<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Portal Farm C-137</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;overflow:hidden}
body{height:100%;overflow:hidden;background:#0b0e0a;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;
 font-family:'VT323',monospace;color:#e6efdd;font-size:20px;user-select:none;-webkit-user-select:none;
 -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
canvas{image-rendering:pixelated}
#game{position:fixed;top:0;left:0;right:0;bottom:0;cursor:crosshair;background:#0c110b;touch-action:none}
#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:5}
#hud{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;pointer-events:none}
#tl{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;align-items:flex-start}
.chip{background:rgba(13,17,11,.9);border:2px solid #39462f;box-shadow:0 0 0 2px #0b0e0a;padding:4px 12px;display:inline-block;width:max-content;font-size:22px;line-height:1.1;margin-bottom:8px}
.chip.money{color:#ffd94a;border-color:#6a5a24}
.chip .sub{font-size:16px;color:#93a586}
#tr{position:absolute;top:14px;right:14px;display:flex;pointer-events:auto}
.hbtn{font-family:inherit;font-size:19px;background:#141a12;border:2px solid #39462f;color:#cfe8c0;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 2px #0b0e0a;margin-left:8px}
.hbtn:hover{border-color:#8fe33c;color:#eaffdd}
.hbtn.off{color:#6a7a62;text-decoration:line-through}
#objCard{position:absolute;left:14px;bottom:16px;background:rgba(13,17,11,.9);border:2px solid #39462f;box-shadow:0 0 0 2px #0b0e0a;padding:8px 14px;max-width:340px}
#objCard .oh{font-size:15px;color:#8fe33c;letter-spacing:2px}
#objT{font-size:23px;color:#eaffdd;line-height:1}
#objH{font-size:16px;color:#93a586;line-height:1.15;margin-top:4px}
#toasts{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:100%;pointer-events:none}
.toast{background:rgba(13,19,11,.95);border:2px solid #39462f;border-left:4px solid #8fe33c;padding:6px 16px;margin-top:6px;font-size:19px;max-width:min(520px,86vw);text-align:center;animation:tin .18s;line-height:1.1}
.toast.warn{border-left-color:#ff7a5c}
.toast.good{border-left-color:#ffd94a}
.toast.dim{border-left-color:#8fe33c;font-size:22px;padding:10px 20px}
.toast.dim .big{font-size:26px;color:#eaffdd}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;pointer-events:auto}
.slot{width:56px;height:56px;background:rgba(13,17,11,.92);border:2px solid #39462f;box-shadow:0 0 0 2px #0b0e0a;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 3px}
.slot:hover{border-color:#5a7048}
.slot.sel{border-color:#8fe33c;background:rgba(30,44,22,.95);transform:translateY(-4px)}
.slot.locked{opacity:.4;cursor:not-allowed}
.slot .k{position:absolute;top:0;left:4px;font-size:15px;color:#7a8a70}
.slot .cnt{position:absolute;bottom:0;right:4px;font-size:17px;color:#ffd94a}
#seedInfo{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);font-size:18px;color:#b8c9a8;background:rgba(13,17,11,.85);border:1px solid #2c3826;padding:2px 10px;display:none;white-space:nowrap}
#fluidbar{position:absolute;left:50%;bottom:80px;transform:translateX(-50%);display:none;pointer-events:auto}
.fchip{background:rgba(13,17,11,.92);border:2px solid #39462f;padding:3px 10px;font-size:17px;color:#93a586;cursor:pointer;white-space:nowrap;margin-right:6px;display:inline-block}
.fchip.sel{border-color:#8fe33c;color:#eaffdd}
.fchip.zero{opacity:.5}
.fchip b{color:#eaffdd}
#pilotTag{position:absolute;top:64px;left:50%;transform:translateX(-50%);font-size:20px;color:#ffd94a;background:rgba(13,17,11,.9);border:2px solid #6a5a24;padding:4px 14px;white-space:nowrap}
#saveFlash{position:absolute;right:16px;bottom:14px;font-size:16px;color:#5a7a52;opacity:0;transition:opacity .5s}
#modalRoot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:center}
#modalBg{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(4,6,4,.72)}
.panel{position:relative;background:#141a12;border:3px solid #39462f;box-shadow:0 0 0 3px #0b0e0a,0 14px 44px rgba(0,0,0,.65);padding:16px 20px 20px;max-width:660px;width:92vw;max-height:84vh;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
@supports(height:1dvh){.panel{max-height:84dvh}}
.panel h2{font-size:32px;color:#eaffdd;font-weight:normal;letter-spacing:1px}
.panel .fl{color:#93a586;font-size:18px;margin:2px 0 8px}
.pclose{position:absolute;top:10px;right:12px;font-family:inherit;font-size:22px;background:#22301e;border:2px solid #4a5c40;color:#cfe8c0;padding:4px 12px;cursor:pointer}
.pclose:hover{border-color:#8fe33c}
.tabs{display:flex;margin:6px 0 4px}
.tabs .btn{margin-right:6px}
.tabs .btn.on{border-color:#8fe33c;color:#eaffdd;background:#33452c}
.btn{font-family:inherit;font-size:19px;background:#22301e;border:2px solid #4a5c40;color:#cfe8c0;padding:5px 12px;cursor:pointer;box-shadow:0 2px 0 #0b0e0a;margin-right:6px}
.btn:hover:not(:disabled){background:#33452c;border-color:#8fe33c;color:#eaffdd}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{color:#ffd94a;border-color:#6a5a24}
.srow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid #232d1e}
.srow .ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.srow .mid{flex:1;min-width:0}
.srow .nm{font-size:22px;line-height:1}
.srow .ds{font-size:17px;color:#93a586;line-height:1.1}
.srow .btn{flex:none}
.tag{display:inline-block;font-size:14px;border:1px solid #6a5a24;color:#ffd94a;padding:0 6px;margin-left:6px}
.req{font-size:17px;margin:2px 0 6px}
.req span{margin-right:12px}
.req .ok{color:#8fe33c}.req .no{color:#ff7a5c}
.sellhead{background:#1a2416;border:1px solid #2c3826;padding:6px 10px;margin:6px 0;font-size:18px;color:#b8c9a8}
.igrid{display:flex;flex-wrap:wrap;margin-top:8px}
.icell{width:86px;background:#1a2416;border:1px solid #2c3826;padding:8px 4px 4px;text-align:center;margin:0 10px 10px 0}
.icell .pic{height:38px;display:flex;align-items:center;justify-content:center}
.icell .n{font-size:15px;color:#93a586;line-height:1}
.icell .c{font-size:20px;color:#eaffdd}
table.keys{border-collapse:collapse;margin-top:6px}
table.keys td{padding:3px 12px 3px 0;font-size:19px}
table.keys td:first-child{color:#8fe33c;white-space:nowrap}
/* ===== touch controls ===== */
#touchUI{position:absolute;right:16px;bottom:16px;display:none;flex-direction:column;align-items:flex-end;pointer-events:auto}
body.touch #touchUI{display:flex}
.tbtn{min-width:62px;height:46px;background:rgba(22,32,18,.9);border:2px solid #4a5c40;color:#cfe8c0;font-family:inherit;font-size:16px;box-shadow:0 0 0 2px #0b0e0a;display:flex;align-items:center;justify-content:center;padding:0 10px;margin-bottom:8px}
.tbtn:active{border-color:#8fe33c;color:#eaffdd}
#useBtn{min-width:84px;min-height:84px;border-radius:50%;background:rgba(22,32,18,.92);border:3px solid #4a5c40;color:#eaffdd;font-family:inherit;font-size:19px;box-shadow:0 0 0 3px #0b0e0a;display:flex;align-items:center;justify-content:center;text-align:center;line-height:.95;padding:10px;max-width:130px;word-wrap:break-word}
#useBtn:active{background:#33452c;border-color:#8fe33c}
#useBtn.dim{opacity:.4}
body.touch #objCard{left:auto;right:14px;top:64px;bottom:auto;max-width:min(320px,44vw)}
body.touch .slot{width:60px;height:60px}
body.touch #hotbar{bottom:12px}
body.touch #seedInfo,body.touch #fluidbar{bottom:94px}
@media (max-width:560px){
 body{font-size:17px}
 .chip{font-size:18px}
 body.touch .slot{width:46px;height:46px}
 .slot{margin:0 2px}
 body.touch #objCard{top:58px;max-width:44vw}
 #useBtn{min-width:70px;min-height:70px;font-size:16px}
 .tbtn{min-width:52px;height:40px;font-size:14px;margin-bottom:6px}
 #touchUI{bottom:80px}
}
.hbtn,.btn,.pclose,.slot,.fchip,#useBtn,.tbtn,#splash .sbtn{touch-action:manipulation}
#splash{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}
#splash .title{font-size:min(96px,12vw);color:#eaffdd;letter-spacing:8px;text-shadow:0 5px 0 #1d4a22;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#splash .sub{font-size:24px;color:#8fe33c;letter-spacing:3px;text-align:center;padding:0 10px}
#splash .sbtns{display:flex;margin-top:22px}
#splash .sbtn{font-family:inherit;font-size:26px;padding:10px 26px;background:#22301e;border:3px solid #4a5c40;color:#cfe8c0;cursor:pointer;box-shadow:0 4px 0 #0b0e0a;margin:0 7px}
#splash .sbtn:hover{border-color:#8fe33c;color:#eaffdd;background:#33452c}
#splash .ctr{margin-top:26px;font-size:19px;color:#93a586;text-align:center;line-height:1.3;padding:0 12px}
#splash .foot{position:absolute;bottom:16px;font-size:16px;color:#5a6a52}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>
<div id="hud" style="display:none">
  <div id="tl">
    <div class="chip money" id="moneyChip">$0</div>
    <div class="chip" id="dimChip"></div>
    <div class="chip" id="mineChip" style="display:none"></div>
    <div class="chip" id="shipChip" style="display:none"></div>
  </div>
  <div id="tr">
    <button class="hbtn" id="btnFull" style="display:none">FULL</button>
    <button class="hbtn" id="btnHelp">HELP [H]</button>
    <button class="hbtn" id="btnMute">SOUND [M]</button>
  </div>
  <div id="objCard" style="display:none"><div class="oh">OBJECTIVE</div><div id="objT"></div><div id="objH"></div></div>
  <div id="toasts"></div>
  <div id="pilotTag" style="display:none">PILOTING · F TO EXIT · RIGHT-CLICK TO COMMAND (ON FOOT)</div>
  <div id="fluidbar"></div>
  <div id="hotbar"></div>
  <div id="seedInfo"></div>
  <div id="touchUI">
    <button class="tbtn" id="modeBtn" style="display:none">MODE</button>
    <button class="tbtn" id="sendBtn" style="display:none">SEND</button>
    <button class="tbtn" id="fluidBtn" style="display:none">FLUID</button>
    <button class="tbtn" id="seedBtn">SEED</button>
    <button id="useBtn" class="dim">USE</button>
  </div>
  <div id="saveFlash">SAVED</div>
</div>
<div id="modalRoot" style="display:none"><div id="modalBg"></div><div id="modalPanel" class="panel"></div></div>
<div id="splash">
  <div class="title">PORTAL FARM</div>
  <div class="sub">DIMENSION C-137 · A FARMING OPERATION</div>
  <div class="sbtns"><button class="sbtn" id="btnNew">NEW GAME</button><button class="sbtn" id="btnCont" style="display:none">CONTINUE</button></div>
  <div class="ctr">WASD move · mouse aim · click to use tool or auto-walk · E interact<br>1–6 hotbar · R switch seeds · H full help</div>
  <div class="foot">fan-made tribute · runs entirely in your browser · autosaves</div>
</div>
<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, T=32;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const easeOut=t=>1-Math.pow(1-t,3);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function lerpAng(a,b,t){let d=(b-a+Math.PI)%TAU;if(d<0)d+=TAU;d-=Math.PI;return a+d*t}
const K=(x,y)=>x+','+y;

/* ================= data ================= */
const DIMS={
 c137:{name:'Dimension C-137',crop:1,grow:1,mine:1,tint:null,pal:{gA:'#6a9c4d',gB:'#5f8f45',path:'#c9b28a',water:'#4a8f8a',leaf:'#2e6a34',leafH:'#4f9a4a'},amb:null},
 gooch:{name:'The Gooch Dimension',crop:0.5,grow:0.7,mine:0.6,tint:'rgba(90,82,40,0.13)',pal:{gA:'#8f8a55',gB:'#827d49',path:'#a89a7c',water:'#6b6b4a',leaf:'#6b6b3f',leafH:'#7f7f4c'},amb:{col:'#a8a08a',vy:14,add:0}},
 acid:{name:'Acid Dimension',crop:1.8,grow:1.1,mine:1.2,tint:'rgba(150,210,40,0.10)',pal:{gA:'#7aa335',gB:'#6f9a2e',path:'#b0a878',water:'#a4d43a',leaf:'#4a7a2a',leafH:'#6a9a3a'},amb:{col:'#c8f050',vy:-26,add:1}},
 blorp:{name:'Blorp Dimension',crop:3,grow:1.4,mine:1.3,special:'zorp',tint:'rgba(30,140,130,0.11)',pal:{gA:'#3f9a8a',gB:'#37897b',path:'#b8b490',water:'#2fbfae',leaf:'#1f6a5e',leafH:'#2f8a78'},amb:{col:'#7ae8d8',vy:-14,add:1}},
 cromulon:{name:'Cromulon Dimension',crop:0.3,grow:0.5,mine:3,special:'darkcore',tint:'rgba(200,80,40,0.11)',pal:{gA:'#a06a4a',gB:'#94603f',path:'#c9a284',water:'#c96a3a',leaf:'#6a4030',leafH:'#8a543c'},amb:{col:'#ffb070',vy:-40,add:1}},
 megaseed:{name:'Mega Seed Dimension',crop:5,grow:2,mine:2.5,special:'chrono',tint:'rgba(255,220,80,0.08)',pal:{gA:'#4fb45a',gB:'#44a750',path:'#d8c890',water:'#e8c84a',leaf:'#2e7a3a',leafH:'#4a9a4c'},amb:{col:'#ffe98a',vy:-20,add:1},flowers:true},
};
const DIMLIST=Object.keys(DIMS);
const FLUIDS=[
 {name:'Residual Sludge',short:'SLUDGE',w:{gooch:70,acid:30}},
 {name:'Standard Green',short:'STD',cost:30,w:{gooch:40,acid:30,blorp:20,cromulon:10}},
 {name:'Ionized Green',short:'ION',cost:100,w:{gooch:12,acid:25,blorp:30,cromulon:22,megaseed:11}},
 {name:'Dark Matter Green',short:'DARK',cost:280,w:{acid:14,blorp:30,cromulon:28,megaseed:28}},
 {name:'Chrono-Gold',short:'GOLD',cost:650,w:{blorp:22,cromulon:28,megaseed:50}},
];
const SEEDS=['plick','squarsh','glimmelon','neuroberry'];
const CROPS={
 plick:{n:'Plick',seed:5,sell:9,grow:20,col:'#e88ab0'},
 squarsh:{n:'Squarsh',seed:16,sell:34,grow:50,col:'#d8842e'},
 glimmelon:{n:'Glimmelon',seed:45,sell:110,grow:110,col:'#2e8a7a'},
 neuroberry:{n:'Neuroberry',seed:120,sell:300,grow:220,col:'#8a2e3a'},
};
const ORES={
 stone:{n:'Stone',hp:2,sell:1},
 coal:{n:'Coal',hp:3,sell:3},
 iron:{n:'Iron',hp:4,sell:7},
 gold:{n:'Gold',hp:5,sell:16},
 flux:{n:'Flux Crystal',hp:6,sell:32},
 portalcrystal:{n:'Portal Crystal',hp:8,sell:150},
 zorp:{n:'Zorp Alloy',hp:8,sell:220,part:1},
 darkcore:{n:'Dark Matter Core',hp:8,sell:260,part:1},
 chrono:{n:'Chrono Crystal',hp:8,sell:300,part:1},
};
const ITEMS={};
for(const k in ORES)ITEMS[k]={n:ORES[k].n,sell:ORES[k].sell,part:ORES[k].part};
for(const k of SEEDS){ITEMS[k]={n:CROPS[k].n,crop:1,sell:CROPS[k].sell};ITEMS['seed_'+k]={n:CROPS[k].n+' Seeds'}}
ITEMS.fert={n:'Blitz Fertilizer'};
const RECIPES=[
 {id:'fert',nm:'Blitz Fertilizer ×3',ds:'Instantly ripens one growing crop. Stackable.',req:{coal:2,iron:1},mk(){G.inv.fert=(G.inv.fert||0)+3}},
 {id:'gun',nm:'Portal Gun',ds:'Punches holes in reality. Equip it, click open ground, step through.',req:{portalcrystal:1,gold:5,iron:8,coal:3},once:1,mk(){G.flags.gun=true}},
 {id:'ship',nm:'The Flying Car',ds:'Flies, follows, patrols, judges. Right-click to send it places. [C] cycles orders.',req:{zorp:1,darkcore:1,chrono:1,gold:15,flux:8},once:1,mk(){G.flags.ship=true;spawnShipAtPad()}},
];
const KEEPER={
 c137:['Mr. Goldenfold','Buy somethin\' or don\'t. Whatever.'],
 gooch:['A Gooch','Everything here is damp. Including the money.'],
 acid:['Sweaty Acid Guy','Careful — the produce bites back a little.'],
 blorp:['Blorpo','Blorp blorp. (Prices are normal. Probably.)'],
 cromulon:['A Giant Floating Head','SHOW ME WHAT YOU\'VE GOT'],
 megaseed:['Goldenfold\'s Cousin','Everything shines here. Even the change.'],
};
const QUOTES={
 board:['Welcome aboard. Wipe your feet.','Buckle up. Or don\'t. I\'m not your mom.'],
 exit:['Deploying you roughly. Try not to need me.','Exiting flight mode.'],
 follow:['Fine. I\'ll follow you. Like a lost Gromflomite.','Following. Judging silently.'],
 stay:['Holding position. Contemplating the void.','Staying. Riveting stuff.'],
 patrol:['Patrolling. Threat assessment: cucumber.','On patrol. If anything moves, I\'ll glare at it.'],
 dock:['Returning to the pad. Don\'t touch anything.','Docking. Recharging my contempt.'],
 go:['En route. Surveillance mode: smug.','Moving out. I expect nothing and I\'m still disappointed.'],
 through:['The ship squeezed through the portal after you. It\'s not happy about it.'],
 refuse:['The ship refuses. Portals give it anxiety.'],
};
const OBJ=[
 {t:'Get planting',h:'Hoe [1] — click inside the fenced field to till (click far away and you\'ll walk over). Seeds [2] to plant, can [3] to water.',c:()=>G.stats.planted>0},
 {t:'First harvest',h:'Crops only grow while watered. Click a ripe crop to pick it (any tool works).',c:()=>G.stats.harvested>0},
 {t:'Make your first sale',h:'Press E at the shop (west) — or just click the shopkeeper — and sell your produce.',c:()=>G.stats.sales>0},
 {t:'Hit the mine',h:'The cave mouth is up north, past the ridge. Bring the pickaxe [4].',c:()=>G.stats.enteredMine>0},
 {t:'Dig for a Portal Crystal',h:'They only form at mine depth 3 or deeper. Take the ladders down.',c:()=>G.stats.maxDepth>=3&&(G.inv.portalcrystal>0||G.flags.gun)},
 {t:'Build the Portal Gun',h:'Crafting bench, east of the hub. Crystal + gold + iron + coal.',c:()=>G.flags.gun},
 {t:'Open your first portal',h:'The shop sells portal fluid. Equip the gun [6], click open ground, walk on in.',c:()=>G.stats.portals>0},
 {t:'Find a richer dimension',h:'Blorp sells crops ×3. Cromulon\'s mine is ×3. Better fluid, better odds.',c:()=>G.stats.visitedRich>0},
 {t:'Cash out big',h:'Sell produce while standing in a ×3 crop dimension.',c:()=>G.stats.soldRich>0},
 {t:'The ship parts',h:'Zorp Alloy (Blorp mine), Dark Matter Core (Cromulon mine), Chrono Crystal (Mega Seed mine) — depth 2+.',c:()=>(G.inv.zorp>0&&G.inv.darkcore>0&&G.inv.chrono>0)||G.flags.ship},
 {t:'Assemble the Flying Car',h:'Bench: the three rarities + gold ×15 + flux ×8.',c:()=>G.flags.ship},
 {t:'Command your ship',h:'Right-click ground to send it. [C] cycles follow / stay / patrol / dock. [E] boards it.',c:()=>G.stats.shipCmd>0},
 {t:'Wubba lubba dub dub',h:'You run the multiverse now. Keep farming. Keep mining.',c:()=>false},
];

/* ================= sprites ================= */
const S={};
function makeSprite(rows,pal,sc=2){
 const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
 const cv=document.createElement('canvas');cv.width=w*sc;cv.height=h*sc;
 const c=cv.getContext('2d');
 rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const col=pal[r[x]];if(col){c.fillStyle=col;c.fillRect(x*sc,y*sc,sc,sc)}}});
 return{cv,w:w*sc,h:h*sc};

 FARM[15][34]='b';FARM[15][35]='b';

/* ================= mine ================= */
const MW=30,MH=20;
function genMine(dimKey,depth){
 const di=DIMLIST.indexOf(dimKey);
 const rnd=mulberry32((di*7919+depth*104729)>>>0^0x9e3779b9);
 const g=Array.from({length:MH},()=>Array(MW).fill(1));
 let x=15,y=1,dir=2;g[y][x]=0;
 const steps=Math.floor(MW*MH*.5);
 for(let i=0;i<steps;i++){
  if(rnd()<.35)dir=(dir+(rnd()<.5?1:3))%4;
  const nx=x+[0,1,0,-1][dir],ny=y+[-1,0,1,0][dir];
  if(nx>1&&nx<MW-2&&ny>1&&ny<MH-2){x=nx;y=ny}
  g[y][x]=0;
  if(rnd()<.25){g[y][clamp(x+(rnd()<.5?1:-1),1,MW-2)]=0;if(rnd()<.5)g[clamp(y+1,1,MH-2)][x]=0}
 }
 g[1][15]=0;g[2][15]=0;g[1][16]=0;g[2][16]=0;
 for(let r=0;r<3;r++){const cx=3+Math.floor(rnd()*(MW-6)),cy=3+Math.floor(rnd()*(MH-6)),rr=2+Math.floor(rnd()*2);
  for(let dy=-rr;dy<=rr;dy++)for(let dx=-rr;dx<=rr;dx++)if(dx*dx+dy*dy<=rr*rr){const yy=cy+dy,xx=cx+dx;if(yy>0&&yy<MH-1&&xx>0&&xx<MW-1)g[yy][xx]=0}}
 const seen=Array.from({length:MH},()=>Array(MW).fill(false));
 const q=[[15,1]];seen[1][15]=true;
 while(q.length){const[cx,cy]=q.pop();
  [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=cx+dx,ny=cy+dy;
   if(nx>=0&&nx<MW&&ny>=0&&ny<MH&&!seen[ny][nx]&&g[ny][nx]===0){seen[ny][nx]=true;q.push([nx,ny])}})}
 const floors=[];
 for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){
  if(g[yy][xx]!==0)continue;
  if(seen[yy][xx])floors.push([xx,yy]);
  else g[yy][xx]=1;
 }
 let down=floors[0]||[MW-3,MH-3],best=-1;
 for(let i=0;i<60&&floors.length;i++){const f=floors[Math.floor(rnd()*floors.length)];const dd=(f[0]-15)**2+(f[1]-1)**2;if(dd>best){best=dd;down=f}}
 const d=DIMS[dimKey];
 const w={stone:34,coal:24,iron:16};
 if(depth>=2){w.gold=13;w.flux=8}
 if(depth>=3){w.portalcrystal=7;w.stone-=6}
 if(d.special&&depth>=(d.special==='chrono'?1:2))w[d.special]=(d.special==='chrono'?14:11)*(d.mine>=2?1.4:1);
 if(dimKey==='cromulon'){w.gold*=1.7;w.flux*=1.6;w.stone*=.7}
 let tot=0;for(const k in w)tot+=w[k];
 const nodes=[];const used=new Set([K(15,1),K(15,2),K(16,1),K(16,2),K(down[0],down[1])]);
 const target=Math.min(55,Math.round((11+depth*2.5)*d.mine));
 let guard=0;
 while(nodes.length<target&&guard++<800){
  const f=floors[Math.floor(rnd()*floors.length)];const key=K(f[0],f[1]);
  if(used.has(key))continue;used.add(key);
  let r=rnd()*tot,type='stone';
  for(const k in w){r-=w[k];if(r<=0){type=k;break}}
  nodes.push({x:f[0],y:f[1],type,hp:ORES[type].hp,max:ORES[type].hp,alive:true});
 }
 const map={};nodes.forEach(n=>map[K(n.x,n.y)]=n);
 return{g,nodes,map,up:{x:15,y:1},down:{x:down[0],y:down[1]}};
}
function getMine(){return G.mines[G.dim+':'+G.depth]}
function mineKey(){return G.dim+':'+G.depth}
function renderMineStatic(){
 const key=mineKey();
 if(mineCache[key])return mineCache[key];
 const m=getMine();
 const cv=document.createElement('canvas');cv.width=MW*T;cv.height=MH*T;
 const c=cv.getContext('2d');
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const px=x*T,py=y*T,hs=hash2(x+50,y+50);
  if(m.g[y][x]===0){
   c.fillStyle='#4a4038';c.fillRect(px,py,T,T);
   c.fillStyle='#403830';if(hs<.5)c.fillRect(px+4,py+6,6,4);if(hs<.3)c.fillRect(px+18,py+20,8,4);
   c.fillStyle='#554a40';if(hs>.6)c.fillRect(px+20,py+8,5,3);
  }else{
   const below=y<MH-1&&m.g[y+1][x]===0;
   if(below){
    c.fillStyle='#2e2822';c.fillRect(px,py,T,T);
    c.fillStyle='#241f1a';for(let i=0;i<3;i++)c.fillRect(px+4,py+8+i*10,T-8,2);
    c.fillStyle='#5a5248';c.fillRect(px,py,T,5);
   }else{
    c.fillStyle='#38332c';c.fillRect(px,py,T,T);
    c.fillStyle='#2f2b25';if(hs<.4)c.fillRect(px+6,py+8,8,6);
   }
  }
 }
 const ex=15*T,ey=1*T;
 const gr=c.createRadialGradient(ex+16,ey+16,4,ex+16,ey+16,90);
 gr.addColorStop(0,'rgba(220,240,200,.25)');gr.addColorStop(1,'rgba(220,240,200,0)');
 c.fillStyle=gr;c.fillRect(ex-70,ey-20,180,140);
 mineCache[key]=cv;
 return cv;
}

};

const onceMap={};
function toastOnce(m){const n=performance.now()/1000;if(onceMap[m]&&n-onceMap[m]<2.5)return;onceMap[m]=n;toast(m,'warn')}
function pickQ(k){const a=QUOTES[k]||['…'];return a[Math.floor(Math.random()*a.length)]}

/* ================= particles ================= */
function addP(x,y,o={}){if(particles.length>600)return;particles.push({x,y,vx:o.vx||0,vy:o.vy||0,g:o.g||0,ttl:o.ttl||.6,t:0,r:o.r||3,col:o.col||'#fff',add:o.add||0})}
function burst(x,y,col,n=8,sp=70){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=sp*(.4+Math.random()*.8);addP(x,y,{vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,g:160,col,r:2+Math.random()*2.5,ttl:.5+Math.random()*.4})}}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;if(p.t>p.ttl){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}}
function drawParticles(c){
 for(const p of particles){const a=1-p.t/p.ttl;if(p.add){c.globalCompositeOperation='lighter'}
  c.globalAlpha=a;c.fillStyle=p.col;c.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);
  c.globalAlpha=1;c.globalCompositeOperation='source-over'}
}
function spawnFly(x,y,item){flyItems.push({x,y,item,t:0,dur:.45})}
function updateFly(dt){
 for(let i=flyItems.length-1;i>=0;i--){const f=flyItems[i];f.t+=dt;
  if(f.t>=f.dur){G.inv[f.item]=(G.inv[f.item]||0)+1;AU.tone(900,'triangle',.06,.07);flyItems.splice(i,1);syncHUD(true)}}
}
function drawFly(c){for(const f of flyItems){const t=f.t/f.dur;const x=lerp(f.x,player.x,easeOut(t)),y=lerp(f.y,player.y-20,easeOut(t))-Math.sin(t*Math.PI)*24;drawSpr(c,ICONKEY[f.item]||f.item,x,y,{ay:.5,alpha:.95})}}

/* ================= portal drawing ================= */
function drawPortal(c,x,y,age,tier=0,s=1){
 const rx=18*s,ry=30*s;
 const gs=easeOut(clamp(age/.35,0,1));
 const pul=1+.045*Math.sin(age*6.3);
 const R=Math.max(1,rx*gs*pul),Ry=Math.max(1,ry*gs*pul);
 c.save();c.translate(x,y);c.scale(1,Ry/R);
 let g;try{g=c.createRadialGradient(0,0,1,0,0,R)}catch(e){g=null}
 if(g){
  g.addColorStop(0,'rgba(228,255,185,0.95)');g.addColorStop(.25,'rgba(140,235,90,0.85)');
  g.addColorStop(.6,'rgba(40,140,50,0.78)');g.addColorStop(1,'rgba(8,45,18,0.92)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,R,0,TAU);c.fill();
 }
 c.globalCompositeOperation='lighter';
 for(let a=0;a<6;a++){
  for(let k=2;k<=26;k++){
   const f=k/26;
   const ang=f*5.4-age*(2.4+a*.11)+a*(TAU/6);
   const r=R*(.12+.86*f);
   const br=1-f;
   c.fillStyle=`rgba(${120+130*br|0},${230+25*br|0},${70+60*br|0},${(.25+.6*br).toFixed(2)})`;
   c.beginPath();c.arc(Math.cos(ang)*r,Math.sin(ang)*r,Math.max(.7,(2.6-2*f))*s,0,TAU);c.fill();
  }
 }
 c.globalCompositeOperation='source-over';
 const rim=tier>=4?'#ffd94a':tier>=3?'#8fe33c':'#aef85e';
 for(let i=0;i<3;i++){c.strokeStyle=i?`rgba(170,255,110,${.25-i*.08})`:rim;c.lineWidth=(2.2+i*2.5)*s;c.beginPath();c.arc(0,0,R+i*1.5*s,0,TAU);c.stroke()}
 if(tier>=4){c.fillStyle='rgba(255,230,120,.9)';for(let i=0;i<5;i++){const a2=age*3+i*TAU/5;c.beginPath();c.arc(Math.cos(a2)*R*1.06,Math.sin(a2)*R*1.06,2*s,0,TAU);c.fill()}}
 c.restore();
}
function updatePortals(dt){
 for(let i=portals.length-1;i>=0;i--){
  const p=portals[i];p.age+=dt;
  p.sp=(p.sp||0)-dt;
  if(p.sp<=0&&p.age<p.ttl-1){p.sp=.07;p.dots=p.dots||[];p.dots.push({a:Math.random()*TAU,r:30+Math.random()*10})}
  if(p.dots)p.dots.forEach(d=>{d.r-=dt*46;d.a+=dt*6;if(d.r<3)d.r=30+Math.random()*10});
  if(p.age>p.ttl){burst(p.x,p.y,'#8fe33c',14,90);portals.splice(i,1);continue}
  if(portalGrace<=0&&!piloting&&!FX.active){
   if(dist(player.x,player.y-14,p.x,p.y)<24){
    AU.warp();addShake(4);
    travelTo(p.dim,p.x,p.y);
   }
  }
 }
}
function drawPortalEnt(c,p){
 const fade=p.ttl-p.age<1?clamp(p.ttl-p.age,0,1):1;
 c.save();c.globalAlpha=fade;
 drawPortal(c,p.x,p.y,p.age,p.tier,1);
 if(p.dots){c.globalCompositeOperation='lighter';
  for(const d of p.dots){c.fillStyle='rgba(200,255,140,.8)';c.beginPath();c.arc(p.x+Math.cos(d.a)*d.r*.62,p.y+Math.sin(d.a)*d.r,2,0,TAU);c.fill()}
 }
 c.restore();
}

/* ================= dimension travel ================= */
function rollDim(tier){
 const w=FLUIDS[tier].w;
 for(let tries=0;tries<6;tries++){
  let tot=0;for(const k in w)tot+=w[k];
  let r=Math.random()*tot,pick='gooch';
  for(const k in w){r-=w[k];if(r<=0){pick=k;break}}
  if(pick!==G.dim)return pick;
 }
 return DIMLIST.find(d=>d!==G.dim&&w[d])||'gooch';
}
function firePortal(wx,wy){
 if(G.scene!=='farm'){toastOnce('Portals don\'t open underground. The rock resists.');AU.err();return}
 if(piloting)return;
 const dx=wx-player.x,dy=wy-(player.y-12);
 const dd=Math.hypot(dx,dy);
 if(dd<44){toastOnce('Too close. Portals need room to breathe.');return}
 const t=dd>9*T?9*T/dd:1;
 const tx=player.x+dx*t,ty=player.y-12+dy*t;
 if(isSolidFarm(Math.floor(tx/T),Math.floor(ty/T))){toastOnce('Portals need open ground.');AU.err();return}
 let tier=G.selFluid;
 if(tier>0&&(G.fluids[tier]||0)<=0){tier=0;toast('Out of '+FLUIDS[G.selFluid].name+' — burning residual sludge.','warn')}
 if(tier>0)G.fluids[tier]--;
 const dim=rollDim(tier);
 projectiles.push({x:player.x,y:player.y-16,tx,ty,sx:player.x,sy:player.y-16,t:0,dur:Math.max(.13,dd/950),dim,tier});
 AU.portalOpen();recoil=.13;G.stats.portals++;addShake(1.5);
}
function findFreeNear(x,y,minD=0){
 for(let r=0;r<7;r++){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
   if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
   const tx=Math.floor(x/T)+dx,ty=Math.floor(y/T)+dy;
   if(isSolidFarm(tx,ty))continue;
   const px=tx*T+16,py=ty*T+24;
   if(dist(px,py,x,y)>=minD)return{x:px,y:py};
  }
 }
 return{x,y};
}
function travelTo(dimKey,x,y){
 if(FX.active)return;
 FX.start('portal',()=>{
  cancelAuto();cmdArm=false;
  const origin=G.dim;
  G.dim=dimKey;G.scene='farm';G.depth=1;portals=[];projectiles=[];
  const pp=findFreeNear(x,y);
  const land=findFreeNear(pp.x,pp.y,30);
  player.x=land.x;player.y=land.y;portalGrace=1.15;
  portals.push({x:pp.x,y:pp.y,age:0,ttl:45,tier:0,dim:origin});
  if(ship&&ship.mode==='follow'&&ship.dim!==dimKey)shipPending=.9;
  if(DIMS[dimKey].crop>=3)G.stats.visitedRich=1;
  const d=DIMS[dimKey];
  const col=v=>v>1?'#8fe33c':v<1?'#ff7a5c':'#e6efdd';
  toast(`<span class="big">${d.name}</span><br>crops <b style="color:${col(d.crop)}">×${d.crop}</b> · mine <b style="color:${col(d.mine)}">×${d.mine}</b> · growth <b style="color:${col(d.grow)}">×${d.grow}</b>`,'dim',4200);
  syncHUD(true);
 });
}

/* ================= farming actions ================= */
function harvest(tx,ty){
 const f=getFarm();const t=f.tiles[K(tx,ty)];if(!t||!t.crop||t.crop.prog<1)return;
 const k=t.crop.k;
 G.inv[k]=(G.inv[k]||0)+1;
 if(Math.random()<.2){G.inv['seed_'+k]=(G.inv['seed_'+k]||0)+1;toast('Found a spare '+CROPS[k].n+' seed!','good')}
 t.crop=null;
 burst(tx*T+16,ty*T+16,CROPS[k].col,10,80);
 AU.harvest();G.stats.harvested++;syncHUD(true);
}
function tileAction(tx,ty){
 if(tx<0||tx>=FW||ty<0||ty>=FH)return null;
 const f=getFarm(),key=K(tx,ty),ch=FARM[ty][tx],t=f.tiles[key],tool=SLOTS[G.sel].id;
 if(t&&t.crop&&t.crop.prog>=1)return{kind:'harvest'};
 if(tool==='hoe'){
  if(ch==='W'&&!f.cleared[key])return{kind:'weed'};
  if(inField(tx,ty)&&ch==='g'&&!t)return{kind:'till'};
 }else if(tool==='seed'){if(t&&!t.crop)return{kind:'plant'}}
 else if(tool==='can'){if(t)return{kind:'water'}}
 else if(tool==='pick'){if(ch==='r'&&!f.cleared[key])return{kind:'rock'}}
 else if(tool==='fert'){if(t&&t.crop&&t.crop.prog<1)return{kind:'fert'}}
 return null;
}
function actTile(tx,ty){
 if(tx<0||tx>=FW||ty<0||ty>=FH)return;
 if(dist(player.x,player.y-10,tx*T+16,ty*T+16)>RANGE){ringPulse=1;toastOnce('Too far away.');return}
 const f=getFarm(),key=K(tx,ty),ch=FARM[ty][tx],tool=SLOTS[G.sel].id;
 const t=f.tiles[key];
 if(t&&t.crop&&t.crop.prog>=1){harvest(tx,ty);startSwing(tx*T+16,ty*T+16);return}
 if(tool==='hoe'){
  if(ch==='W'&&!f.cleared[key]){f.cleared[key]=1;blitFarmTile(G.dim,tx,ty,'grass');AU.thunk();burst(tx*T+16,ty*T+20,'#a0a04a',6);startSwing(tx*T+16,ty*T+16);return}
  if(ch==='r'&&!f.cleared[key]){toastOnce('Rocks need the pickaxe (slot 4).');return}
  if(inField(tx,ty)&&ch==='g'&&!t){f.tiles[key]={crop:null,moist:0};blitFarmTile(G.dim,tx,ty,'soil');AU.thunk();burst(tx*T+16,ty*T+18,'#7a5a3c',7);startSwing(tx*T+16,ty*T+16);return}
  toastOnce('Till inside the fenced field.');
 }
 else if(tool==='seed'){
  if(!t){toastOnce('Till the soil first (hoe, slot 1).');return}
  if(t.crop){toastOnce('Something\'s already growing there.');return}
  const sk='seed_'+G.seedSel;
  if((G.inv[sk]||0)<=0){toastOnce('No '+CROPS[G.seedSel].n+' seeds — the shop sells them.');AU.err();return}
  G.inv[sk]--;t.crop={k:G.seedSel,prog:0};
  AU.plant();burst(tx*T+16,ty*T+18,'#5a9a3e',5,40);G.stats.planted++;startSwing(tx*T+16,ty*T+16);syncHUD(true);
 }
 else if(tool==='can'){
  if(!t){toastOnce('Water tilled soil.');return}
  let n=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   const tt=f.tiles[K(tx+dx,ty+dy)];
   if(tt){tt.moist=100;n++}
  }
  AU.water();
  for(let i=0;i<n*2;i++)addP(tx*T+8+Math.random()*48,ty*T+4,{vy:60+Math.random()*40,ttl:.4,col:'#7ac8e8',r:2});
  startSwing(tx*T+16,ty*T+16);
 }
 else if(tool==='pick'){
  if(ch==='r'&&!f.cleared[key]){
   const n={hp:2,max:2};n.hp-=pickDmg();
   if(n.hp<=0){f.cleared[key]=1;blitFarmTile(G.dim,tx,ty,'grass');AU.crack();burst(tx*T+16,ty*T+16,'#8a9096',10);spawnFly(tx*T+16,ty*T+8,'stone')}
   else AU.thunk();
   startSwing(tx*T+16,ty*T+16);return;
  }
  toastOnce('Nothing to mine here. The cave is up north.');
 }
 else if(tool==='fert'){
  if(!t||!t.crop||t.crop.prog>=1){toastOnce('Use it on a growing crop.');return}
  if((G.inv.fert||0)<=0){toastOnce('Craft fertilizer at the bench (coal + iron).');AU.err();return}
  G.inv.fert--;t.crop.prog=1;
  burst(tx*T+16,ty*T+12,'#c0ff90',14,90);AU.chime();startSwing(tx*T+16,ty*T+16);syncHUD(true);
 }
}

function mineClick(wx,wy){
 const tx=Math.floor(wx/T),ty=Math.floor(wy/T);
 if(tx<0||tx>=MW||ty<0||ty>=MH)return;
 const d=dist(player.x,player.y-10,tx*T+16,ty*T+16);
 const n=nodeMap[K(tx,ty)];
 if(n){
  if(d<=RANGE+12){
   if(SLOTS[G.sel].id!=='pick'){toastOnce('Equip the pickaxe (slot 4).');return}
   hitNode(n);
  }else if(SLOTS[G.sel].id==='pick'){
   if(walkTo(tx*T+16,ty*T+16,()=>{const n2=nodeMap[K(tx,ty)];if(n2)hitNode(n2)},54))toastOnce('Heading over.');
  }else toastOnce('Too far away.');
  return;
 }
 const m=getMine();
 if(m.up.x===tx&&m.up.y===ty){
  if(d<=RANGE+12)changeDepth(G.depth-1);
  else if(walkTo(m.up.x*T+16,m.up.y*T+24,()=>changeDepth(G.depth-1),48))toastOnce('Heading over.');
  return;
 }
 if(m.down.x===tx&&m.down.y===ty){
  if(d<=RANGE+12)changeDepth(G.depth+1);
  else if(walkTo(m.down.x*T+16,m.down.y*T+24,()=>changeDepth(G.depth+1),48))toastOnce('Heading over.');
  return;
 }
 if(m.g[ty][tx]===0)walkTo(tx*T+16,ty*T+24,null,26);
 else{ringPulse=1;toastOnce('Too far away.')}
}

function updateShip(dt){

/* ================= FX overlay ================= */
const FX={active:false,type:'portal',phase:'in',t:0,cb:null,dur:.55,
 start(type,cb){if(this.active)return;this.active=true;this.type=type;this.phase='in';this.t=0;this.cb=cb;this.dur=type==='fade'?.3:.55},
 update(dt){
  if(!this.active)return;
  this.t+=dt/this.dur;
  if(this.phase==='in'&&this.t>=1){this.cb&&this.cb();this.cb=null;this.phase='out';this.t=0;this.dur=this.type==='fade'?.3:.5}
  else if(this.phase==='out'&&this.t>=1){this.active=false;fxcx.clearRect(0,0,vw,vh)}
 },
 draw(){
  if(!this.active){fxcx.clearRect(0,0,vw,vh);return}
  fxcx.clearRect(0,0,vw,vh);
  if(this.type==='fade'){
   const a=this.phase==='in'?this.t:1-this.t;
   fxcx.fillStyle=`rgba(6,9,6,${a})`;fxcx.fillRect(0,0,vw,vh);return;
  }
  if(this.phase==='in'){
   const p=this.t;
   fxcx.fillStyle=`rgba(4,8,4,${p*.9})`;fxcx.fillRect(0,0,vw,vh);
   const s=lerp(.3,Math.hypot(vw,vh)/58,easeIn(p));
   drawPortal(fxcx,vw/2,vh/2,p*2.2,0,s);
   if(p>.85){fxcx.fillStyle=`rgba(230,255,190,${(p-.85)*3})`;fxcx.fillRect(0,0,vw,vh)}
  }else{
   const p=1-this.t;
   const px=player.x-CAM.x,py=player.y-16-CAM.y;
   fxcx.fillStyle=`rgba(4,8,4,${p*.85})`;fxcx.fillRect(0,0,vw,vh);
   const s=lerp(.3,Math.hypot(vw,vh)/58,easeOut(p));
   drawPortal(fxcx,px,py,(1-p)*2+.3,0,s);
  }
 }
};
function easeIn(t){return t*t*t}

/* ================= crops update ================= */
function updateCrops(dt){
 for(const dimId in G.farms){
  const f=G.farms[dimId],gm=DIMS[dimId].grow;
  for(const key in f.tiles){
   const t=f.tiles[key];
   if(t.moist>0)t.moist=Math.max(0,t.moist-dt*(100/35));
   if(t.crop&&t.crop.prog<1&&t.moist>0){
    t.crop.prog=Math.min(1,t.crop.prog+dt/CROPS[t.crop.k].grow*gm);
   }
  }
 }
}

/* ================= movement + update ================= */
function moveBy(dx,dy){
 const s=G.scene==='farm'?isSolidFarm:isSolidMine;
 const solid=(x,y)=>s(Math.floor((x-9)/T),Math.floor((y-6)/T))||s(Math.floor((x+9)/T),Math.floor((y-6)/T))||s(Math.floor((x-9)/T),Math.floor((y+6)/T))||s(Math.floor((x+9)/T),Math.floor((y+6)/T));
 if(dx&&!solid(player.x+dx,player.y))player.x+=dx;
 if(dy&&!solid(player.x,player.y+dy))player.y+=dy;
}
let saveT=0;
function update(dt){
 if(!started)return;
 if(portalGrace>0)portalGrace-=dt;
 if(recoil>0)recoil-=dt;
 if(swing.t>=0){swing.t+=dt;if(swing.t>.22)swing.t=-1}
 shk.a=Math.max(0,shk.a-dt*9);
 ringPulse=Math.max(0,ringPulse-dt*2);
 const lock=uiOpen||FX.active;
 if(lock||piloting)cancelAuto();
 if(!lock){
  if(!piloting){
   const inp=inputAxis();
   if(inp.l>0.02){
    cancelAuto();
    moveBy(inp.x*165*dt,inp.y*165*dt);
    if(inp.l>0.15){player.moving=true;player.walk+=dt}else player.moving=false;
   }else if(auto.on){
    const d=dist(player.x,player.y-10,auto.x,auto.y);
    if(d<=auto.r){
     const fn=auto.fn;cancelAuto();if(fn)fn();
    }else{
     const a=Math.atan2(auto.y-(player.y-10),auto.x-player.x);
     moveBy(Math.cos(a)*165*dt,Math.sin(a)*165*dt);
     player.moving=true;player.walk+=dt;
     if(d>=auto.lastD-1.5){
      auto.stuck+=dt;
      if(auto.stuck>.9){cancelAuto();if(auto.fn)toastOnce('Can\'t quite reach that.')}
     }else auto.stuck=0;
     auto.lastD=Math.min(auto.lastD,d);
    }
   }else player.moving=false;
  }
  if(mouse.down){clickCd-=dt;if(clickCd<=0){clickCd=.24;onMouseAction(true)}}
 }
 updateMouseWorld();
 updateShip(dt);
 updatePortals(dt);
 for(let i=projectiles.length-1;i>=0;i--){
  const pr=projectiles[i];pr.t+=dt/pr.dur;
  pr.x=lerp(pr.sx,pr.tx,pr.t);pr.y=lerp(pr.sy,pr.ty,pr.t)-Math.sin(pr.t*Math.PI)*24;
  addP(pr.x,pr.y,{vx:(Math.random()*20-10),vy:(Math.random()*20-10),ttl:.3,col:'#8fe33c',r:2,add:1});
  if(pr.t>=1){
   projectiles.splice(i,1);
   portals.push({x:pr.tx,y:pr.ty,age:0,ttl:25,tier:pr.tier,dim:pr.dim});
   burst(pr.tx,pr.ty,'#8fe33c',18,110);addShake(3);
   toast('A portal rips open. '+(pr.tier>0?FLUIDS[pr.tier].name+' charge used.':'Ugh — residual sludge.'),'info',2600);
  }
 }
 updateFly(dt);
 updateParticles(dt);
 updateCrops(dt);
 const amb=DIMS[G.dim].amb;
 if(G.scene==='farm'&&amb&&Math.random()<.12){
  addP(CAM.x+Math.random()*vw,CAM.y+(amb.vy<0?vh:0)+(Math.random()*40-20),{vx:Math.random()*16-8,vy:amb.vy,ttl:3,col:amb.col,r:2,add:amb.add});
 }
 if(G.flags.gun&&SLOTS[G.sel].id==='gun'&&!piloting){
  dripT-=dt;
  if(dripT<=0){dripT=2+Math.random()*2;
   const a=Math.atan2(mw.y-(player.y-16),mw.x-player.x);
   addP(player.x+Math.cos(a)*16,player.y-12,{vy:90,g:200,ttl:.7,col:'#5ee02e',r:3});}
 }
 let tx,ty;
 if(piloting&&ship){tx=ship.x+ship.vx*.25;ty=ship.y+ship.vy*.25}
 else{tx=player.x;ty=player.y-20}
 const wW=G.scene==='farm'?FW*T:MW*T,wH=G.scene==='farm'?FH*T:MH*T;
 let cx=tx-vw/2,cy=ty-vh/2;
 if(vw>=wW)cx=(wW-vw)/2;else cx=clamp(cx,0,wW-vw);
 if(vh>=wH)cy=(wH-vh)/2;else cy=clamp(cy,0,wH-vh);
 CAM.x=lerp(CAM.x,cx,Math.min(1,8*dt));
 CAM.y=lerp(CAM.y,cy,Math.min(1,8*dt));
 checkObjectives(dt);
 saveT+=dt;if(saveT>8){saveT=0;saveGame()}
}

function shopAction(a){
 if(a==='close'){closeModal();return}
 if(a.startsWith('tab:')){shopTab=a.slice(4);AU.click();renderShop();return}
 if(a.startsWith('buy:')){
  const[,what,arg]=a.split(':');
  if(what==='seed'){
   const c=CROPS[arg];
   if(G.money<c.seed){AU.err();return}
   G.money-=c.seed;G.inv['seed_'+arg]=(G.inv['seed_'+arg]||0)+1;
   AU.coin();renderShop();syncHUD(true);
  }else if(what==='pick'){
   const t=+arg,prices={2:80,3:300};
   if(G.flags.pickTier>=t||G.money<prices[t]||(t===3&&G.flags.pickTier<2)){AU.err();return}
   G.money-=prices[t];G.flags.pickTier=t;
   AU.craft();toast('Pickaxe Mk.'+['I','II','III'][t-1]+' equipped.','good');renderShop();syncHUD(true);
  }else if(what==='fluid'){
   const t=+arg;
   if(G.money<FLUIDS[t].cost){AU.err();toastOnce('Not enough money.');return}
   G.money-=FLUIDS[t].cost;G.fluids[t]=(G.fluids[t]||0)+5;G.selFluid=t;
   AU.coin();toast(FLUIDS[t].name+' ×5 loaded. Better odds online.','good');renderShop();syncHUD(true);
  }
 }
 if(a.startsWith('sellall:')){const k=a.slice(8);sellItem(k,k==='ALL'?1e9:(G.inv[k]||0));return}
 if(a.startsWith('sell:')){sellItem(a.slice(5),1);return}

function sellItem(k,n){
 if(k==='ALL'){
  let total=0;
  for(const kk in G.inv){
   if(!G.inv[kk]||kk.startsWith('seed_'))continue;
   const it=ITEMS[kk];if(!it||(!it.sell&&!it.crop))continue;
   const price=it.crop?CROPS[kk].sell*DIMS[G.dim].crop:it.sell;total+=price*G.inv[kk];
   if(DIMS[G.dim].crop>=3&&it.crop)G.stats.soldRich+=price*G.inv[kk];
   G.inv[kk]=0;
  }
  if(total>0){G.money+=total;G.stats.sales+=total;AU.coin();toast('Sold everything — +$'+fmt(total),'good')}
  renderShop();syncHUD(true);return;
 }
 const it=ITEMS[k];if(!it)return;
 const price=it.crop?CROPS[k].sell*DIMS[G.dim].crop:it.sell;
 n=Math.min(n,G.inv[k]||0);if(!n)return;
 G.inv[k]-=n;G.money+=price*n;G.stats.sales+=price*n;
 if(DIMS[G.dim].crop>=3&&it.crop)G.stats.soldRich+=price*n;
 AU.coin();renderShop();syncHUD(true);
}
