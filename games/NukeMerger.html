<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NUKE MERGE</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#060a14;--panel:rgba(8,16,30,0.94);--border:rgba(0,210,255,0.25);--accent:#00d4ff;--danger:#ff2244;--success:#00ff88;--text:#d8e4f0;--muted:#4a5a70;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);overflow:hidden;font-family:'Rajdhani',sans-serif;color:var(--text);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0}
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:10}
#resBar{position:absolute;top:max(6px,env(safe-area-inset-top,6px));left:max(6px,env(safe-area-inset-left,6px));background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 12px;display:flex;align-items:center;gap:8px;pointer-events:auto;font-size:11px}
#resBar i{color:var(--gold);font-size:14px}
#resVal{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:var(--gold)}
#incRate{color:var(--success);font-size:10px;font-family:'Orbitron',monospace}
#rbCount{color:var(--gold);font-size:10px;font-family:'Orbitron',monospace;border-left:1px solid var(--border);padding-left:8px;margin-left:4px}
.btn-row{position:absolute;bottom:max(8px,env(safe-area-inset-bottom,8px));left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center;max-width:95vw}
.gbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap;min-height:40px}
.gbtn:active{transform:scale(0.94);background:rgba(0,210,255,0.08)}
.gbtn.disabled{opacity:0.25;pointer-events:none}
.gbtn.shield-btn{border-color:rgba(0,255,136,0.3)}
.gbtn.shield-btn.active{background:rgba(0,255,136,0.15);border-color:var(--success);color:var(--success)}
.gbtn.shield-btn.cooldown{opacity:0.45}
.gbtn.launch-btn{border-color:rgba(255,100,50,0.3)}
.gbtn.rebirth-btn{border-color:rgba(255,215,0,0.4);color:var(--gold)}
.gbtn.rebirth-btn.confirm{background:rgba(255,215,0,0.15);border-color:var(--gold);animation:rbPulse 0.6s infinite alternate}
@keyframes rbPulse{to{box-shadow:0 0 15px rgba(255,215,0,0.3)}}
.gbtn.upgrade-btn{border-color:rgba(160,120,255,0.3)}
#shieldCd{font-size:9px;color:var(--muted);font-family:'Rajdhani',sans-serif}
#enemyBar{position:absolute;top:max(6px,env(safe-area-inset-top,6px));right:max(6px,env(safe-area-inset-right,6px));background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;pointer-events:auto;min-width:110px}
.ebar{display:flex;align-items:center;gap:5px;font-size:10px}
.ebar .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ebar .ename{flex:1;font-weight:600;font-size:9px}
.ebar .enuke{font-family:'Orbitron',monospace;font-size:8px;color:var(--muted)}
.ebar .eshield{font-size:9px;color:var(--success)}
#upgradePanel{position:fixed;top:0;right:0;bottom:0;width:min(300px,82vw);background:var(--panel);border-left:1px solid var(--border);z-index:20;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding:14px 10px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
#upgradePanel.open{transform:translateX(0)}
#upgradePanel h2{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:var(--accent);display:flex;align-items:center;justify-content:space-between}
.close-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px;min-width:36px;min-height:36px;display:flex;align-items:center;justify-content:center}
.ucard{background:rgba(0,210,255,0.04);border:1px solid var(--border);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:5px}
.ucard .utitle{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;display:flex;align-items:center;gap:5px}
.ucard .udesc{font-size:11px;color:var(--muted);line-height:1.2}
.ucard .ubuy{background:rgba(0,210,255,0.1);border:1px solid rgba(0,210,255,0.3);border-radius:7px;padding:7px 10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:36px}
.ucard .ubuy:active{background:rgba(0,210,255,0.25)}
.ucard .ubuy.maxed{opacity:0.35;pointer-events:none}
.rb-card{background:rgba(255,215,0,0.06);border:1px solid rgba(255,215,0,0.25);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:5px}
.rb-card .utitle{font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:5px}
.rb-card .udesc{font-size:11px;color:var(--muted);line-height:1.2}
.rb-card .ubuy{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);border-radius:7px;padding:7px 10px;font-family:'Orbitron',monospace;font-size:9px;font-weight:700;color:var(--gold);cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:36px}
.rb-card .ubuy:active{background:rgba(255,215,0,0.25)}
#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.toast-msg{font-family:'Orbitron',monospace;font-size:12px;font-weight:700;padding:5px 14px;border-radius:7px;background:rgba(0,0,0,0.8);animation:toastIn .3s ease,toastOut .4s ease 1.4s forwards;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(8px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translateY(-16px) scale(0.9)}}
#startScreen{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#startScreen h1{font-family:'Orbitron',monospace;font-size:clamp(26px,7vw,60px);font-weight:900;background:linear-gradient(135deg,#ff6432,#ffd700,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:3px}
#startScreen p{font-size:13px;color:var(--muted);letter-spacing:4px;text-transform:uppercase}
#startBtn{margin-top:14px;background:none;border:2px solid var(--accent);border-radius:12px;padding:12px 40px;font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;min-height:46px}
#startBtn:active{background:rgba(0,212,255,0.15);transform:scale(0.96)}
#selInfo{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-family:'Orbitron',monospace;font-size:9px;color:var(--accent);opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#selInfo.show{opacity:1}
#mapClose{position:fixed;top:max(6px,env(safe-area-inset-top,6px));left:50%;transform:translateX(-50%);z-index:15;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 18px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer;pointer-events:auto;display:none;min-height:36px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="startScreen">
<h1>NUKE MERGE</h1>
<p>Merge &middot; Arm &middot; Destroy &middot; Rebirth</p>
<button id="startBtn">ENGAGE</button>
</div>

<div id="hud">
<div id="resBar"><i class="fas fa-radiation"></i><span id="resVal">0</span><span id="incRate"></span><span id="rbCount">R0</span></div>
<div id="enemyBar"></div>
<div id="selInfo"></div>
<div class="btn-row">
<button class="gbtn shield-btn" id="shieldBtn" onclick="toggleShield()"><i class="fas fa-shield-halved"></i>SHIELD<span id="shieldCd"></span></button>
<button class="gbtn launch-btn disabled" id="launchBtn" onclick="openMap()"><i class="fas fa-rocket"></i>LAUNCH</button>
<button class="gbtn rebirth-btn" id="rebirthBtn" onclick="handleRebirth()"><i class="fas fa-infinity"></i>REBIRTH</button>
<button class="gbtn upgrade-btn" id="upgradeBtn" onclick="toggleUpgrades()"><i class="fas fa-arrow-up"></i>UPGRADE</button>
</div>
</div>

<button id="mapClose" onclick="closeMap()"><i class="fas fa-xmark"></i> CLOSE</button>

<div id="upgradePanel">
<h2>UPGRADES <button class="close-btn" onclick="toggleUpgrades()"><i class="fas fa-xmark"></i></button></h2>
<div id="upgradeCards"></div>
</div>

<div id="toast"></div>

<script>
/* ===== 动态核弹等级 ===== */
const BASE_TIERS=[
    {name:'Tiny',  color:'#4ade80',glow:'#22c55e',dmg:15,  hp:1, r:16},
    {name:'Small', color:'#facc15',glow:'#eab308',dmg:35,  hp:2, r:19},
    {name:'Medium',color:'#fb923c',glow:'#f97316',dmg:70,  hp:3, r:22},
    {name:'Large', color:'#f87171',glow:'#ef4444',dmg:140, hp:5, r:26},
    {name:'Mega',  color:'#c084fc',glow:'#a855f7',dmg:300, hp:8, r:30},
    {name:'Titan', color:'#f472b6',glow:'#ec4899',dmg:600, hp:12,r:35}
];
const REBIRTH_TIERS=[
    {name:'Omega',    color:'#00ffdd',glow:'#00aa99',dmg:1000, hp:16,r:38},
    {name:'Nova',     color:'#ff44ff',glow:'#aa22aa',dmg:1800, hp:22,r:41},
    {name:'Supernova',color:'#ffdd00',glow:'#aa9900',dmg:3200, hp:30,r:44},
    {name:'Void',     color:'#aa55ff',glow:'#7733cc',dmg:5600, hp:40,r:47},
    {name:'Annihilate',color:'#ff2200',glow:'#cc1100',dmg:10000,hp:55,r:50}
];
let TIERS=[...BASE_TIERS];
const SHIELD_CD=20;
const ENAME=['Crimson Isle','Obsidian Atoll','Storm Reef'];
const ECOL=['#ff4466','#8866ff','#ff8833'];

function rebuildTIERS(rb){
    TIERS=[...BASE_TIERS];
    for(let i=0;i<rb&&i<REBIRTH_TIERS.length;i++) TIERS.push(REBIRTH_TIERS[i]);
}
function maxTierForRebirth(rb){return BASE_TIERS.length-1+Math.min(rb,REBIRTH_TIERS.length);}

/* ===== 画布 ===== */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H,dpr,unit,topSafe,botSafe,playH;
function hash(a,b){let h=((a*2654435761)^(b*2246822519))>>>0;return(h&0xFFFF)/0xFFFF;}
function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    topSafe=40;botSafe=52;playH=H-topSafe-botSafe;
    unit=Math.min(W,playH)/100;
    if(G)updatePositions();
}
window.addEventListener('resize',resize);

/* ===== 游戏状态 ===== */
let G=null;
function initGame(){
    G={
        state:'playing',time:0,res:80,spawnTimer:0,
        shakeX:0,shakeY:0,shakePow:0,
        rebirth:0, rebirthConfirm:false,
        player:{
            nukes:[],selectedIdx:-1,
            shield:{active:false,timer:0,cd:0},
            upgrades:{spawnTier:0,spawnLimit:0,shieldTime:0},
            hp:100,maxHp:100,x:0,y:0,size:0,
            destroyed:false,respawnTimer:0
        },
        enemies:[],
        city:{x:0,y:0,hp:600,maxHp:600,size:0,destroyed:false,respawnTimer:0},
        projectiles:[],explosions:[],particles:[],floats:[],warnings:[],
        mapHover:-1,mapAnim:0,ambientParts:[]
    };
    rebuildTIERS(0);
    for(let i=0;i<3;i++){
        G.enemies.push({
            name:ENAME[i],color:ECOL[i],
            nukes:[],hp:80,maxHp:80,
            shield:{active:false,timer:0,cd:0},
            spawnTimer:3+Math.random()*4,launchTimer:8+Math.random()*10,
            x:0,y:0,size:0,alive:true,respawnTimer:0
        });
    }
    updatePositions();
    for(let i=0;i<18;i++) G.ambientParts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*3,r:Math.random()*1.5+0.5,a:Math.random()*0.2+0.05,phase:Math.random()*Math.PI*2});
    spawnPlayerNuke();spawnPlayerNuke();
    updateUI();
}

function updatePositions(){
    if(!G)return;
    const p=G.player;
    p.x=W*0.5;p.y=topSafe+playH*0.82;p.size=unit*8;
    G.city.x=W*0.5;G.city.y=topSafe+playH*0.35;G.city.size=unit*9;
    const m=Math.max(unit*8,W*0.12);
    G.enemies[0].x=W*0.5;G.enemies[0].y=topSafe+playH*0.08;
    G.enemies[1].x=m;G.enemies[1].y=topSafe+playH*0.42;
    G.enemies[2].x=W-m;G.enemies[2].y=topSafe+playH*0.42;
    G.enemies.forEach(e=>{e.size=unit*6.5;});
}

/* ===== 工具 ===== */
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function rand(a,b){return a+Math.random()*(b-a)}

/* 动态升级系统 */
function upgCost(type,lv){
    if(type==='spawnTier') return Math.floor(40*Math.pow(2.5,lv));
    if(type==='spawnLimit') return Math.floor(30*Math.pow(1.8,lv));
    if(type==='shieldTime') return Math.floor(40*Math.pow(2.2,lv));
    return Infinity;
}
function upgMax(type){
    if(type==='spawnTier') return maxTierForRebirth(G.rebirth);
    if(type==='spawnLimit') return 7+G.rebirth;
    if(type==='shieldTime') return 4+G.rebirth;
    return 0;
}
function upgDesc(type){
    const lv=G.player.upgrades[type];
    if(type==='spawnTier') return `Spawn tier ${lv+1} (${TIERS[clamp(lv,0,TIERS.length-1)].name})`;
    if(type==='spawnLimit') return `Max nukes: ${3+lv}`;
    if(type==='shieldTime') return `Shield: ${getShieldTime().toFixed(1)}s`;
    return '';
}
function getSpawnTier(){return Math.min(G.player.upgrades.spawnTier,TIERS.length-1);}
function getSpawnLimit(){return 3+G.player.upgrades.spawnLimit;}
function getShieldTime(){return 5+G.player.upgrades.shieldTime*2.5;}

/* 被动收入：每个核弹 (tier+1)*0.5 /秒 */
function getIncome(){
    return G.player.nukes.reduce((s,n)=>s+(n.tier+1)*0.5,0);
}

/* ===== 核弹生成 ===== */
function spawnPlayerNuke(){
    if(G.player.nukes.length>=getSpawnLimit())return;
    const tier=getSpawnTier();
    G.player.nukes.push({tier,hp:TIERS[tier].hp,maxHp:TIERS[tier].hp,x:0,y:0,targetX:0,targetY:0,bobPhase:Math.random()*Math.PI*2});
    updateNukePositions();
}
function spawnEnemyNuke(e){
    const maxN=5+G.rebirth;
    if(e.nukes.length>=maxN)return;
    e.nukes.push({tier:0,hp:1,maxHp:1,bobPhase:Math.random()*Math.PI*2});
}
function getNukePos(idx,total,cx,cy,size){
    const spacing=Math.min(unit*4.5,(size*3)/Math.max(1,total));
    return{x:cx-(total-1)*spacing/2+idx*spacing, y:cy-size*0.3-Math.max(8,unit*1.5)};
}
function updateNukePositions(){
    const p=G.player;
    p.nukes.forEach((n,i)=>{
        const pos=getNukePos(i,p.nukes.length,p.x,p.y,p.size);
        n.targetX=pos.x;n.targetY=pos.y;
        if(n.x===0&&n.y===0){n.x=pos.x;n.y=pos.y;}
    });
}

/* ===== 特效 ===== */
function showToast(text,color){
    const el=document.createElement('div');
    el.className='toast-msg';el.style.color=color;el.style.borderLeft='3px solid '+color;
    el.textContent=text;document.getElementById('toast').appendChild(el);
    setTimeout(()=>el.remove(),1800);
}
function addFloat(text,x,y,color){G.floats.push({text,x,y,color,life:1.8,maxLife:1.8});}
function addParticles(x,y,color,count,speed,life){
    for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*speed;
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-Math.random()*speed*0.3,r:Math.random()*3+1,color,life:life*(0.5+Math.random()*0.5),maxLife:life});}
}
function addExplosion(x,y,radius,color){
    G.explosions.push({x,y,radius,maxRadius:radius,color,life:0.8,maxLife:0.8});
    addParticles(x,y,color,20,120,0.8);addParticles(x,y,'#ffd700',8,80,0.5);
    G.shakePow=Math.min(G.shakePow+radius*0.15,14);
}

/* ===== 盾牌 ===== */
function toggleShield(){
    const p=G.player;
    if(p.shield.active||p.shield.cd>0||G.state!=='playing'||p.destroyed)return;
    p.shield.active=true;p.shield.timer=getShieldTime();
    showToast('SHIELD ACTIVE','#00ff88');
    addParticles(p.x,p.y,'#00ff88',15,60,0.6);updateUI();
}

/* ===== 地图 ===== */
function openMap(){
    if(G.player.selectedIdx<0||G.player.selectedIdx>=G.player.nukes.length)return;
    G.state='map';G.mapAnim=0;G.mapHover=-1;
    document.getElementById('mapClose').style.display='block';
}
function closeMap(){G.state='playing';document.getElementById('mapClose').style.display='none';}
function getMapTargets(){
    const targets=[];
    if(!G.city.destroyed)
        targets.push({type:'city',name:'MEGALOPOLIS',x:G.city.x,y:G.city.y,hp:G.city.hp,maxHp:G.city.maxHp,sub:'Central City'});
    G.enemies.forEach((e,i)=>{
        if(e.alive) targets.push({type:'enemy',idx:i,name:e.name,x:e.x,y:e.y,hp:e.hp,maxHp:e.maxHp,
            sub:e.nukes.length+' nukes'+(e.shield.active?' | SHIELDED':''),shielded:e.shield.active,color:e.color});
    });
    return targets;
}

/* ===== 发射（发射时盾牌关闭） ===== */
function launchNuke(target){
    const p=G.player;if(p.selectedIdx<0)return;
    const nuke=p.nukes[p.selectedIdx];if(!nuke)return;
    const tier=TIERS[clamp(nuke.tier,0,TIERS.length-1)];
    p.nukes.splice(p.selectedIdx,1);p.selectedIdx=-1;
    updateNukePositions();
    /* 盾牌在发射时关闭 */
    if(p.shield.active){
        p.shield.active=false;p.shield.cd=SHIELD_CD;
        showToast('SHIELD OFF - LAUNCHED','#ff8844');
    }
    G.projectiles.push({
        fromX:p.x,fromY:p.y-p.size*0.3,toX:target.x,toY:target.y,
        progress:0,speed:0.55+nuke.tier*0.04,tier:nuke.tier,dmg:tier.dmg,
        owner:'player',target:target
    });
    showToast('LAUNCHED '+tier.name.toUpperCase(),tier.color);
    addParticles(p.x,p.y-p.size,tier.color,12,50,0.4);
    G.state='playing';document.getElementById('mapClose').style.display='none';updateUI();
}
function launchEnemyNuke(e,tx,ty,target){
    if(e.nukes.length===0)return;
    e.nukes.sort((a,b)=>b.tier-a.tier);
    const nuke=e.nukes.shift();const tier=TIERS[clamp(nuke.tier,0,TIERS.length-1)];
    G.projectiles.push({
        fromX:e.x,fromY:e.y+e.size*0.6,toX:tx,toY:ty,
        progress:0,speed:0.35+nuke.tier*0.03,tier:nuke.tier,dmg:tier.dmg,
        owner:'enemy',ownerIdx:G.enemies.indexOf(e),target:target
    });
}

/* ===== 伤害（安全索引） ===== */
function applyDamage(base,dmg){
    let remaining=dmg;const nukes=base.nukes||[];
    while(remaining>0&&nukes.length>0){
        let minT=999,mi=-1;
        for(let i=0;i<nukes.length;i++){if(nukes[i]&&nukes[i].tier<minT){minT=nukes[i].tier;mi=i;}}
        if(mi<0||!nukes[mi])break;
        nukes[mi].hp-=remaining;
        if(nukes[mi].hp<=0){
            remaining=-nukes[mi].hp;
            addFloat('-'+TIERS[clamp(nukes[mi].tier,0,TIERS.length-1)].name,base.x+rand(-20,20),base.y-10,'#ff4444');
            nukes.splice(mi,1);
        }else{remaining=0;}
    }
    if(remaining>0){base.hp-=remaining;addFloat('-'+Math.round(remaining)+' HP',base.x,base.y+20,'#ff2244');}
}

/* ===== 升级购买 ===== */
function buyUpgrade(type){
    const lv=G.player.upgrades[type],cost=upgCost(type,lv),max=upgMax(type);
    if(G.res<cost||lv>=max)return;
    G.res-=cost;G.player.upgrades[type]++;
    showToast('UPGRADED!','#a078ff');updateUI();renderUpgradeCards();
}

/* ===== 合并 ===== */
function canMerge(fi,ti){
    if(fi<0||ti<0||fi===ti)return false;
    const p=G.player;
    if(fi>=p.nukes.length||ti>=p.nukes.length)return false;
    if(p.nukes[fi].tier!==p.nukes[ti].tier)return false;
    if(p.nukes[fi].tier>=TIERS.length-1)return false;
    return true;
}

/* ===== REBIRTH ===== */
function handleRebirth(){
    if(G.player.destroyed)return;
    const btn=document.getElementById('rebirthBtn');
    if(!G.rebirthConfirm){
        G.rebirthConfirm=true;
        btn.classList.add('confirm');
        btn.innerHTML='<i class="fas fa-exclamation-triangle"></i>TAP AGAIN';
        setTimeout(()=>{if(G.rebirthConfirm){G.rebirthConfirm=false;btn.classList.remove('confirm');btn.innerHTML='<i class="fas fa-infinity"></i>REBIRTH';}},3000);
        return;
    }
    G.rebirthConfirm=false;btn.classList.remove('confirm');
    btn.innerHTML='<i class="fas fa-infinity"></i>REBIRTH';
    doRebirth();
}
function doRebirth(){
    G.rebirth++;
    rebuildTIERS(G.rebirth);
    const p=G.player;
    p.nukes=[];p.selectedIdx=-1;
    p.hp=p.maxHp;p.destroyed=false;p.respawnTimer=0;
    p.shield={active:false,timer:0,cd:0};
    p.upgrades={spawnTier:0,spawnLimit:0,shieldTime:0};
    G.res=80+G.rebirth*20;
    G.city.maxHp=600+G.rebirth*200;G.city.hp=G.city.maxHp;G.city.destroyed=false;G.city.respawnTimer=0;
    G.enemies.forEach(e=>{
        e.alive=true;e.maxHp=80+G.rebirth*30;e.hp=e.maxHp;
        e.nukes=[];e.shield={active:false,timer:0,cd:0};
        e.spawnTimer=3+Math.random()*4;e.launchTimer=8+Math.random()*10;e.respawnTimer=0;
    });
    G.projectiles=[];G.explosions=[];G.particles=[];G.floats=[];G.warnings=[];
    spawnPlayerNuke();spawnPlayerNuke();
    if(G.rebirth>1){spawnPlayerNuke();}
    const newTier=TIERS[TIERS.length-1];
    showToast('REBIRTH '+G.rebirth+' — '+newTier.name.toUpperCase()+' UNLOCKED','#ffd700');
    addParticles(p.x,p.y,'#ffd700',30,100,1);
    updateUI();renderUpgradeCards();
}

/* ===== AI（敌人重生） ===== */
function updateAI(dt){
    const rb=G.rebirth;
    G.enemies.forEach((e,i)=>{
        if(!e.alive){
            e.respawnTimer-=dt;
            if(e.respawnTimer<=0){
                e.alive=true;e.hp=e.maxHp;e.nukes=[];
                e.shield={active:false,timer:0,cd:0};
                e.spawnTimer=5+Math.random()*3;e.launchTimer=10+Math.random()*5;
                showToast(e.name+' REBUILT',e.color);
            }
            return;
        }
        if(e.shield.active){e.shield.timer-=dt;if(e.shield.timer<=0){e.shield.active=false;e.shield.cd=SHIELD_CD;}}
        else{e.shield.cd-=dt;}
        e.spawnTimer-=dt;
        if(e.spawnTimer<=0){spawnEnemyNuke(e);e.spawnTimer=Math.max(2,4-rb*0.3)+Math.random()*3;mergeEnemyNukes(e);}
        e.launchTimer-=dt;
        if(e.launchTimer<=0&&e.nukes.length>0){
            e.launchTimer=Math.max(5,8-rb*0.5)+Math.random()*10;
            const roll=Math.random();
            if(roll<0.35) launchEnemyNuke(e,G.city.x,G.city.y,{type:'city'});
            else if(roll<0.75) launchEnemyNuke(e,G.player.x,G.player.y-G.player.size,{type:'player'});
            else{
                const others=G.enemies.filter((o,j)=>j!==i&&o.alive);
                if(others.length>0){const t=others[Math.floor(Math.random()*others.length)];launchEnemyNuke(e,t.x,t.y+t.size,{type:'enemy',idx:G.enemies.indexOf(t)});}
            }
        }
        const inc=G.projectiles.find(p=>p.owner!=='enemy'&&p.target&&p.target.type==='enemy'&&p.target.idx===i);
        if(inc&&!e.shield.active&&e.shield.cd<=0&&Math.random()<0.4){e.shield.active=true;e.shield.timer=3;}
    });
}
function mergeEnemyNukes(e){
    let merged=true;
    while(merged){merged=false;
        for(let i=0;i<e.nukes.length-1;i++){
            if(e.nukes[i]&&e.nukes[i+1]&&e.nukes[i].tier===e.nukes[i+1].tier&&e.nukes[i].tier<TIERS.length-1){
                const nt=e.nukes[i].tier+1;
                e.nukes[i]={tier:nt,hp:TIERS[nt].hp,maxHp:TIERS[nt].hp,bobPhase:Math.random()*Math.PI*2};
                e.nukes.splice(i+1,1);merged=true;break;
            }
        }
    }
}

/* ===== 主更新 ===== */
function update(dt){
    if(G.state==='gameover')return;
    G.time+=dt;
    /* 震动衰减 */
    if(G.shakePow>0){G.shakePow*=Math.pow(0.04,dt);G.shakeX=(Math.random()-0.5)*G.shakePow;G.shakeY=(Math.random()-0.5)*G.shakePow;if(G.shakePow<0.3){G.shakePow=0;G.shakeX=0;G.shakeY=0;}}
    if(G.state==='map'){G.mapAnim=Math.min(G.mapAnim+dt*3,1);return;}
    const p=G.player;
    /* 玩家基地重生 */
    if(p.destroyed){
        p.respawnTimer-=dt;
        if(p.respawnTimer<=0){p.destroyed=false;p.hp=p.maxHp;G.res=Math.max(G.res,20);showToast('BASE REBUILT','#00d4ff');addParticles(p.x,p.y,'#00d4ff',15,60,0.6);}
    } else {
        /* 盾牌 */
        if(p.shield.active){p.shield.timer-=dt;if(p.shield.timer<=0){p.shield.active=false;p.shield.cd=SHIELD_CD;showToast('SHIELD DOWN','#ff8844');}}
        else{if(p.shield.cd>0)p.shield.cd-=dt;}
        /* 核弹生成 */
        G.spawnTimer-=dt;
        if(G.spawnTimer<=0){spawnPlayerNuke();G.spawnTimer=3.5;}
        /* 核弹位置平滑 */
        p.nukes.forEach(n=>{n.x=lerp(n.x,n.targetX,Math.min(1,dt*8));n.y=lerp(n.y,n.targetY,Math.min(1,dt*8));n.bobPhase+=dt*2;});
    }
    /* 城市重生 */
    if(G.city.destroyed){
        G.city.respawnTimer-=dt;
        if(G.city.respawnTimer<=0){G.city.destroyed=false;G.city.hp=G.city.maxHp;showToast('MEGALOPOLIS REBUILT','#ff6432');addParticles(G.city.x,G.city.y,'#ff6432',20,80,0.8);}
    }
    /* 被动收入 */
    if(!p.destroyed) G.res+=getIncome()*dt;
    /* 投射物 */
    for(let i=G.projectiles.length-1;i>=0;i--){
        const pr=G.projectiles[i];pr.progress+=dt*pr.speed;
        if(pr.progress>=1){
            const tx=pr.toX,ty=pr.toY;
            const tier=TIERS[clamp(pr.tier,0,TIERS.length-1)];
            let deflected=false;
            if(pr.target.type==='city'){
                if(!G.city.destroyed){
                    G.city.hp-=pr.dmg;addFloat('-'+pr.dmg,tx,ty-20,'#ff6432');
                    addExplosion(tx,ty,unit*4+pr.tier*unit,tier.color);
                    if(pr.owner==='player'){const g=Math.floor(pr.dmg*1.5);G.res+=g;addFloat('+'+g,tx+30,ty,'#ffd700');}
                    if(G.city.hp<=0){G.city.hp=0;G.city.destroyed=true;G.city.respawnTimer=60;addExplosion(G.city.x,G.city.y,unit*8,'#ff4400');showToast('MEGALOPOLIS DESTROYED — 60s','/ff6432');}
                }
            }else if(pr.target.type==='player'){
                if(p.destroyed){deflected=true;}
                else if(p.shield.active){deflected=true;showToast('DEFLECTED!','#00ff88');addParticles(tx,ty,'#00ff88',15,80,0.5);}
                else{applyDamage(p,pr.dmg);addExplosion(tx,ty,unit*3.5+pr.tier*unit,tier.color);
                    if(p.hp<=0){p.hp=0;p.destroyed=true;p.respawnTimer=15;p.nukes=[];p.selectedIdx=-1;
                        addExplosion(p.x,p.y,unit*7,'#0088ff');showToast('BASE DESTROYED — 15s','#ff2244');}
                    updateNukePositions();
                }
            }else if(pr.target.type==='enemy'){
                const eIdx=pr.target.idx;
                const e=(eIdx>=0&&eIdx<G.enemies.length)?G.enemies[eIdx]:null;
                if(e&&e.alive){
                    if(e.shield.active){deflected=true;addParticles(tx,ty,'#00ff88',12,70,0.4);}
                    else{applyDamage(e,pr.dmg);addExplosion(tx,ty,unit*3+pr.tier*unit,tier.color);
                        if(pr.owner==='player'){const g=10+pr.tier*5;G.res+=g;addFloat('+'+g,tx+20,ty,'#ffd700');}
                        if(e.hp<=0){e.alive=false;e.respawnTimer=45;addExplosion(e.x,e.y,unit*6,e.color);showToast(e.name+' DESTROYED — 45s','#ffd700');}
                    }
                }
            }
            if(!deflected)G.warnings.push({x:tx,y:ty,life:0.6,maxLife:0.6});
            G.projectiles.splice(i,1);
        }
    }
    for(let i=G.explosions.length-1;i>=0;i--){G.explosions[i].life-=dt;if(G.explosions[i].life<=0)G.explosions.splice(i,1);}
    for(let i=G.particles.length-1;i>=0;i--){const pt=G.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=100*dt;pt.life-=dt;if(pt.life<=0)G.particles.splice(i,1);}
    for(let i=G.floats.length-1;i>=0;i--){G.floats[i].y-=30*dt;G.floats[i].life-=dt;if(G.floats[i].life<=0)G.floats.splice(i,1);}
    for(let i=G.warnings.length-1;i>=0;i--){G.warnings[i].life-=dt;if(G.warnings[i].life<=0)G.warnings.splice(i,1);}
    G.ambientParts.forEach(ap=>{ap.x+=ap.vx*dt;ap.y+=ap.vy*dt+Math.sin(G.time+ap.phase)*0.3;if(ap.x<-10)ap.x=W+10;if(ap.x>W+10)ap.x=-10;if(ap.y<-10)ap.y=H+10;if(ap.y>H+10)ap.y=-10;});
    updateAI(dt);updateUI();
}

/* ===== 绘制 ===== */
function render(){
    ctx.save();ctx.translate(G.shakeX,G.shakeY);
    drawOcean();drawWarnings();drawConnections();
    /* 敌人 */
    G.enemies.forEach(e=>{
        if(e.alive){drawIsland(e.x,e.y,e.size,false,e.name,e.color);drawEnemyNukes(e);if(e.shield.active)drawShieldDome(e.x,e.y,e.size,e.color);drawHPBar(e.x,e.y-e.size*0.6-unit,e.size*1.2,e.hp,e.maxHp,e.color);}
        else drawDeadIsland(e.x,e.y,e.size,e.color,e.respawnTimer);
    });
    /* 城市 */
    if(!G.city.destroyed) drawCity();
    else drawDeadCity();
    /* 玩家 */
    if(!G.player.destroyed){
        drawIsland(G.player.x,G.player.y,G.player.size,true,'YOUR BASE','#00d4ff');
        if(G.player.shield.active)drawShieldDome(G.player.x,G.player.y,G.player.size,'#00ff88');
        drawHPBar(G.player.x,G.player.y+G.player.size*0.7,G.player.size*1.4,G.player.hp,G.player.maxHp,'#00d4ff');
        drawPlayerNukes();
    }else drawDeadIsland(G.player.x,G.player.y,G.player.size,'#00d4ff',G.player.respawnTimer);
    G.projectiles.forEach(drawProjectile);
    G.explosions.forEach(drawExplosion);
    G.particles.forEach(drawParticle);
    G.floats.forEach(drawFloatText);
    G.ambientParts.forEach(ap=>{ctx.beginPath();ctx.arc(ap.x,ap.y,ap.r,0,Math.PI*2);ctx.fillStyle=`rgba(100,200,255,${ap.a*(0.5+0.5*Math.sin(G.time*2+ap.phase))})`;ctx.fill();});
    if(G.state==='map')drawMapView();
    ctx.restore();
}

function drawOcean(){
    const grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#040810');grad.addColorStop(0.3,'#071520');grad.addColorStop(0.7,'#0a1e30');grad.addColorStop(1,'#0c2238');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    for(let l=0;l<4;l++){
        ctx.beginPath();const a=0.02+l*0.01,f=0.005+l*0.002,am=5+l*4,sp=0.4+l*0.2,yb=H*(0.15+l*0.22);
        ctx.moveTo(0,yb);for(let x=0;x<=W;x+=5){ctx.lineTo(x,yb+Math.sin(x*f+G.time*sp)*am+Math.sin(x*f*1.7+G.time*sp*0.6)*am*0.4);}
        ctx.strokeStyle=`rgba(0,160,220,${a})`;ctx.lineWidth=1;ctx.stroke();
    }
}
function drawConnections(){
    ctx.setLineDash([4,8]);ctx.lineWidth=0.5;ctx.strokeStyle='rgba(0,180,255,0.06)';
    const p=G.player;[G.city,...G.enemies.filter(e=>e.alive)].forEach(t=>{if(!t.destroyed){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(t.x,t.y);ctx.stroke();}});
    ctx.setLineDash([]);
}
function drawIsland(x,y,size,isP,name,color){
    const s=size;
    ctx.beginPath();ctx.ellipse(x,y+s*0.15,s*1.3,s*0.4,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fill();
    ctx.beginPath();ctx.ellipse(x,y,s*1.15,s*0.65,0,0,Math.PI*2);
    const wg=ctx.createRadialGradient(x,y,s*0.5,x,y,s*1.15);wg.addColorStop(0,'rgba(0,100,150,0.15)');wg.addColorStop(1,'rgba(0,60,100,0.05)');ctx.fillStyle=wg;ctx.fill();
    ctx.beginPath();ctx.ellipse(x,y,s,s*0.58,0,0,Math.PI*2);ctx.fillStyle='#8a7450';ctx.fill();
    ctx.beginPath();ctx.ellipse(x,y,s*0.92,s*0.52,0,0,Math.PI*2);ctx.fillStyle='#a08060';ctx.fill();
    ctx.beginPath();ctx.ellipse(x-s*0.15,y-s*0.05,s*0.7,s*0.4,-0.15,0,Math.PI*2);ctx.fillStyle='#1a5c30';ctx.fill();
    ctx.beginPath();ctx.ellipse(x+s*0.25,y+s*0.05,s*0.45,s*0.32,0.2,0,Math.PI*2);ctx.fillStyle='#236b3a';ctx.fill();
    const bc=isP?'#1a3a5a':'#3a1a1a',bh=isP?'#2a5a8a':'#5a2a2a';
    drawBldg(x-s*0.35,y-s*0.12,s*0.1,s*0.2,bc,bh,1);
    drawBldg(x+s*0.05,y-s*0.22,s*0.12,s*0.28,bc,bh,2);
    drawBldg(x+s*0.35,y-s*0.08,s*0.08,s*0.16,bc,bh,3);
    ctx.strokeStyle='#888';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+s*0.05,y-s*0.5);ctx.lineTo(x+s*0.05,y-s*0.68);ctx.stroke();
    ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+s*0.05,y-s*0.68);ctx.lineTo(x+s*0.05+s*0.13,y-s*0.62);ctx.lineTo(x+s*0.05,y-s*0.56);ctx.fill();
    ctx.font=`700 ${Math.max(8,s*0.18)}px Orbitron`;ctx.fillStyle=color;ctx.textAlign='center';ctx.fillText(name,x,y-s*0.82);
}
function drawBldg(x,y,w,h,base,hl,seed){
    ctx.fillStyle=base;ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle=hl;ctx.fillRect(x-w/2,y-h,w,2);
    const rows=Math.max(1,Math.floor(h/6)),cols=Math.max(1,Math.floor(w/5));
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(hash(seed*100+r*7+c*13,r*31+c*47+seed*17)>0.4){ctx.fillStyle=`rgba(255,220,100,${0.3+hash(r*53+c*59+seed*23,r*71+c*83)*0.5})`;ctx.fillRect(x-w/2+2+c*5,y-h+3+r*6,2,2);}
}
function drawDeadIsland(x,y,size,color,timer){

function drawDeadCity(){

function drawCity(){
    const c=G.city,s=c.size;
    const pulse=0.5+0.5*Math.sin(G.time*1.5),auraR=s*1.5+pulse*s*0.3;

function drawHPBar(x,y,w,hp,maxHp,color){
    const h=4,ratio=clamp(hp/maxHp,0,1);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(x-w/2-1,y-1,w+2,h+2);
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(x-w/2,y,w,h);
    if(ratio>0){ctx.fillStyle=ratio>0.5?color:ratio>0.25?'#ff8800':'#ff2244';ctx.fillRect(x-w/2,y,w*ratio,h);}
    ctx.font='600 9px Rajdhani';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(Math.max(0,Math.ceil(hp))+'/'+maxHp,x,y+h+10);
}
function drawNuke(nuke,x,y,r,selected,hoverMerge){
    const ti=clamp(nuke.tier,0,TIERS.length-1),t=TIERS[ti],pulse=0.8+0.2*Math.sin(G.time*3+nuke.bobPhase);
    const gr=r*2.5*pulse,glow=ctx.createRadialGradient(x,y,r*0.3,x,y,gr);
    glow.addColorStop(0,t.glow+'40');glow.addColorStop(0.5,t.glow+'15');glow.addColorStop(1,t.glow+'00');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,gr,0,Math.PI*2);ctx.fill();
    const bg=ctx.createRadialGradient(x-r*0.2,y-r*0.2,0,x,y,r);
    bg.addColorStop(0,'#ffffff40');bg.addColorStop(0.3,t.color);bg.addColorStop(1,t.glow);
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=t.color;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=Math.max(1,r*0.1);
    for(let i=0;i<3;i++){const a=i*Math.PI*2/3-Math.PI/2;ctx.beginPath();ctx.arc(x,y,r*0.55,a-0.5,a+0.5);ctx.stroke();}
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.arc(x,y,r*0.15,0,Math.PI*2);ctx.fill();
    ctx.font=`900 ${Math.max(7,r*0.65)}px Orbitron`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(nuke.tier+1,x,y+1);ctx.textBaseline='alphabetic';
    if(nuke.maxHp>1){const dr=Math.max(1.5,r*0.12),ds=Math.max(5,r*0.35),dw=nuke.maxHp*ds;for(let i=0;i<nuke.maxHp;i++){const dx=x-dw/2+i*ds+ds/2,dy=y+r+6;ctx.beginPath();ctx.arc(dx,dy,dr,0,Math.PI*2);ctx.fillStyle=i<nuke.hp?t.color:'rgba(255,255,255,0.15)';ctx.fill();}}
    if(selected){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.lineDashOffset=-G.time*20;ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.lineDashOffset=0;}
    if(hoverMerge){ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,r+5,0,Math.PI*2);ctx.stroke();ctx.restore();}
}
function drawPlayerNukes(){
    const p=G.player;
    p.nukes.forEach((n,i)=>{
        if(isDragging&&dragIdx===i)return;
        const bob=Math.sin(G.time*2+n.bobPhase)*2;
        const sel=p.selectedIdx===i;
        const hov=!isDragging&&mouseOverNuke===i&&canMerge(p.selectedIdx>=0?p.selectedIdx:-1,i);
        drawNuke(n,n.x,n.y+bob,TIERS[clamp(n.tier,0,TIERS.length-1)].r,sel,hov);
    });
    if(isDragging&&dragIdx>=0&&dragIdx<p.nukes.length){
        const n=p.nukes[dragIdx];
        drawNuke(n,inputX,inputY,TIERS[clamp(n.tier,0,TIERS.length-1)].r*1.15,false,false);
        if(mouseOverNuke>=0&&mouseOverNuke!==dragIdx&&canMerge(dragIdx,mouseOverNuke)){
            const tgt=p.nukes[mouseOverNuke];if(tgt){
                ctx.save();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(tgt.x,tgt.y,TIERS[clamp(tgt.tier,0,TIERS.length-1)].r+8,0,Math.PI*2);ctx.stroke();ctx.restore();
                ctx.font='700 18px Orbitron';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('+',(inputX+tgt.x)/2,(inputY+tgt.y)/2+5);
            }
        }
    }
}
function drawEnemyNukes(e){
    const count=e.nukes.length;if(count===0)return;
    const spacing=Math.min(unit*2,e.size*0.5/count),sx=e.x-(count-1)*spacing/2;
    e.nukes.forEach((n,i)=>{
        const nx=sx+i*spacing,ny=e.y+e.size*0.6+10+Math.sin(G.time*2+n.bobPhase)*2;
        const t=TIERS[clamp(n.tier,0,TIERS.length-1)],r=Math.max(5,t.r*0.5);
        ctx.fillStyle=t.color;ctx.beginPath();ctx.arc(nx,ny,r,0,Math.PI*2);ctx.fill();
        ctx.font=`700 ${Math.max(6,r*0.8)}px Orbitron`;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.tier+1,nx,ny);ctx.textBaseline='alphabetic';
    });
}
function drawShieldDome(x,y,size,color){
    const r=size*1.3,pulse=0.7+0.3*Math.sin(G.time*4);
    ctx.save();ctx.globalAlpha=0.12*pulse;
    const g=ctx.createRadialGradient(x,y-size*0.2,0,x,y,r);g.addColorStop(0,color);g.addColorStop(0.7,color+'80');g.addColorStop(1,color+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r,r*0.7,0,Math.PI,0);ctx.fill();
    ctx.globalAlpha=0.4*pulse;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r,r*0.7,0,Math.PI,0);ctx.stroke();
    ctx.globalAlpha=0.08;ctx.lineWidth=1;for(let i=0;i<6;i++){const a=Math.PI+i*Math.PI/6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r*0.7);ctx.stroke();}
    ctx.restore();
}
function drawProjectile(pr){
    const t=pr.progress,fx=pr.fromX,fy=pr.fromY,tx=pr.toX,ty=pr.toY;
    const cx=(fx+tx)/2,cy=Math.min(fy,ty)-dist({x:fx,y:fy},{x:tx,y:ty})*0.3;
    const px=(1-t)*(1-t)*fx+2*(1-t)*t*cx+t*t*tx,py=(1-t)*(1-t)*fy+2*(1-t)*t*cy+t*t*ty;
    const tier=TIERS[clamp(pr.tier,0,TIERS.length-1)];
    ctx.strokeStyle=tier.color;ctx.lineWidth=2;ctx.beginPath();
    for(let i=0;i<=8;i++){const tt=Math.max(0,t-i*0.015);ctx.lineTo((1-tt)*(1-tt)*fx+2*(1-tt)*tt*cx+tt*tt*tx,(1-tt)*(1-tt)*fy+2*(1-tt)*tt*cy+tt*tt*ty);}
    ctx.globalAlpha=0.6;ctx.stroke();ctx.globalAlpha=1;
    const glow=ctx.createRadialGradient(px,py,0,px,py,10);glow.addColorStop(0,'#ffffff');glow.addColorStop(0.3,tier.color);glow.addColorStop(1,tier.color+'00');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(px,py,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill();
}
function drawExplosion(e){
    const t=1-e.life/e.maxLife,r=Math.max(1,e.maxRadius*(0.3+0.7*t)),a=1-t;
    ctx.save();ctx.globalAlpha=a*0.5;
    const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,r);g.addColorStop(0,'#ffffff');g.addColorStop(0.2,e.color);g.addColorStop(0.6,e.color+'80');g.addColorStop(1,e.color+'00');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=a*0.3;ctx.strokeStyle=e.color;ctx.lineWidth=3*(1-t);ctx.beginPath();ctx.arc(e.x,e.y,Math.max(1,r*1.2),0,Math.PI*2);ctx.stroke();ctx.restore();
}
function drawParticle(pt){const a=pt.life/pt.maxLife;ctx.globalAlpha=a;ctx.fillStyle=pt.color;ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(0.5,pt.r*a),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
function drawFloatText(ft){const a=ft.life/ft.maxLife;ctx.globalAlpha=a;ctx.font='700 11px Orbitron';ctx.fillStyle=ft.color;ctx.textAlign='center';ctx.fillText(ft.text,ft.x,ft.y);ctx.globalAlpha=1;}
function drawWarnings(){G.warnings.forEach(w=>{const t=1-w.life/w.maxLife;ctx.globalAlpha=(1-t)*0.4;ctx.strokeStyle='#ff4444';ctx.lineWidth=2*(1-t);ctx.beginPath();ctx.arc(w.x,w.y,Math.max(1,40*t),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;});}

/* ===== 地图视图 ===== */
function drawMapView(){
    const a=G.mapAnim;
    ctx.fillStyle=`rgba(4,8,16,${0.85*a})`;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=0.08*a;ctx.strokeStyle='#00d4ff';ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();
    ctx.save();ctx.globalAlpha=0.03*a;for(let y=0;y<H;y+=3){ctx.fillStyle='#00d4ff';ctx.fillRect(0,y,W,1);}ctx.restore();
    ctx.save();ctx.globalAlpha=a;ctx.font='900 18px Orbitron';ctx.fillStyle='#00d4ff';ctx.textAlign='center';ctx.fillText('STRATEGIC MAP',W/2,40);
    ctx.font='400 11px Rajdhani';ctx.fillStyle='#5a8aaa';ctx.fillText('Select a target',W/2,56);ctx.restore();
    if(G.player.selectedIdx>=0&&G.player.selectedIdx<G.player.nukes.length){
        const sel=G.player.nukes[G.player.selectedIdx],tier=TIERS[clamp(sel.tier,0,TIERS.length-1)];
        ctx.save();ctx.globalAlpha=a;ctx.font='700 10px Orbitron';ctx.fillStyle=tier.color;ctx.textAlign='center';ctx.fillText(`ARMED: ${tier.name.toUpperCase()} (DMG: ${tier.dmg})`,W/2,H-44);ctx.restore();
    }
    const targets=getMapTargets();
    targets.forEach((tgt,i)=>{
        const tx=tgt.x,ty=tgt.y,isH=G.mapHover===i,pulse=0.6+0.4*Math.sin(G.time*3+i);
        const col=tgt.color||'#ff6432';
        ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=isH?3:1.5;ctx.beginPath();ctx.arc(tx,ty,isH?34:24,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=a*pulse*0.3;ctx.beginPath();ctx.arc(tx,ty,16+pulse*8,0,Math.PI*2);ctx.stroke();
        ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(tx,ty,isH?7:4,0,Math.PI*2);ctx.fill();
        ctx.font=`700 ${isH?11:9}px Orbitron`;ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(tgt.name,tx,ty-(isH?42:32));
        if(tgt.sub){ctx.font='400 9px Rajdhani';ctx.fillStyle='#8aa';ctx.fillText(tgt.sub,tx,ty+(isH?46:38));}
        if(tgt.hp!==undefined){const bw=40,bh=3,ratio=clamp(tgt.hp/tgt.maxHp,0,1);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(tx-bw/2,ty+18,bw,bh);ctx.fillStyle=ratio>0.5?col:ratio>0.25?'#ff8800':'#ff2244';ctx.fillRect(tx-bw/2,ty+18,bw*ratio,bh);}
        if(tgt.shielded){ctx.font='600 9px Rajdhani';ctx.fillStyle='#00ff88';ctx.fillText('SHIELDED',tx,ty+30);}
        if(isH){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.globalAlpha=a*0.5;const cs=40;
            ctx.beginPath();ctx.moveTo(tx-cs,ty);ctx.lineTo(tx-10,ty);ctx.stroke();ctx.beginPath();ctx.moveTo(tx+10,ty);ctx.lineTo(tx+cs,ty);ctx.stroke();
            ctx.beginPath();ctx.moveTo(tx,ty-cs);ctx.lineTo(tx,ty-10);ctx.stroke();ctx.beginPath();ctx.moveTo(tx,ty+10);ctx.lineTo(tx,ty+cs);ctx.stroke();}
        ctx.restore();
    });
    if(G.mapHover>=0&&G.mapHover<targets.length){
        const tgt=targets[G.mapHover];
        ctx.save();ctx.globalAlpha=a*0.5;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.setLineDash([6,6]);ctx.lineDashOffset=-G.time*30;
        ctx.beginPath();ctx.moveTo(G.player.x,G.player.y);ctx.lineTo(tgt.x,tgt.y);ctx.stroke();ctx.setLineDash([]);ctx.restore();
    }
}

/* ===== 输入 ===== */
let inputX=0,inputY=0,inputDown=false,dragIdx=-1,isDragging=false,dragStartX=0,dragStartY=0,mouseOverNuke=-1;
function getNukeAtPos(mx,my){
    const p=G.player;if(p.destroyed)return -1;
    for(let i=p.nukes.length-1;i>=0;i--){const n=p.nukes[i];if(n&&Math.hypot(mx-n.x,my-n.y)<TIERS[clamp(n.tier,0,TIERS.length-1)].r+8)return i;}
    return -1;
}
function handleDown(x,y){
    if(G.state==='gameover'||G.player.destroyed)return;
    inputX=x;inputY=y;
    if(G.state==='map'){
        const targets=getMapTargets();
        for(let i=0;i<targets.length;i++){if(Math.hypot(x-targets[i].x,y-targets[i].y)<45){
            if(targets[i].shielded)showToast('TARGET SHIELDED!','#ff4444');
            else launchNuke(targets[i]);return;
        }}
        closeMap();return;
    }
    if(G.state!=='playing')return;
    inputDown=true;dragStartX=x;dragStartY=y;
    const idx=getNukeAtPos(x,y);if(idx>=0){dragIdx=idx;isDragging=false;}
}
function handleMove(x,y){
    inputX=x;inputY=y;
    if(G.state==='map'){const targets=getMapTargets();G.mapHover=-1;for(let i=0;i<targets.length;i++){if(Math.hypot(x-targets[i].x,y-targets[i].y)<45){G.mapHover=i;return;}}return;}
    if(inputDown&&dragIdx>=0&&Math.hypot(x-dragStartX,y-dragStartY)>8)isDragging=true;
    mouseOverNuke=getNukeAtPos(x,y);
}
function handleUp(x,y){
    if(G.state!=='playing'||G.player.destroyed){inputDown=false;dragIdx=-1;isDragging=false;return;}
    if(isDragging&&dragIdx>=0){
        const ti=getNukeAtPos(x,y);
        if(ti>=0&&ti!==dragIdx&&canMerge(dragIdx,ti)){
            const p=G.player,nt=p.nukes[dragIdx].tier+1;
            p.nukes[ti]={tier:nt,hp:TIERS[nt].hp,maxHp:TIERS[nt].hp,x:p.nukes[ti].x,y:p.nukes[ti].y,targetX:0,targetY:0,bobPhase:Math.random()*Math.PI*2};
            p.nukes.splice(dragIdx,1);
            if(p.selectedIdx===dragIdx)p.selectedIdx=-1;else if(p.selectedIdx>dragIdx)p.selectedIdx--;
            updateNukePositions();
            const m=p.nukes[Math.min(ti,p.nukes.length-1)];
            if(m){addParticles(m.x,m.y,TIERS[nt].color,15,80,0.6);showToast('MERGED: '+TIERS[nt].name.toUpperCase(),'#fff');}
        }
    }else if(!isDragging&&dragIdx>=0){G.player.selectedIdx=(G.player.selectedIdx===dragIdx)?-1:dragIdx;}
    inputDown=false;dragIdx=-1;isDragging=false;updateUI();
}
canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();handleDown(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();handleMove(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener('mouseup',e=>{const r=canvas.getBoundingClientRect();handleUp(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=canvas.getBoundingClientRect();handleDown(t.clientX-r.left,t.clientY-r.top);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=canvas.getBoundingClientRect();handleMove(t.clientX-r.left,t.clientY-r.top);},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0],r=canvas.getBoundingClientRect();handleUp(t.clientX-r.left,t.clientY-r.top);},{passive:false});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&G.state==='map')closeMap();});

/* ===== UI ===== */
function updateUI(){
    if(!G)return;
    document.getElementById('resVal').textContent=Math.floor(G.res);
    const inc=getIncome();
    document.getElementById('incRate').textContent=inc>0?'(+'+inc.toFixed(1)+'/s)':'';
    document.getElementById('rbCount').textContent='R'+G.rebirth;
    const sb=document.getElementById('shieldBtn'),scd=document.getElementById('shieldCd');
    if(G.player.destroyed){sb.classList.add('disabled');scd.textContent='';}
    else if(G.player.shield.active){sb.classList.add('active');sb.classList.remove('cooldown','disabled');scd.textContent=G.player.shield.timer.toFixed(1)+'s';}
    else if(G.player.shield.cd>0){sb.classList.remove('active');sb.classList.add('cooldown');sb.classList.remove('disabled');scd.textContent=G.player.shield.cd.toFixed(0)+'s';}
    else{sb.classList.remove('active','cooldown','disabled');scd.textContent='';}
    const lb=document.getElementById('launchBtn');
    if(G.player.destroyed||G.player.selectedIdx<0||G.player.selectedIdx>=G.player.nukes.length)lb.classList.add('disabled');
    else lb.classList.remove('disabled');
    const rb=document.getElementById('rebirthBtn');
    if(G.player.destroyed)rb.classList.add('disabled');else rb.classList.remove('disabled');
    const si=document.getElementById('selInfo');
    if(G.player.selectedIdx>=0&&G.player.selectedIdx<G.player.nukes.length){
        const n=G.player.nukes[G.player.selectedIdx],t=TIERS[clamp(n.tier,0,TIERS.length-1)];
        si.textContent=`${t.name} T${n.tier+1} | DMG:${t.dmg} | +${((n.tier+1)*0.5).toFixed(1)}/s`;
        si.classList.add('show');
    }else si.classList.remove('show');
    document.getElementById('enemyBar').innerHTML=G.enemies.map(e=>{
        if(!e.alive)return`<div class="ebar" style="opacity:0.3"><span class="dot" style="background:${e.color}"></span><span class="ename">${e.name}</span><span class="enuke">${Math.ceil(e.respawnTimer)}s</span></div>`;
        return`<div class="ebar"><span class="dot" style="background:${e.color}"></span><span class="ename">${e.name}</span><span class="enuke">${e.nukes.length}n</span>${e.shield.active?'<span class="eshield"><i class="fas fa-shield-halved"></i></span>':''}</div>`;
    }).join('');
}

function toggleUpgrades(){
    const p=document.getElementById('upgradePanel');p.classList.toggle('open');
    if(p.classList.contains('open'))renderUpgradeCards();
}
function renderUpgradeCards(){
    const c=document.getElementById('upgradeCards');
    const types=['spawnTier','spawnLimit','shieldTime'];
    const icons=['fa-burst','fa-layer-group','fa-shield-halved'];
    const names=['Spawn Tier','Spawn Limit','Shield Time'];
    let html=types.map((type,i)=>{
        const lv=G.player.upgrades[type],max=upgMax(type),cost=upgCost(type,lv);
        const isMaxed=lv>=max,canBuy=G.res>=cost&&!isMaxed;
        return`<div class="ucard"><div class="utitle"><i class="fas ${icons[i]}" style="color:var(--accent)"></i>${names[i]}</div><div class="udesc">${upgDesc(type)}</div><div class="udesc" style="font-size:10px;color:#5a6a80">Level ${lv} / ${max}</div><div class="ubuy ${isMaxed?'maxed':''}" ${canBuy?`onclick="buyUpgrade('${type}')"`:''} style="${!canBuy&&!isMaxed?'opacity:0.4':''}"><span>${isMaxed?'MAXED':'Next Level'}</span><span>${isMaxed?'--':'<i class="fas fa-radiation" style="color:var(--gold)"></i> '+cost}</span></div></div>`;
    }).join('');
    /* Rebirth card */
    const nextRebirthTier=G.rebirth<REBIRTH_TIERS.length?REBIRTH_TIERS[G.rebirth]:null;
    html+=`<div class="rb-card"><div class="utitle"><i class="fas fa-infinity" style="color:var(--gold)"></i>REBIRTH</div><div class="udesc">Reset all progress for permanent bonuses.</div>`;
    if(nextRebirthTier){
        html+=`<div class="udesc" style="color:${nextRebirthTier.color}">Unlocks: ${nextRebirthTier.name} (DMG:${nextRebirthTier.dmg})</div>`;
        html+=`<div class="udesc" style="font-size:10px;color:#5a6a80">City HP: ${G.city.maxHp} → ${600+(G.rebirth+1)*200}</div>`;
    }else{
        html+=`<div class="udesc" style="color:var(--gold)">All tiers unlocked! Difficulty still scales.</div>`;
    }
    html+=`<div class="udesc" style="font-size:10px;color:#5a6a80">Current: Rebirth ${G.rebirth}</div></div>`;
    c.innerHTML=html;
}

/* ===== 游戏循环 ===== */
let lastTime=0;
function gameLoop(ts){
    const dt=Math.min(0.05,(ts-lastTime)/1000);lastTime=ts;
    if(G&&G.state!=='gameover')update(dt);
    if(G)render();
    requestAnimationFrame(gameLoop);
}
resize();initGame();requestAnimationFrame(gameLoop);
document.getElementById('startBtn').addEventListener('click',()=>{const s=document.getElementById('startScreen');s.style.opacity='0';setTimeout(()=>s.style.display='none',600);});
</script>
