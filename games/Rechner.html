// Video-style fullscreen, just like the iPad video player: the chrome appears
// for a moment after entering, then fades away on its own – any tap brings it
// back briefly. iPad Safari uses the native Fullscreen API: Safari's bars slide
// away and the system's grey ✕ fades out by itself after a few seconds, just

const isAppleTouch=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

  if(!fsActive())return;

function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}function workBlob(){return new Blob([JSON.stringify({expressions:expressions.map(e=>e.text),points})],{type:'application/json'})}function save(){download(workBlob(),'rechnung.json')}function openFile(){$('file').click()}$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.expressions))throw Error();const next=d.expressions.map((text,i)=>({text,fn:compile(text),isFunction:/x/.test(text),color:colors[i%colors.length]}));expressions=next;points=Array.isArray(d.points)?d.points.filter(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)):[];renderRows();draw()}catch{toast('Die Datei konnte nicht geöffnet werden.')}e.target.value=''};async function shareWork(){const f=new File([workBlob()],'rechnung.json',{type:'application/json'});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f]})}catch(e){if(e.name!=='AbortError')save()}}else save()}

const time=d=>d.toLocaleTimeString('de-DE',{hour12:false});function report(finished){if(finished)$('keyboard').classList.remove('hidden');modal('<header><small>GeoGebra Rechner Suite</small><h2>Prüfungsmodus: OK</h2></header><main><h3>Zeige diesen Bildschirm deiner Lehrkraft</h3><div class="detail"><small>Dauer</small>'+duration()+'</div><div class="detail"><small>Datum der Prüfung</small>'+start.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})+'</div><div class="detail"><small>Beginn der Prüfung</small>'+time(start)+'</div>'+(finished?'<div class="detail"><small>Ende der Prüfung</small>'+time(end)+'</div>':'')+'<div class="actions"></div></main>','report');actions(finished?[['Bild speichern',()=>showExport(true)],['Beenden',()=>{exam=false;app.classList.remove('exam');close();tick();toast('Prüfung beendet.');input.focus()},true]]:[['Schließen',close,true]]);if(finished)requestAnimationFrame(()=>requestAnimationFrame(makeReportImage))}
// Paint the visible app itself so the exported PNG follows the current viewport,
// graph, keyboard and dialog rather than a second hard-coded mockup.
let captureRevision=0;
async function makeReportImage(){
  const revision=++captureRevision;
  reportBlob=null;
  const reportDialog=document.querySelector('.report');
  const motion=[...$('overlay').getAnimations({subtree:true}),...$('keyboard').getAnimations()];
  await Promise.allSettled(motion.map(a=>a.finished));
  if(revision!==captureRevision||!reportDialog?.isConnected)return;
  const c=document.createElement('canvas'),d=Math.min(devicePixelRatio||1,2);
  c.width=Math.round(innerWidth*d);c.height=Math.round(innerHeight*d);
  const g=c.getContext('2d');g.scale(d,d);g.fillStyle='#fff';g.fillRect(0,0,innerWidth,innerHeight);
  const transparent=color=>color==='transparent'||color==='rgba(0, 0, 0, 0)';
  function rect(r,radius){g.beginPath();g.roundRect(r.x,r.y,r.width,r.height,Math.max(0,Math.min(radius,r.width/2,r.height/2)))}
  async function paint(el){
    if(el.nodeType===Node.TEXT_NODE){
      if(!el.textContent.trim())return;
      const parent=el.parentElement,st=getComputedStyle(parent),range=document.createRange();
      g.fillStyle=st.color;g.font=st.font||`${st.fontWeight} ${st.fontSize} ${st.fontFamily}`;g.textBaseline='alphabetic';
      const metrics=g.measureText('Mg'),ascent=metrics.fontBoundingBoxAscent||parseFloat(st.fontSize)*.8,descent=metrics.fontBoundingBoxDescent||parseFloat(st.fontSize)*.2;
      for(let i=0;i<el.length;i++){
        range.setStart(el,i);range.setEnd(el,i+1);const r=range.getBoundingClientRect();
        if(r.width&&r.height)g.fillText(el.textContent[i],r.x,r.y+(r.height-ascent-descent)/2+ascent);
      }
      return;
    }
    if(el.nodeType!==Node.ELEMENT_NODE)return;
    const st=getComputedStyle(el),r=el.getBoundingClientRect();
    if(st.display==='none'||st.visibility==='hidden'||!r.width||!r.height)return;
    g.save();g.globalAlpha*=Number(st.opacity);
    const radius=parseFloat(st.borderTopLeftRadius)||0;
    if(!transparent(st.backgroundColor)){g.fillStyle=st.backgroundColor;rect(r,radius);g.fill()}
    const bw=parseFloat(st.borderTopWidth)||0;
    if(bw&&st.borderTopStyle!=='none'){
      g.strokeStyle=st.borderTopColor;g.lineWidth=bw;
      if(st.borderTopStyle==='dotted')g.setLineDash([1,2]);
      rect({x:r.x+bw/2,y:r.y+bw/2,width:r.width-bw,height:r.height-bw},radius);g.stroke();g.setLineDash([]);
    }else{
      for(const [side,x1,y1,x2,y2] of [['Bottom',r.left,r.bottom,r.right,r.bottom],['Right',r.right,r.top,r.right,r.bottom]]){
        const n=parseFloat(st['border'+side+'Width']);if(n&&st['border'+side+'Style']!=='none'){g.strokeStyle=st['border'+side+'Color'];g.lineWidth=n;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
      }
    }
    if(st.overflow==='hidden'||st.overflow==='auto'){rect(r,radius);g.clip()}
    if(el.tagName==='CANVAS'){g.drawImage(el,r.x,r.y,r.width,r.height)}
    else if(el.tagName.toLowerCase()==='svg'){
      const copy=el.cloneNode(true);copy.setAttribute('xmlns','http://www.w3.org/2000/svg');copy.setAttribute('width',r.width);copy.setAttribute('height',r.height);copy.style.color=st.color;
      const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}));
      await new Promise(resolve=>{const img=new Image();img.onload=()=>{g.drawImage(img,r.x,r.y,r.width,r.height);URL.revokeObjectURL(url);resolve()};img.onerror=()=>{URL.revokeObjectURL(url);resolve()};img.src=url});
    }else if(el.tagName==='INPUT'){
      g.font=st.font;g.fillStyle=el.value?st.color:'#8b8b89';g.textBaseline='middle';g.fillText(el.value||el.placeholder||'',r.x+parseFloat(st.paddingLeft),r.y+r.height/2);
    }else{for(const child of el.childNodes)await paint(child)}
    g.restore();
  }
  try{
    await paint(app);await paint($('overlay'));
    const blob=await new Promise(resolve=>c.toBlob(resolve,'image/png'));
    if(revision!==captureRevision||!blob)return;
    if(reportURL)URL.revokeObjectURL(reportURL);reportBlob=blob;reportURL=URL.createObjectURL(blob);
  }catch{toast('Bild konnte nicht erstellt werden. Bitte erneut versuchen.')}
}

function exportGraph(){canvas.toBlob(b=>showImage(b,false),'image/png')}function showExport(){if(!reportBlob){toast('Bild wird vorbereitet. Bitte nochmals tippen.');return}showImage(reportBlob,true)}function showImage(blob,isReport){const url=URL.createObjectURL(blob);modal('<h2>Bild speichern</h2><img class="preview-image" alt="Exportiertes Bild" src="'+url+'"><p class="note">Auf dem iPad: „Teilen“ antippen und, falls angeboten, „Bild sichern“ wählen. Alternativ das Bild lange drücken. „PNG herunterladen“ speichert die Datei zunächst in Dateien.</p><div class="actions"></div>');actions([['Zurück',()=>{URL.revokeObjectURL(url);isReport?report(true):close()}],['PNG herunterladen',()=>download(blob,isReport?'pruefungsbild.png':'graph.png')],['Teilen',async()=>{const file=new File([blob],isReport?'pruefungsbild.png':'graph.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]})}catch(e){if(e.name!=='AbortError')toast('Teilen nicht verfügbar. Nutze den Download.')}}else toast('Nutze PNG herunterladen oder drücke lange auf das Bild.')},true]])}
function help(){modal('<h2>Hilfe</h2><p>Beispiele: <b>x^2</b>, <b>2x+1</b>, <b>sin(x)</b>, <b>sqrt(9)</b>. Mit Enter übernehmen. Grafik ziehen und mit +/− zoomen. Winkel werden im Bogenmaß berechnet.</p><p>Tippe auf „Tabellenkalkulation“, um Vollbild ein- oder auszuschalten.</p><p>Der Prüfungsablauf liegt im Menü ☰. Beim Beenden wird ein PNG-Bild vorbereitet, das du über „Bild speichern“ exportieren kannst.</p><div class="actions"></div>');actions([['Los geht’s',close,true]])}
