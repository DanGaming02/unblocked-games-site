<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PvZ VON WISH</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
  canvas{max-width:100vw;max-height:100vh;border-radius:6px;box-shadow:0 0 60px rgba(0,0,0,.6);cursor:crosshair}

<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 640;
canvas.width = W; canvas.height = H;

const ROWS = 5, COLS = 9, CW = 82, CH = 100, GX = 80, GY = 90;
const PO = ['sunflower','peashooter','repeater','gatlingpea','snowpea','wallnut','potatomine','chomper','torchwood','squash','cherrybomb'];
const PL = {
  sunflower:{n:'Sunflower',c:50,h:100,cd:7500},peashooter:{n:'Peashooter',c:100,h:100,cd:7500},
  repeater:{n:'Repeater',c:200,h:100,cd:7500},gatlingpea:{n:'Gatling Pea',c:250,h:100,cd:7500},
  snowpea:{n:'Snow Pea',c:175,h:100,cd:7500},wallnut:{n:'Wall-nut',c:50,h:400,cd:20000},
  potatomine:{n:'Potato Mine',c:25,h:100,cd:20000},chomper:{n:'Chomper',c:150,h:100,cd:7500},
  torchwood:{n:'Torchwood',c:175,h:100,cd:7500},squash:{n:'Squash',c:50,h:100,cd:20000},
  cherrybomb:{n:'Cherry Bomb',c:150,h:100,cd:35000}
};
const ZD = {
  basic:{hp:100,s:26,d:22},cone:{hp:220,s:26,d:22},bucket:{hp:440,s:23,d:28},
  flag:{hp:100,s:32,d:22},polevault:{hp:100,s:50,d:22},newspaper:{hp:100,s:26,d:22,sh:150},
  screendoor:{hp:100,s:26,d:22,sh:300},football:{hp:800,s:48,d:35},dancing:{hp:100,s:26,d:22}
};
const WAVES = [
  {z:[{t:'basic',n:3}],iv:4200,dl:22000},{z:[{t:'basic',n:5}],iv:3200,dl:19000},
  {z:[{t:'basic',n:4},{t:'cone',n:2}],iv:2800,dl:19000},{z:[{t:'basic',n:3},{t:'cone',n:3},{t:'newspaper',n:1}],iv:2400,dl:20000},
  {z:[{t:'basic',n:5},{t:'cone',n:3},{t:'newspaper',n:2},{t:'screendoor',n:1}],iv:2000,dl:18000},
  {z:[{t:'basic',n:4},{t:'cone',n:4},{t:'polevault',n:2},{t:'screendoor',n:1}],iv:1800,dl:20000},
  {z:[{t:'basic',n:5},{t:'cone',n:4},{t:'polevault',n:2},{t:'screendoor',n:2},{t:'dancing',n:1}],iv:1600,dl:21000},
  {z:[{t:'basic',n:6},{t:'cone',n:5},{t:'polevault',n:3},{t:'screendoor',n:2},{t:'football',n:1}],iv:1400,dl:22000},
  {z:[{t:'flag',n:1},{t:'basic',n:8},{t:'cone',n:6},{t:'polevault',n:4},{t:'screendoor',n:3},{t:'football',n:2}],iv:1100,dl:24000},
  {z:[{t:'basic',n:8},{t:'cone',n:7},{t:'polevault',n:4},{t:'screendoor',n:3},{t:'football',n:3},{t:'dancing',n:2}],iv:1000,dl:24000},
  {z:[{t:'basic',n:10},{t:'cone',n:8},{t:'newspaper',n:5},{t:'polevault',n:5},{t:'screendoor',n:4},{t:'football',n:3}],iv:900,dl:25000},
  {z:[{t:'basic',n:10},{t:'cone',n:10},{t:'polevault',n:6},{t:'screendoor',n:5},{t:'football',n:5}],iv:800,dl:25000},
  {z:[{t:'flag',n:2},{t:'basic',n:12},{t:'cone',n:10},{t:'polevault',n:6},{t:'screendoor',n:5},{t:'football',n:6},{t:'dancing',n:3}],iv:700,dl:26000},
  {z:[{t:'basic',n:15},{t:'cone',n:12},{t:'polevault',n:8},{t:'screendoor',n:6},{t:'football',n:8},{t:'dancing',n:4}],iv:600,dl:26000},
  {z:[{t:'flag',n:3},{t:'basic',n:20},{t:'cone',n:15},{t:'polevault',n:10},{t:'screendoor',n:8},{t:'football',n:10},{t:'dancing',n:5}],iv:500,dl:28000}
];

/* ── Menu Button Positions ── */
const MB = {adv:{x:130,y:195,w:290,h:160},inf:{x:540,y:195,w:290,h:160}};
const EB = {menu:{x:W/2-230,y:H/2+15,w:210,h:50},retry:{x:W/2+20,y:H/2+15,w:210,h:50}};
const PB = {resume:{x:W/2-160,y:H/2+15,w:145,h:48},menu:{x:W/2+15,y:H/2+15,w:145,h:48}};

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function snd(t){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);const n=audioCtx.currentTime;switch(t){case'shoot':o.frequency.value=660;o.type='sine';g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.06);o.start(n);o.stop(n+.06);break;case'sun':o.frequency.setValueAtTime(880,n);o.frequency.exponentialRampToValueAtTime(1200,n+.12);o.type='sine';g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);break;case'place':o.frequency.value=440;o.type='triangle';g.gain.setValueAtTime(.06,n);g.gain.exponentialRampToValueAtTime(.001,n+.1);o.start(n);o.stop(n+.1);break;case'boom':o.frequency.value=80;o.type='sawtooth';g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.35);o.start(n);o.stop(n+.35);break;case'mower':o.frequency.value=120;o.type='sawtooth';g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.5);o.start(n);o.stop(n+.5);break;case'die':o.frequency.setValueAtTime(300,n);o.frequency.exponentialRampToValueAtTime(80,n+.12);o.type='square';g.gain.setValueAtTime(.04,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);break;case'chomp':o.frequency.value=150;o.type='sawtooth';g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.12);o.start(n);o.stop(n+.12);break;case'jump':o.frequency.setValueAtTime(200,n);o.frequency.exponentialRampToValueAtTime(600,n+.12);o.type='sine';g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.15);o.start(n);o.stop(n+.15);break;case'move':o.frequency.value=520;o.type='triangle';g.gain.setValueAtTime(.05,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.start(n);o.stop(n+.08);break;}}catch(e){}}

/* ── High Score ── */
function getHS(){try{const d=JSON.parse(localStorage.getItem('pvz_hs'));return d&&d.w?d:{w:0,s:0};}catch(e){return{w:0,s:0};}}
function setHS(w,s){try{const c=getHS();if(w>c.w||s>c.s)localStorage.setItem('pvz_hs',JSON.stringify({w:Math.max(w,c.w),s:Math.max(s,c.s)}));}catch(e){}}

/* ── Menu Particles ── */
let mParts=[];
function initMP(){mParts=[];for(let i=0;i<50;i++)mParts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*12,vy:-8-Math.random()*18,sz:1+Math.random()*3,a:.08+Math.random()*.25,c:Math.random()>.5?'#4CAF50':'#FFD54F'});}
function upMP(dt){for(let p of mParts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<-10){p.y=H+10;p.x=Math.random()*W;}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;}}
function drMP(){for(let p of mParts){ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}

/* ── Infinite Wave Generator ── */
function genInfWave(n){
  const types=['basic'];
  if(n>=3)types.push('cone');if(n>=6)types.push('newspaper');
  if(n>=9)types.push('polevault','screendoor');
  if(n>=13)types.push('bucket','dancing');if(n>=16)types.push('football');
  const huge=n>0&&n%10===0;const z=[];
  if(huge)z.push({t:'flag',n:1+Math.floor(n/15)});
  const total=Math.min(45,Math.floor(3+n*1.1+(huge?12:0)));
  const bc=Math.floor(total*.4);z.push({t:'basic',n:bc});let rem=total-bc;
  const ot=types.slice(1);if(ot.length>0){const each=Math.max(1,Math.floor(rem/ot.length));for(const t of ot){const c=Math.min(each,rem);if(c>0){z.push({t,n:c});rem-=c;}}}
  return{z,iv:Math.max(300,2800-n*110),dl:Math.max(9000,20000-n*350)};
}

/* ── Helpers ── */
function isOv(x,y,b){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function rr(x,y,w,h,r,f,s){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(f)ctx.fill();if(s)ctx.stroke();}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:.4+Math.random()*.4,ml:.4+Math.random()*.4,color:col,sz:2+Math.random()*4});}}

let G={},particles=[],grass=[];
function initGame(){
  G={state:'menu',mode:'adventure',sun:200,plants:[],zombies:[],proj:[],suns:[],mowers:[],sel:null,shovel:false,
    moveMode:false,movingPlant:null,wave:0,waveTimer:0,spawnQ:[],spawnT:0,spawnIv:0,
    sunDropT:6,time:0,announce:null,annT:0,score:0,shake:0,mx:0,my:0,
    waveActive:false,allSpawned:false,paused:false,fastFwd:false};
  PO.forEach(k=>PL[k].r=0);
  for(let r=0;r<ROWS;r++)G.mowers.push({row:r,x:GX-45,active:false,triggered:false});
  particles=[];
}
function startGame(mode){
  initGame();G.state='playing';G.mode=mode;
  G.announce='Ready... Set... Plant!';G.annT=3;G.waveTimer=22;initAudio();
}
function goToMenu(){initGame();}
function genGrass(){grass=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(let i=0;i<5;i++)grass.push({x:GX+c*CW+Math.random()*CW,y:GY+r*CH+CH*.6+Math.random()*CH*.4,h:4+Math.random()*6,a:(Math.random()-.5)*.5});}
function upPart(dt){for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);}

/* ── Plant Drawings ── */
function dSunflower(x,y,s,t){const c=x,y2=y-s*.15;ctx.fillStyle='#2E7D32';ctx.fillRect(c-3,y2+s*.18,6,s*.55);ctx.save();ctx.translate(c-6,y2+s*.4);ctx.rotate(-.4);ctx.beginPath();ctx.ellipse(0,0,10,5,0,0,Math.PI*2);ctx.fillStyle='#43A047';ctx.fill();ctx.restore();const pc=10,pr=s*.32,po=Math.sin(t*2.5)*.08;for(let i=0;i<pc;i++){const a=(i/pc)*Math.PI*2+po;ctx.beginPath();ctx.ellipse(c+Math.cos(a)*pr,y2+Math.sin(a)*pr,8,4.5,a,0,Math.PI*2);ctx.fillStyle='#FFD54F';ctx.fill();}ctx.beginPath();ctx.arc(c,y2,s*.17,0,Math.PI*2);ctx.fillStyle='#5D4037';ctx.fill();ctx.fillStyle='#1B0000';ctx.beginPath();ctx.arc(c-4,y2-2,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+4,y2-2,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c,y2+4,4,.1,Math.PI-.1);ctx.strokeStyle='#1B0000';ctx.lineWidth=1;ctx.stroke();}
function dShooter(x,y,s,t,rc,isSnow){const c=x,cy=y-s*.1,r=rc||0,b=isSnow?'#4FC3F7':'#66BB6A',d=isSnow?'#0288D1':'#2E7D32',l=isSnow?'#B3E5FC':'#A5D6A7';ctx.fillStyle=d;ctx.fillRect(c-3,cy+s*.15,6,s*.55);ctx.save();ctx.translate(c-8,cy+s*.35);ctx.rotate(-.5);ctx.beginPath();ctx.ellipse(0,0,12,5,0,0,Math.PI*2);ctx.fillStyle=b;ctx.fill();ctx.restore();const h=c+r*6;ctx.beginPath();ctx.ellipse(h,cy,s*.2,s*.18,0,0,Math.PI*2);ctx.fillStyle=b;ctx.fill();ctx.strokeStyle=d;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=d;ctx.beginPath();ctx.moveTo(h+s*.16,cy-5);ctx.lineTo(h+s*.3,cy-7);ctx.lineTo(h+s*.3,cy+7);ctx.lineTo(h+s*.16,cy+5);ctx.fill();ctx.fillStyle=l;ctx.fillRect(h+s*.18,cy-4,s*.1,8);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h-1,cy-4,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+7,cy-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(h+1,cy-4,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+9,cy-4,2,0,Math.PI*2);ctx.fill();}
function dRepeater(x,y,s,t,rc){const c=x,cy=y-s*.1,r=rc||0,d='#1B5E20',b='#388E3C';ctx.fillStyle=d;ctx.fillRect(c-3,cy+s*.15,6,s*.55);const h=c+r*6;ctx.beginPath();ctx.ellipse(h,cy,s*.22,s*.2,0,0,Math.PI*2);ctx.fillStyle=b;ctx.fill();ctx.strokeStyle=d;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=d;ctx.beginPath();ctx.moveTo(h+s*.16,cy-9);ctx.lineTo(h+s*.32,cy-10);ctx.lineTo(h+s*.32,cy-4);ctx.lineTo(h+s*.16,cy-3);ctx.fill();ctx.beginPath();ctx.moveTo(h+s*.16,cy+3);ctx.lineTo(h+s*.32,cy+4);ctx.lineTo(h+s*.32,cy+10);ctx.lineTo(h+s*.16,cy+9);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h-2,cy-4,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+8,cy-4,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(h,cy-4,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+10,cy-4,2,0,Math.PI*2);ctx.fill();}
function dGatling(x,y,s,t,rc){const c=x,cy=y-s*.1,r=rc||0,d='#1B5E20',b='#2E7D32';ctx.fillStyle=d;ctx.fillRect(c-3,cy+s*.15,6,s*.55);const h=c+r*6;ctx.beginPath();ctx.ellipse(h,cy,s*.25,s*.22,0,0,Math.PI*2);ctx.fillStyle=b;ctx.fill();ctx.strokeStyle=d;ctx.lineWidth=1.5;ctx.stroke();for(let i=-1.5;i<=1.5;i++){ctx.fillStyle=d;ctx.beginPath();ctx.moveTo(h+s*.18,cy+i*5-2);ctx.lineTo(h+s*.35,cy+i*5-2.5);ctx.lineTo(h+s*.35,cy+i*5+2.5);ctx.lineTo(h+s*.18,cy+i*5+2);ctx.fill();ctx.fillStyle='#81C784';ctx.fillRect(h+s*.2,cy+i*5-1.5,s*.13,3);}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h-3,cy-5,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+7,cy-5,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(h-1,cy-5,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(h+9,cy-5,2,0,Math.PI*2);ctx.fill();}
function dWallnut(x,y,s,t,hp,mhp){const c=x,cy=y-s*.05,r=hp/mhp;ctx.beginPath();ctx.ellipse(c,cy,s*.32,s*.38,0,0,Math.PI*2);ctx.fillStyle='#A1887F';ctx.fill();ctx.strokeStyle='#6D4C41';ctx.lineWidth=2;ctx.stroke();ctx.strokeStyle='#4E342E';ctx.lineWidth=1.5;if(r<.75){ctx.beginPath();ctx.moveTo(c-4,cy-12);ctx.lineTo(c-1,cy-2);ctx.lineTo(c-7,cy+8);ctx.stroke();}if(r<.5){ctx.beginPath();ctx.moveTo(c+7,cy-10);ctx.lineTo(c+4,cy+2);ctx.lineTo(c+9,cy+12);ctx.stroke();}if(r<.25){ctx.beginPath();ctx.moveTo(c-2,cy-15);ctx.lineTo(c+2,cy-5);ctx.lineTo(c-4,cy+5);ctx.stroke();}ctx.fillStyle='#3E2723';ctx.beginPath();ctx.arc(c-6,cy-3,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+6,cy-3,2.2,0,Math.PI*2);ctx.fill();}
function dMine(x,y,s,t,armed){const c=x,cy=y+s*.1;if(!armed){ctx.fillStyle='#6D4C41';ctx.beginPath();ctx.ellipse(c,cy+10,18,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8D6E63';ctx.beginPath();ctx.ellipse(c,cy+6,14,6,0,0,Math.PI);ctx.fill();}else{ctx.fillStyle='#5D4037';ctx.beginPath();ctx.ellipse(c,cy,s*.28,s*.25,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3E2723';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c-6,cy-4,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+6,cy-4,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F44336';ctx.beginPath();ctx.arc(c,cy+6,4,0,Math.PI);ctx.fill();}}
function dChomper(x,y,s,t,chew){const c=x,cy=y-s*.15;ctx.fillStyle='#6A1B9A';ctx.fillRect(c-4,cy+s*.15,8,s*.55);if(chew){ctx.beginPath();ctx.ellipse(c,cy,s*.25,s*.22,0,0,Math.PI*2);ctx.fillStyle='#7B1FA2';ctx.fill();ctx.strokeStyle='#4A148C';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#5D4037';ctx.beginPath();ctx.ellipse(c,cy+2,8,6,0,0,Math.PI*2);ctx.fill();}else{ctx.beginPath();ctx.ellipse(c,cy,s*.25,s*.2,0,Math.PI,0);ctx.fillStyle='#7B1FA2';ctx.fill();ctx.beginPath();ctx.ellipse(c,cy+s*.15,s*.25,s*.12,0,0,Math.PI);ctx.fillStyle='#7B1FA2';ctx.fill();ctx.fillStyle='#fff';for(let i=0;i<5;i++){const tx=c-12+i*6;ctx.beginPath();ctx.moveTo(tx,cy);ctx.lineTo(tx+3,cy+8);ctx.lineTo(tx+6,cy);ctx.fill();}ctx.strokeStyle='#4A148C';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c,cy,s*.25,s*.22,0,0,Math.PI*2);ctx.stroke();}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(c-5,cy-8,3.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+5,cy-8,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c-4,cy-8,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+6,cy-8,1.5,0,Math.PI*2);ctx.fill();}
function dTorch(x,y,s,t){const c=x,cy=y-s*.1;ctx.fillStyle='#5D4037';ctx.fillRect(c-12,cy+s*.1,24,s*.55);ctx.fillStyle='#795548';ctx.beginPath();ctx.ellipse(c,cy+s*.15,18,10,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3E2723';ctx.lineWidth=1.5;ctx.stroke();for(let i=0;i<5;i++){const a=Math.sin(t*5+i)*.3;ctx.fillStyle=i%2===0?'#FF9800':'#FFEB3B';ctx.beginPath();ctx.ellipse(c+Math.sin(a+i)*6,cy-10-i*5,10-i,8-i,a,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#F44336';ctx.beginPath();ctx.ellipse(c,cy-5,8,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF9800';ctx.beginPath();ctx.ellipse(c,cy-5,5,8,0,0,Math.PI*2);ctx.fill();}
function dSquash(x,y,s,t,jump){const c=x,cy=y-s*.05;if(jump){ctx.fillStyle='#388E3C';ctx.beginPath();ctx.ellipse(c,cy-20,s*.3,s*.35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c-6,cy-25,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+6,cy-25,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1B5E20';ctx.beginPath();ctx.arc(c,cy-18,5,0,Math.PI);ctx.fill();}else{ctx.fillStyle='#388E3C';ctx.beginPath();ctx.ellipse(c,cy,s*.35,s*.3,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1B5E20';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#2E7D32';ctx.beginPath();ctx.ellipse(c,cy+10,12,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#000';ctx.beginPath();ctx.arc(c-7,cy-5,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+7,cy-5,2.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1B5E20';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c-6,cy+5);ctx.lineTo(c+6,cy+5);ctx.stroke();}}

function dPlant(p,t){
  const cx=GX+p.col*CW+CW/2,cy=GY+p.row*CH+CH/2+10,sz=CW*.95;
  switch(p.type){case'sunflower':dSunflower(cx,cy,sz,t);break;case'peashooter':dShooter(cx,cy,sz,t,p.rc||0,false);break;case'snowpea':dShooter(cx,cy,sz,t,p.rc||0,true);break;case'repeater':dRepeater(cx,cy,sz,t,p.rc||0);break;case'gatlingpea':dGatling(cx,cy,sz,t,p.rc||0);break;case'wallnut':dWallnut(cx,cy,sz,t,p.hp,p.mhp);break;case'potatomine':dMine(cx,cy,sz,t,p.armed);break;case'chomper':dChomper(cx,cy,sz,t,p.chew);break;case'torchwood':dTorch(cx,cy,sz,t);break;case'squash':dSquash(cx,cy,sz,t,p.jumping);break;case'cherrybomb':dCherry(cx,cy,sz,t,p.bt||0);break;}

  if(p.type==='potatomine'&&!p.armed){const bw=CW*.6,bh=4,bx=cx-bw/2,by=GY+p.row*CH+2;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#FFC107';ctx.fillRect(bx,by,bw*(1-p.at/14),bh);}

}

/* ── Zombie Drawing ── */
function dZombie(z,t){
  const c=z.x,cy=GY+z.row*CH+CH/2+10;
  const bob=z.eat?Math.sin((z.et||0)*12)*4:Math.sin((z.wt||0)*4)*2;
  const sl=z.sl>0,sk=sl?'#7986CB':'#8D9B6A',sdk=sl?'#5C6BC0':'#6B7A4A',cl=sl?'#546E7A':'#5D4037';
  ctx.fillStyle=cl;const lo=Math.sin((z.wt||0)*4)*5;ctx.fillRect(c-8,cy+20+lo,7,22);ctx.fillRect(c+1,cy+20-lo,7,22);
  ctx.fillStyle=cl;ctx.fillRect(c-12,cy-5+bob,24,28);ctx.fillStyle='#C62828';ctx.fillRect(c-2,cy-2+bob,4,18);
  ctx.fillStyle=sk;const aa=z.eat?Math.sin((z.et||0)*10)*.3:-.2;

  ctx.save();ctx.translate(c+12,cy+2+bob);ctx.rotate(-aa+.8);ctx.fillRect(0,-4,18,8);ctx.restore();
  if(z.type==='polevault'&&!z.jumped){ctx.strokeStyle='#795548';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(c+15,cy-10+bob);ctx.lineTo(c+15,cy-60+bob);ctx.stroke();}
  if(z.type==='football'){ctx.fillStyle='#4E342E';ctx.beginPath();ctx.ellipse(c,cy-25+bob,16,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#F48FB1';ctx.fillRect(c-15,cy-5+bob,30,5);}
  if(z.type==='screendoor'&&z.shHp>0){ctx.fillStyle='#90A4AE';ctx.fillRect(c+12,cy-30+bob,5,50);ctx.strokeStyle='#546E7A';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(c+12,cy-25+i*10+bob);ctx.lineTo(c+17,cy-25+i*10+bob);ctx.stroke();}ctx.beginPath();ctx.moveTo(c+14.5,cy-30+bob);ctx.lineTo(c+14.5,cy+20+bob);ctx.stroke();}
  if(z.type==='dancing'){ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(c,cy-35+bob,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#E0E0E0';ctx.fillRect(c-12,cy-5+bob,24,28);}
  ctx.beginPath();ctx.ellipse(c,cy-18+bob,14,16,0,0,Math.PI*2);ctx.fillStyle=sk;ctx.fill();ctx.strokeStyle=sdk;ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#3E2723';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(c-8+i*4,cy-32+bob,3,5,(i-2)*.3,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(c-5,cy-20+bob,4,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(c+5,cy-20+bob,4,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=z.enraged?'#FF0000':'#B71C1C';ctx.beginPath();ctx.arc(c-5,cy-19+bob,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+5,cy-19+bob,2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(c,cy-10+bob,6,0,Math.PI);ctx.fillStyle='#3E2723';ctx.fill();
  if(z.type==='newspaper'&&z.shHp>0){ctx.fillStyle='#ECEFF1';ctx.fillRect(c+10,cy-28+bob,22,38);ctx.fillStyle='#B71C1C';ctx.fillRect(c+10,cy-28+bob,22,6);}
  if(z.type==='flag'){ctx.strokeStyle='#795548';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(c+10,cy-10+bob);ctx.lineTo(c+10,cy-55+bob);ctx.stroke();ctx.fillStyle='#F44336';ctx.beginPath();ctx.moveTo(c+12,cy-55+bob);ctx.lineTo(c+35,cy-45+bob);ctx.lineTo(c+12,cy-35+bob);ctx.fill();}
  if(z.type==='cone'){ctx.beginPath();ctx.moveTo(c,cy-48+bob);ctx.lineTo(c-12,cy-22+bob);ctx.lineTo(c+12,cy-22+bob);ctx.closePath();ctx.fillStyle='#FF8F00';ctx.fill();}

function dMower(m){if(m.triggered&&!m.active)return;const c=m.x,cy=GY+m.row*CH+CH/2+15;ctx.fillStyle='#F44336';ctx.fillRect(c-18,cy-10,36,20);ctx.fillStyle='#B71C1C';ctx.fillRect(c-18,cy-10,36,5);ctx.fillStyle='#333';ctx.beginPath();ctx.arc(c-12,cy+12,6,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(c+12,cy+12,6,0,Math.PI*2);ctx.fill();if(m.active){const a=G.time*20;ctx.strokeStyle='#CCC';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c+18+Math.cos(a)*8,cy+Math.sin(a)*8);ctx.lineTo(c+18-Math.cos(a)*8,cy-Math.sin(a)*8);ctx.stroke();}}

/* ── Background & UI ── */
function drawBg(){const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#4FC3F7');g.addColorStop(1,'#B3E5FC');ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);const gg=ctx.createLinearGradient(0,GY,0,H);gg.addColorStop(0,'#4CAF50');gg.addColorStop(1,'#2E7D32');ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY);ctx.fillStyle='#8D6E63';for(let i=0;i<22;i++)ctx.fillRect(i*45,GY-20,8,25);ctx.fillRect(0,GY-15,W,5);ctx.fillRect(0,GY-5,W,5);}
function drawLawn(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){ctx.fillStyle=(r+c)%2===0?'rgba(76,175,80,.35)':'rgba(56,142,60,.35)';ctx.fillRect(GX+c*CW,GY+r*CH,CW,CH);ctx.strokeStyle='rgba(0,0,0,.06)';ctx.lineWidth=1;ctx.strokeRect(GX+c*CW,GY+r*CH,CW,CH);}ctx.strokeStyle='rgba(46,125,50,.5)';ctx.lineWidth=1.5;for(let g of grass){const sw=Math.sin(G.time*1.5+g.x*.05)*.15;ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.lineTo(g.x+Math.sin(g.a+sw)*g.h,g.y-g.h);ctx.stroke();}}
function drawSuns(){for(let s of G.suns){if(s.dead)continue;const sc=s.col?1-(s.cp||0)*.5:1,p=1+Math.sin(G.time*4+s.x)*.06;ctx.save();ctx.translate(s.x,s.y);ctx.scale(sc*p,sc*p);ctx.fillStyle='rgba(255,235,59,.2)';ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFD54F';for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2+G.time;ctx.beginPath();ctx.ellipse(Math.cos(a)*12,Math.sin(a)*12,6,3,a,0,Math.PI*2);ctx.fill();}ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fillStyle='#FFC107';ctx.fill();ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fillStyle='#FFD54F';ctx.fill();ctx.restore();}}
function drawProj(){for(let p of G.proj){if(p.dead)continue;if(p.type==='snow'){ctx.fillStyle='#90CAF9';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();}else if(p.type==='fire'){ctx.fillStyle='#FF5722';ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFEB3B';ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle='#66BB6A';ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#A5D6A7';ctx.beginPath();ctx.arc(p.x-1,p.y-1,2.5,0,Math.PI*2);ctx.fill();}}}
function drawPart(){for(let p of particles){ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.color;ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}ctx.globalAlpha=1;}

function drawUI(){
  ctx.fillStyle='rgba(33,33,33,.9)';ctx.fillRect(0,0,W,78);ctx.fillStyle='rgba(76,175,80,.3)';ctx.fillRect(0,75,W,3);
  ctx.fillStyle='#FFC107';ctx.beginPath();ctx.arc(32,34,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FFD54F';ctx.beginPath();ctx.arc(32,34,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(G.sun,32,60);
  for(let i=0;i<PO.length;i++){
    const type=PO[i],def=PL[type],cx=68+i*55,cy=2,cw=52,ch=70;
    const can=G.sun>=def.c&&def.r<=0,sel=G.sel===type;
    ctx.fillStyle=sel?'rgba(76,175,80,.6)':can?'rgba(255,255,255,.12)':'rgba(0,0,0,.3)';ctx.strokeStyle=sel?'#66BB6A':'rgba(255,255,255,.15)';ctx.lineWidth=sel?2:1;rr(cx,cy,cw,ch,4,true,true);
    if(def.r>0){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(cx+2,cy+2,cw-4,(ch-4)*(def.r/def.cd));}
    ctx.save();ctx.beginPath();ctx.rect(cx,cy,cw,ch-16);ctx.clip();ctx.globalAlpha=can?1:.4;const icx=cx+cw/2,icy=cy+26;
    switch(type){case'sunflower':dSunflower(icx,icy,30,G.time);break;case'peashooter':dShooter(icx,icy,30,G.time,0,false);break;case'snowpea':dShooter(icx,icy,30,G.time,0,true);break;case'repeater':dRepeater(icx,icy,30,G.time,0);break;case'gatlingpea':dGatling(icx,icy,30,G.time,0);break;case'wallnut':dWallnut(icx,icy,30,G.time,400,400);break;case'potatomine':dMine(icx,icy,30,G.time,true);break;case'chomper':dChomper(icx,icy,30,G.time,false);break;case'torchwood':dTorch(icx,icy,30,G.time);break;case'squash':dSquash(icx,icy,30,G.time,false);break;case'cherrybomb':dCherry(icx,icy,30,G.time,99);break;}
    ctx.globalAlpha=1;ctx.restore();ctx.fillStyle=can?'#FFD54F':'#888';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(def.c,cx+cw/2,cy+ch-4);
  }
  const tools=[{x:675,y:8,w:36,h:58,active:G.moveMode,col:'rgba(33,150,243,.4)',scol:'#42A5F5',txt:'M'},{x:716,y:8,w:36,h:58,active:G.shovel,col:'rgba(244,67,54,.4)',scol:'#EF5350',txt:'S'},{x:757,y:8,w:36,h:58,active:G.fastFwd,col:'rgba(255,193,7,.4)',scol:'#FFC107',txt:'>>'},{x:798,y:8,w:36,h:58,active:G.paused,col:'rgba(255,255,255,.15)',scol:'rgba(255,255,255,.4)',txt:'||'}];
  for(let tl of tools){ctx.fillStyle=tl.active?tl.col:'rgba(255,255,255,.08)';ctx.strokeStyle=tl.active?tl.scol:'rgba(255,255,255,.15)';ctx.lineWidth=tl.active?2:1;rr(tl.x,tl.y,tl.w,tl.h,4,true,true);ctx.fillStyle='#fff';ctx.font=tl.txt==='>>'?'bold 12px sans-serif':'bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(tl.txt,tl.x+tl.w/2,tl.y+tl.h/2+2);}
  /* Mode & wave info */
  const isInf=G.mode==='infinite';
  ctx.fillStyle=isInf?'rgba(239,83,80,.6)':'rgba(102,187,106,.6)';ctx.font='bold 10px sans-serif';ctx.textAlign='left';ctx.fillText(isInf?'INFINITE':'ADVENTURE',845,15);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='11px sans-serif';ctx.fillText(isInf?'Wave '+(G.wave+1)+' / \u221E':'Wave '+Math.min(G.wave+1,WAVES.length)+'/'+WAVES.length,845,30);
  ctx.fillStyle='rgba(255,255,255,.1)';rr(845,35,100,6,3,true,false);ctx.fillStyle=isInf?'#EF5350':'#66BB6A';rr(845,35,100*(isInf?((G.wave+1)%10)/10:G.wave/WAVES.length),6,3,true,false);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillText('Score: '+G.score,845,52);
  ctx.fillText('Zombies: '+(G.zombies.length+G.spawnQ.length),845,68);
  if((G.sel||G.shovel||G.moveMode)&&G.state==='playing'){
    const hc=Math.floor((G.mx-GX)/CW),hr=Math.floor((G.my-GY)/CH);
    if(hc>=0&&hc<COLS&&hr>=0&&hr<ROWS){
      const occ=G.plants.some(p=>p.row===hr&&p.col===hc);
      if(G.moveMode){ctx.fillStyle=occ?'rgba(255,152,0,.3)':'rgba(33,150,243,.2)';ctx.fillRect(GX+hc*CW,GY+hr*CH,CW,CH);}
      else{ctx.fillStyle=occ?'rgba(244,67,54,.25)':'rgba(255,255,255,.15)';ctx.fillRect(GX+hc*CW,GY+hr*CH,CW,CH);}
      if(G.sel&&!occ){ctx.globalAlpha=.5;dPlant({type:G.sel,row:hr,col:hc,hp:100,mhp:100,rc:0,bt:99,armed:true,chew:false,at:0,ct:0,jumping:false},G.time);ctx.globalAlpha=1;}
    }
  }
  if(G.announce&&G.annT>0){const a=Math.min(1,G.annT);ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.65)';rr(W/2-220,H/2-35,440,70,10,true,false);ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(G.announce,W/2,H/2);ctx.globalAlpha=1;}
}

/* ── Updates ── */
function upSuns(dt){G.sunDropT-=dt;if(G.sunDropT<=0){G.sunDropT=7+Math.random()*4;G.suns.push({x:GX+Math.random()*(COLS*CW),y:-20,ty:GY+30+Math.random()*(ROWS*CH-60),val:25,t:10,col:false,sx:0,sy:0,cx:40,cy:35,cp:0,dead:false});}for(let s of G.suns){if(s.dead)continue;if(s.col){s.cp=Math.min(1,s.cp+dt*3.5);const e=s.cp*s.cp*(3-2*s.cp);s.x=s.sx+(s.cx-s.sx)*e;s.y=s.sy+(s.cy-s.sy)*e;if(s.cp>=1){G.sun+=s.val;s.dead=true;snd('sun');}}else{s.y+=(s.ty-s.y)*2.5*dt;if(Math.abs(s.y-s.ty)<1)s.y=s.ty;s.t-=dt;if(s.t<=0)s.dead=true;}}G.suns=G.suns.filter(s=>!s.dead);}
function upPlants(dt){
  for(let p of G.plants){if(p.dead)continue;p.rc=Math.max(0,(p.rc||0)-dt);
    if(p.type==='sunflower'){p.st-=dt;if(p.st<=0){p.st=18+Math.random()*6;const px=GX+p.col*CW+CW/2,py=GY+p.row*CH+CH/2;G.suns.push({x:px,y:py-20,ty:py+15+Math.random()*25,val:25,t:8,col:false,sx:0,sy:0,cx:40,cy:35,cp:0,dead:false});}}
    if(p.type==='peashooter'||p.type==='snowpea'){p.sht-=dt;if(p.sht<=0){const px=GX+p.col*CW+CW/2+20;if(G.zombies.some(z=>z.row===p.row&&z.x>px-30&&z.hp>0)){G.proj.push({x:px,y:GY+p.row*CH+CH/2+10,row:p.row,s:320,d:20,type:p.type==='snowpea'?'snow':'pea',dead:false});p.sht=1.4;p.rc=.12;snd('shoot');}}}
    if(p.type==='repeater'){p.sht-=dt;p.ss=p.ss||'i';if(p.ss==='i'&&p.sht<=0){const px=GX+p.col*CW+CW/2+20;if(G.zombies.some(z=>z.row===p.row&&z.x>px-30&&z.hp>0)){G.proj.push({x:px,y:GY+p.row*CH+CH/2+6,row:p.row,s:320,d:20,type:'pea',dead:false});p.rc=.12;p.ss='w';p.sht=.15;snd('shoot');}}else if(p.ss==='w'&&p.sht<=0){const px=GX+p.col*CW+CW/2+20;G.proj.push({x:px,y:GY+p.row*CH+CH/2+14,row:p.row,s:320,d:20,type:'pea',dead:false});p.rc=.12;p.ss='i';p.sht=1.4;snd('shoot');}}

function upZombies(dt){
  for(let z of G.zombies){if(z.hp<=0)continue;if(z.sl>0)z.sl-=dt;const sm=z.sl>0?.4:1;let eat=false;
    if(z.type==='polevault'&&!z.jumped){const col=Math.floor((z.x-GX)/CW);const pl=G.plants.find(p=>p.row===z.row&&p.col===col&&!p.dead&&p.type!=='potatomine');if(pl){z.jumped=true;z.s=15;z.x=GX+(col+1)*CW+10;snd('jump');continue;}}
    for(let p of G.plants){if(p.dead||p.row!==z.row)continue;if(p.type==='potatomine'&&!p.armed)continue;const pr=GX+(p.col+1)*CW,pl=GX+p.col*CW;if(z.x<=pr+5&&z.x>=pl-15){eat=true;z.eat=true;z.et=(z.et||0)+dt;p.hp-=z.d*dt;if(p.hp<=0){p.dead=true;burst(GX+p.col*CW+CW/2,GY+p.row*CH+CH/2,'#4CAF50',10);z.eat=false;}break;}}

}
function upProj(dt){

    if(p.type!=='fire'){const tw=G.plants.find(pl=>pl.type==='torchwood'&&!pl.dead&&pl.row===p.row&&Math.abs(p.x-(GX+pl.col*CW+CW/2))<CW/2);if(tw){p.type='fire';p.d=40;}}
    for(let z of G.zombies){if(z.row!==p.row||z.hp<=0)continue;const zy=GY+z.row*CH+CH/2+10;if(Math.abs(p.x-z.x)<18&&Math.abs(p.y-zy)<35){
      if(p.type==='snow')z.sl=3;

      p.dead=true;burst(p.x,p.y,p.type==='fire'?'#FF5722':p.type==='snow'?'#90CAF9':'#81C784',4);break;}}
    if(p.x>W+20)p.dead=true;}
  G.proj=G.proj.filter(p=>!p.dead);
}
function upMowers(dt){for(let m of G.mowers){if(!m.active)continue;m.x+=450*dt;for(let z of G.zombies){if(z.row===m.row&&Math.abs(z.x-m.x)<45)z.hp=0;}if(m.x>W+60)m.active=false;}}
function upWaves(dt){
  if(G.mode==='adventure'&&G.wave>=WAVES.length){if(G.zombies.length===0&&G.spawnQ.length===0)G.state='win';return;}
  if(!G.waveActive){G.waveTimer-=dt;if(G.waveTimer<=0){G.waveActive=true;G.allSpawned=false;
    const wd=G.mode==='infinite'?genInfWave(G.wave):WAVES[G.wave];
    G.spawnQ=[];for(let z of wd.z)for(let i=0;i<z.n;i++)G.spawnQ.push(z.t);for(let i=G.spawnQ.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.spawnQ[i],G.spawnQ[j]]=[G.spawnQ[j],G.spawnQ[i]];}G.spawnT=1;G.spawnIv=wd.iv/1000;
    const wn=G.wave+1;const huge=G.mode==='infinite'&&wn%10===0;

  else{if(!G.allSpawned){G.spawnT-=dt;if(G.spawnT<=0&&G.spawnQ.length>0){const type=G.spawnQ.shift(),def=ZD[type],row=Math.floor(Math.random()*ROWS);
    const hpM=G.mode==='infinite'?1+G.wave*.04:1;const spM=G.mode==='infinite'?1+G.wave*.008:1;
    G.zombies.push({type,row,x:W+20+Math.random()*80,hp:Math.floor(def.hp*hpM),mhp:Math.floor(def.hp*hpM),s:Math.min(def.s*spM,70),d:def.d,eat:false,et:0,wt:Math.random()*10,sl:0,jumped:type==='polevault'?false:undefined,enraged:false,shHp:def.sh?Math.floor((def.sh||0)*hpM):undefined,mshHp:def.sh?Math.floor((def.sh||0)*hpM):undefined,isBackup:false});
    if(type==='dancing'){const r1=Math.min(ROWS-1,row+1),r2=Math.max(0,row-1);G.zombies.push({type:'dancing',row:r1,x:W+60,hp:Math.floor(100*hpM),mhp:Math.floor(100*hpM),s:Math.min(26*spM,70),d:22,eat:false,et:0,wt:0,sl:0,enraged:false,isBackup:true});G.zombies.push({type:'dancing',row:r2,x:W+100,hp:Math.floor(100*hpM),mhp:Math.floor(100*hpM),s:Math.min(26*spM,70),d:22,eat:false,et:0,wt:0,sl:0,enraged:false,isBackup:true});}
    G.spawnT=G.spawnIv;if(G.spawnQ.length===0)G.allSpawned=true;}}
  if(G.allSpawned&&G.zombies.length===0){G.waveActive=false;G.wave++;

    else if(G.wave<WAVES.length){G.waveTimer=WAVES[G.wave].dl/1000;}}}}

/* ── Input ── */
function getP(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height)];}
canvas.addEventListener('mousemove',e=>{[G.mx,G.my]=getP(e);});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();cancelActions();});
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){if(G.state==='playing')G.paused=!G.paused;return;}
  if(e.key==='f'||e.key==='F'){G.fastFwd=!G.fastFwd;return;}
  if(G.paused||G.state!=='playing')return;
  const n=parseInt(e.key);if(n>=1&&n<=11){const t=PO[n-1],d=PL[t];if(G.sun>=d.c&&d.r<=0){G.sel=G.sel===t?null:t;G.shovel=false;G.moveMode=false;}}
  if(e.key==='m'||e.key==='M'){G.moveMode=!G.moveMode;G.sel=null;G.shovel=false;if(!G.moveMode&&G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}}
  if(e.key==='s'||e.key==='S'){G.shovel=!G.shovel;G.sel=null;G.moveMode=false;if(!G.shovel&&G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}}
  if(e.key==='Escape')cancelActions();
});
function cancelActions(){G.sel=null;G.shovel=false;G.moveMode=false;if(G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}}
function handleClick(x,y){
  if(G.paused){if(isOv(x,y,PB.resume))G.paused=false;if(isOv(x,y,PB.menu))goToMenu();return;}
  if(G.state==='menu'){if(isOv(x,y,MB.adv))startGame('adventure');if(isOv(x,y,MB.inf))startGame('infinite');return;}
  if(G.state==='gameover'||G.state==='win'){if(isOv(x,y,EB.menu))goToMenu();if(isOv(x,y,EB.retry)){const m=G.mode;startGame(m);}return;}
  if(G.state!=='playing')return;
  if(x>=675&&x<=711&&y>=8&&y<=66){G.moveMode=!G.moveMode;G.sel=null;G.shovel=false;if(!G.moveMode&&G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}return;}
  if(x>=716&&x<=752&&y>=8&&y<=66){G.shovel=!G.shovel;G.sel=null;G.moveMode=false;if(!G.shovel&&G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}return;}
  if(x>=757&&x<=793&&y>=8&&y<=66){G.fastFwd=!G.fastFwd;return;}
  if(x>=798&&x<=834&&y>=8&&y<=66){G.paused=true;return;}
  for(let i=0;i<PO.length;i++){const cx=68+i*55,cy=2;if(x>=cx&&x<=cx+52&&y>=cy&&y<=cy+70){const t=PO[i],d=PL[t];if(G.sun>=d.c&&d.r<=0){G.sel=G.sel===t?null:t;G.shovel=false;G.moveMode=false;if(G.movingPlant){G.plants.push(G.movingPlant);G.movingPlant=null;}}return;}}
  for(let s of G.suns){if(s.col||s.dead)continue;if((x-s.x)**2+(y-s.y)**2<900){s.col=true;s.sx=s.x;s.sy=s.y;s.cp=0;return;}}
  const col=Math.floor((x-GX)/CW),row=Math.floor((y-GY)/CH);if(col<0||col>=COLS||row<0||row>=ROWS)return;
  if(G.moveMode){if(!G.movingPlant){const idx=G.plants.findIndex(p=>p.row===row&&p.col===col);if(idx>=0){G.movingPlant=G.plants.splice(idx,1)[0];snd('move');}}else{if(!G.plants.some(p=>p.row===row&&p.col===col)){if(G.sun<50){G.announce='Need 50 sun to move!';G.annT=1.5;return;}G.sun-=50;G.movingPlant.row=row;G.movingPlant.col=col;G.movingPlant.rc=0;G.plants.push(G.movingPlant);G.movingPlant=null;G.moveMode=false;snd('place');}}return;}
  if(G.shovel){const idx=G.plants.findIndex(p=>p.row===row&&p.col===col);if(idx>=0){G.plants.splice(idx,1);G.shovel=false;snd('place');}return;}
  if(G.sel){if(G.plants.some(p=>p.row===row&&p.col===col))return;const d=PL[G.sel];if(G.sun<d.c||d.r>0)return;G.plants.push({type:G.sel,row,col,hp:d.h,mhp:d.h,sht:1.2,st:12+Math.random()*6,rc:0,bt:G.sel==='cherrybomb'?1:0,armed:G.sel==='potatomine'?false:undefined,at:G.sel==='potatomine'?14:0,chew:false,ct:0,ss:'i',ssn:0,jumping:false,tgx:0,jt:0,dead:false});G.sun-=d.c;d.r=d.cd;G.sel=null;snd('place');}
}
canvas.addEventListener('click',e=>{const[x,y]=getP(e);handleClick(x,y);});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const[x,y]=getP(t);handleClick(x,y);},{passive:false});

  /* Two buttons */
  const hm=isOv(G.mx,G.my,EB.menu),hr2=isOv(G.mx,G.my,EB.retry);
  ctx.fillStyle=hm?'rgba(255,255,255,.2)':'rgba(255,255,255,.08)';ctx.strokeStyle=hm?'rgba(255,255,255,.6)':'rgba(255,255,255,.2)';ctx.lineWidth=hm?2:1;rr(EB.menu.x,EB.menu.y,EB.menu.w,EB.menu.h,8,true,true);
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText('Main Menu',EB.menu.x+EB.menu.w/2,EB.menu.y+EB.menu.h/2+1);
  ctx.fillStyle=hr2?bc:'rgba('+parseInt(bc.slice(1,3),16)+','+parseInt(bc.slice(3,5),16)+','+parseInt(bc.slice(5,7),16)+',.8)';ctx.strokeStyle=hr2?'#fff':bc;ctx.lineWidth=hr2?2:1;rr(EB.retry.x,EB.retry.y,EB.retry.w,EB.retry.h,8,true,true);
  ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText(G.state==='win'?'Play Again':'Retry',EB.retry.x+EB.retry.w/2,EB.retry.y+EB.retry.h/2+1);
  /* Infinite high score notice */
  if(G.mode==='infinite'){const hs=getHS();if(G.wave+1>=hs.w&&G.score>=hs.s){ctx.fillStyle='rgba(255,213,79,.7)';ctx.font='bold 16px sans-serif';ctx.fillText('NEW HIGH SCORE!',W/2,H/2+85);}}
}
function drawPause(){
  ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 48px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('PAUSED',W/2,H/2-40);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='14px sans-serif';ctx.fillText(G.mode==='infinite'?'Infinite Mode - Wave '+(G.wave+1):'Adventure Mode - Wave '+Math.min(G.wave+1,WAVES.length),W/2,H/2-5);
  const h1=isOv(G.mx,G.my,PB.resume),h2=isOv(G.mx,G.my,PB.menu);
  ctx.fillStyle=h1?'rgba(76,175,80,.5)':'rgba(76,175,80,.25)';ctx.strokeStyle=h1?'#66BB6A':'rgba(102,187,106,.5)';ctx.lineWidth=h1?2:1;rr(PB.resume.x,PB.resume.y,PB.resume.w,PB.resume.h,8,true,true);
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('Resume',PB.resume.x+PB.resume.w/2,PB.resume.y+PB.resume.h/2+1);
  ctx.fillStyle=h2?'rgba(244,67,54,.5)':'rgba(244,67,54,.25)';ctx.strokeStyle=h2?'#EF5350':'rgba(239,83,80,.5)';ctx.lineWidth=h2?2:1;rr(PB.menu.x,PB.menu.y,PB.menu.w,PB.menu.h,8,true,true);
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.fillText('Main Menu',PB.menu.x+PB.menu.w/2,PB.menu.y+PB.menu.h/2+1);
}

/* ── Loop ── */
let lastT=0;
function loop(ts){
  const raw=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  const dt=raw*(G.fastFwd?2:1);
  if(G.state==='playing'&&!G.paused)update(dt);
  else if(G.state==='menu'){G.time+=raw;upMP(raw);}
  else if(G.state==='win'){G.time+=raw;upPart(raw);}
  ctx.save();if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*20,(Math.random()-.5)*G.shake*20);
  if(G.state==='menu'){drawMenu();}
  else if(G.state==='gameover'){drawBg();drawLawn();G.mowers.forEach(dMower);G.plants.forEach(p=>dPlant(p,G.time));G.zombies.forEach(z=>dZombie(z,G.time));drawProj();drawSuns();drawPart();drawUI();drawEnd('The Zombies Ate Your Brains!',(G.mode==='infinite'?'Infinite - ':'Adventure - ')+'Wave '+(G.wave+1)+'  |  Score: '+G.score,'#E53935');}
  else if(G.state==='win'){drawBg();drawLawn();drawPart();drawUI();if(Math.random()<.15)burst(100+Math.random()*(W-200),50+Math.random()*200,['#FFD54F','#FF8A65','#CE93D8','#81D4FA','#A5D6A7'][Math.floor(Math.random()*5)],12);drawEnd('Victory!','Final Score: '+G.score,'#43A047');}
  else{drawBg();drawLawn();G.mowers.forEach(dMower);let pi=0,zi=0;const sp=[...G.plants].sort((a,b)=>a.row-b.row),sz=[...G.zombies].sort((a,b)=>a.row-b.row||a.x-b.x);for(let r=0;r<ROWS;r++){while(pi<sp.length&&sp[pi].row===r){dPlant(sp[pi],G.time);pi++;}while(zi<sz.length&&sz[zi].row===r){dZombie(sz[zi],G.time);zi++;}}drawProj();drawSuns();drawPart();drawUI();if(G.paused)drawPause();}
  ctx.restore();requestAnimationFrame(loop);
}
initGame();initMP();genGrass();requestAnimationFrame(loop);
</script>
