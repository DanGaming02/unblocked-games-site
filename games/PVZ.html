<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plants vs Zombies - Extended</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d1117;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
  canvas{max-width:100vw;max-height:100vh;border-radius:6px;box-shadow:0 0 60px rgba(0,0,0,.6);cursor:crosshair}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 640;
canvas.width = W; canvas.height = H;

/* ── Constants ── */
const ROWS = 5, COLS = 9, CELL_W = 82, CELL_H = 100;
const GX = 80, GY = 90;
const PLANT_ORDER = ['sunflower','peashooter','repeater','wallnut','snowpea','potatomine','chomper','cherrybomb'];
const PLANTS = {
  sunflower:  {name:'Sunflower',    cost:50,  hp:100, cd:7500},
  peashooter: {name:'Peashooter',   cost:100, hp:100, cd:7500},
  repeater:   {name:'Repeater',     cost:200, hp:100, cd:7500},
  wallnut:    {name:'Wall-nut',     cost:50,  hp:400, cd:20000},
  snowpea:    {name:'Snow Pea',     cost:175, hp:100, cd:7500},
  potatomine: {name:'Potato Mine',  cost:25,  hp:100, cd:20000},
  chomper:    {name:'Chomper',      cost:150, hp:100, cd:7500},
  cherrybomb: {name:'Cherry Bomb',  cost:150, hp:100, cd:35000}
};
const ZOMBIES = {
  basic:    {hp:100, speed:26, dmg:22},
  cone:     {hp:220, speed:26, dmg:22},
  bucket:   {hp:440, speed:23, dmg:28},
  flag:     {hp:100, speed:32, dmg:22},
  polevault:{hp:100, speed:50, dmg:22},
  newspaper:{hp:100, speed:26, dmg:22, shield:150}
};
const WAVES = [
  {z:[{t:'basic',n:3}], iv:4200, dl:22000},
  {z:[{t:'basic',n:5}], iv:3200, dl:19000},
  {z:[{t:'basic',n:4},{t:'cone',n:2}], iv:2800, dl:19000},
  {z:[{t:'basic',n:3},{t:'cone',n:3},{t:'newspaper',n:1}], iv:2400, dl:20000},
  {z:[{t:'basic',n:5},{t:'cone',n:3},{t:'newspaper',n:2}], iv:2000, dl:18000},
  {z:[{t:'basic',n:4},{t:'cone',n:4},{t:'newspaper',n:2},{t:'polevault',n:1}], iv:1800, dl:20000},
  {z:[{t:'basic',n:5},{t:'cone',n:4},{t:'newspaper',n:3},{t:'polevault',n:2}], iv:1600, dl:21000},
  {z:[{t:'basic',n:6},{t:'cone',n:5},{t:'newspaper',n:3},{t:'polevault',n:3},{t:'bucket',n:1}], iv:1400, dl:22000},
  {z:[{t:'basic',n:5},{t:'cone',n:5},{t:'newspaper',n:4},{t:'polevault',n:4},{t:'bucket',n:2}], iv:1300, dl:22000},
  {z:[{t:'flag',n:1},{t:'basic',n:8},{t:'cone',n:6},{t:'newspaper',n:4},{t:'polevault',n:4},{t:'bucket',n:3}], iv:1100, dl:24000},
  {z:[{t:'basic',n:8},{t:'cone',n:7},{t:'newspaper',n:5},{t:'polevault',n:4},{t:'bucket',n:4}], iv:1000, dl:24000},
  {z:[{t:'basic',n:10},{t:'cone',n:8},{t:'newspaper',n:5},{t:'polevault',n:5},{t:'bucket',n:5}], iv:900, dl:25000},
  {z:[{t:'flag',n:2},{t:'basic',n:12},{t:'cone',n:10},{t:'newspaper',n:6},{t:'polevault',n:6},{t:'bucket',n:6}], iv:800, dl:26000},
  {z:[{t:'basic',n:15},{t:'cone',n:12},{t:'newspaper',n:8},{t:'polevault',n:7},{t:'bucket',n:7}], iv:700, dl:26000},
  {z:[{t:'flag',n:3},{t:'basic',n:20},{t:'cone',n:15},{t:'newspaper',n:10},{t:'polevault',n:10},{t:'bucket',n:10}], iv:600, dl:28000}
];

/* ── Audio ── */
let audioCtx = null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function snd(type){
  if(!audioCtx)return;
  try{
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime;
  switch(type){
    case'shoot':o.frequency.value=660;o.type='sine';g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.start(t);o.stop(t+.07);break;
    case'sun':o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(1200,t+.12);o.type='sine';g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.15);break;
    case'place':o.frequency.value=440;o.type='triangle';g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.start(t);o.stop(t+.1);break;
    case'boom':o.frequency.value=80;o.type='sawtooth';g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4);break;
    case'mower':o.frequency.value=120;o.type='sawtooth';g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.start(t);o.stop(t+.6);break;
    case'die':o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(80,t+.15);o.type='square';g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);break;
    case'chomp':o.frequency.value=150;o.type='sawtooth';g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.15);break;
    case'jump':o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(600,t+.15);o.type='sine';g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);break;
  }}catch(e){}
}

/* ── Game State ── */
let G={}, particles=[], grassBlades=[];
function initGame(){
  G={state:'menu',sun:150,plants:[],zombies:[],projectiles:[],suns:[],mowers:[],
    sel:null,shovel:false,wave:0,waveTimer:0,spawnQ:[],spawnT:0,spawnIv:0,
    sunDropT:6,time:0,announce:null,annT:0,score:0,shake:0,mx:0,my:0,
    waveActive:false,allSpawned:false,paused:false};
  PLANT_ORDER.forEach(k=>PLANTS[k].r=0);
  for(let r=0;r<ROWS;r++)G.mowers.push({row:r,x:GX-45,active:false,triggered:false});
  particles=[];genGrass();
}
function genGrass(){
  grassBlades=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(let i=0;i<5;i++){
    grassBlades.push({x:GX+c*CELL_W+Math.random()*CELL_W,y:GY+r*CELL_H+CELL_H*.6+Math.random()*CELL_H*.4,
      h:4+Math.random()*6,a:(Math.random()-.5)*.5});
  }
}

/* ── Particles ── */
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*140;
  particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:.4+Math.random()*.4,ml:.4+Math.random()*.4,color,sz:2+Math.random()*4});}}
function updateParticles(dt){for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);}

/* ── Plant Drawing ── */
function drawSunflower(x,y,sz,t){
  const cx=x,cy=y-sz*.15;
  ctx.fillStyle='#2E7D32';ctx.fillRect(cx-3,cy+sz*.18,6,sz*.55);
  ctx.save();ctx.translate(cx-6,cy+sz*.4);ctx.rotate(-.4);ctx.beginPath();ctx.ellipse(0,0,10,5,0,0,Math.PI*2);ctx.fillStyle='#43A047';ctx.fill();ctx.restore();
  ctx.save();ctx.translate(cx+6,cy+sz*.5);ctx.rotate(.3);ctx.beginPath();ctx.ellipse(0,0,9,4,0,0,Math.PI*2);ctx.fillStyle='#43A047';ctx.fill();ctx.restore();
  const pc=10,pr=sz*.32,po=Math.sin(t*2.5)*.08;
  for(let i=0;i<pc;i++){const a=(i/pc)*Math.PI*2+po;ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*pr,cy+Math.sin(a)*pr,8,4.5,a,0,Math.PI*2);ctx.fillStyle='#FFD54F';ctx.fill();ctx.strokeStyle='#F9A825';ctx.lineWidth=.5;ctx.stroke();}
  ctx.beginPath();ctx.arc(cx,cy,sz*.17,0,Math.PI*2);ctx.fillStyle='#5D4037';ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,sz*.13,0,Math.PI*2);ctx.fillStyle='#4E342E';ctx.fill();
  ctx.fillStyle='#1B0000';ctx.beginPath();ctx.arc(cx-4,cy-2,1.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+4,cy-2,1.8,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy+4,4,.1,Math.PI-.1);ctx.strokeStyle='#1B0000';ctx.lineWidth=1;ctx.stroke();
}
function drawPeashooter(x,y,sz,t,recoil,isSnow){
  const cx=x,cy=y-sz*.1,rc=recoil||0;
  const base=isSnow?'#4FC3F7':'#66BB6A',dark=isSnow?'#0288D1':'#2E7D32',light=isSnow?'#B3E5FC':'#A5D6A7';
  ctx.fillStyle=dark;ctx.fillRect(cx-3,cy+sz*.15,6,sz*.55);
  ctx.save();ctx.translate(cx-8,cy+sz*.35);ctx.rotate(-.5);ctx.beginPath();ctx.ellipse(0,0,12,5,0,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();ctx.restore();
  const hx=cx+rc*6;
  ctx.beginPath();ctx.ellipse(hx,cy,sz*.2,sz*.18,0,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(hx+sz*.16,cy-5);ctx.lineTo(hx+sz*.3,cy-7);ctx.lineTo(hx+sz*.3,cy+7);ctx.lineTo(hx+sz*.16,cy+5);ctx.fill();
  ctx.fillStyle=light;ctx.fillRect(hx+sz*.18,cy-4,sz*.1,8);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx-1,cy-4,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+7,cy-4,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hx+1,cy-4,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+9,cy-4,2,0,Math.PI*2);ctx.fill();
  if(isSnow){ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(hx-4,cy+2,4,2,-.3,0,Math.PI*2);ctx.fill();}
}
function drawRepeater(x,y,sz,t,recoil){
  const cx=x,cy=y-sz*.1,rc=recoil||0;
  const base='#388E3C',dark='#1B5E20',light='#81C784';
  ctx.fillStyle=dark;ctx.fillRect(cx-3,cy+sz*.15,6,sz*.55);
  ctx.save();ctx.translate(cx-8,cy+sz*.35);ctx.rotate(-.5);ctx.beginPath();ctx.ellipse(0,0,12,5,0,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();ctx.restore();
  const hx=cx+rc*6;
  ctx.beginPath();ctx.ellipse(hx,cy,sz*.22,sz*.2,0,0,Math.PI*2);ctx.fillStyle=base;ctx.fill();ctx.strokeStyle=dark;ctx.lineWidth=1.5;ctx.stroke();
  // Double barrel
  ctx.fillStyle=dark;
  ctx.beginPath();ctx.moveTo(hx+sz*.16,cy-9);ctx.lineTo(hx+sz*.32,cy-10);ctx.lineTo(hx+sz*.32,cy-4);ctx.lineTo(hx+sz*.16,cy-3);ctx.fill();
  ctx.beginPath();ctx.moveTo(hx+sz*.16,cy+3);ctx.lineTo(hx+sz*.32,cy+4);ctx.lineTo(hx+sz*.32,cy+10);ctx.lineTo(hx+sz*.16,cy+9);ctx.fill();
  ctx.fillStyle=light;ctx.fillRect(hx+sz*.18,cy-8,sz*.12,4);ctx.fillRect(hx+sz*.18,cy+4,sz*.12,4);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx-2,cy-4,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+8,cy-4,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hx,cy-4,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(hx+10,cy-4,2,0,Math.PI*2);ctx.fill();
}
function drawWallnut(x,y,sz,t,hp,maxHp){
  const cx=x,cy=y-sz*.05,ratio=hp/maxHp;
  ctx.beginPath();ctx.ellipse(cx,cy,sz*.32,sz*.38,0,0,Math.PI*2);ctx.fillStyle='#A1887F';ctx.fill();ctx.strokeStyle='#6D4C41';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.ellipse(cx-5,cy-8,sz*.1,sz*.12,-.2,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();
  ctx.strokeStyle='#4E342E';ctx.lineWidth=1.5;
  if(ratio<.75){ctx.beginPath();ctx.moveTo(cx-4,cy-12);ctx.lineTo(cx-1,cy-2);ctx.lineTo(cx-7,cy+8);ctx.stroke();}
  if(ratio<.5){ctx.beginPath();ctx.moveTo(cx+7,cy-10);ctx.lineTo(cx+4,cy+2);ctx.lineTo(cx+9,cy+12);ctx.stroke();}
  if(ratio<.25){ctx.beginPath();ctx.moveTo(cx-2,cy-15);ctx.lineTo(cx+2,cy-5);ctx.lineTo(cx-4,cy+5);ctx.lineTo(cx+1,cy+15);ctx.stroke();}
  ctx.fillStyle='#3E2723';const ey=cy-3;
  ctx.beginPath();ctx.arc(cx-6,ey,2.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+6,ey,2.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();if(ratio>.5)ctx.arc(cx,cy+7,5,0.2,Math.PI-0.2);else ctx.ellipse(cx,cy+11,4,3,0,0,Math.PI*2);ctx.strokeStyle='#3E2723';ctx.lineWidth=1.5;ctx.stroke();
}
function drawPotatoMine(x,y,sz,t,armed){
  const cx=x,cy=y+sz*.1;
  if(!armed){
    ctx.fillStyle='#6D4C41';ctx.beginPath();ctx.ellipse(cx,cy+10,18,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#8D6E63';ctx.beginPath();ctx.ellipse(cx,cy+6,14,6,0,0,Math.PI);ctx.fill();
  }else{
    ctx.fillStyle='#5D4037';ctx.beginPath();ctx.ellipse(cx,cy,sz*.28,sz*.25,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3E2723';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-6,cy-4,2.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+6,cy-4,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#F44336';ctx.beginPath();ctx.arc(cx,cy+6,4,0,Math.PI);ctx.fill();
  }
}
function drawChomper(x,y,sz,t,chewing){
  const cx=x,cy=y-sz*.15;
  ctx.fillStyle='#6A1B9A';ctx.fillRect(cx-4,cy+sz*.15,8,sz*.55);
  ctx.save();ctx.translate(cx-10,cy+sz*.3);ctx.rotate(-.4);ctx.beginPath();ctx.ellipse(0,0,12,6,0,0,Math.PI*2);ctx.fillStyle='#8E24AA';ctx.fill();ctx.restore();
  if(chewing){
    ctx.beginPath();ctx.ellipse(cx,cy,sz*.25,sz*.22,0,0,Math.PI*2);ctx.fillStyle='#7B1FA2';ctx.fill();ctx.strokeStyle='#4A148C';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#5D4037';ctx.beginPath();ctx.ellipse(cx,cy+2,8,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-5,cy-5,3,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+5,cy-5,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-4,cy-5,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+6,cy-5,1.5,0,Math.PI*2);ctx.fill();
  }else{
    // Open head
    ctx.beginPath();ctx.ellipse(cx,cy,sz*.25,sz*.2,0,Math.PI,0);ctx.fillStyle='#7B1FA2';ctx.fill();
    ctx.beginPath();ctx.ellipse(cx,cy+sz*.15,sz*.25,sz*.12,0,0,Math.PI);ctx.fillStyle='#7B1FA2';ctx.fill();
    // Teeth
    ctx.fillStyle='#fff';
    for(let i=0;i<5;i++){const tx=cx-12+i*6;ctx.beginPath();ctx.moveTo(tx,cy);ctx.lineTo(tx+3,cy+8);ctx.lineTo(tx+6,cy);ctx.fill();}
    // Lips/Outline
    ctx.strokeStyle='#4A148C';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,sz*.25,sz*.22,0,0,Math.PI*2);ctx.stroke();
    // Eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-6,cy-8,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+6,cy-8,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-5,cy-8,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx+7,cy-8,2,0,Math.PI*2);ctx.fill();
  }
}
function drawCherryBomb(x,y,sz,t,fuse){
  const cx=x,cy=y-sz*.05,flash=fuse<.5?Math.sin(t*30)*.5+.5:0;
  ctx.strokeStyle='#2E7D32';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx-10,cy-sz*.25);ctx.quadraticCurveTo(cx,cy-sz*.5,cx+5,cy-sz*.55);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx+10,cy-sz*.2);ctx.quadraticCurveTo(cx+5,cy-sz*.45,cx+5,cy-sz*.55);ctx.stroke();
  ctx.save();ctx.translate(cx+5,cy-sz*.5);ctx.beginPath();ctx.ellipse(5,-3,8,4,.3,0,Math.PI*2);ctx.fillStyle='#43A047';ctx.fill();ctx.restore();
  const r=sz*.22+flash*3;
  ctx.beginPath();ctx.arc(cx-10,cy,r,0,Math.PI*2);ctx.fillStyle=flash>.5?'#FF8A65':'#E53935';ctx.fill();ctx.strokeStyle='#B71C1C';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.arc(cx+10,cy+5,r*.9,0,Math.PI*2);ctx.fillStyle=flash>.5?'#FF8A65':'#D32F2F';ctx.fill();ctx.strokeStyle='#B71C1C';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(cx-14,cy-6,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-13,cy-3,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(cx-7,cy-3,2,0,Math.PI*2);ctx.fill();
  if(fuse<.8){ctx.fillStyle='#FFEB3B';ctx.beginPath();ctx.arc(cx+5,cy-sz*.55,3+flash*2,0,Math.PI*2);ctx.fill();}
}
function drawPlant(p,t){
  const cx=GX+p.col*CELL_W+CELL_W/2, cy=GY+p.row*CELL_H+CELL_H/2+10, sz=CELL_W*.95;
  switch(p.type){
    case'sunflower':drawSunflower(cx,cy,sz,t);break;
    case'peashooter':drawPeashooter(cx,cy,sz,t,p.recoil||0,false);break;
    case'snowpea':drawPeashooter(cx,cy,sz,t,p.recoil||0,true);break;
    case'repeater':drawRepeater(cx,cy,sz,t,p.recoil||0);break;
    case'wallnut':drawWallnut(cx,cy,sz,t,p.hp,p.maxHp);break;
    case'potatomine':drawPotatoMine(cx,cy,sz,t,p.armed);break;
    case'chomper':drawChomper(cx,cy,sz,t,p.chewing);break;
    case'cherrybomb':drawCherryBomb(cx,cy,sz,t,p.bombTimer||0);break;
  }
  if(p.hp<p.maxHp&&p.type!=='cherrybomb'&&p.type!=='potatomine'){
    const bw=CELL_W*.6,bh=4,bx=cx-bw/2,by=GY+p.row*CELL_H+2;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=p.hp/p.maxHp>.5?'#66BB6A':'#EF5350';ctx.fillRect(bx,by,bw*(p.hp/p.maxHp),bh);
  }
  // Arm timer for potato mine
  if(p.type==='potatomine'&&!p.armed){
    const bw=CELL_W*.6,bh=4,bx=cx-bw/2,by=GY+p.row*CELL_H+2;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#FFC107';ctx.fillRect(bx,by,bw*(1-p.armTimer/14),bh);
  }
  // Digestion timer for chomper
  if(p.type==='chomper'&&p.chewing){
    const bw=CELL_W*.6,bh=4,bx=cx-bw/2,by=GY+p.row*CELL_H+2;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#CE93D8';ctx.fillRect(bx,by,bw*(1-p.chewTimer/30),bh);
  }
}

/* ── Zombie Drawing ── */
function drawZombie(z,t){
  const cx=z.x, cy=GY+z.row*CELL_H+CELL_H/2+10;
  const bob=z.eating?Math.sin((z.eatTimer||0)*12)*4:Math.sin((z.walkTimer||0)*4)*2;
  const slow=z.slowTimer>0;
  const skin=slow?'#7986CB':'#8D9B6A',skinDark=slow?'#5C6BC0':'#6B7A4A',clothes=slow?'#546E7A':'#5D4037';
  // Legs
  const legOff=Math.sin((z.walkTimer||0)*4)*5*(z.type==='polevault'&&!z.jumped?2:1);

/* ── Updates ── */
function updateSuns(dt){
  G.sunDropT-=dt;if(G.sunDropT<=0){G.sunDropT=7+Math.random()*4;G.suns.push({x:GX+Math.random()*(COLS*CELL_W),y:-20,ty:GY+30+Math.random()*(ROWS*CELL_H-60),val:25,timer:10,collected:false,sx:0,sy:0,cx:40,cy:35,cp:0,dead:false});}
  for(let s of G.suns){if(s.dead)continue;if(s.collected){s.cp=Math.min(1,s.cp+dt*3.5);const t=s.cp,e=t*t*(3-2*t);s.x=s.sx+(s.cx-s.sx)*e;s.y=s.sy+(s.cy-s.sy)*e;if(t>=1){G.sun+=s.val;s.dead=true;snd('sun');}}else{s.y+=(s.ty-s.y)*2.5*dt;if(Math.abs(s.y-s.ty)<1)s.y=s.ty;s.timer-=dt;if(s.timer<=0)s.dead=true;}}
  G.suns=G.suns.filter(s=>!s.dead);
}
function updatePlants(dt){
  for(let p of G.plants){
    if(p.dead)continue;
    p.recoil=Math.max(0,(p.recoil||0)-dt);
    if(p.type==='sunflower'){p.sunTimer-=dt;if(p.sunTimer<=0){p.sunTimer=18+Math.random()*6;const px=GX+p.col*CELL_W+CELL_W/2,py=GY+p.row*CELL_H+CELL_H/2;G.suns.push({x:px,y:py-20,ty:py+15+Math.random()*25,val:25,timer:8,collected:false,sx:0,sy:0,cx:40,cy:35,cp:0,dead:false});}}
    if(p.type==='peashooter'||p.type==='snowpea'){p.shootTimer-=dt;if(p.shootTimer<=0){const px=GX+p.col*CELL_W+CELL_W/2+20;const has=G.zombies.some(z=>z.row===p.row&&z.x>px-30&&z.hp>0);if(has){G.projectiles.push({x:px,y:GY+p.row*CELL_H+CELL_H/2+10,row:p.row,speed:320,dmg:20,type:p.type==='snowpea'?'snow':'pea',dead:false});p.shootTimer=1.4;p.recoil=.12;snd('shoot');}}}
    if(p.type==='repeater'){
      p.shootTimer-=dt; p.shootState = p.shootState || 'idle';
      if(p.shootState==='idle'&&p.shootTimer<=0){
        const px=GX+p.col*CELL_W+CELL_W/2+20;const has=G.zombies.some(z=>z.row===p.row&&z.x>px-30&&z.hp>0);
        if(has){G.projectiles.push({x:px,y:GY+p.row*CELL_H+CELL_H/2+6,row:p.row,speed:320,dmg:20,type:'pea',dead:false});p.recoil=.12;p.shootState='wait2';p.shootTimer=0.15;snd('shoot');}
      } else if(p.shootState==='wait2'&&p.shootTimer<=0){
        const px=GX+p.col*CELL_W+CELL_W/2+20;G.projectiles.push({x:px,y:GY+p.row*CELL_H+CELL_H/2+14,row:p.row,speed:320,dmg:20,type:'pea',dead:false});p.recoil=.12;p.shootState='idle';p.shootTimer=1.4;snd('shoot');
      }
    }
    if(p.type==='potatomine'){if(!p.armed){p.armTimer-=dt;if(p.armTimer<=0)p.armed=true;}else{const px=GX+p.col*CELL_W+CELL_W/2;const target=G.zombies.find(z=>z.row===p.row&&Math.abs(z.x-px)<30&&z.hp>0);if(target){target.hp=0;p.dead=true;burst(px,GY+p.row*CELL_H+CELL_H/2,'#795548',15);burst(px,GY+p.row*CELL_H+CELL_H/2,'#FFEB3B',10);snd('boom');}}}
    if(p.type==='chomper'){if(p.chewing){p.chewTimer-=dt;if(p.chewTimer<=0)p.chewing=false;}else{const px=GX+(p.col+1)*CELL_W;const target=G.zombies.find(z=>z.row===p.row&&z.x>px-20&&z.x<px+30&&z.hp>0);if(target){target.hp=0;p.chewing=true;p.chewTimer=30;snd('chomp');burst(target.x,GY+p.row*CELL_H+CELL_H/2,'#9C27B0',8);}}}
    if(p.type==='cherrybomb'&&p.bombTimer>0){p.bombTimer-=dt;if(p.bombTimer<=0){const cx=GX+p.col*CELL_W+CELL_W/2,cy=GY+p.row*CELL_H+CELL_H/2;for(let z of G.zombies){const zc=(z.x-GX)/CELL_W;if(Math.abs(z.row-p.row)<=1&&Math.abs(zc-p.col)<=1.5)z.hp-=1800;}burst(cx,cy,'#FF5722',35);burst(cx,cy,'#FFC107',25);burst(cx,cy,'#FFEB3B',15);G.shake=.45;snd('boom');p.dead=true;}}
  }
  PLANT_ORDER.forEach(k=>{if(PLANTS[k].r>0)PLANTS[k].r=Math.max(0,PLANTS[k].r-dt*1000);});
}
function updateZombies(dt){
  for(let z of G.zombies){
    if(z.hp<=0)continue;
    if(z.slowTimer>0)z.slowTimer-=dt;
    const sm=z.slowTimer>0?.4:1;
    let eating=false;
    
    // Pole Vaulting Jump
    if(z.type==='polevault'&&!z.jumped){
      const col=Math.floor((z.x-GX)/CELL_W);
      const plantInCell=G.plants.find(p=>p.row===z.row&&p.col===col&&!p.dead);
      if(plantInCell&&plantInCell.type!=='potatomine'){
        z.jumped=true;z.speed=15;z.x=GX+(col+1)*CELL_W+10;snd('jump');continue;
      }
    }

    for(let p of G.plants){
      if(p.dead||p.row!==z.row)continue;
      if(p.type==='potatomine'&&!p.armed)continue; // Walk over unarmed mines
      const pr=GX+(p.col+1)*CELL_W,pl=GX+p.col*CELL_W;
      if(z.x<=pr+5&&z.x>=pl-15){
        eating=true;z.eating=true;z.eatTimer=(z.eatTimer||0)+dt;
        p.hp-=z.dmg*dt;
        if(p.hp<=0){p.dead=true;burst(GX+p.col*CELL_W+CELL_W/2,GY+p.row*CELL_H+CELL_H/2,'#4CAF50',10);z.eating=false;}
        break;
      }
    }
    if(!eating){z.eating=false;z.eatTimer=0;z.x-=z.speed*sm*dt;z.walkTimer=(z.walkTimer||0)+dt;}
    if(z.x<=GX-15){const mw=G.mowers.find(m=>m.row===z.row&&!m.triggered);if(mw){mw.triggered=true;mw.active=true;snd('mower');}else{G.state='gameover';}}
  }
  for(let z of G.zombies){if(z.hp<=0){G.score+=z.type==='bucket'?30:z.type==='cone'||z.type==='newspaper'?20:z.type==='polevault'?25:10;burst(z.x,GY+z.row*CELL_H+CELL_H/2,'#556B2F',10);snd('die');}}
  G.zombies=G.zombies.filter(z=>z.hp>0);G.plants=G.plants.filter(p=>!p.dead);
}
function updateProjectiles(dt){
  for(let p of G.projectiles){if(p.dead)continue;p.x+=p.speed*dt;
    for(let z of G.zombies){if(z.row!==p.row||z.hp<=0)continue;const zy=GY+z.row*CELL_H+CELL_H/2+10;
      if(Math.abs(p.x-z.x)<18&&Math.abs(p.y-zy)<35){
        if(p.type==='snow'){z.slowTimer=3;}
        // Handle newspaper shield
        if(z.shieldHp!==undefined&&z.shieldHp>0){z.shieldHp-=p.dmg;if(z.shieldHp<=0){z.shieldHp=0;z.enraged=true;z.speed=50;}} 
        else{z.hp-=p.dmg;}
        p.dead=true;burst(p.x,p.y,p.type==='snow'?'#90CAF9':'#81C784',4);break;
      }
    }
    if(p.x>W+20)p.dead=true;
  }
  G.projectiles=G.projectiles.filter(p=>!p.dead);
}
function updateMowers(dt){for(let m of G.mowers){if(!m.active)continue;m.x+=450*dt;for(let z of G.zombies){if(z.row===m.row&&Math.abs(z.x-m.x)<45)z.hp=0;}if(m.x>W+60)m.active=false;}}
function updateWaves(dt){
  if(G.wave>=WAVES.length){if(G.zombies.length===0&&G.spawnQ.length===0)G.state='win';return;}
  if(!G.waveActive){G.waveTimer-=dt;if(G.waveTimer<=0){G.waveActive=true;G.allSpawned=false;const wd=WAVES[G.wave];G.spawnQ=[];for(let z of wd.z)for(let i=0;i<z.n;i++)G.spawnQ.push(z.t);for(let i=G.spawnQ.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.spawnQ[i],G.spawnQ[j]]=[G.spawnQ[j],G.spawnQ[i]];}G.spawnT=1;G.spawnIv=wd.iv/1000;G.announce=G.wave>=9?'A massive wave is approaching!':`Wave ${G.wave+1}`;G.annT=2.5;}}
  else{if(!G.allSpawned){G.spawnT-=dt;if(G.spawnT<=0&&G.spawnQ.length>0){const type=G.spawnQ.shift(),def=ZOMBIES[type],row=Math.floor(Math.random()*ROWS);G.zombies.push({type,row,x:W+20+Math.random()*80,hp:def.hp,maxHp:def.hp,speed:def.speed,dmg:def.dmg,eating:false,eatTimer:0,walkTimer:Math.random()*10,slowTimer:0,jumped:type==='polevault'?false:undefined,enraged:false,shieldHp:def.shield||undefined,maxShieldHp:def.shield||undefined});G.spawnT=G.spawnIv;if(G.spawnQ.length===0)G.allSpawned=true;}}if(G.allSpawned&&G.zombies.length===0){G.waveActive=false;G.wave++;if(G.wave<WAVES.length)G.waveTimer=WAVES[G.wave].dl/1000;}}
}
function update(dt){G.time+=dt;if(G.annT>0)G.annT-=dt;if(G.shake>0)G.shake=Math.max(0,G.shake-dt);updateSuns(dt);updatePlants(dt);updateZombies(dt);updateProjectiles(dt);updateMowers(dt);updateWaves(dt);updateParticles(dt);}

/* ── Input ── */
function getPos(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height)];}
canvas.addEventListener('mousemove',e=>{[G.mx,G.my]=getPos(e);});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();G.sel=null;G.shovel=false;});
document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){if(G.state==='playing'){G.paused=!G.paused;}else if(G.state==='paused'){G.paused=false;}return;}
  if(G.paused||G.state!=='playing')return;
  const n=parseInt(e.key);if(n>=1&&n<=8){const t=PLANT_ORDER[n-1],d=PLANTS[t];if(G.sun>=d.cost&&d.r<=0){G.sel=G.sel===t?null:t;G.shovel=false;}}
  if(e.key==='s'||e.key==='S'){G.shovel=!G.shovel;G.sel=null;}if(e.key==='Escape'){G.sel=null;G.shovel=false;}
});
function handleClick(x,y){
  if(G.paused){G.paused=false;return;}
  if(G.state==='menu'){if(x>=W/2-100&&x<=W/2+100&&y>=H/2-20&&y<=H/2+30){initGame();G.state='playing';G.announce='Ready... Set... Plant!';G.annT=3;initAudio();}return;}
  if(G.state==='gameover'||G.state==='win'){if(x>=W/2-100&&x<=W/2+100&&y>=H/2+20&&y<=H/2+70){initGame();G.state='playing';G.announce='Ready... Set... Plant!';G.annT=3;}return;}
  if(G.state!=='playing')return;
  // Pause btn
  if(x>=695&&x<=735&&y>=15&&y<=60){G.paused=true;return;}
  // Cards
  for(let i=0;i<PLANT_ORDER.length;i++){const cx=80+i*68,cy=3;if(x>=cx&&x<=cx+64&&y>=cy&&y<=cy+68){const t=PLANT_ORDER[i],d=PLANTS[t];if(G.sun>=d.cost&&d.r<=0){G.sel=G.sel===t?null:t;G.shovel=false;}return;}}
  // Shovel
  if(x>=630&&x<=680&&y>=8&&y<=66){G.shovel=!G.shovel;G.sel=null;return;}
  // Suns
  for(let s of G.suns){if(s.collected||s.dead)continue;if((x-s.x)**2+(y-s.y)**2<900){s.collected=true;s.sx=s.x;s.sy=s.y;s.cp=0;return;}}
  // Grid
  const col=Math.floor((x-GX)/CELL_W),row=Math.floor((y-GY)/CELL_H);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  if(G.shovel){const idx=G.plants.findIndex(p=>p.row===row&&p.col===col);if(idx>=0){G.plants.splice(idx,1);G.shovel=false;snd('place');}return;}
  if(G.sel){if(G.plants.some(p=>p.row===row&&p.col===col))return;const d=PLANTS[G.sel];if(G.sun<d.cost||d.r>0)return;
    G.plants.push({type:G.sel,row,col,hp:d.hp,maxHp:d.hp,shootTimer:1.2,sunTimer:12+Math.random()*6,recoil:0,bombTimer:G.sel==='cherrybomb'?1:0,armed:G.sel==='potatomine'?false:undefined,armTimer:G.sel==='potatomine'?14:0,chewing:false,chewTimer:0,shootState:'idle',dead:false});
    G.sun-=d.cost;d.r=d.cd;G.sel=null;snd('place');
  }
}
canvas.addEventListener('click',e=>{const[x,y]=getPos(e);handleClick(x,y);});
canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const[x,y]=getPos(t);handleClick(x,y);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];[G.mx,G.my]=getPos(t);},{passive:false});

/* ── Loop ── */
let lastT=0;
function loop(ts){
  const dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  if(G.state==='playing'&&!G.paused)update(dt);
  else if(G.state==='menu'||G.state==='win'){G.time+=dt;updateParticles(dt);}
  ctx.save();
  if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake*20,(Math.random()-.5)*G.shake*20);
  if(G.state==='menu'){drawMenu();}
  else if(G.state==='gameover'){drawBg();drawLawn();G.mowers.forEach(drawMower);G.plants.forEach(p=>drawPlant(p,G.time));G.zombies.forEach(z=>drawZombie(z,G.time));drawProjectiles();drawSuns();drawParticlesFn();drawUI();drawEndScreen('The Zombies Ate Your Brains!',`Reached wave ${G.wave+1} | Score: ${G.score}`,'#E53935','Try Again',0);}
  else if(G.state==='win'){drawBg();drawLawn();drawParticlesFn();drawUI();if(Math.random()<.15)burst(100+Math.random()*(W-200),50+Math.random()*200,['#FFD54F','#FF8A65','#CE93D8','#81D4FA','#A5D6A7'][Math.floor(Math.random()*5)],12);drawEndScreen('You Defeated All Zombies!',`Final Score: ${G.score}`,'#43A047','Play Again',0);}
  else{drawBg();drawLawn();G.mowers.forEach(drawMower);let pi=0,zi=0;const sp=[...G.plants].sort((a,b)=>a.row-b.row),sz=[...G.zombies].sort((a,b)=>a.row-b.row||a.x-b.x);for(let r=0;r<ROWS;r++){while(pi<sp.length&&sp[pi].row===r){drawPlant(sp[pi],G.time);pi++;}while(zi<sz.length&&sz[zi].row===r){drawZombie(sz[zi],G.time);zi++;}}drawProjectiles();drawSuns();drawParticlesFn();drawUI();if(G.paused)drawPause();}
  ctx.restore();requestAnimationFrame(loop);
}
initGame();requestAnimationFrame(loop);
</script>
