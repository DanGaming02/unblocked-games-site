<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroClick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 14'%3E%3Cpath d='M5 .8C7 3.8 9 6.2 9 8.8a4 4 0 1 1-8 0C1 6.2 3 3.8 5 .8z' fill='%231493d3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',sans-serif;color:#083b57;background:#63c3ec;
    user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #stage{position:fixed;inset:0}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{position:absolute;inset:0;pointer-events:none;z-index:1}
  #floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:3;
    background:radial-gradient(circle at 50% 55%, rgba(255,255,255,.95), rgba(255,255,255,0) 62%)}

  .glass{background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.30) 46%,rgba(214,242,255,.40));
    backdrop-filter:blur(12px) saturate(1.5);-webkit-backdrop-filter:blur(12px) saturate(1.5);
    border:1px solid rgba(255,255,255,.78);
    box-shadow:0 12px 34px rgba(9,84,130,.28), inset 0 1px 0 rgba(255,255,255,.95);border-radius:20px}

  .hud-top{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:flex-start;gap:12px;z-index:5;pointer-events:none}
  .logo{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;
    padding:9px 20px;font-weight:900;font-size:17px;letter-spacing:1.5px;color:#0b5e8f;pointer-events:auto}
  .logo em{font-style:normal;font-weight:700;color:#1493d3}
  .counter{display:flex;align-items:center;gap:13px;padding:9px 22px 9px 10px;pointer-events:auto}
  .coin{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 26%,#f2fdff,#7fd4f4 55%,#1493d3 110%);
    box-shadow:inset 0 2px 3px #fff, 0 4px 10px rgba(9,84,130,.38)}
  #dropsV{font-size:29px;font-weight:900;line-height:1.05;color:#0b5e8f;font-variant-numeric:tabular-nums;min-width:110px}
  .sub{font-size:11.5px;font-weight:800;color:#2a7ea6;margin-top:2px;white-space:nowrap}
  .sub b{color:#0f8a5b}
  .hud-actions{display:flex;gap:10px;pointer-events:auto}
  .glass-btn{width:46px;height:46px;border-radius:14px;cursor:pointer;display:grid;place-items:center;color:#0b6ea6}
  .glass-btn svg{width:22px;height:22px}
  .glass-btn:active{transform:translateY(1px)}
  #panelBtn{position:relative}
  #panelBtn.active{color:#0a6c3f;background:linear-gradient(180deg,rgba(235,255,242,.85),rgba(180,240,205,.55) 46%,rgba(140,225,175,.6))}
  #panelBtn svg{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
  #panelBtn.active svg{transform:rotate(90deg)}
  .notify{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d9ffe4,#37d16a);
    box-shadow:0 0 9px rgba(55,209,106,.95), inset 0 1px 1px #fff;
    opacity:0;transform:scale(.4);transition:opacity .25s, transform .25s;pointer-events:none}
  .notify.show{opacity:1;animation:npulse 1.5s ease-in-out infinite}
  @keyframes npulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

  .panel{position:absolute;top:78px;right:16px;bottom:16px;width:346px;display:flex;flex-direction:column;z-index:6;overflow:hidden;
    transition:transform .5s cubic-bezier(.24,1.15,.32,1), opacity .28s ease}
  .panel.closed{transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none}
  .panel-head{padding:13px 16px 10px;display:flex;align-items:center;justify-content:space-between;
    background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));border-bottom:1px solid rgba(255,255,255,.6)}
  .panel-head h2{font-size:16.5px;font-weight:900;color:#0b5e8f;letter-spacing:.4px}
  .head-right{display:flex;align-items:center;gap:8px}
  #resetBtn{font-family:inherit;font-size:10.5px;font-weight:900;letter-spacing:.6px;color:#2a7ea6;cursor:pointer;
    background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);border-radius:999px;padding:4px 11px}
  #resetBtn:hover{background:#fff}
  #resetBtn.armed{color:#b32d2d;border-color:#e6a6a6}
  #closePanel{font-family:inherit;cursor:pointer;color:#2a7ea6;width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85)}
  #closePanel:hover{background:#fff;color:#0b5e8f}
  .panel-body{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
  .panel-body::-webkit-scrollbar{width:8px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.65);border-radius:8px}

  .special{border-radius:16px;padding:12px;position:relative;
    background:linear-gradient(150deg,rgba(150,230,170,.38),rgba(130,215,255,.32));
    border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff, 0 4px 12px rgba(9,84,130,.14)}
  .special .tag{font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:#157a4b;display:flex;align-items:center;gap:6px}
  .special .tag svg{width:13px;height:13px}
  .special-main{display:flex;align-items:center;gap:11px;margin-top:9px}
  .lm-icon{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;
    background:radial-gradient(circle at 30% 24%,#fff,#d9f5ff 58%,#a9def5);
    box-shadow:inset 0 2px 2px #fff, 0 3px 8px rgba(9,84,130,.26)}
  .lm-icon svg{width:36px;height:36px}
  .lm-name{font-weight:900;font-size:15px;color:#0b5e8f;line-height:1.15}
  .lm-eff{font-size:11.5px;font-weight:800;color:#157a4b;margin-top:2px}
  .tier-dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 2px rgba(9,84,130,.28)}
  .dot.f{background:radial-gradient(circle at 35% 30%,#eafff0,#4ecf77);box-shadow:0 0 7px rgba(78,207,119,.85)}
  .done-msg{font-size:13px;font-weight:800;color:#0b5e8f;margin-top:8px;line-height:1.4}
  .bprow{display:flex;align-items:center;gap:9px;margin-top:11px}
  .bp{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 3px rgba(9,84,130,.25);overflow:hidden}
  .bp i{display:block;height:100%;width:0;border-radius:6px;
    background:linear-gradient(180deg,#b9f2c9,#4ecf77);box-shadow:0 0 8px rgba(78,207,119,.8);transition:width .2s linear}
  #bpTime{font-size:13px;font-weight:900;color:#0b5e8f;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}

  /* floating build timer above the site */
  #siteTimer{position:absolute;z-index:4;display:none;transform:translate(-50%,-100%);
    padding:4px 14px;font-weight:900;font-size:13.5px;color:#0b5e8f;pointer-events:none;white-space:nowrap;
    border-radius:999px;animation:chipBob 1s ease-in-out infinite alternate}
  @keyframes chipBob{from{margin-top:0}to{margin-top:-5px}}

  .btn-buy{cursor:pointer;font-family:inherit;font-weight:900;color:#0b5e8f;
    border:1px solid rgba(255,255,255,.75);border-radius:12px;
    background:linear-gradient(180deg,#eafbff,#bfe9fb 48%,#8fd2f2 52%,#cdeffb);
    box-shadow:inset 0 1px 0 #fff, 0 3px 7px rgba(9,84,130,.24);
    transition:filter .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
  .btn-buy.can{color:#0a5c2e;background:linear-gradient(180deg,#eafff0,#b6f2c6 48%,#7bdc97 52%,#c6f5d2);
    box-shadow:inset 0 1px 0 #fff, 0 3px 10px rgba(46,160,90,.42)}
  .btn-buy.can:hover{filter:brightness(1.06)}
  .btn-buy.can:active{transform:translateY(1px) scale(.98)}
  .btn-buy.small{border-radius:10px;padding:7px 11px;font-size:12.5px;min-width:78px;flex:none}
  .buy-big{margin-top:11px;width:100%;padding:9px 14px;font-size:13.5px;justify-content:space-between}
  .btn-buy .d{width:10px;height:14px;flex:none}
  .btn-buy.armed{color:#a33333;background:linear-gradient(180deg,#ffecec,#f5c2c2 48%,#e89a9a 52%,#ffd9d9);
    box-shadow:inset 0 1px 0 #fff, 0 3px 10px rgba(200,80,80,.4)}

  .rebirth{border-radius:16px;padding:12px;
    background:linear-gradient(150deg,rgba(255,236,170,.6),rgba(255,190,120,.35));
    border:1px solid rgba(255,240,200,.95);box-shadow:inset 0 1px 0 #fff, 0 4px 12px rgba(160,110,20,.18)}
  .rb-tag{font-size:9.5px;font-weight:900;letter-spacing:1.6px;color:#a06a00;display:flex;gap:6px;align-items:center}
  .rb-tag svg{width:13px;height:13px}
  .rb-info{font-size:11.5px;font-weight:800;color:#7a5b10;margin-top:6px;line-height:1.45}
  .rb-info b{color:#a3490a}
  .rb-stats{font-size:10.5px;font-weight:800;color:#a07b2a;margin-top:4px}
  .rb-btn{margin-top:10px}
  .rb-btn.can{color:#6b4a00;background:linear-gradient(180deg,#fff7dd,#ffe49a 48%,#f5c443 52%,#ffeebc);
    box-shadow:inset 0 1px 0 #fff, 0 3px 10px rgba(220,160,40,.5)}

  .up-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;
    background:linear-gradient(180deg,rgba(255,255,255,.58),rgba(255,255,255,.22));
    border:1px solid rgba(255,255,255,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
    transition:transform .12s, background .15s}
  .up-row:hover{background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.4));transform:translateY(-1px)}
  .tile{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
    background:radial-gradient(circle at 32% 26%,#fff,#c9ecfa 55%,#8ecdec);
    box-shadow:inset 0 2px 2px rgba(255,255,255,.95), 0 2px 6px rgba(9,84,130,.24)}
  .tile svg{width:23px;height:23px}
  .meta{flex:1;min-width:0}
  .nm{font-size:13.5px;font-weight:900;color:#0b5e8f}
  .fx{font-size:11px;font-weight:800;color:#3d87ab;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fx b{color:#0f8a5b}

  .fl{position:absolute;font-weight:900;font-size:22px;color:#fff;pointer-events:none;
    text-shadow:0 2px 6px rgba(9,84,130,.55), 0 0 14px rgba(150,235,255,.9);white-space:nowrap}
  #toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{padding:9px 18px;display:flex;gap:11px;align-items:center;font-weight:900;color:#0b5e8f;font-size:14px}
  .toast svg{width:26px;height:26px;flex:none}
  .toast .tt{color:#157a4b}

  /* ---------- scene ---------- */
  #dropZone{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #dropBody{transform-box:fill-box;transform-origin:50% 100%;
    filter:drop-shadow(0 16px 22px rgba(8,80,140,.35)) drop-shadow(0 0 18px rgba(160,235,255,.45))}
  .lm{opacity:0;transition:opacity .35s}
  .lm.on{opacity:1}
  .noT,.noT *{transition:none!important}
  .cons{opacity:0;transition:opacity .5s;pointer-events:none}
  .pp,.ppB,.ppY,.ppD,.ppO{transform-box:fill-box;transition:transform .55s cubic-bezier(.26,1.55,.45,1),opacity .5s ease}
  .pp{transform:scale(0);transform-origin:50% 50%}
  .ppB{transform:scale(0);transform-origin:50% 100%}
  .ppY{transform:scaleY(0);transform-origin:50% 100%}
  .ppD{transform:translateY(-46px);opacity:0}
  .ppO{opacity:0;transition:opacity .8s ease}
  .pop-in{transform:none;opacity:1}
  #lhB{transform-box:view-box;transform-origin:180px 571px;animation:beamSpin 9s linear infinite}
  @keyframes beamSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .rip{fill:none;stroke:#fff;stroke-width:3;transform-box:fill-box;transform-origin:center;
    animation:rip .95s cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes rip{from{transform:scale(.5);opacity:.85}to{transform:scale(2.8);opacity:0}}
  #hint{font-family:'Nunito',sans-serif;font-weight:900;font-size:27px;letter-spacing:1px;
    fill:#fff;stroke:rgba(9,84,130,.35);stroke-width:.8;paint-order:stroke}

  /* ---------- the little people ---------- */
  #peopleB,#peopleF{pointer-events:none}
  .person{pointer-events:none;transition:opacity .5s}
  .pinner{animation:pbob .6s ease-in-out infinite alternate}
  .person.walking .pinner{animation-duration:.28s}
  @keyframes pbob{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
  .leg{transform-box:fill-box;transform-origin:50% 8%}
  .person.walking .lg1{animation:lsw .28s ease-in-out infinite alternate}
  .person.walking .lg2{animation:lsw .28s ease-in-out infinite alternate-reverse}
  @keyframes lsw{from{transform:rotate(17deg)}to{transform:rotate(-17deg)}}
  .tool{transform-box:fill-box;transform-origin:10% 60%;opacity:0;transition:opacity .2s}
  .person.working .mallet{opacity:1;animation:tap .45s ease-in-out infinite alternate}
  @keyframes tap{from{transform:rotate(-14deg)}to{transform:rotate(26deg)}}
  .person.watering .can{opacity:1;animation:tip 1.4s ease-in-out infinite alternate}
  @keyframes tip{from{transform:rotate(6deg)}to{transform:rotate(24deg)}}
  .person.cheer .pinner{animation:cheer .45s ease-in-out 3}
  @keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  @media(max-width:760px){
    .logo{display:none}
    .panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;height:44vh}
    .panel.closed{transform:translateY(115%)}
    .counter{padding:7px 16px 7px 8px}
    #dropsV{font-size:21px;min-width:84px}
    .sub{font-size:10px}
  }
</style>
</head>
<body>
<div id="stage">

<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1186cf"/><stop offset=".42" stop-color="#63c3ec"/>
      <stop offset=".76" stop-color="#c8eef4"/><stop offset="1" stop-color="#e9f9e3"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fffbe8" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff3bd" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff3bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef5"/><stop offset="1" stop-color="#ffdd77"/>
    </linearGradient>
    <linearGradient id="rayG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".65" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hillBackG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4e89e"/><stop offset="1" stop-color="#62bd67"/>
    </linearGradient>
    <linearGradient id="hillFrontG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ede77"/><stop offset="1" stop-color="#3fae57"/>
    </linearGradient>
    <linearGradient id="watG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5ecff"/><stop offset=".35" stop-color="#2fa3d9"/><stop offset="1" stop-color="#0a5f9e"/>
    </linearGradient>
    <linearGradient id="deepG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04345e" stop-opacity="0"/><stop offset="1" stop-color="#04345e" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="dropG" cx=".32" cy=".25" r="1">
      <stop offset="0" stop-color="#f4feff"/><stop offset=".28" stop-color="#ade9ff"/>
      <stop offset=".62" stop-color="#47b9ec"/><stop offset="1" stop-color="#0c7cbd"/>
    </radialGradient>
    <linearGradient id="towerG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fbff"/><stop offset=".45" stop-color="#9adcf5"/><stop offset="1" stop-color="#55aede"/>
    </linearGradient>
    <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9854e"/><stop offset="1" stop-color="#7d5228"/>
    </linearGradient>
    <radialGradient id="leafG" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#d9ffb2"/><stop offset=".45" stop-color="#86d95f"/><stop offset="1" stop-color="#2f9e4c"/>
    </radialGradient>
    <linearGradient id="balG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#f2674a"/>
    </linearGradient>
    <linearGradient id="roofR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08a"/><stop offset="1" stop-color="#e8684a"/>
    </linearGradient>
    <linearGradient id="roofG2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf2c8"/><stop offset="1" stop-color="#4caf6d"/>
    </linearGradient>
    <radialGradient id="domeG" cx=".4" cy=".3" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#cdeffb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#9fd4f0" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="beamGL" gradientUnits="userSpaceOnUse" x1="180" y1="571" x2="-150" y2="571">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".5"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamGR" gradientUnits="userSpaceOnUse" x1="180" y1="571" x2="510" y2="571">
      <stop offset="0" stop-color="#fff3b0" stop-opacity=".5"/><stop offset="1" stop-color="#fff3b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="twc"><rect x="1211" y="432" width="78" height="300" rx="7"/></clipPath>
    <clipPath id="lhC"><path d="M166 768 L174 652 L186 652 L194 768 Z"/></clipPath>
    <path id="dropShape" d="M800 352 C838 414 888 464 888 518 A88 88 0 1 1 712 518 C712 464 762 414 800 352 Z"/>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1600" height="900" fill="url(#skyG)"/>
  <g opacity=".5">
    <animate attributeName="opacity" values=".45;.8;.45" dur="9s" repeatCount="indefinite"/>
    <polygon points="150,-20 300,-20 1000,920 560,920" fill="url(#rayG)" opacity=".14"/>
    <polygon points="330,-20 420,-20 1240,920 980,920" fill="url(#rayG)" opacity=".1"/>
  </g>
  <circle cx="215" cy="150" r="150" fill="url(#sunGlow)"/>
  <circle cx="215" cy="150" r="54" fill="url(#sunG)"/>
  <ellipse cx="200" cy="132" rx="16" ry="10" fill="#fff" opacity=".85" transform="rotate(-20 200 132)"/>

  <g fill="#fff">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;45 0;0 0" dur="34s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(1120,150) scale(1.15)">
        <ellipse cx="0" cy="0" rx="72" ry="30"/><ellipse cx="58" cy="10" rx="52" ry="22"/>
        <ellipse cx="-58" cy="12" rx="48" ry="20"/><ellipse cx="6" cy="-16" rx="46" ry="24"/>
        <ellipse cx="0" cy="22" rx="80" ry="14" fill="#d9eef8" opacity=".55"/>
      </g></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="26s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(430,115) scale(.8)">
        <ellipse cx="0" cy="0" rx="72" ry="30"/><ellipse cx="58" cy="10" rx="52" ry="22"/>
        <ellipse cx="-58" cy="12" rx="48" ry="20"/><ellipse cx="6" cy="-16" rx="46" ry="24"/>
        <ellipse cx="0" cy="22" rx="80" ry="14" fill="#d9eef8" opacity=".55"/>
      </g></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;35 0;0 0" dur="21s" repeatCount="indefinite" additive="sum"/>
      <g transform="translate(1430,290) scale(.6)">
        <ellipse cx="0" cy="0" rx="72" ry="30"/><ellipse cx="58" cy="10" rx="52" ry="22"/>
        <ellipse cx="-58" cy="12" rx="48" ry="20"/><ellipse cx="6" cy="-16" rx="46" ry="24"/>
      </g></g>
  </g>

  <!-- LANDMARK 3 : rainbow — appears instantly, no construction -->

function fmt(n){
  if(n<1000)return Math.floor(n).toString();
  const u=['K','M','B','T','Qa','Qi','Sx','Sp'];let i=-1;
  while(n>=1000&&i<u.length-1){n/=1000;i++}
  return (n<100?n.toFixed(1):Math.floor(n))+u[i];
}
const fmtTime=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function cost(u){return Math.ceil(u.base*Math.pow(u.growth,state.owned[u.id]||0))}
const prestige=()=>Math.pow(5,state.rebirths||0);
/* build time: base duration, shrinks with crew — always between 10s and 60s */
function buildTime(L){return Math.max(10,Math.min(60,L.dur*Math.pow(2/Math.max(2,people.length),.5)))}

function recalc(){
  let fc=0,fs=0,cm=1,gm=1;
  for(const u of UPGRADES){
    const o=state.owned[u.id]||0;if(!o)continue;
    if(u.type==='click')fc+=u.val*o;
    else if(u.type==='sec')fs+=u.val*o;
    else if(u.type==='cm')cm*=Math.pow(u.val,o);
    else gm*=Math.pow(u.val,o);
  }
  clickPower=(1+fc)*cm*gm*Math.pow(4,state.special)*prestige();
  cps=fs*gm*prestige();
  $('#cpcV').textContent=fmt(clickPower);
  $('#cpsV').textContent=fmt(cps);
  $('#lmxV').textContent='×'+fmt(Math.pow(4,state.special)*prestige());
}

/* ---------------- upgrade panel ---------------- */
const rowRefs={};
function buildPanel(){
  const list=$('#upList');
  for(const u of UPGRADES){
    const row=document.createElement('div');row.className='up-row';
    row.innerHTML=`<div class="tile">${ICONS[u.icon]}</div>
      <div class="meta"><div class="nm">${u.name}</div>
      <div class="fx">${u.desc} · owned <b>×0</b></div></div>
      <button class="btn-buy small"><span class="cost">0</span>${DROP_MINI}</button>`;
    list.appendChild(row);
    const btn=row.querySelector('button');
    rowRefs[u.id]={row,btn,own:row.querySelector('.fx b'),cost:row.querySelector('.cost')};
    btn.addEventListener('click',()=>{
      const c=cost(u);
      if(state.drops>=c){
        state.drops-=c;
        state.owned[u.id]=(state.owned[u.id]||0)+1;
        recalc();refreshPanel();sfxBuy();
        row.animate([{transform:'scale(1)'},{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:200});
      }else shake(btn);
    });
  }
}

const FT=[[0,706],[140,650],[260,646],[380,676],[500,704],[620,690],[740,664],[860,640],[980,648],[1100,678],[1220,706],[1340,712],[1460,684],[1600,668]];
const BT=[[0,618],[120,556],[240,548],[360,586],[470,616],[560,596],[660,566],[770,536],[880,548],[980,586],[1090,622],[1200,620],[1300,588],[1400,556],[1500,566],[1600,606]];
function groundY(l,x){
  const T=l==='B'?BT:FT;x=Math.max(0,Math.min(1600,x));
  for(let i=1;i<T.length;i++){if(x<=T[i][0]){
    const [x0,y0]=T[i-1],[x1,y1]=T[i];return y0+(y1-y0)*(x-x0)/(x1-x0);}}
  return T[T.length-1][1];
}

const MAXP=26;
const people=[];
const peopleB=q('peopleB'),peopleF=q('peopleF');

function addPerson(edge){
  if(people.length>=MAXP)return null;
  const ci=people.length%2; /* strictly alternating blue / green */
  const layer=Math.random()<.35?'B':'F';
  const el=personEl(ci);
  (layer==='B'?peopleB:peopleF).appendChild(el);
  const p={el,layer,ci,flip:1,state:'idle',t:1+Math.random()*3,after:null,rush:false,faceX:undefined,
    s:layer==='B'?.7+Math.random()*.16:.95+Math.random()*.25,
    d:layer==='B'?8+Math.random()*16:16+Math.random()*26};
  p.speed=34*p.s;
  if(edge){p.x=Math.random()<.5?-40:1640;p.tx=60+Math.random()*1480;p.state='walk';}
  else p.x=60+Math.random()*1480;
  p.y=Math.min(groundY(layer,p.x)+p.d,718);
  people.push(p);
  $('#crewV').textContent=people.length;
  return p;
}
function place(p){
  const fx=p.flip<0?-1:1;
  p.el.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) scale(${(p.s*fx).toFixed(3)} ${p.s.toFixed(3)})`);
}
/* doors the little people can walk through (only when that landmark exists) */
function enterSpots(){
  const s=[];
  if(state.special>1)s.push({x:1250,y:729});                 /* skyscraper glass door */
  if(state.special>5){s.push({x:880,y:704});s.push({x:1064,y:710});} /* cottage doors */
  if(state.special>7)s.push({x:320,y:698});                  /* dome door */
  if(state.special>8)s.push({x:180,y:766});                  /* lighthouse door */
  return s;
}
function nextTarget(p){
  const spots=p.layer==='F'?enterSpots():null;
  if(spots&&spots.length&&Math.random()<.22){
    const d=spots[(Math.random()*spots.length)|0];
    p.tx=d.x;p.d=Math.max(6,d.y-groundY(p.layer,d.x));p.after='enter';
  }else{
    p.tx=40+Math.random()*1520;
    p.d=p.layer==='B'?8+Math.random()*16:16+Math.random()*26;
    p.after='idle';
  }
  p.state='walk';
}
function updPeople(dt){
  for(const p of people){
    if(p.state==='walk'){
      const sp=p.speed*(p.rush?3.6:1)*dt,dx=p.tx-p.x;
      if(Math.abs(dx)<=sp){
        p.x=p.tx;p.y=Math.min(groundY(p.layer,p.x)+p.d,718);
        if(p.faceX!==undefined){p.flip=p.faceX>=p.x?1:-1;p.faceX=undefined;}
        p.el.classList.remove('walking');
        if(p.after==='work')p.state='work';
        else if(p.after==='enter'){p.state='inside';p.t=3+Math.random()*5;p.el.style.opacity=0;}
        else{p.state='idle';p.t=1+Math.random()*3;}
        p.after=null;
      }else{
        p.x+=Math.sign(dx)*sp;p.flip=dx<0?-1:1;
        p.y=Math.min(groundY(p.layer,p.x)+p.d,718);
        p.el.classList.add('walking');
      }
    }else if(p.state==='idle'){
      p.t-=dt;if(p.t<=0)nextTarget(p);
    }else if(p.state==='inside'){
      p.t-=dt;if(p.t<=0){p.el.style.opacity=1;p.state='idle';p.t=.6+Math.random()*2;}
    }
    place(p);
  }
}
function syncPeople(instant){
  const want=Math.min(2+2*state.special+2*(state.rebirths||0),MAXP);
  if(people.length>=want)return;
  const addOne=()=>{
    if(people.length>=want)return;
    addPerson(!instant);
    setTimeout(addOne,instant?60:900+Math.random()*800);
  };
  addOne();
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tw=(ms,fn)=>new Promise(res=>{const t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/ms);fn(p);p<1?requestAnimationFrame(f):res();})(t0);});
function scY(id,by,p){q(id).setAttribute('transform',`translate(0 ${by}) scale(1 ${p}) translate(0 ${-by})`)}
function show(i){q('lm'+i).classList.add('on')}
function consOn(id){q(id).style.opacity=1}
function consOff(id){q(id).style.opacity=0}
function popP(el,delay=0){if(el)setTimeout(()=>el.classList.add('pop-in'),delay)}
function setProg(p){const f=q('bpFill');if(f)f.style.width=(p*100)+'%'}

let building=null,curCrew=[],progTimer=null,tickTimer=null;

function pickWorkers(n,site){
  return people.filter(p=>p.state==='idle'||p.state==='walk')
    .sort((a,b)=>Math.hypot(a.x-site.x,a.y-site.y)-Math.hypot(b.x-site.x,b.y-site.y))
    .slice(0,n);
}
function moveSiteTimer(txt){
  const chip=q('siteTimer'),site=SITES[building];
  chip.style.display='block';chip.textContent='⏱ '+txt;
  const m=q('scene').getScreenCTM();
  if(!m)return;
  const p=new DOMPoint(site.x,site.ty).matrixTransform(m);
  chip.style.left=p.x+'px';chip.style.top=p.y+'px';
}

/* rainbow — no construction, it just appears (draws itself in) */
function revealRainbow(){
  const el=q('lm2');el.classList.add('on');
  const bands=[...el.querySelectorAll('.rb')];
  bands.forEach(b=>{b.style.transition='none';b.style.strokeDasharray='1';b.style.strokeDashoffset='1';});
  el.getBoundingClientRect();
  bands.forEach((b,k)=>{
    b.style.transition=`stroke-dashoffset 1.3s cubic-bezier(.3,0,.2,1) ${k*.12}s`;
    b.style.strokeDashoffset='0';
    setTimeout(()=>{b.style.transition='';b.style.strokeDasharray='';b.style.strokeDashoffset='';},1700+k*120);
  });
}

function startBuild(i){
  const L=LANDMARKS[i];
  if(L.instant){ /* rainbow: magic! */
    revealRainbow();
    $('#flash').animate([{opacity:0},{opacity:.55,offset:.2},{opacity:0}],{duration:750});
    toast(`${LM_ICON[i]}<div><span class="tt">${L.name}</span> appears in the sky · click power ×4 · 2 new builders arrive</div>`);
    burst(30);sfxLandmark();
    syncPeople(false);renderSpecial();refreshPanel();save();
    return;
  }
  building=i;
  const site=SITES[i];
  toast(`${LM_ICON[i]}<div>The crew started building <span class="tt">${L.name}</span>…</div>`);
  const n=Math.min(site.spots.length,people.length,4);
  curCrew=pickWorkers(Math.max(1,n),site);
  curCrew.forEach((p,k)=>{
    const sp=site.spots[k%site.spots.length];
    p.rush=true;p.state='walk';p.after='work';p.faceX=site.x;
    p.tx=sp[0];p.d=Math.max(8,Math.min(sp[1],718)-groundY(p.layer,sp[0]));
  });
  const D=buildTime(L),S=D*1000,t0=performance.now(),end=t0+S;
  progTimer=setInterval(()=>{
    const rem=Math.max(0,end-performance.now());
    setProg(Math.min(.98,1-rem/S));
    const txt=fmtTime(rem);
    const bt=q('bpTime');if(bt)bt.textContent=txt;
    moveSiteTimer(txt);
    document.title='⏱ '+txt+' · AeroClick';
  },100);
  tickTimer=setInterval(()=>tone(150+Math.random()*70,80,.06,.03),520);
  curCrew.forEach(p=>p.el.classList.add('working'));
  BUILDS[i](S).then(()=>{
    clearInterval(progTimer);clearInterval(tickTimer);setProg(1);
    q('siteTimer').style.display='none';
    curCrew.forEach(p=>{
      p.el.classList.remove('working','watering');
      p.el.classList.add('cheer');
      p.state='idle';p.t=.4+Math.random();p.rush=false;p.after=null;
      setTimeout(()=>p.el.classList.remove('cheer'),1600);
    });
    curCrew=[];building=null;
    $('#flash').animate([{opacity:0},{opacity:.55,offset:.2},{opacity:0}],{duration:750});
    toast(`${LM_ICON[i]}<div><span class="tt">${L.name}</span> finished · click power ×4 · 2 new builders arrive</div>`);
    burst(40);sfxLandmark();
    syncPeople(false);
    renderSpecial();renderRebirth();refreshPanel();save();
  });
}
function instantShow(i){
  const el=q('lm'+i);if(!el)return;
  el.classList.add('on','noT');
  el.querySelectorAll('.pp,.ppB,.ppY,.ppD,.ppO').forEach(e=>e.classList.add('pop-in'));
  if(i===6){balloon.phase='drift';balloon.x=-200+Math.random()*1900;balloon.y=140;balloon.sc=1;}
  setTimeout(()=>el.classList.remove('noT'),150);
}
function resetLM(i){
  const el=q('lm'+i);if(!el)return;
  el.classList.remove('on');
  el.querySelectorAll('.pop-in').forEach(e=>e.classList.remove('pop-in'));
  if(i===0)q('tr0').removeAttribute('transform');

/* ---------------- special landmark card ---------------- */
function renderSpecial(){
  const card=$('#specialCard'),t=state.special;
  const dots=LANDMARKS.map((_,i)=>`<span class="dot${i<t?' f':''}"></span>`).join('');
  if(building!==null){
    card.innerHTML=`<div class="tag">${STAR} LANDMARK PROJECT · TIER ${building+1}</div>
      <div class="special-main"><div class="lm-icon">${LM_ICON[building]}</div>
      <div><div class="lm-name">${LANDMARKS[building].name}</div><div class="lm-eff">the crew is building…</div></div></div>
      <div class="bprow"><div class="bp"><i id="bpFill"></i></div><span id="bpTime">…</span></div>
      <div class="tier-dots">${dots}</div>`;
    return;
  }
  if(t>=LANDMARKS.length){
    card.innerHTML=`<div class="tag">${STAR} SCENERY MASTERED</div>
      <div class="done-msg">Every landmark is built — the Aero valley is complete. Rebirth for a ×5 bonus, or keep clicking!</div>
      <div class="tier-dots">${dots}</div>`;
    return;
  }
  const L=LANDMARKS[t];
  const timeStr=L.instant?'appears instantly':`≈ ${fmtTime(buildTime(L)*1000)} build`;
  card.innerHTML=`<div class="tag">${STAR} LANDMARK PROJECT · TIER ${t+1}/${LANDMARKS.length}</div>
    <div class="special-main"><div class="lm-icon">${LM_ICON[t]}</div>
      <div><div class="lm-name">${L.name}</div>
      <div class="lm-eff">Click power ×4 · ${people.length} builders ${PERSON_MINI} · ${timeStr}</div></div></div>
    <button class="btn-buy buy-big" id="buySpecial"><span>Start building</span><span>${fmt(L.cost)} ${DROP_MINI}</span></button>
    <div class="tier-dots">${dots}</div>`;
  $('#buySpecial').addEventListener('click',buySpecial);
}
function buySpecial(){
  if(building!==null){shake($('#buySpecial'));return}
  const t=state.special;if(t>=LANDMARKS.length)return;
  const c=LANDMARKS[t].cost;
  if(state.drops<c){shake($('#buySpecial'));return}
  state.drops-=c;state.special++;
  recalc();renderSpecial();refreshPanel();save();
  startBuild(t);
}

/* ---------------- rebirth ---------------- */
function renderRebirth(){
  const rb=state.rebirths||0,cost=1e12*Math.pow(20,rb);
  const el=$('#rebirthCard');
  el.innerHTML=`<div class="rb-tag">${GOLDSTAR} REBIRTH${rb?` · LEVEL ${rb+1}`:''}</div>
    <div class="rb-info">Reset drops, upgrades &amp; scenery — the crew rebuilds everything from scratch.<br>
    Permanent <b>×5 all drops</b> and <b>+2 builders</b> per rebirth.</div>
    <div class="rb-stats">Rebirths: ${rb} · current bonus ×${fmt(Math.pow(5,rb))} · crew bonus +${2*rb}</div>
    <button class="btn-buy buy-big rb-btn" id="rbBtn"><span>Rebirth</span><span>${fmt(cost)} ${DROP_MINI}</span></button>`;
  let armed=false,tm;
  $('#rbBtn').addEventListener('click',function(){
    if(building!==null){shake(this);return}
    const c=1e12*Math.pow(20,state.rebirths||0);
    if(state.drops<c){shake(this);return}
    if(!armed){armed=true;this.classList.add('armed');
      this.firstElementChild.textContent='Really? All progress resets!';
      tm=setTimeout(()=>{armed=false;this.classList.remove('armed');
        this.firstElementChild.textContent='Rebirth'},3000);}
    else{clearTimeout(tm);doRebirth();}
  });
}
function doRebirth(){
  state.rebirths=(state.rebirths||0)+1;
  state.drops=0;state.owned={};state.special=0;disp=0;
  for(let i=0;i<LANDMARKS.length;i++)resetLM(i);
  balloon.phase='hidden';
  people.slice().forEach(p=>p.el.remove());people.length=0;
  $('#crewV').textContent=0;
  recalc();renderSpecial();renderRebirth();refreshPanel();syncPeople(false);save();
  $('#flash').animate([{opacity:0},{opacity:.85,offset:.25},{opacity:0}],{duration:1100});
  toast(`${GOLDSTAR}<div><span class="tt">Rebirth!</span> Permanent ×5 bonus &amp; +2 builders joined the valley</div>`);
  burst(60);sfxLandmark();
}

    {duration:900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>el.remove();
}
function ripple(){
  const e=document.createElementNS(NS,'ellipse');
  e.setAttribute('cx',800);e.setAttribute('cy',726);
  e.setAttribute('rx',70);e.setAttribute('ry',14);e.setAttribute('class','rip');
  ripples.appendChild(e);setTimeout(()=>e.remove(),1100);
}

/* ---------------- bubble / splash canvas ---------------- */
const cv=$('#fx'),ctx=cv.getContext('2d');
let W,H,waterY;
const bubbles=[],spl=[],rings=[];
function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sc=Math.max(W/1600,H/900);
  waterY=Math.min(H-(900-724)*sc,H*.92);
}
addEventListener('resize',resize);resize();
function splash(x,y){
  for(let i=0;i<8;i++){
    const a=Math.random()*6.28,sp=60+Math.random()*130;
    spl.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,r:1.5+Math.random()*2.4,l:.65+Math.random()*.25});
  }
}
function burst(n){for(let i=0;i<n;i++)bubbles.push(
  {x:Math.random()*W,y:H-Math.random()*H*.3,r:2+Math.random()*4.5,v:60+Math.random()*90,ph:Math.random()*6.28,amp:14+Math.random()*20});}
function drawFX(dt,t){
  ctx.clearRect(0,0,W,H);
  if(Math.random()<dt*2.4)bubbles.push(
    {x:Math.random()*W,y:H+10,r:2+Math.random()*4.5,v:24+Math.random()*36,ph:Math.random()*6.28,amp:10+Math.random()*18});
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(t*1.8+b.ph)*b.amp*dt;
    if(b.y<waterY+3){rings.push({x:b.x,y:waterY+2,r:b.r+2,a:.55});bubbles.splice(i,1);continue}
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);
    ctx.fillStyle='rgba(215,245,255,.16)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.65)';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.32,0,7);
    ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
  }
  for(let i=spl.length-1;i>=0;i--){
    const d=spl[i];d.vy+=560*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.l-=dt;
    if(d.l<=0){spl.splice(i,1);continue}
    ctx.globalAlpha=Math.max(0,d.l/.9);
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);
    ctx.fillStyle='rgba(225,248,255,.95)';ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();
    ctx.globalAlpha=1;
  }
  for(let i=rings.length-1;i>=0;i--){
    const g=rings[i];g.r+=55*dt;g.a-=1.4*dt;
    if(g.a<=0){rings.splice(i,1);continue}
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);
    ctx.strokeStyle=`rgba(255,255,255,${g.a})`;ctx.lineWidth=1.5;ctx.stroke();
  }
}

/* ---------------- sound ---------------- */
let AC=null;
function initAudio(){try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
}catch(e){}}
function tone(f0,f1,dur,vol,when=0){
  if(state.muted||!AC)return;
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+when;
  o.type='sine';o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}
const sfxClick=()=>tone(620+Math.random()*90,170,.16,.09);
const sfxBuy=()=>{tone(430,860,.1,.12);tone(860,980,.09,.08,.08)};
const sfxLandmark=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.24,.12,i*.1));

/* ---------------- toast / save / buttons ---------------- */
function toast(html){
  const box=$('#toast');
  if(box.childElementCount>2)box.firstElementChild.remove();
  const t=document.createElement('div');t.className='toast glass';t.innerHTML=html;
  box.appendChild(t);
  t.animate([{transform:'translateY(20px) scale(.9)',opacity:0},{transform:'none',opacity:1}],
    {duration:450,easing:'cubic-bezier(.2,1.4,.4,1)'});
  setTimeout(()=>{t.animate([{opacity:1},{opacity:0,transform:'translateY(8px)'}],{duration:400}).onfinish=()=>t.remove()},3800);
}
function save(){try{state.panelOpen=panelOpen;localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{
  const d=JSON.parse(localStorage.getItem(KEY));
  if(d){state.drops=+d.drops||0;state.owned=d.owned||{};
    state.special=Math.min(d.special||0,LANDMARKS.length);
    state.rebirths=+d.rebirths||0;state.muted=!!d.muted;
    if(d.panelOpen!==undefined)state.panelOpen=!!d.panelOpen;}
}catch(e){}}
const muteBtn=$('#muteBtn');
function drawMute(){muteBtn.innerHTML=state.muted?ICON_OFF:ICON_ON}
muteBtn.addEventListener('click',()=>{state.muted=!state.muted;drawMute();save()});
let armed=false,armT;
 $('#resetBtn').addEventListener('click',function(){
  if(!armed){armed=true;this.textContent='Sure?';this.classList.add('armed');
    armT=setTimeout(()=>{armed=false;this.textContent='Reset';this.classList.remove('armed')},2600);}
  else{clearTimeout(armT);localStorage.removeItem(KEY);location.reload();}
});

/* ---------------- balloon drift ---------------- */
const balloon={phase:'hidden',x:0,y:140,sc:0};
function updBalloon(dt){
  if(balloon.phase==='hidden')return;
  if(balloon.phase==='drift'){balloon.x+=18*dt;if(balloon.x>1880)balloon.x=-260;}
  q('lm6drift').setAttribute('transform',`translate(${balloon.x.toFixed(1)} ${balloon.y.toFixed(1)})`);
  q('lm6sc').setAttribute('transform',`scale(${balloon.sc.toFixed(3)})`);
}

/* ---------------- main loop ---------------- */
let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/1000,.25);last=t;
  state.drops+=cps*dt;
  updPeople(dt);
  updBalloon(dt);
  drawFX(dt,t/1000);
  disp+=(state.drops-disp)*Math.min(1,dt*10);
  if(Math.abs(state.drops-disp)<.5)disp=state.drops;
  $('#dropsV').textContent=fmt(disp);
  requestAnimationFrame(loop);
}

/* ---------------- init ---------------- */
buildPanel();
load();
drawMute();
recalc();
for(let i=0;i<state.special;i++)instantShow(i);
renderSpecial();
renderRebirth();
syncPeople(true);
setPanel(state.panelOpen===null?!matchMedia('(max-width:760px)').matches:state.panelOpen,false);
refreshPanel();
setInterval(refreshPanel,250);
setInterval(save,5000);
addEventListener('beforeunload',save);
requestAnimationFrame(loop);
</script>
