<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Clicker - Full Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background:#0b0f17; color:white; overflow-x:hidden; }

    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(2px,-2px); }
      50% { transform: translate(-2px,2px); }
      75% { transform: translate(2px,2px); }
      100% { transform: translate(0,0); }
    }

    .shake { animation: shake 0.15s; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="p-4 border-b border-white/10 flex justify-between flex-wrap gap-3">
  <div>
    <h1 class="text-3xl font-black text-cyan-400">CS2 CLICKER</h1>
    <p class="text-white/50 text-sm">Clean Full HTML Version</p>
  </div>

  <div class="flex gap-3 flex-wrap">
    <div class="bg-white/10 px-4 py-2 rounded-xl">Kills: <span id="kills">0</span></div>
    <div class="bg-white/10 px-4 py-2 rounded-xl">Money: $<span id="money">250</span></div>
    <div class="bg-white/10 px-4 py-2 rounded-xl">KPC: <span id="kpc">1</span></div>
    <div class="bg-white/10 px-4 py-2 rounded-xl">KPS: <span id="kps">0</span></div>
  </div>
</div>

<!-- TABS -->
<div class="flex gap-2 p-3 flex-wrap">
  <button class="tab bg-cyan-500 px-4 py-2 rounded-xl" data-tab="clicker">Clicker</button>
  <button class="tab bg-white/10 px-4 py-2 rounded-xl" data-tab="shop">Shop</button>
  <button class="tab bg-white/10 px-4 py-2 rounded-xl" data-tab="cases">Cases</button>
  <button class="tab bg-white/10 px-4 py-2 rounded-xl" data-tab="inventory">Inventory</button>
</div>

<!-- CLICKER -->
<div id="clicker" class="tabPage grid grid-cols-1 lg:grid-cols-3 gap-4 p-4">

  <div>
    <div class="bg-white/5 p-4 rounded-xl border border-white/10">
      <h2 class="font-bold mb-2">Upgrades</h2>
      <button id="buyDamage" class="w-full bg-white/10 p-2 rounded-xl mb-2">+1 KPC ($100)</button>
      <button id="buyPassive" class="w-full bg-white/10 p-2 rounded-xl">+10 KPS ($500)</button>
    </div>

    <div class="bg-white/5 p-4 rounded-xl border border-white/10 mt-4">
      <h2 class="font-bold mb-2">Exchange</h2>
      <button id="exchange" class="w-full bg-green-500 p-2 rounded-xl">10 Kills = $1</button>
    </div>
  </div>

  <div class="flex flex-col items-center justify-center">

    <div id="comboText" class="text-cyan-300 font-bold mb-2">Combo: 0</div>

    <button id="weapon" class="p-6 bg-white/5 rounded-2xl border border-cyan-400/20">
      <svg width="400" height="200">
        <rect id="gun" x="120" y="80" width="200" height="40" rx="10" fill="#2563eb" />
      </svg>
    </button>

    <div class="mt-4 w-full bg-white/10 h-4 rounded-full overflow-hidden">
      <div id="comboBar" class="h-full bg-cyan-400" style="width:0%"></div>
    </div>

  </div>

  <div></div>
</div>

<!-- SHOP -->
<div id="shop" class="tabPage hidden p-4">
  <div class="bg-white/5 p-4 rounded-xl border border-white/10">
    <h2 class="font-bold mb-2">Shop</h2>
    <button id="shopDeagle" class="w-full bg-white/10 p-2 rounded-xl mb-2">Desert Eagle ($2500)</button>
    <button id="shopAWP" class="w-full bg-white/10 p-2 rounded-xl">AWP ($15000)</button>
  </div>
</div>

<!-- CASES -->
<div id="cases" class="tabPage hidden p-4">
  <div class="bg-white/5 p-4 rounded-xl border border-white/10">
    <button id="caseOpen" class="w-full bg-blue-500 p-3 rounded-xl">Open Case ($250)</button>
    <div id="caseResult" class="mt-3"></div>
  </div>
</div>

<!-- INVENTORY -->
<div id="inventory" class="tabPage hidden p-4">
  <div id="inv" class="space-y-2"></div>
</div>

<script>
let kills=0,money=250,kpc=1,kps=0,combo=0;
let comboTimer;
let equipped={color:'#2563eb',name:'Default'};
let inventory=[];

const killsEl=document.getElementById('kills');
const moneyEl=document.getElementById('money');
const kpcEl=document.getElementById('kpc');
const kpsEl=document.getElementById('kps');
const gun=document.getElementById('gun');

function update(){
  killsEl.innerText=Math.floor(kills);
  moneyEl.innerText=Math.floor(money);
  kpcEl.innerText=kpc;
  kpsEl.innerText=kps;
  document.getElementById('comboText').innerText="Combo: "+combo;
  document.getElementById('comboBar').style.width=Math.min(combo,100)+"%";
  gun.setAttribute('fill',equipped.color);
}

// tabs
let tabs=document.querySelectorAll('.tab');
tabs.forEach(t=>t.onclick=()=>{
  tabs.forEach(x=>x.classList.remove('bg-cyan-500'));
  t.classList.add('bg-cyan-500');

  document.querySelectorAll('.tabPage').forEach(p=>p.classList.add('hidden'));
  document.getElementById(t.dataset.tab).classList.remove('hidden');
});

// click
weapon.onclick=()=>{
  weapon.classList.add('shake');
  setTimeout(()=>weapon.classList.remove('shake'),150);

  combo++;
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>combo=0,20000);

  let gain=kpc*(1+combo*0.02);
  kills+=gain;
  update();
};

// exchange
exchange.onclick=()=>{
  let earn=Math.floor(kills/10);
  money+=earn;
  kills%=10;
  update();
};

// upgrades
buyDamage.onclick=()=>{
  if(money<100)return;
  money-=100;
  kpc++;
  update();
};

buyPassive.onclick=()=>{
  if(money<500)return;
  money-=500;
  kps+=10;
  update();
};

// shop
shopDeagle.onclick=()=>{
  if(money<2500)return;
  money-=2500;
  kpc+=10;
  equipped={color:'#f59e0b',name:'Deagle'};
  update();
};

shopAWP.onclick=()=>{
  if(money<15000)return;
  money-=15000;
  kpc+=50;
  equipped={color:'#a855f7',name:'AWP'};
  update();
};

// cases
caseOpen.onclick=()=>{
  if(money<250)return;
  money-=250;

  let roll=Math.random();
  let skin;

  if(roll<0.6) skin={name:'Mil-Spec',color:'#3b82f6'};
  else if(roll<0.85) skin={name:'Restricted',color:'#a855f7'};
  else skin={name:'Covert',color:'#ef4444'};

  inventory.push(skin);
  inv.innerHTML=inventory.map((i,index)=>
    `<div onclick="equip(${index})" class='bg-white/10 p-2 rounded-xl'>${i.name}</div>`
  ).join('');

  document.getElementById('caseResult').innerHTML='Won: '+skin.name;

  update();
};

function equip(i){
  equipped=inventory[i];
  update();
}

setInterval(()=>{
  kills+=kps;
  update();
},1000);

update();
</script>

</body>
</html>
