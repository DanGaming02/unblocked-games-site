<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal 1 & 2 Clicker</title>
<style>
  :root {
    --blue: #2f8cff;
    --orange: #ff8a1c;
    --bg: #e4e8ec;
    --grid: rgba(60, 75, 90, .10);
    --panel: #f6f8fa;
    --panel-edge: #c3cbd3;
    --ink: #1b232b;
    --muted: #5d6b78;
    --btn: #1b232b;
    --btn-ink: #f6f8fa;
    --stage: #f9fafb;
    --wall: rgba(27, 35, 43, .07);
    --good: #1c8f4e;
  }
  body[data-era="2"] {
    --bg: #1c1912;
    --grid: rgba(190, 150, 90, .07);
    --panel: #29251b;
    --panel-edge: #4a4030;
    --ink: #eadfc6;
    --muted: #a89c80;
    --btn: #d9c48f;
    --btn-ink: #1c1912;
    --stage: #221f16;
    --wall: rgba(120, 140, 70, .10);
    --good: #9ccf5a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    color: var(--ink);
    font-family: "Avenir Next", "Century Gothic", "Trebuchet MS", "Segoe UI", sans-serif;
    transition: background-color .5s, color .5s;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0;
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  .era-switch {
    display: inline-flex;
    border: 2px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
  }
  .era-switch button {
    background: transparent;
    border: 0;
    padding: 8px 18px;
    cursor: pointer;
    font-weight: 700;
  }
  .era-switch button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--bg);
  }
  .era-switch button:disabled {
    cursor: not-allowed;
    opacity: .5;
  }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }

  .stage-card {
    background: var(--panel);
    border: 2px solid var(--panel-edge);
    border-radius: 6px;
    padding: 18px;
    transition: background .5s, border-color .5s;
  }
  .score {
    text-align: center;
    margin-bottom: 8px;
  }
  .score .num {
    font-size: clamp(2.4rem, 8vw, 3.8rem);
    font-weight: 800;
    letter-spacing: -.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .score .label { color: var(--muted); margin-top: 4px; }
  .rates {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: .95rem;
    margin-top: 6px;
  }
  .rates b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .stage {
    position: relative;
    height: 320px;
    margin-top: 14px;
    background: var(--stage);
    border: 2px solid var(--panel-edge);
    border-radius: 4px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    transition: background .5s, border-color .5s;
  }
  .stage::before {
    /* wall panel seams */
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, transparent 49.5%, var(--wall) 49.5%, var(--wall) 50.5%, transparent 50.5%),
      linear-gradient(transparent 66%, var(--wall) 66%, var(--wall) 67%, transparent 67%);
    pointer-events: none;
  }
  body[data-era="2"] .stage::after {
    /* overgrown, stained look for Portal 2 */
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120px 60px at 8% 100%, rgba(95, 125, 50, .35), transparent 70%),
      radial-gradient(160px 70px at 92% 100%, rgba(95, 125, 50, .30), transparent 70%),
      radial-gradient(90px 140px at 50% 0%, rgba(140, 90, 40, .25), transparent 70%);
    pointer-events: none;
  }

  .portal {
    position: absolute;
    top: 50%;
    width: 104px;
    height: 190px;
    margin-top: -95px;
    border-radius: 50%;
    border: 9px solid var(--c);
    background: radial-gradient(ellipse at center, #06080b 40%, color-mix(in srgb, var(--c) 35%, #06080b) 100%);
    box-shadow:
      0 0 24px var(--c),
      0 0 60px color-mix(in srgb, var(--c) 55%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--c) 70%, transparent);
    cursor: pointer;
    padding: 0;
    transition: transform .08s;
  }
  .portal:active { transform: scale(.94); }
  .portal.blue { --c: var(--blue); left: 9%; }
  .portal.orange { --c: var(--orange); right: 9%; }
  .portal .spin {
    position: absolute; inset: 6px;
    border-radius: 50%;
    border: 2px dashed color-mix(in srgb, var(--c) 80%, white);
    opacity: .6;
    animation: spin 6s linear infinite;
  }
  .portal.orange .spin { animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cube, .floater, .bonus {
    position: absolute;
    left: 0; top: 0;
    pointer-events: none;
  }
  .cube {
    width: 28px; height: 28px;
    margin: -14px 0 0 -14px;
    background: #c9ced4;
    border: 3px solid #7d858e;
    border-radius: 3px;
    box-shadow: inset 0 0 0 4px #dfe3e7;
  }
  .cube::after {
    content: "";
    position: absolute; inset: 5px;
    border-radius: 50%;
    border: 2px solid #ff5d9e;
  }
  body[data-era="2"] .cube { background: #a79d86; border-color: #6b6350; box-shadow: inset 0 0 0 4px #bdb39a; }

  .floater {
    font-weight: 800;
    font-size: 1.1rem;
    color: var(--ink);
    text-shadow: 0 0 6px var(--stage);
    white-space: nowrap;
  }

  .bonus {
    pointer-events: auto;
    cursor: pointer;
    width: 40px; height: 40px;
    margin: 0;
    border: 3px solid #ff5d9e;
    border-radius: 6px;
    background: #d3d8de;
    padding: 0;
    z-index: 5;
    box-shadow: 0 0 16px rgba(255, 93, 158, .7);
  }
  .bonus::after {
    content: "";
    position: absolute; inset: 7px;
    border-radius: 50%;
    border: 3px solid #ff5d9e;
  }

  .hint { text-align: center; color: var(--muted); font-size: .9rem; margin: 12px 0 0; }
  .ticker {
    margin: 14px 0 0;
    padding-top: 12px;
    border-top: 2px solid var(--panel-edge);
    color: var(--muted);
    font-style: italic;
    min-height: 3em;
    text-align: center;
  }

  .shop {
    background: var(--panel);
    border: 2px solid var(--panel-edge);
    border-radius: 6px;
    padding: 14px;
    transition: background .5s, border-color .5s;
  }
  .shop h2 {
    margin: 0 0 4px;
    font-size: 1.1rem;
  }
  .shop .sub { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  .list { display: grid; gap: 8px; }

  .up {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 2px 12px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 2px solid var(--panel-edge);
    border-radius: 4px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color .15s, transform .08s;
  }
  .up:active:not(:disabled) { transform: scale(.985); }
  .up:disabled { cursor: not-allowed; opacity: .55; }
  .up.can { border-color: var(--good); }
  .up .name { font-weight: 800; }
  .up .desc { grid-column: 1; color: var(--muted); font-size: .85rem; }
  .up .own {
    grid-column: 2; grid-row: 1;
    justify-self: end;
    font-weight: 800;
    font-size: 1.25rem;
    font-variant-numeric: tabular-nums;
  }
  .up .cost {
    grid-column: 2; grid-row: 2;
    justify-self: end;
    font-size: .85rem;
    font-variant-numeric: tabular-nums;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    color: var(--muted);
    font-size: .85rem;
  }
  .reset {
    background: transparent;
    border: 1px solid var(--panel-edge);
    border-radius: 4px;
    padding: 5px 10px;
    cursor: pointer;
    color: var(--muted);
  }
  .reset:hover { border-color: var(--ink); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .portal .spin { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body data-era="1">
<div class="wrap">
  <header>
    <h1>Aperture Clicker</h1>
    <div class="era-switch" role="group" aria-label="Choose game">
      <button id="era1" aria-pressed="true">Portal 1</button>
      <button id="era2" aria-pressed="false" disabled title="Unlocks at 2,000 total points">Portal 2</button>
    </div>
  </header>

  <main>
    <section class="stage-card" aria-label="Test chamber">
      <div class="score">
        <div class="num" id="pts">0</div>
        <div class="label">science points</div>
        <div class="rates">
          <span><b id="cps">1</b> per click</span>
          <span><b id="aps">0</b> per second</span>
        </div>
      </div>

      <div class="stage" id="stage">
        <button class="portal blue" id="pBlue" aria-label="Blue portal: click to send a cube through"><span class="spin"></span></button>
        <button class="portal orange" id="pOrange" aria-label="Orange portal: click to send a cube through"><span class="spin"></span></button>
      </div>

      <p class="hint">Click either portal to send a cube through. Grab the pink-ringed cubes that drift by for a bonus.</p>
      <p class="ticker" id="ticker" aria-live="polite"></p>
    </section>

    <section class="shop" aria-label="Upgrades">
      <h2 id="shopTitle">Test Chamber Upgrades</h2>
      <p class="sub" id="shopSub">Everything here was approved by nobody.</p>
      <div class="list" id="list"></div>
      <div class="footer-row">
        <span id="lifetime">Lifetime: 0</span>
        <button class="reset" id="reset">Reset game</button>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  "use strict";

  var SAVE_KEY = "aperture-clicker-v1";
  var UNLOCK_P2 = 2000;

  // type "click" adds points per click, "auto" adds points per second
  var UPGRADES = [
    // Portal 1
    { id: "gun",     era: 1, type: "click", val: 1,      base: 15,        name: "Portal Gun Calibration", desc: "+1 point per click" },
    { id: "cube",    era: 1, type: "auto",  val: 1,      base: 60,        name: "Weighted Storage Cube",  desc: "+1 point per second" },
    { id: "button",  era: 1, type: "click", val: 6,      base: 400,       name: "Super Colliding Button", desc: "+6 points per click" },
    { id: "turret",  era: 1, type: "auto",  val: 6,      base: 900,       name: "Sentry Turret",          desc: "+6 points per second" },
    { id: "subject", era: 1, type: "auto",  val: 30,     base: 6000,      name: "Volunteer Test Subject", desc: "+30 points per second" },
    { id: "cake",    era: 1, type: "auto",  val: 160,    base: 40000,     name: "The Cake",               desc: "+160 points per second" },
    // Portal 2
    { id: "repulse", era: 2, type: "click", val: 40,     base: 2500,      name: "Repulsion Gel",          desc: "+40 points per click" },
    { id: "propel",  era: 2, type: "auto",  val: 220,    base: 9000,      name: "Propulsion Gel",         desc: "+220 points per second" },
    { id: "funnel",  era: 2, type: "auto",  val: 900,    base: 45000,     name: "Excursion Funnel",       desc: "+900 points per second" },
    { id: "laser",   era: 2, type: "click", val: 600,    base: 120000,    name: "Thermal Discouragement Beam", desc: "+600 points per click" },
    { id: "core",    era: 2, type: "auto",  val: 4800,   base: 400000,    name: "Personality Core",       desc: "+4,800 points per second" },
    { id: "convert", era: 2, type: "auto",  val: 26000,  base: 2500000,   name: "Conversion Gel",         desc: "+26,000 points per second" }
  ];

  var LINES = {
    1: [
      "The chamber is clean, the walls are white, and nobody is asking questions.",
      "Reminder: the cube did not choose this career either.",
      "The turrets have been told to be supportive. They are not great at it.",
      "Science is mostly repeating an experiment until the funding arrives.",
      "The promised reward is definitely real and definitely nearby.",
      "You are doing very well. That is an automated statement."
    ],
    2: [
      "Something has grown through the ceiling. Do not tell facilities.",
      "The facility has been asleep for a long time and it shows.",
      "The gels are still sticky. Nobody knows why we keep making them.",
      "A voice somewhere is confident about all of this. Nobody else is.",
      "The whole place feels like it might fall apart and invent a new type of paint.",
      "Testing is fun again. Officially."
    ]
  };

  var state = fresh();

  function fresh() {
    return { pts: 0, total: 0, era: 1, owned: {}, last: Date.now(), p2seen: false };
  }

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };

  function fmt(n) {
    if (n < 1000) return (n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n)));
    var units = ["K", "M", "B", "T", "Qa", "Qi"];
    var i = -1;
    while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
    return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + units[i];
  }
  function owned(id) { return state.owned[id] || 0; }
  function cost(u) { return Math.ceil(u.base * Math.pow(1.15, owned(u.id))); }
  function clickPower() {
    var p = 1;
    UPGRADES.forEach(function (u) { if (u.type === "click") p += u.val * owned(u.id); });
    return p;
  }
  function autoPower() {
    var p = 0;
    UPGRADES.forEach(function (u) { if (u.type === "auto") p += u.val * owned(u.id); });
    return p;
  }

  // ---------- save / load ----------
  function save() {
    try { state.last = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && typeof s.pts === "number") {
        state = Object.assign(fresh(), s);
        var away = Math.min((Date.now() - (s.last || Date.now())) / 1000, 3600);
        var gain = autoPower() * away;
        if (gain >= 1) {
          state.pts += gain; state.total += gain;
          setTicker("While you were away, the facility earned " + fmt(gain) + " points on its own.");
        }
      }
    } catch (e) {}
  }

  // ---------- UI build ----------
  var listEl = $("list");
  var rows = {};

  function buildList() {
    listEl.innerHTML = "";
    rows = {};
    UPGRADES.filter(function (u) { return u.era === state.era; }).forEach(function (u) {
      var b = document.createElement("button");
      b.className = "up";
      b.innerHTML =
        '<span class="name"></span><span class="own"></span>' +
        '<span class="desc"></span><span class="cost"></span>';
      b.querySelector(".name").textContent = u.name;
      b.querySelector(".desc").textContent = u.desc;
      b.addEventListener("click", function () { buy(u); });
      listEl.appendChild(b);
      rows[u.id] = { el: b, own: b.querySelector(".own"), cost: b.querySelector(".cost") };
    });
  }

  function setEra(era) {
    state.era = era;
    document.body.setAttribute("data-era", String(era));
    $("era1").setAttribute("aria-pressed", era === 1);
    $("era2").setAttribute("aria-pressed", era === 2);
    $("shopTitle").textContent = era === 1 ? "Test Chamber Upgrades" : "Repulsion & Propulsion Upgrades";
    $("shopSub").textContent = era === 1
      ? "Everything here was approved by nobody."
      : "Bigger rooms, stickier science, worse safety records.";
    buildList();
    pickLine();
    render();
  }

  function render() {
    $("pts").textContent = fmt(state.pts);
    $("cps").textContent = fmt(clickPower());
    $("aps").textContent = fmt(autoPower());
    $("lifetime").textContent = "Lifetime: " + fmt(state.total);

    UPGRADES.forEach(function (u) {
      var r = rows[u.id];
      if (!r) return;
      var c = cost(u);
      var can = state.pts >= c;
      r.own.textContent = owned(u.id);
      r.cost.textContent = fmt(c) + " points";
      r.el.disabled = !can;
      r.el.classList.toggle("can", can);
    });

    var unlocked = state.total >= UNLOCK_P2;
    var e2 = $("era2");
    e2.disabled = !unlocked;
    e2.title = unlocked ? "" : "Unlocks at 2,000 total points";
    if (unlocked && !state.p2seen) {
      state.p2seen = true;
      setTicker("A new wing has opened. Portal 2 upgrades are available up top.");
    }
  }

  function buy(u) {
    var c = cost(u);
    if (state.pts < c) return;
    state.pts -= c;
    state.owned[u.id] = owned(u.id) + 1;
    render();
    save();
  }

  // ---------- portal clicking ----------
  var stage = $("stage");
  var flying = 0;

  function center(el) {
    var s = stage.getBoundingClientRect();
    var r = el.getBoundingClientRect();
    return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2 };
  }

  function sendCube(fromEl, toEl) {
    if (flying > 14) return;
    var a = center(fromEl), b = center(toEl);
    var cube = document.createElement("div");
    cube.className = "cube";
    stage.appendChild(cube);
    flying++;
    var mx = (a.x + b.x) / 2, my = Math.min(a.y, b.y) - 100;
    var anim = cube.animate([
      { transform: "translate(" + a.x + "px," + a.y + "px) scale(.2) rotate(0deg)", opacity: 0 },
      { transform: "translate(" + (a.x + (b.x - a.x) * .12) + "px," + (a.y - 30) + "px) scale(1) rotate(60deg)", opacity: 1, offset: .15 },
      { transform: "translate(" + mx + "px," + my + "px) scale(1) rotate(200deg)", opacity: 1, offset: .5 },
      { transform: "translate(" + (b.x - (b.x - a.x) * .12) + "px," + (b.y - 30) + "px) scale(1) rotate(320deg)", opacity: 1, offset: .85 },
      { transform: "translate(" + b.x + "px," + b.y + "px) scale(.2) rotate(380deg)", opacity: 0 }
    ], { duration: 700, easing: "ease-in-out" });
    anim.onfinish = function () { cube.remove(); flying--; };
  }

  function floater(text, x, y) {
    var f = document.createElement("div");
    f.className = "floater";
    f.textContent = text;
    stage.appendChild(f);
    var a = f.animate([
      { transform: "translate(" + x + "px," + y + "px)", opacity: 1 },
      { transform: "translate(" + x + "px," + (y - 70) + "px)", opacity: 0 }
    ], { duration: 800, easing: "ease-out" });
    a.onfinish = function () { f.remove(); };
  }

  function clickPortal(which, ev) {
    var power = clickPower();
    state.pts += power;
    state.total += power;
    var from = which === "blue" ? $("pBlue") : $("pOrange");
    var to = which === "blue" ? $("pOrange") : $("pBlue");
    sendCube(from, to);
    var s = stage.getBoundingClientRect();
    var c = center(from);
    var x = ev && ev.clientX ? ev.clientX - s.left : c.x;
    var y = ev && ev.clientY ? ev.clientY - s.top : c.y;
    floater("+" + fmt(power), x - 12, y - 10);
    render();
  }
  $("pBlue").addEventListener("click", function (e) { clickPortal("blue", e); });
  $("pOrange").addEventListener("click", function (e) { clickPortal("orange", e); });

  // ---------- bonus cube ----------
  function scheduleBonus() {
    setTimeout(spawnBonus, 40000 + Math.random() * 50000);
  }
  function spawnBonus() {
    var b = document.createElement("button");
    b.className = "bonus";
    b.setAttribute("aria-label", "Bonus cube: click for a burst of points");
    stage.appendChild(b);
    var w = stage.clientWidth, h = stage.clientHeight;
    var y0 = 30 + Math.random() * (h - 100);
    var y1 = 30 + Math.random() * (h - 100);
    var dir = Math.random() < .5;
    var anim = b.animate([
      { transform: "translate(" + (dir ? -50 : w + 10) + "px," + y0 + "px) rotate(0deg)" },
      { transform: "translate(" + (dir ? w + 10 : -50) + "px," + y1 + "px) rotate(540deg)" }
    ], { duration: 11000, easing: "linear" });
    var done = false;
    anim.onfinish = function () { if (!done) { b.remove(); scheduleBonus(); } };
    b.addEventListener("click", function (e) {
      e.stopPropagation();
      done = true;
      anim.cancel();
      var reward = Math.max(50 * clickPower(), 45 * autoPower(), 100);
      state.pts += reward; state.total += reward;
      var r = b.getBoundingClientRect(), s = stage.getBoundingClientRect();
      floater("+" + fmt(reward) + " bonus", r.left - s.left - 20, r.top - s.top);
      b.remove();
      setTicker("Bonus cube recovered. Its reward is " + fmt(reward) + " points and zero gratitude.");
      render();
      scheduleBonus();
    });
  }

  // ---------- flavor text ----------
  var tickerEl = $("ticker");
  function setTicker(t) { tickerEl.textContent = t; }
  function pickLine() {
    var l = LINES[state.era];
    setTicker(l[Math.floor(Math.random() * l.length)]);
  }
  setInterval(pickLine, 14000);

  // ---------- era switch ----------
  $("era1").addEventListener("click", function () { setEra(1); });
  $("era2").addEventListener("click", function () { if (!$("era2").disabled) setEra(2); });

  // ---------- reset ----------
  $("reset").addEventListener("click", function () {
    if (!confirm("Reset all progress? This cannot be undone.")) return;
    state = fresh();
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    setEra(1);
  });

  // ---------- main loop ----------
  var lastTick = performance.now();
  var cubeTimer = 0;
  function tick(now) {
    var dt = Math.min((now - lastTick) / 1000, 1);
    lastTick = now;
    var a = autoPower();
    if (a > 0) {
      state.pts += a * dt;
      state.total += a * dt;
      // visual only: cubes wander through the portals while the facility earns
      cubeTimer += dt;
      var gap = Math.max(.35, 1.6 - Math.log10(a + 1) * .3);
      if (cubeTimer > gap) {
        cubeTimer = 0;
        if (Math.random() < .5) sendCube($("pBlue"), $("pOrange"));
        else sendCube($("pOrange"), $("pBlue"));
      }
    }
    render();
    requestAnimationFrame(tick);
  }

  // ---------- start ----------
  load();
  setEra(state.era === 2 && state.total >= UNLOCK_P2 ? 2 : 1);
  scheduleBonus();
  setInterval(save, 5000);
  window.addEventListener("beforeunload", save);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
