<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DUST PROTOCOL — Tactical FPS Prototype</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap');
:root{
  --accent:#d3b686; --ct:#8fc1ee; --t:#e6bd6c; --ink:#e9e5d9;
  --panel:rgba(10,13,16,.55); --line:rgba(255,255,255,.09);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0c0e}
body{
  font-family:'Rajdhani','Arial Narrow',sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:none;overscroll-behavior:none;position:fixed;inset:0;
}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.plate{background:var(--panel);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
/* ============ HUD ============ */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
body.pregame #hud, body.pregame #touchui{opacity:0}
#topbar{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px}
.scorebox{min-width:44px;text-align:center;font-size:24px;font-weight:700;padding:3px 10px 1px;line-height:1.1}
#scoreCT{color:var(--ct)} #scoreT{color:var(--t)}
#midbox{padding:3px 12px 5px;text-align:center}
#timer{font-size:24px;font-weight:700;line-height:1.05;letter-spacing:1px;font-variant-numeric:tabular-nums}
#timer.bomb{color:#ff5340;animation:pulse .8s infinite}
#roundlbl{font-size:9px;letter-spacing:2.5px;color:#9b968a}
#alive{display:flex;gap:4px;justify-content:center;margin-top:3px}
#alive i{width:7px;height:7px;border-radius:50%;background:var(--t);opacity:1}
#alive i.dead{opacity:.18}
@keyframes pulse{50%{opacity:.5}}
#killfeed{position:absolute;top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.kf{display:flex;gap:9px;align-items:center;padding:4px 11px;font-size:14px;font-weight:600;letter-spacing:.5px;animation:kfin .18s ease-out}
.kf .a{color:var(--ct)} .kf .b{color:var(--t)} .kf .w{color:#8f8b80;font-size:11px;letter-spacing:1.5px}
.kf .hs{color:#ff5340;font-size:10px;border:1px solid #ff5340;padding:0 3px;line-height:14px}
.kf.byet .a{color:var(--t)} .kf.byet .b{color:var(--ct)}
@keyframes kfin{from{transform:translateX(14px);opacity:0}}
/* crosshair */
#crosshair{position:absolute;left:50%;top:50%;--gap:6px;--len:8px}
#crosshair i{position:absolute;background:#5ce08a;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#crosshair .v{width:2px;height:var(--len);left:-1px}
#crosshair .cht{top:calc(-1*var(--gap) - var(--len))}
#crosshair .chb{top:var(--gap)}
#crosshair .h{height:2px;width:var(--len);top:-1px}
#crosshair .chl{left:calc(-1*var(--gap) - var(--len))}
#crosshair .chr{left:var(--gap)}
#crosshair .dot{width:2px;height:2px;left:-1px;top:-1px}
#hitmarker{position:absolute;left:50%;top:50%;opacity:0}
#hitmarker i{position:absolute;width:2px;height:8px;background:#fff}
#hitmarker i:nth-child(1){transform:rotate(45deg);left:5px;top:5px}
#hitmarker i:nth-child(2){transform:rotate(-45deg);left:-7px;top:5px}
#hitmarker i:nth-child(3){transform:rotate(135deg);left:5px;top:-13px}
#hitmarker i:nth-child(4){transform:rotate(-135deg);left:-7px;top:-13px}
#hitmarker.kill i{background:#ff5340}
/* center messages */
#msg{position:absolute;top:24%;left:0;right:0;text-align:center;opacity:0;transition:opacity .25s}
#msg.show{opacity:1}
#msgtitle{font-size:38px;font-weight:700;letter-spacing:7px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
#msgsub{font-size:15px;letter-spacing:3px;color:#c4bfb2;margin-top:2px}
#msg.ct #msgtitle{color:var(--ct)} #msg.t #msgtitle{color:var(--t)} #msg.t #msgsub{color:#ff8d7d}
#interact{position:absolute;bottom:31%;left:0;right:0;text-align:center;display:none}
#interactlabel{font-size:15px;letter-spacing:3px;font-weight:600;margin-bottom:8px}
#interactbar{width:240px;height:6px;margin:0 auto;background:rgba(0,0,0,.55);border:1px solid var(--line)}
#interactbar i{display:block;height:100%;width:0;background:var(--accent)}
/* lower HUD */
#lowerleft{position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom))}
#money{font-size:19px;font-weight:700;color:var(--accent);letter-spacing:1px;padding:2px 12px;margin-bottom:6px;display:inline-block}
#health{display:flex;align-items:center;gap:10px;padding:7px 14px}
#hpnum{font-size:32px;font-weight:700;line-height:1;min-width:52px}
#hpbar{width:150px;height:8px;background:rgba(0,0,0,.5);border:1px solid var(--line)}
#hpbar i{display:block;height:100%;width:100%;background:#e9e5d9}
#health.low #hpnum{color:#eda456} #health.crit #hpnum{color:#ff5340}
#health.low #hpbar i{background:#eda456} #health.crit #hpbar i{background:#ff5340}
#lowerright{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));text-align:right}
#weaponname{font-size:12px;letter-spacing:3px;color:#9b968a;margin-bottom:2px}
#ammo{padding:6px 16px 8px}
#mag{font-size:34px;font-weight:700;line-height:1}
#mag.low{color:#ff5340}
#reserve{font-size:16px;color:#8f8b80;margin-left:6px}
#inventory{font-size:10px;letter-spacing:2px;color:#78736a;margin-top:5px}
#inventory b{color:#c4bfb2}
/* screen effects */
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(186,28,18,.6) 100%);opacity:0}
#flashwhite{position:absolute;inset:0;background:#fff;opacity:0}
/* ============ TOUCH UI ============ */
#touchui{position:fixed;inset:0;z-index:6;display:none}
body.touch.pregame #touchui{display:none}
body.touch #touchui{display:block}
#joyzone{position:absolute;left:0;top:0;bottom:0;width:44%}
#lookzone{position:absolute;right:0;top:0;bottom:0;width:56%}
#joybase{position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,13,16,.32);display:none;transform:translate(-50%,-50%)}
#joynub{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(233,229,217,.4);border:1px solid rgba(255,255,255,.35);display:none;transform:translate(-50%,-50%)}
.tbtn{position:absolute;border-radius:50%;background:rgba(10,13,16,.5);border:1px solid rgba(255,255,255,.16);color:var(--ink);
  font-family:inherit;font-weight:600;letter-spacing:1px;pointer-events:auto;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.tbtn:active,.tbtn.on{background:rgba(211,182,134,.35);border-color:var(--accent)}
#btnFire{right:calc(30px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom));width:96px;height:96px;font-size:16px}
#btnJump{right:calc(146px + env(safe-area-inset-right));bottom:calc(58px + env(safe-area-inset-bottom));width:66px;height:66px;font-size:12px}
#btnCrouch{right:calc(40px + env(safe-area-inset-right));bottom:calc(238px + env(safe-area-inset-bottom));width:66px;height:66px;font-size:12px}
#btnReload{right:calc(152px + env(safe-area-inset-right));bottom:calc(152px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:11px}
#btnWpn{right:calc(52px + env(safe-area-inset-right));bottom:calc(330px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:12px}
#btnUse{left:calc(26px + env(safe-area-inset-left));bottom:calc(230px + env(safe-area-inset-bottom));width:78px;height:78px;font-size:12px;display:none}
#fsbtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:7;display:none;
  padding:5px 12px;font-size:10px;letter-spacing:2px;background:var(--panel);border:1px solid var(--line);color:#9b968a;pointer-events:auto}
body.touch #fsbtn{display:block}
/* ============ OVERLAY ============ */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(9,10,12,.82);display:flex;align-items:center;justify-content:center;text-align:center}
#ovinner{max-width:560px;padding:30px 40px}
#ovEyebrow{font-size:11px;letter-spacing:6px;color:var(--accent);margin-bottom:10px}
#ovTitle{font-size:58px;font-weight:700;letter-spacing:10px;line-height:1;margin-bottom:14px}
#ovTitle.ct{color:var(--ct)} #ovTitle.t{color:var(--t)}
#ovRule{width:64px;height:2px;background:var(--accent);margin:0 auto 16px}
#ovBody{font-size:14px;letter-spacing:1.5px;color:#c4bfb2;line-height:2;margin-bottom:26px}
#ovBody b{color:var(--ink)}
#startBtn{pointer-events:auto;background:var(--accent);color:#15130e;border:none;font-family:inherit;
  font-size:17px;font-weight:700;letter-spacing:4px;padding:13px 46px;cursor:pointer}
#startBtn:active{transform:translateY(1px)}
@media (max-width:640px){#ovTitle{font-size:38px;letter-spacing:6px}#msgtitle{font-size:26px;letter-spacing:4px}}
</style>
</head>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* =====================================================================
   0. CONSTANTS, GLOBAL STATE, UTILITIES
   ===================================================================== */
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const SENS = 0.0021;                       // mouse look sensitivity (rad / px)
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const distXZ = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

const Game = { started: false, paused: false, time: 0, isTouch: IS_TOUCH };

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(),
      _v4 = new THREE.Vector3(), _tv1 = new THREE.Vector3(), _tv2 = new THREE.Vector3(),
      _tvY = new THREE.Vector3(0, 1, 0);

function angDiff(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return d; }
function approachAngle(a, b, step) { const d = angDiff(a, b); return a + clamp(d, -step, step); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* =====================================================================
   1. AUDIO ENGINE — everything synthesized with the Web Audio API
   ===================================================================== */
const AudioSys = {
  ctx: null, master: null, noise: null,
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  _out(pan) {
    const g = this.ctx.createGain(); g.gain.value = 1;
    if (this.ctx.createStereoPanner && pan) {
      const p = this.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
      g.connect(p); p.connect(this.master);
    } else g.connect(this.master);
    return g;
  },
  burst(o) { // filtered white-noise burst
    if (!this.ctx || (o.vol || 0) <= 0.01) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const src = this.ctx.createBufferSource(); src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter();
    f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.8;
    f.frequency.setValueAtTime(o.f0, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(40, o.f1), t + o.dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(o.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    src.connect(f); f.connect(g); g.connect(this._out(o.pan || 0));
    src.start(t, Math.random() * 0.8); src.stop(t + o.dur + 0.03);
  },
  tone(o) {
    if (!this.ctx || (o.vol || 0) <= 0.01) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const osc = this.ctx.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f0, t);
    if (o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), t + o.dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(o.vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
    osc.connect(g); g.connect(this._out(o.pan || 0));
    osc.start(t); osc.stop(t + o.dur + 0.03);
  },
  spatial(pos, base, maxDist = 60) { // distance attenuation + stereo pan relative to camera
    const d = camera.position.distanceTo(pos);
    const vol = base * Math.max(0, 1 - d / maxDist);
    _tv1.copy(pos).sub(camera.position); _tv1.y = 0;
    if (_tv1.lengthSq() > 0.001) _tv1.normalize(); else _tv1.set(0, 0, 1);
    _tv2.setFromMatrixColumn(camera.matrixWorld, 0); _tv2.y = 0; _tv2.normalize();
    return { vol, pan: clamp(_tv1.dot(_tv2) * 0.85, -0.9, 0.9) };
  },
  shot(vol = 1, pan = 0) {
    this.burst({ dur: 0.11, f0: 5200, f1: 600, vol: 0.85 * vol, pan });
    this.tone({ f0: 150, f1: 52, dur: 0.07, type: 'triangle', vol: 0.5 * vol, pan });
    this.burst({ dur: 0.3, f0: 700, f1: 170, vol: 0.16 * vol, pan, delay: 0.035 });
  },
  footstep(vol = 0.4, pan = 0) {
    this.burst({ dur: 0.075, f0: 320 + Math.random() * 180, vol: 0.5 * vol, pan });
    this.burst({ dur: 0.02, type: 'highpass', f0: 1500, vol: 0.1 * vol, pan });
  },
  land(vol = 0.5) { this.burst({ dur: 0.09, f0: 240, vol: 0.7 * vol }); this.tone({ f0: 95, f1: 45, dur: 0.08, type: 'triangle', vol: 0.35 }); },
  beep(f, dur, vol, pan) { this.tone({ f0: f, dur, vol, pan }); },
  hit() { this.tone({ f0: 2100, dur: 0.025, type: 'square', vol: 0.14 }); },
  kill() { this.tone({ f0: 990, dur: 0.06, vol: 0.2 }); this.tone({ f0: 1480, dur: 0.09, vol: 0.2, delay: 0.07 }); },
  hurt() { this.tone({ f0: 190, f1: 85, dur: 0.12, type: 'triangle', vol: 0.4 }); this.burst({ dur: 0.06, f0: 500, vol: 0.2 }); },
  dry() { this.tone({ f0: 1100, dur: 0.02, type: 'square', vol: 0.14 }); this.tone({ f0: 700, dur: 0.03, type: 'square', vol: 0.1, delay: 0.05 }); },
  reload(stage) {
    if (stage === 0) this.burst({ dur: 0.04, f0: 900, vol: 0.22 });
    if (stage === 1) { this.tone({ f0: 520, dur: 0.04, type: 'square', vol: 0.16 }); this.burst({ dur: 0.05, f0: 1200, vol: 0.14 }); }
    if (stage === 2) this.tone({ f0: 760, dur: 0.04, type: 'square', vol: 0.16 });
    if (stage === 3) { this.burst({ dur: 0.05, f0: 1600, vol: 0.25 }); this.tone({ f0: 1250, dur: 0.03, type: 'square', vol: 0.12 }); }
  },
  whoosh() { this.burst({ dur: 0.16, type: 'bandpass', f0: 350, f1: 2400, vol: 0.28, q: 1.5 }); },
  click(f) { this.tone({ f0: f, dur: 0.03, type: 'square', vol: 0.1 }); },
  roundStart() { this.tone({ f0: 620, dur: 0.09, vol: 0.22 }); this.tone({ f0: 930, dur: 0.12, vol: 0.22, delay: 0.12 }); },
  win() { [523, 659, 784].forEach((f, i) => this.tone({ f0: f, dur: 0.14, vol: 0.22, delay: i * 0.13 })); },
  lose() { [330, 262, 196].forEach((f, i) => this.tone({ f0: f, dur: 0.16, vol: 0.22, delay: i * 0.14 })); },
  explosion(vol = 1) {
    this.burst({ dur: 1.3, f0: 2800, f1: 85, vol: 1.1 * vol });
    this.tone({ f0: 52, f1: 26, dur: 0.9, vol: 0.9 * vol });
    this.burst({ dur: 0.3, f0: 500, f1: 110, vol: 0.5 * vol, delay: 0.05 });
  }
};

/* =====================================================================
   2. RENDERER, SCENE, LIGHTING, POST-PROCESSING
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
 $('game').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdccdb0, 95, 300);
const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
camera.position.set(0, 1.6, 30);
scene.add(camera);

// soft daylight: warm sun + hemisphere bounce
const sun = new THREE.DirectionalLight(0xfff0d6, 3.1);
sun.position.set(46, 58, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -52; sun.shadow.camera.right = 52;
sun.shadow.camera.top = 52; sun.shadow.camera.bottom = -52;
sun.shadow.camera.near = 8; sun.shadow.camera.far = 180;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd7f2, 0xcbb489, 0.55));

// procedural sky dome with a hot sun disc (drives the bloom)
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: new THREE.Vector3(46, 58, 24).normalize() } },
  vertexShader: 'varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: `varying vec3 vD; uniform vec3 sunDir;
    void main(){

/* =====================================================================
   5. PHYSICS & COLLISION — AABB world, slab raycasts, axis slide + step
   ===================================================================== */
let _hitAxis = 1, _hitSign = 1;
function rayBox(ox, oy, oz, dx, dy, dz, c) { // slab test, returns entry t (>=0) or -1
  let tmin = 0, tmax = 1e9, axis = -1;
  if (dx > -1e-9 && dx < 1e-9) { if (ox < c.x0 || ox > c.x1) return -1; }
  else {
    const inv = 1 / dx; let t1 = (c.x0 - ox) * inv, t2 = (c.x1 - ox) * inv;
    if (t1 > t2) { const s = t1; t1 = t2; t2 = s; }
    if (t1 > tmin) { tmin = t1; axis = 0; } if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return -1;
  }
  if (dy > -1e-9 && dy < 1e-9) { if (oy < c.y0 || oy > c.y1) return -1; }
  else {
    const inv = 1 / dy; let t1 = (c.y0 - oy) * inv, t2 = (c.y1 - oy) * inv;
    if (t1 > t2) { const s = t1; t1 = t2; t2 = s; }
    if (t1 > tmin) { tmin = t1; axis = 1; } if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return -1;
  }
  if (dz > -1e-9 && dz < 1e-9) { if (oz < c.z0 || oz > c.z1) return -1; }
  else {
    const inv = 1 / dz; let t1 = (c.z0 - oz) * inv, t2 = (c.z1 - oz) * inv;
    if (t1 > t2) { const s = t1; t1 = t2; t2 = s; }
    if (t1 > tmin) { tmin = t1; axis = 2; } if (t2 < tmax) tmax = t2;
    if (tmin > tmax) return -1;
  }
  if (tmax < 0) return -1;
  if (axis >= 0) { _hitAxis = axis; _hitSign = (axis === 0 ? dx : axis === 1 ? dy : dz) > 0 ? -1 : 1; }
  else { _hitAxis = 1; _hitSign = 1; }
  return tmin > 0 ? tmin : 0;
}
function raycastWorld(origin, dir, maxDist) {
  let bestT = maxDist, hit = false, nAxis = -1, nSign = 1;
  if (dir.y < -1e-6) {
    const t = -origin.y / dir.y;
    if (t > 0 && t < bestT) { bestT = t; hit = true; nAxis = 1; nSign = 1; }
  }
  for (const c of COLLIDERS) {
    const t = rayBox(origin.x, origin.y, origin.z, dir.x, dir.y, dir.z, c);
    if (t >= 0 && t < bestT) { bestT = t; hit = true; nAxis = _hitAxis; nSign = _hitSign; }
  }
  const point = origin.clone().addScaledVector(dir, bestT);
  const normal = new THREE.Vector3();
  if (nAxis >= 0) normal.setComponent(nAxis, nSign);
  return { hit, t: bestT, point, normal };
}
function losBlocked(ax, ay, az, bx, by, bz) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
  if (dist < 0.6) return false;
  const ix = dx / dist, iy = dy / dist, iz = dz / dist;
  for (const c of COLLIDERS) {
    const t = rayBox(ax, ay, az, ix, iy, iz, c);
    if (t >= 0 && t < dist - 0.25) return true;
  }
  return false;
}
function raySphere(o, d, cx, cy, cz, r) {
  const lx = cx - o.x, ly = cy - o.y, lz = cz - o.z;
  const tc = lx * d.x + ly * d.y + lz * d.z;
  if (tc < 0) return -1;
  const d2 = lx * lx + ly * ly + lz * lz - tc * tc, r2 = r * r;
  if (d2 > r2) return -1;
  return tc - Math.sqrt(r2 - d2);
}
function tryStep(pos, r, h, c) { // step onto low ledges (platforms) while grounded
  if (!player.grounded) return false;
  const rise = c.y1 - pos.y;
  if (rise > 0.7 || rise <= 0.001) return false;
  const ny = c.y1 + 0.002;
  for (const o of COLLIDERS) {
    if (o === c) continue;
    if (pos.x + r <= o.x0 || pos.x - r >= o.x1 || pos.z + r <= o.z0 || pos.z - r >= o.z1) continue;
    if (ny < o.y1 && ny + h > o.y0) return false;
  }
  pos.y = ny; return true;
}
function moveXZ(pos, r, h, dx, dz, step) { // per-axis slide resolution
  pos.x += dx;
  for (const c of COLLIDERS) {
    if (pos.x + r <= c.x0 || pos.x - r >= c.x1 || pos.z + r <= c.z0 || pos.z - r >= c.z1) continue;
    if (pos.y >= c.y1 || pos.y + h <= c.y0) continue;
    if (step && tryStep(pos, r, h, c)) continue;
    pos.x = (pos.x < (c.x0 + c.x1) / 2) ? c.x0 - r - 0.001 : c.x1 + r + 0.001;
  }
  pos.z += dz;
  for (const c of COLLIDERS) {
    if (pos.x + r <= c.x0 || pos.x - r >= c.x1 || pos.z + r <= c.z0 || pos.z - r >= c.z1) continue;
    if (pos.y >= c.y1 || pos.y + h <= c.y0) continue;
    if (step && tryStep(pos, r, h, c)) continue;
    pos.z = (pos.z < (c.z0 + c.z1) / 2) ? c.z0 - r - 0.001 : c.z1 + r + 0.001;
  }
}

class ParticleSystem {
  constructor(cap) {

const player = {
  pos: new THREE.Vector3(0, 0, 30.5), vel: new THREE.Vector3(),
  yaw: 0, pitch: 0, radius: 0.34,
  hp: 100, alive: true, grounded: true,
  crouchAmt: 0, money: 800, kills: 0,
  stepAcc: 0, bobT: 0, bobAmp: 0, deathT: 0, shake: 0, hurt: 0,
  recoil: { p: 0, y: 0 },
  height() { return 1.8 - 0.62 * this.crouchAmt; },
  eyeH() { return 1.62 - 0.55 * this.crouchAmt; },
  reset() {
    this.pos.set(0, 0, 30.5); this.vel.set(0, 0, 0);
    this.yaw = 0; this.pitch = 0;
    this.hp = 100; this.alive = true; this.crouchAmt = 0;
    this.recoil.p = this.recoil.y = 0;
    this.deathT = 0; this.hurt = 0; this.shake = 0;
    Weapons.reset();
    UI.hp(); UI.ammo(); UI.money();
  },
  standBlocked() {
    const p = this.pos, r = this.radius;
    for (const c of COLLIDERS) {
      if (p.x + r <= c.x0 || p.x - r >= c.x1 || p.z + r <= c.z0 || p.z - r >= c.z1) continue;
      if (c.y1 <= p.y + 1.25 || c.y0 >= p.y + 1.82) continue;
      return true;
    }
    return false;
  },
  update(dt) {
    const frozen = Round.state === 'freeze' || Round.state === 'over' || Round.state === 'match' || !this.alive;
    // look
    const [ldx, ldy] = Input.consumeLook();
    if (this.alive) {
      this.yaw -= ldx * SENS;
      this.pitch = clamp(this.pitch - ldy * SENS, -1.45, 1.45);
    }
    // crouch (camera height scales down)
    const wantC = Input.crouch();
    if (wantC) this.crouchAmt = Math.min(1, this.crouchAmt + dt * 7);
    else if (!this.standBlocked()) this.crouchAmt = Math.max(0, this.crouchAmt - dt * 7);
    // wish velocity
    let mf = 0, ms = 0;
    if (!frozen) { mf = Input.moveF(); ms = Input.moveS(); }
    const fx = -Math.sin(this.yaw), fz = -Math.cos(this.yaw);
    const rx = Math.cos(this.yaw), rz = -Math.sin(this.yaw);
    let wx = fx * mf + rx * ms, wz = fz * mf + rz * ms;
    const wl = Math.hypot(wx, wz);
    if (wl > 1) { wx /= wl; wz /= wl; }
    const crouched = this.crouchAmt > 0.5;
    const spd = crouched ? 2.4 : (Input.walk() ? 2.6 : 4.8);
    const k = 1 - Math.exp(-(this.grounded ? 11 : 1.8) * dt);
    this.vel.x += (wx * spd - this.vel.x) * k;
    this.vel.z += (wz * spd - this.vel.z) * k;
    if (!frozen && Input.jumpQ && this.grounded) { this.vel.y = 6.6; this.grounded = false; }
    Input.jumpQ = false;
    this.vel.y = Math.max(-28, this.vel.y - 17.5 * dt);
    // vertical integrate + resolve
    const fallV = this.vel.y;
    this.pos.y += this.vel.y * dt;
    let grounded = false;
    if (this.pos.y <= 0) {
      if (this.vel.y < -7) { AudioSys.land(0.5); this.shake = Math.max(this.shake, 0.16); }
      this.pos.y = 0; this.vel.y = 0; grounded = true;
    }
    const r = this.radius, h = this.height();
    for (const c of COLLIDERS) {
      if (this.pos.x + r <= c.x0 || this.pos.x - r >= c.x1 || this.pos.z + r <= c.z0 || this.pos.z - r >= c.z1) continue;
      if (this.pos.y >= c.y1 || this.pos.y + h <= c.y0) continue;
      if (this.vel.y <= 0 && this.pos.y > c.y1 - 1.25) {
        if (this.vel.y < -7) AudioSys.land(0.4);
        this.pos.y = c.y1; this.vel.y = 0; grounded = true;
      } else if (this.vel.y > 0) {
        this.pos.y = c.y0 - h - 0.001; this.vel.y = 0;
      }
    }
    moveXZ(this.pos, r, h, this.vel.x * dt, this.vel.z * dt, true);
    this.grounded = grounded;
    // bobbing + footsteps
    const hs = Math.hypot(this.vel.x, this.vel.z);
    this.bobT += hs * dt * 1.75;
    const targetAmp = this.grounded ? Math.min(1, hs / 4.8) : 0;
    this.bobAmp += (targetAmp - this.bobAmp) * Math.min(1, dt * 8);
    if (this.grounded && hs > 2.3 && !crouched && !Input.walk()) {
      this.stepAcc += hs * dt;
      if (this.stepAcc > 2.5) { this.stepAcc = 0; AudioSys.footstep(0.4, 0); }
    }
    // death handling
    if (!this.alive) {
      this.deathT += dt;
      if (this.deathT > 1.6 && Round.state !== 'over' && Round.state !== 'match' && !Round.bomb.planted)
        Round.end('t', 'YOU WERE ELIMINATED');
    }
    // recoil recovery + decay
    if (Game.time - Weapons.lastShotT > 0.13) {
      const rk = Math.exp(-6.5 * dt);
      this.recoil.p *= rk; this.recoil.y *= rk;
    }
    this.hurt = Math.max(0, this.hurt - dt * 1.3);
    this.shake = Math.max(0, this.shake - dt * 0.55);
    // camera
    const eh = this.eyeH();
    let cy = this.pos.y + eh;
    if (!this.alive) cy = this.pos.y + Math.max(0.35, eh - this.deathT * 2.4);
    camera.position.set(this.pos.x, cy, this.pos.z);
    const sh = this.shake;
    camera.rotation.set(
      this.pitch + this.recoil.p + (Math.random() - 0.5) * sh * 0.06,
      this.yaw + this.recoil.y + (Math.random() - 0.5) * sh * 0.06,
      (this.alive ? -ms * 0.012 * this.bobAmp : 0.55 * Math.min(1, this.deathT * 2)) + (Math.random() - 0.5) * sh * 0.02
    );
  },
  takeDamage(d, from) {
    if (!this.alive || Round.state === 'over' || Round.state === 'match') return;
    this.hp -= d;
    this.hurt = Math.min(1, this.hurt + d / 45);
    this.shake = Math.max(this.shake, 0.12);
    AudioSys.hurt();
    if (this.hp <= 0) {
      this.hp = 0; this.alive = false; this.deathT = 0;
      AudioSys.lose();
      if (from) UI.feed(from.name, 'AK-47', 'YOU', false, false);
    }
    UI.hp();
  }
};

  const light = new THREE.PointLight(0xff2418, 0, 7, 2);
  light.position.set(0, 0.4, 0); g.add(light);
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  g.visible = false;
  scene.add(g);
  return { group: g, light, lamp };
}
const bombMesh = buildBomb();

function updateAliveDots() {
  const dots = document.querySelectorAll('#alive i');
  bots.forEach((b, i) => dots[i] && dots[i].classList.toggle('dead', !b.alive));
}
function checkElimination() {
  if (bots.every(b => !b.alive)) {
    if (Round.bomb.planted) UI.msg('SITE CLEAR', 'DEFUSE THE BOMB', 3, 'ct');
    else Round.end('ct', 'ENEMY TEAM ELIMINATED');
  }
}
const Round = {
  state: 'idle', num: 0, ct: 0, t: 0,
  timer: 115, freezeT: 0, overT: 0,
  beepT: 0, defuseTick: 0,
  bomb: { planted: false, bomber: null, pos: new THREE.Vector3(), timer: 0, defuse: 0 },
  startMatch() {
    this.num = 0; this.ct = 0; this.t = 0;
    player.money = 800; player.kills = 0;
    this.begin();
  },
  begin() {
    this.num++;
    this.state = 'freeze'; this.freezeT = 3; this.timer = 115;
    const b = this.bomb;
    b.planted = false; b.bomber = null; b.timer = 0; b.defuse = 0;
    bombMesh.group.visible = false; bombMesh.light.intensity = 0;
    player.reset();
    const routes = shuffle([ROUTE_LONG, ROUTE_MID, ROUTE_TUN]);
    bots.forEach((bt, i) => bt.reset(BOT_SPAWNS[i], routes[i], 0.4 + i * 0.7 + Math.random() * 0.6));
    updateAliveDots();
    UI.score(); UI.msg('ROUND ' + this.num, 'DEFEND SITE A — STOP THE PLANT', 2.6);
    AudioSys.roundStart();
    document.body.classList.remove('pregame');
  },
  plant(pos) {
    const b = this.bomb;
    b.planted = true; b.bomber = null;
    b.pos.set(clamp(pos.x, SITE.x - 4, SITE.x + 4), 0, clamp(pos.z, SITE.z - 4, SITE.z + 4));
    b.timer = 45; b.defuse = 0; this.beepT = 0;
    this.state = 'planted';
    bombMesh.group.position.copy(b.pos);
    bombMesh.group.visible = true;
    UI.msg('THE BOMB HAS BEEN PLANTED', '45 SECONDS TO DETONATION', 3, 't');
    AudioSys.beep(880, 0.2, 0.3);
  },
  explode() {
    const p = this.bomb.pos;
    explosionFX(p);
    AudioSys.explosion(1);
    UI.flash(0.9);
    player.shake = Math.max(player.shake, clamp(1.6 - distXZ(player.pos, p) / 12, 0.3, 1.4));
    if (player.alive && distXZ(player.pos, p) < 16) player.takeDamage(500, null);
    for (const b of bots) if (b.alive && distXZ(b.pos, p) < 14) b.die(false, false);
    bombMesh.group.visible = false; bombMesh.light.intensity = 0;
    this.bomb.planted = false; // consumed
    this.end('t', 'TARGET DESTROYED', true);
    this.bomb.planted = true;  // keep flag semantics for the rest of the round
  },
  end(winner, reason, silentMsg) {
    if (this.state === 'over' || this.state === 'match') return;
    this.state = 'over'; this.overT = 4.6;
    if (winner === 'ct') {
      this.ct++;
      player.money = Math.min(16000, player.money + 3250);
      AudioSys.win();
      if (!silentMsg) UI.msg('COUNTER-TERRORISTS WIN', reason, 4.4, 'ct');
    } else {
      this.t++;
      player.money = Math.min(16000, player.money + 1400);
      AudioSys.lose();
      if (!silentMsg) UI.msg('TERRORISTS WIN', reason, 4.4, 't');
    }
    UI.score(); UI.money();
    if (this.ct >= 8 || this.t >= 8) {
      this.state = 'match';
      setTimeout(() => Overlay.show('match'), 1800);
    }
  },
  update(dt) {
    switch (this.state) {
      case 'freeze':
        this.freezeT -= dt;
        if (this.freezeT <= 0) this.state = 'live';
        break;
      case 'live':
        this.timer -= dt;
        if (this.timer <= 0) this.end('ct', 'TIME EXPIRED — SITE HELD');
        break;
      case 'planted': {
        const b = this.bomb;
        b.timer -= dt;
        this.beepT -= dt;
        const iv = Math.max(0.1, (b.timer / 45) * 0.85);
        if (this.beepT <= 0) {
          this.beepT = iv;
          const s = AudioSys.spatial(b.pos, 0.55, 80);
          AudioSys.beep(1160, 0.055, Math.max(0.1, s.vol), s.pan);
          bombMesh.light.intensity = 3;
        }
        bombMesh.light.intensity *= Math.pow(0.02, dt);
        bombMesh.lamp.material.emissiveIntensity = 2 + bombMesh.light.intensity * 2;
        if (b.timer <= 0) { this.explode(); break; }
        // defusing
        const near = player.alive && distXZ(player.pos, b.pos) < 2.3;
        UI.interact(near, b.defuse / 5);
        if (IS_TOUCH) $('btnUse').style.display = this.bomb.planted && Round.state === 'planted' ? 'flex' : 'none';
        if (near && Input.use) {
          b.defuse += dt;
          this.defuseTick -= dt;
          if (this.defuseTick <= 0) { this.defuseTick = 0.45; AudioSys.beep(1600, 0.03, 0.14); }
          if (b.defuse >= 5) this.end('ct', 'BOMB DEFUSED');
        } else b.defuse = 0;
        break;
      }
      case 'over':
        this.overT -= dt;
        if (this.overT <= 0) this.begin();
        break;
    }
    if (this.state !== 'planted') {
      UI.interact(false, 0);
      if (IS_TOUCH) $('btnUse').style.display = 'none';
    }
  }
};

/* =====================================================================
   12. UI MANAGER
   ===================================================================== */
const UI = {
  els: {}, last: {}, msgT: 0, hmT: 0, flashT: 0,
  init() {
    ['topbar', 'scoreCT', 'scoreT', 'timer', 'roundlbl', 'killfeed', 'crosshair', 'hitmarker',
     'msg', 'msgtitle', 'msgsub', 'interact', 'interactlabel', 'interactbar', 'money', 'health',
     'hpnum', 'hpbarfill', 'weaponname', 'mag', 'reserve', 'vignette', 'flashwhite']
      .forEach(id => this.els[id] = $(id));
    this.bar = this.els.interactbar.firstElementChild;
  },
  text(id, v) { if (this.last[id] === v) return; this.last[id] = v; this.els[id].textContent = v; },
  hp() {
    this.text('hpnum', String(Math.ceil(player.hp)));
    this.els.hpbarfill.style.width = Math.max(0, player.hp) + '%';
    this.els.health.className = 'plate ' + (player.hp <= 25 ? 'crit' : player.hp <= 50 ? 'low' : '');
  },
  ammo() {
    this.text('mag', String(Weapons.mag));
    this.text('reserve', '/ ' + Weapons.reserve);
    this.els.mag.className = Weapons.mag <= 5 ? 'low' : '';
  },
  weaponName() { this.text('weaponname', WEAPONS[Weapons.current].name); },
  money() { this.text('money', '$ ' + player.money); },
  score() {
    this.text('scoreCT', String(this === UI ? Round.ct : 0));
    this.els.scoreCT.textContent = Round.ct;
    this.els.scoreT.textContent = Round.t;
    this.text('roundlbl', 'ROUND ' + Round.num);
  },
  msg(title, sub, dur = 2.5, cls = '') {
    this.els.msgtitle.textContent = title;
    this.els.msgsub.textContent = sub;
    this.els.msg.className = 'show ' + cls;
    this.msgT = dur;
  },
  hitmarker(kill) {
    this.hmT = 0.18;
    this.els.hitmarker.className = kill ? 'kill' : '';
    this.els.hitmarker.style.opacity = 1;
  },
  feed(a, wpn, b, hs, playerKill) {
    const div = document.createElement('div');
    div.className = 'kf plate' + (playerKill ? '' : ' byet');
    div.innerHTML = `<span class="a">${a}</span><span class="w">${wpn}</span>${hs ? '<span class="hs">HS</span>' : ''}<span class="b">${b}</span>`;
    this.els.killfeed.prepend(div);
    while (this.els.killfeed.children.length > 4) this.els.killfeed.lastChild.remove();
    setTimeout(() => div.remove(), 5200);
  },
  interact(show, frac) {
    this.els.interact.style.display = show ? 'block' : 'none';
    if (show) {
      this.els.interactlabel.textContent = frac > 0
        ? 'DEFUSING…' : (IS_TOUCH ? 'HOLD DEFUSE BUTTON' : 'HOLD [E] TO DEFUSE');
      this.bar.style.width = Math.min(100, frac * 100) + '%';
    }
  },
  flash(v) { this.flashT = v; },
  frame(dt) {
    // timer
    let t = Round.timer, bomb = false;
    if (Round.state === 'freeze') t = Math.max(0, Round.freezeT);
    if (Round.state === 'planted') { t = Math.max(0, Round.bomb.timer); bomb = true; }
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    this.text('timer', m + ':' + String(s).padStart(2, '0'));
    this.els.timer.className = bomb ? 'bomb' : '';
    // crosshair spread
    const gap = clamp(4 + Weapons.computeSpread() * 2600, 4, 70);
    this.els.crosshair.style.setProperty('--gap', gap.toFixed(1) + 'px');
    this.els.crosshair.style.opacity = player.alive ? 1 : 0;
    // hitmarker fade
    if (this.hmT > 0) {
      this.hmT -= dt;
      if (this.hmT <= 0) this.els.hitmarker.style.opacity = 0;
    }
    // message fade
    if (this.msgT > 0) {
      this.msgT -= dt;
      if (this.msgT <= 0) this.els.msg.className = '';
    }
    // vignette
    this.els.vignette.style.opacity = clamp(player.hurt + (player.alive && player.hp < 30 ? 0.28 : 0), 0, 1).toFixed(3);
    // explosion flash
    if (this.flashT > 0) {
      this.flashT -= dt * 1.6;
      this.els.flashwhite.style.opacity = Math.max(0, this.flashT).toFixed(3);
    }
  }
};
UI.init();

/* =====================================================================
   13. INPUT HANDLER — keyboard / mouse / multi-touch
   ===================================================================== */
const Input = {
  keys: Object.create(null),
  lookDX: 0, lookDY: 0,
  fire: false, fireEdge: false, use: false, jumpQ: false,
  joyId: -1, joyOX: 0, joyOY: 0, joyX: 0, joyY: 0,
  lookId: -1, lookLX: 0, lookLY: 0,
  tCrouch: false,
  crouch() { return !!this.keys['ControlLeft'] || !!this.keys['KeyC'] || this.tCrouch; },
  walk() { return !!this.keys['ShiftLeft']; },
  moveF() {
    let f = (this.keys['KeyW'] ? 1 : 0) - (this.keys['KeyS'] ? 1 : 0);
    if (this.joyId !== -1) f += -this.joyY;
    return clamp(f, -1, 1);
  },
  moveS() {
    let s = (this.keys['KeyD'] ? 1 : 0) - (this.keys['KeyA'] ? 1 : 0);
    if (this.joyId !== -1) s += this.joyX;
    return clamp(s, -1, 1);
  },
  consumeLook() {
    const r = [this.lookDX, this.lookDY];
    this.lookDX = 0; this.lookDY = 0;
    return r;
  }
};
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Tab') e.preventDefault();
  if (e.repeat) return;
  Input.keys[e.code] = true;
  if (!Game.started || Game.paused) return;
  if (e.code === 'Space') Input.jumpQ = true;
  if (e.code === 'KeyR') Weapons.tryReload();
  if (e.code === 'Digit1') Weapons.switchTo('rifle');
  if (e.code === 'Digit2') Weapons.switchTo('knife');
});
addEventListener('keyup', e => { Input.keys[e.code] = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (document.pointerLockElement === renderer.domElement) {
    Input.lookDX += e.movementX;
    Input.lookDY += e.movementY;
  }
});
renderer.domElement.addEventListener('mousedown', e => {
  if (!Game.started || IS_TOUCH) return;
  if (document.pointerLockElement !== renderer.domElement) {
    try { renderer.domElement.requestPointerLock(); } catch (_) { }
    return;
  }
  if (e.button === 0) { Input.fire = true; Input.fireEdge = true; }
});
addEventListener('mouseup', e => { if (e.button === 0) Input.fire = false; });
document.addEventListener('pointerlockchange', () => {
  if (!IS_TOUCH && Game.started && document.pointerLockElement !== renderer.domElement && Round.state !== 'match') {
    Game.paused = true;
    Overlay.show('pause');
  } else if (document.pointerLockElement === renderer.domElement) {
    Game.paused = false;
    $('overlay').style.display = 'none';
  }
});
// ---- touch (iPad) ----
if (IS_TOUCH) document.body.classList.add('touch');
function bindHold(id, down, up) {
  const el = $(id);
  const on = e => { e.preventDefault(); e.stopPropagation(); down(); };
  const off = e => { e.preventDefault(); e.stopPropagation(); if (up) up(); };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
}
if (IS_TOUCH) {
  const joyzone = $('joyzone'), lookzone = $('lookzone'), base = $('joybase'), nub = $('joynub');
  joyzone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (Input.joyId !== -1) return;
    const t = e.changedTouches[0];
    Input.joyId = t.identifier;
    Input.joyOX = t.clientX; Input.joyOY = t.clientY;
    Input.joyX = 0; Input.joyY = 0;
    base.style.display = nub.style.display = 'block';
    base.style.left = nub.style.left = Input.joyOX + 'px';
    base.style.top = nub.style.top = Input.joyOY + 'px';
  }, { passive: false });
  lookzone.addEventListener('touchstart', e => {
    e.preventDefault();
    if (Input.lookId !== -1) return;
    const t = e.changedTouches[0];
    Input.lookId = t.identifier;
    Input.lookLX = t.clientX; Input.lookLY = t.clientY;
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === Input.joyId) {
        let dx = t.clientX - Input.joyOX, dy = t.clientY - Input.joyOY;
        const len = Math.hypot(dx, dy);
        if (len > 55) { dx = dx / len * 55; dy = dy / len * 55; }
        Input.joyX = dx / 55; Input.joyY = dy / 55;
        nub.style.left = (Input.joyOX + dx) + 'px';
        nub.style.top = (Input.joyOY + dy) + 'px';
      } else if (t.identifier === Input.lookId) {
        Input.lookDX += (t.clientX - Input.lookLX) * 2.0;
        Input.lookDY += (t.clientY - Input.lookLY) * 2.0;
        Input.lookLX = t.clientX; Input.lookLY = t.clientY;
      }
    }
    e.preventDefault();
  }, { passive: false });
  const endTouch = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === Input.joyId) {
        Input.joyId = -1; Input.joyX = 0; Input.joyY = 0;
        base.style.display = nub.style.display = 'none';
      }
      if (t.identifier === Input.lookId) Input.lookId = -1;
    }
  };
  document.addEventListener('touchend', endTouch);
  document.addEventListener('touchcancel', endTouch);
  bindHold('btnFire', () => { Input.fire = true; Input.fireEdge = true; }, () => { Input.fire = false; });
  bindHold('btnJump', () => { Input.jumpQ = true; });
  bindHold('btnCrouch', () => {
    Input.tCrouch = !Input.tCrouch;
    $('btnCrouch').classList.toggle('on', Input.tCrouch);
  });
  bindHold('btnReload', () => Weapons.tryReload());
  bindHold('btnWpn', () => Weapons.switchTo(Weapons.current === 'rifle' ? 'knife' : 'rifle'));
  bindHold('btnUse', () => { Input.use = true; }, () => { Input.use = false; });
  $('fsbtn').addEventListener('touchstart', e => {
    e.preventDefault(); e.stopPropagation();
    try { document.documentElement.requestFullscreen(); } catch (_) { }
  }, { passive: false });
}

/* =====================================================================
   14. OVERLAY / BOOT / MAIN LOOP
   ===================================================================== */
const Overlay = {
  show(type) {
    const ov = $('overlay'), eb = $('ovEyebrow'), ti = $('ovTitle'), bo = $('ovBody'), btn = $('startBtn');
    ti.className = '';
    if (type === 'start') {
      eb.textContent = 'BOMB DEFUSAL · TACTICAL PROTOTYPE';
      ti.textContent = 'DUST PROTOCOL';
      bo.innerHTML = IS_TOUCH
        ? 'LEFT THUMB — <b>MOVE</b> · RIGHT THUMB — <b>AIM</b><br>BUTTONS — <b>FIRE / JUMP / CROUCH / RELOAD / DEFUSE</b><br>STOP THE BOTS FROM PLANTING AT SITE A. FIRST TO 8 ROUNDS WINS.'
        : '<b>WASD</b> MOVE · <b>SPACE</b> JUMP · <b>C</b> CROUCH · <b>SHIFT</b> WALK<br><b>MOUSE</b> AIM + FIRE · <b>R</b> RELOAD · <b>1 / 2</b> WEAPONS · <b>E</b> DEFUSE<br>STOP THE BOTS FROM PLANTING AT SITE A. FIRST TO 8 ROUNDS WINS.';
      btn.textContent = 'DEPLOY';
    } else if (type === 'pause') {
      eb.textContent = 'PAUSED';
      ti.textContent = 'STAND BY';
      bo.innerHTML = 'YOUR CURSOR IS UNLOCKED.<br>CLICK <b>RESUME</b> TO RE-ENGAGE.';
      btn.textContent = 'RESUME';
    } else {
      eb.textContent = 'MATCH OVER';
      const won = Round.ct > Round.t;
      ti.textContent = won ? 'VICTORY' : 'DEFEAT';
      ti.className = won ? 'ct' : 't';
      bo.innerHTML = `FINAL SCORE <b>${Round.ct} — ${Round.t}</b><br>KILLS <b>${player.kills}</b> · EARNINGS <b>$ ${player.money}</b>`;
      btn.textContent = 'PLAY AGAIN';
    }
    ov.style.display = 'flex';
  },
  hide() { $('overlay').style.display = 'none'; }
};
 $('startBtn').addEventListener('click', () => {
  AudioSys.init();
  AudioSys.resume();
  if (!Game.started) {
    Game.started = true;
    Round.startMatch();
    Overlay.hide();
  } else if (Round.state === 'match') {
    Round.startMatch();
    Overlay.hide();
  } else {
    Game.paused = false;
    Overlay.hide();
  }
  if (!IS_TOUCH) {
    try { renderer.domElement.requestPointerLock(); } catch (_) { }
  }
});
Overlay.show('start');

let lastT = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.001;
  if (!Game.started) { // menu: slow orbit over the map
    Game.time += dt;
    const a = Game.time * 0.07;
    camera.position.set(Math.cos(a) * 33, 19, Math.sin(a) * 33);
    camera.lookAt(-6, 0, 0);
    Effects.update(dt);
    composer.render();
    return;
  }
  if (Game.paused) { composer.render(); return; }
  Game.time += dt;
  player.update(dt);
  Weapons.update(dt);
  for (const b of bots) b.update(dt);
  Round.update(dt);
  Effects.update(dt);
  UI.frame(dt);
  composer.render();
}
requestAnimationFrame(tick);
</script>
