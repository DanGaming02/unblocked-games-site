<script type="module">
import* as THREE from'three';

/* ====== AUDIO ====== */
var AC=window.AudioContext||window.webkitAudioContext,actx;
function ea(){if(!actx)actx=new AC()}
function mkN(dur,dec){ea();var b=actx.createBuffer(1,actx.sampleRate*dur,actx.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*dec));return b}
function sShot(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.09,.012);var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;var g=actx.createGain();g.gain.value=.18;s.connect(f).connect(g).connect(actx.destination);s.start(t);var o=actx.createOscillator();o.frequency.value=75;o.type='sine';var g2=actx.createGain();g2.gain.setValueAtTime(.25,t);g2.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g2).connect(actx.destination);o.start(t);o.stop(t+.07)}
function sPistol(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.06,.015);var f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=800;var g=actx.createGain();g.gain.value=.15;s.connect(f).connect(g).connect(actx.destination);s.start(t);var o=actx.createOscillator();o.frequency.value=120;o.type='sine';var g2=actx.createGain();g2.gain.setValueAtTime(.2,t);g2.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g2).connect(actx.destination);o.start(t);o.stop(t+.04)}
function sKnife(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.03,.005);var f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=2000;var g=actx.createGain();g.gain.value=.1;s.connect(f).connect(g).connect(actx.destination);s.start(t)}
function sHit(){ea();var t=actx.currentTime,o=actx.createOscillator();o.frequency.value=950;o.type='sine';var g=actx.createGain();g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.07)}
function sHS(){ea();var t=actx.currentTime;[1250,1700].forEach(function(fr){var o=actx.createOscillator();o.frequency.value=fr;o.type='sine';var g=actx.createGain();g.gain.setValueAtTime(.13,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.1)})}
function sReload(){ea();var t=actx.currentTime;[0,.25,.55].forEach(function(d){var s=actx.createBufferSource();s.buffer=mkN(.04,.008);var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=800+d*600;var g=actx.createGain();g.gain.value=.06;s.connect(f).connect(g).connect(actx.destination);s.start(t+d)})}
function sStep(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.035,.006);var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=300+Math.random()*150;var g=actx.createGain();g.gain.value=.04;s.connect(f).connect(g).connect(actx.destination);s.start(t)}
function sRico(){ea();var t=actx.currentTime,o=actx.createOscillator();o.frequency.setValueAtTime(2000+Math.random()*1000,t);o.frequency.exponentialRampToValueAtTime(500,t+.08);o.type='sine';var g=actx.createGain();g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.08)}
function sDeath(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.25,.06);var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;var g=actx.createGain();g.gain.value=.08;s.connect(f).connect(g).connect(actx.destination);s.start(t)}
function sSmoke(){ea();var t=actx.currentTime,s=actx.createBufferSource();s.buffer=mkN(.15,.02);var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=400;var g=actx.createGain();g.gain.value=.08;s.connect(f).connect(g).connect(actx.destination);s.start(t)}
function sFlash(){ea();var t=actx.currentTime;var o=actx.createOscillator();o.frequency.value=3000;o.type='square';var g=actx.createGain();g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.15)}

/* ====== WEAPON DEFS ====== */
var WDEFS={
  knife:{name:'Knife',cost:0,dmg:40,rate:.5,mag:1/0,res:0,reload:0,spread:0,moveSpd:1.15,auto:false,range:3.5,snd:sKnife},
  pistol:{name:'USP-S',cost:0,dmg:28,rate:.17,mag:12,res:36,reload:2.0,spread:2,moveSpd:1,auto:false,range:50,snd:sPistol},

/* ====== THREE ====== */
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x7BAFD4);
scene.fog=new THREE.FogExp2(0xC8BFA8,.01);
var camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,150);
camera.position.set(0,1.7,22);camera.rotation.order='YXZ';
var renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.prepend(renderer.domElement);

/* ====== LIGHTING ====== */
scene.add(new THREE.AmbientLight(0xffe8cc,.45));
var sun=new THREE.DirectionalLight(0xfff0dd,1.6);sun.position.set(20,35,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);var sc=sun.shadow.camera;sc.near=.5;sc.far=100;sc.left=-35;sc.right=35;sc.top=35;sc.bottom=-35;
scene.add(sun);scene.add(new THREE.HemisphereLight(0x88bbdd,0x886644,.25));
var pL1=new THREE.PointLight(0xffeedd,.5,14);pL1.position.set(20,3.5,-22);scene.add(pL1);
var pL2=new THREE.PointLight(0xffeedd,.5,14);pL2.position.set(-20,3.5,-22);scene.add(pL2);

/* ====== TEXTURES ====== */

function drawMM(){mmCtx.clearRect(0,0,mmS,mmS);mmCtx.fillStyle='rgba(30,28,24,.8)';mmCtx.fillRect(0,0,mmS,mmS);
var ox=mmS/2-camera.position.x*mmSc,oz=mmS/2-camera.position.z*mmSc;
mmCtx.fillStyle='rgba(120,110,90,.4)';for(var i=0;i<cols.length;i++){var c=cols[i];mmCtx.fillRect(c.min.x*mmSc+ox,c.min.z*mmSc+oz,(c.max.x-c.min.x)*mmSc,(c.max.z-c.min.z)*mmSc)}
mmCtx.fillStyle='#ef4444';for(var j=0;j<enemies.length;j++){if(!enemies[j].alive)continue;var e2=enemies[j].grp.position;mmCtx.beginPath();mmCtx.arc(e2.x*mmSc+ox,e2.z*mmSc+oz,2,0,Math.PI*2);mmCtx.fill()}
mmCtx.fillStyle='#60a5fa';for(var k=0;k<teammates.length;k++){if(!teammates[k].alive)continue;var t2=teammates[k].grp.position;mmCtx.beginPath();mmCtx.arc(t2.x*mmSc+ox,t2.z*mmSc+oz,2,0,Math.PI*2);mmCtx.fill()}
mmCtx.save();mmCtx.translate(mmS/2,mmS/2);mmCtx.rotate(-G.yaw);mmCtx.fillStyle='#4ade80';mmCtx.beginPath();mmCtx.moveTo(0,-3.5);mmCtx.lineTo(-2.5,2.5);mmCtx.lineTo(2.5,2.5);mmCtx.closePath();mmCtx.fill();mmCtx.restore()}

/* ====== HUD UPDATE ====== */
function updateHUD(){document.getElementById('ht').textContent=Math.max(0,Math.round(G.hp));
var hpB=document.getElementById('hb');hpB.style.width=Math.max(0,G.hp)+'%';hpB.style.background=G.hp>50?'#4ade80':G.hp>25?'#facc15':'#ef4444';
var w=curW();document.getElementById('ac').textContent=w.name==='Knife'?'--':G.ammoCur;document.getElementById('ar').textContent=w.name==='Knife'?'':('/ '+G.ammoRes);
document.getElementById('mn').textContent='$'+G.money;
var sp=6+G.spread;var chL=document.querySelectorAll('.cl');chL[0].style.top=(-6-sp)+'px';chL[1].style.top=(6+sp-8)+'px';chL[2].style.left=(-6-sp)+'px';chL[3].style.left=(6+sp-8)+'px';
var mins=Math.floor(G.rTime/60);var secs=Math.floor(G.rTime%60);var rtEl=document.getElementById('rt');
rtEl.textContent=mins+':'+(secs<10?'0':'')+secs;
rtEl.style.color=G.roundState==='buy'?'#e8c84a':G.rTime<10?'#ef4444':'#fff';
document.querySelector('#sc .sct').textContent=G.ctS;document.querySelector('#sc .st2').textContent=G.tS;
updateTeamPanel()}

/* ====== GAME LOOP ====== */
var lastT=0,roundAcc=0;
function loop(time){requestAnimationFrame(loop);var dt=Math.min(.05,(time-lastT)/1000);lastT=time;if(dt<=0)dt=.016;
if(!G.on){renderer.render(scene,camera);return}
// Round timer
if(!G.dead){roundAcc+=dt;if(roundAcc>=1){roundAcc-=1;if(G.roundState==='buy'){G.rTime--;if(G.rTime<=0){G.roundState='active';G.rTime=115;roundAcc=0;hideBuyMenu()}}
else if(G.roundState==='active'){G.rTime--;if(G.rTime<=0)endRound(false,'Time ran out')}}}
// Movement
if(!G.dead){var kx=0,kz=0;if(keys['KeyW']||keys['ArrowUp'])kz=-1;if(keys['KeyS']||keys['ArrowDown'])kz=1;if(keys['KeyA']||keys['ArrowLeft'])kx=-1;if(keys['KeyD']||keys['ArrowRight'])kx=1;
var mx=G.mx||kx,mz=G.mz||kz;var moving=Math.abs(mx)>.1||Math.abs(mz)>.1;
var w=curW();var spd=6*w.moveSpd*(G.crouch?.6:1);var sinY=Math.sin(G.yaw),cosY=Math.cos(G.yaw);
var ddx=(mx*cosY+mz*sinY)*spd*dt,ddz=(-mx*sinY+mz*cosY)*spd*dt;
if(!checkCol(camera.position.x+ddx,camera.position.z,.4))camera.position.x+=ddx;
if(!checkCol(camera.position.x,camera.position.z+ddz,.4))camera.position.z+=ddz;
camera.position.y=G.crouch?1.2:1.7;
if(moving&&!G.crouch){wpn.bobT+=dt*10;G.spread=Math.min(12,G.spread+dt*15);G.stepT-=dt;if(G.stepT<=0){sStep();G.stepT=G.crouch?.5:.38}}
else G.spread=Math.max(0,G.spread-dt*30);
if(G.shooting){G.ft-=dt;if(G.ft<=0)shoot()}}
camera.rotation.y=G.yaw;camera.rotation.x=G.pitch;camera.rotation.z*=.85;
// Weapon anim
var bobX=Math.sin(wpn.bobT)*.008*(Math.abs(G.mx)+Math.abs(G.mz)>.1&&!G.crouch?1:0);
var bobY=Math.abs(Math.cos(wpn.bobT))*.006*(Math.abs(G.mx)+Math.abs(G.mz)>.1&&!G.crouch?1:0);
wpn.rz*=.85;wpn.ry*=.85;
var rldOff=0;if(wpn.rld){wpn.rldT+=dt;var p=wpn.rldT/curW().reload;rldOff=p<.3?p/.3*.4:p>.7?(1-p)/.3*.4:.4;if(wpn.rldT>=curW().reload)finishReload()}
// Knife swing
if(wpn.knSwing>0){wpn.knSwing-=dt*6;if(wpn.knSwing<0)wpn.knSwing=0}
var knRot=wpn.knSwing*(-.8);
if(knGrp.visible){knGrp.rotation.x=knRot;knGrp.position.y=wpn.rest.y-0.02+Math.sin(wpn.knSwing*Math.PI)*.05}
if(wGrp.visible){wGrp.position.set(wpn.rest.x+bobX,wpn.rest.y+bobY-rldOff,wpn.rest.z+wpn.rz);wGrp.rotation.x=-wpn.ry}
mfL.intensity*=.7;mfMat2.opacity*=.65;if(G.ft>0)G.ft-=dt;G.spread=Math.max(0,G.spread-dt*25);
for(var i=0;i<enemies.length;i++)enemies[i].update(dt);
for(var j=0;j<teammates.length;j++)teammates[j].update(dt);
updatePart(dt);updateShells(dt);updateSmokes(dt);
for(var d=0;d<dustN;d++){dArr[d*3]+=Math.sin(time*.0003+d)*.003;dArr[d*3+1]+=Math.sin(time*.0005+d*.7)*.002;if(dArr[d*3+1]>8)dArr[d*3+1]=.1}dustGeo.attributes.position.needsUpdate=true;
updateHUD();drawMM();renderer.render(scene,camera)}

/* ====== START ====== */
document.getElementById('playBtn').addEventListener('click',function(){ea();document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='block';
G.on=true;G.dead=false;G.hp=100;G.money=800;G.roundState='buy';G.rTime=15;G.roundNum=1;G.ctS=0;G.tS=0;G.smokeCount=0;G.flashCount=0;G.ownedRifle=null;
G.weapons=[WDEFS.knife,WDEFS.pistol,null];G.slot=1;G.ammoCur=12;G.ammoRes=36;
camera.position.set(0,1.7,22);G.yaw=0;G.pitch=0;roundAcc=0;
for(var i=0;i<teammates.length;i++)teammates[i].respawn(-2+i*2,20);
for(var j=0;j<enemies.length;j++){enemies[j].grp.position.set((Math.random()-.5)*30,0,-18+Math.random()*12);enemies[j].pickPatrol()}
updateSlotUI();document.getElementById('wn').textContent='USP-S';showBuyMenu()});
document.getElementById('respBtn').addEventListener('click',function(){document.getElementById('ds').style.display='none';G.dead=false;G.hp=100;G.ammoCur=curW().mag;G.ammoRes=curW().res;G.reloading=false;wpn.rld=false;camera.position.set(0,1.7,22);G.yaw=0;G.pitch=0});
window.addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
requestAnimationFrame(loop);
</script>
