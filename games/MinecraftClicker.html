<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0c1d;--panel:rgba(20,20,40,0.88);--border:rgba(255,255,255,0.08);--emerald:#00E676;--diamond:#4DD9FF;--gold:#FFD700;--iron:#D4A574;--text:#ddd;--dim:#666}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Press Start 2P',monospace;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;user-select:none}
#particles{position:fixed;inset:0;pointer-events:none;z-index:50}
.bg-sky{position:fixed;inset:0;background:linear-gradient(180deg,#060618 0%,#0d0d30 40%,#14143a 70%,#1a1a44 100%);z-index:0}
.bg-stars{position:fixed;inset:0;z-index:1;opacity:.6}
.bg-ground{position:fixed;bottom:0;width:100%;height:22%;z-index:2;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 48px),
  repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 48px),
  linear-gradient(180deg,#5B8731 0%,#5B8731 10px,#8B6914 10px,#7a5c12 100%);
  image-rendering:pixelated}
.bg-ground::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.4) 100%)}
#app{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px 12px 200px}
header{text-align:center;margin-bottom:8px;width:100%}
header h1{font-size:clamp(14px,3vw,22px);color:var(--emerald);text-shadow:0 0 20px rgba(0,230,118,.4),3px 3px 0 #000;letter-spacing:2px;margin-bottom:14px}
.stats-bar{display:flex;justify-content:center;gap:clamp(10px,3vw,30px);flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);padding:8px 16px;border-radius:4px;display:flex;align-items:center;gap:8px;font-size:clamp(8px,1.5vw,11px)}
.stat i{font-size:clamp(10px,1.8vw,14px)}
.stat.emeralds i{color:var(--emerald)}
.stat.cps i{color:var(--diamond)}
.stat.clicks i{color:var(--gold)}
.stat .val{color:#fff;min-width:40px;text-align:right}
.block-area{position:relative;margin:20px 0 10px;display:flex;flex-direction:column;align-items:center}
.block-scene{width:clamp(120px,25vw,170px);height:clamp(120px,25vw,170px);perspective:600px;cursor:pointer;position:relative}
.block-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(32deg);transition:filter .1s}
.block-cube.idle{animation:idleBob 3.5s ease-in-out infinite}
.block-cube.clicked{animation:clickPulse .12s ease-out}
.block-cube.breaking{animation:breakAnim .35s ease-out forwards}
.block-cube.reforming{animation:reformAnim .4s ease-out forwards}
@keyframes idleBob{0%,100%{transform:rotateX(-22deg) rotateY(32deg) translateY(0)}50%{transform:rotateX(-22deg) rotateY(38deg) translateY(-6px)}}
@keyframes clickPulse{0%{transform:rotateX(-22deg) rotateY(32deg) scale(1)}50%{transform:rotateX(-22deg) rotateY(32deg) scale(.88)}100%{transform:rotateX(-22deg) rotateY(32deg) scale(1)}}
@keyframes breakAnim{0%{transform:rotateX(-22deg) rotateY(32deg) scale(1);opacity:1}40%{transform:rotateX(-10deg) rotateY(50deg) scale(1.15);opacity:.7}100%{transform:rotateX(-22deg) rotateY(32deg) scale(0);opacity:0}}
@keyframes reformAnim{0%{transform:rotateX(-22deg) rotateY(32deg) scale(0);opacity:0}60%{transform:rotateX(-22deg) rotateY(32deg) scale(1.12);opacity:1}100%{transform:rotateX(-22deg) rotateY(32deg) scale(1);opacity:1}}
.face{position:absolute;width:100%;height:100%;image-rendering:pixelated;background-size:cover;backface-visibility:hidden}
.face.front{transform:translateZ(calc(clamp(120px,25vw,170px)/2))}
.face.back{transform:rotateY(180deg) translateZ(calc(clamp(120px,25vw,170px)/2))}
.face.right{transform:rotateY(90deg) translateZ(calc(clamp(120px,25vw,170px)/2))}
.face.left{transform:rotateY(-90deg) translateZ(calc(clamp(120px,25vw,170px)/2))}
.face.top{transform:rotateX(90deg) translateZ(calc(clamp(120px,25vw,170px)/2))}
.face.bottom{transform:rotateX(-90deg) translateZ(calc(clamp(120px,25vw,170px)/2))}
.block-shadow{width:120px;height:24px;background:radial-gradient(ellipse,rgba(0,0,0,.35),transparent 70%);margin-top:10px;transition:all .15s;border-radius:50%}
.block-shadow.pulse{width:160px;height:32px;opacity:.5}
.damage-overlay{position:absolute;inset:0;pointer-events:none;border-radius:2px;transition:all .2s}
.combo-display{position:absolute;top:-30px;font-size:clamp(8px,1.2vw,11px);color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.6);opacity:0;transition:all .2s}
.combo-display.active{opacity:1}
.floating-num{position:absolute;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:clamp(10px,1.5vw,14px);color:var(--emerald);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;z-index:60;animation:floatUp .9s ease-out forwards;white-space:nowrap}
.floating-num.fortune{font-size:clamp(14px,2vw,20px);color:var(--gold);animation:floatUpF .9s ease-out forwards}
.floating-num.break{font-size:clamp(16px,2.5vw,24px);color:#fff;animation:floatUpB 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.6)}}
@keyframes floatUpF{0%{opacity:1;transform:translateY(0) scale(1.2)}30%{transform:translateY(-20px) scale(1.4)}100%{opacity:0;transform:translateY(-90px) scale(.5)}}
@keyframes floatUpB{0%{opacity:1;transform:translateY(0) scale(1.5)}40%{transform:translateY(-30px) scale(1.8)}100%{opacity:0;transform:translateY(-110px) scale(.4)}}
.block-selector{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 20px}
.block-opt{width:52px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.block-opt:hover{transform:translateY(-3px)}
.block-opt.locked{opacity:.4;cursor:not-allowed}
.block-opt.locked:hover{transform:none}
.block-opt.active .block-preview{box-shadow:0 0 0 2px var(--emerald),0 0 12px rgba(0,230,118,.3)}
.block-preview{width:44px;height:44px;image-rendering:pixelated;border:2px solid rgba(255,255,255,.1);border-radius:2px;margin:0 auto 4px;transition:all .15s}
.block-opt .block-name{font-size:5px;color:var(--dim);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-opt .block-cost{font-size:5px;color:var(--emerald);margin-top:2px}
.block-opt.locked .block-cost{color:#f44}
.lock-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:14px;color:rgba(255,255,255,.6);text-shadow:0 0 4px #000}
.section-title{font-size:clamp(9px,1.5vw,12px);color:var(--dim);margin-bottom:12px;text-align:center;letter-spacing:1px}
.upgrades-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;width:100%;max-width:800px}
.upgrade-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:12px;display:flex;align-items:center;gap:12px;transition:all .15s;position:relative;overflow:hidden}
.upgrade-card:hover{border-color:rgba(255,255,255,.15);background:rgba(30,30,55,.9)}
.upgrade-card.affordable{border-color:rgba(0,230,118,.25)}
.upgrade-card.affordable:hover{border-color:rgba(0,230,118,.4);box-shadow:0 0 15px rgba(0,230,118,.08)}
.upgrade-icon{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:18px;border-radius:4px;flex-shrink:0;border:1px solid var(--border)}
.upgrade-info{flex:1;min-width:0}
.upgrade-name{font-size:clamp(7px,1.2vw,9px);margin-bottom:4px;color:#fff}
.upgrade-desc{font-size:clamp(6px,1vw,7px);color:var(--dim);line-height:1.6;margin-bottom:6px}
.upgrade-level{font-size:clamp(6px,1vw,7px);color:var(--diamond);margin-bottom:6px}
.upgrade-buy{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.3);color:var(--emerald);font-family:inherit;font-size:clamp(6px,1vw,8px);padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.upgrade-buy:hover{background:rgba(0,230,118,.25);border-color:rgba(0,230,118,.5)}
.upgrade-buy:disabled{background:rgba(255,255,255,.04);border-color:var(--border);color:#444;cursor:not-allowed}
.upgrade-buy:disabled:hover{background:rgba(255,255,255,.04);border-color:var(--border)}
#toastContainer{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(20,20,40,.95);border:1px solid var(--gold);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:10px;transform:translateX(120%);transition:transform .3s ease;pointer-events:auto;max-width:300px}
.toast.show{transform:translateX(0)}
.toast-icon{font-size:18px;color:var(--gold);flex-shrink:0}
.toast-title{font-size:7px;color:var(--gold);margin-bottom:3px}
.toast-desc{font-size:6px;color:var(--dim);line-height:1.5}
.achievements-section{width:100%;max-width:800px;margin-top:16px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.ach-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:6px;opacity:.35;transition:all .3s}
.ach-card.unlocked{opacity:1;border-color:rgba(255,215,0,.3)}
.ach-card .ach-icon{font-size:12px;color:#444;flex-shrink:0;width:20px;text-align:center}
.ach-card.unlocked .ach-icon{color:var(--gold)}
.ach-card .ach-name{color:#888}
.ach-card.unlocked .ach-name{color:#fff}
.screen-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:100;opacity:0;animation:flash .2s ease-out}
@keyframes flash{0%{opacity:.25}100%{opacity:0}}
@media(max-width:600px){.upgrades-grid{grid-template-columns:1fr}.ach-grid{grid-template-columns:1fr 1fr}.block-selector{gap:5px}.block-opt{width:44px}.block-preview{width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style>
</head>
<body>
<div class="bg-sky"></div>
<canvas class="bg-stars" id="starsCanvas"></canvas>
<div class="bg-ground"></div>
<canvas id="particles"></canvas>

<div id="app">
  <header>
    <h1>MINECRAFT CLICKER</h1>
    <div class="stats-bar">
      <div class="stat emeralds"><i class="fas fa-gem"></i><span class="val" id="emeraldCount">0</span></div>
      <div class="stat cps"><i class="fas fa-bolt"></i><span class="val" id="cpsCount">0</span>/s</div>
      <div class="stat clicks"><i class="fas fa-crosshairs"></i><span class="val" id="clickCount">0</span></div>
    </div>
  </header>

  <div class="block-area" id="blockArea">
    <div class="combo-display" id="comboDisplay">COMBO x1</div>
    <div class="block-scene" id="blockScene">
      <div class="block-cube idle" id="blockCube">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face left"></div>
        <div class="face right"></div>
        <div class="face top"></div>
        <div class="face bottom"></div>
        <div class="damage-overlay" id="damageOverlay"></div>
      </div>
    </div>
    <div class="block-shadow" id="blockShadow"></div>
  </div>

  <div class="block-selector" id="blockSelector"></div>

  <div class="section-title">UPGRADES</div>
  <div class="upgrades-grid" id="upgradesGrid"></div>

  <div class="achievements-section">
    <div class="section-title" style="margin-top:16px">ACHIEVEMENTS</div>
    <div class="ach-grid" id="achGrid"></div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
/* ===== BLOCK TYPES ===== */
const blockTypes = [
  { name:'Grass Block', mult:1, cost:0, top:'#5B8731', topN:['#4C7A2B','#6B9E3A','#528532'], side:'#8B6914', sideN:['#7A5C12','#9C7A1A','#6B5210'], bot:'#8B6914', botN:['#7A5C12','#9C7A1A'], particles:['#5B8731','#4C7A2B','#8B6914','#6B5210'], ore:null, grassSide:3 },
  { name:'Stone', mult:2, cost:100, top:'#8B8B8B', topN:['#7A7A7A','#9C9C9C','#6E6E6E'], side:'#808080', sideN:['#737373','#919191','#6A6A6A'], bot:'#777', botN:['#6E6E6E','#888'], particles:['#8B8B8B','#7A7A7A','#6E6E6E'], ore:null, grassSide:0 },
  { name:'Iron Ore', mult:5, cost:500, top:'#8B8B8B', topN:['#7A7A7A','#9C9C9C','#6E6E6E'], side:'#808080', sideN:['#737373','#919191','#6A6A6A'], bot:'#777', botN:['#6E6E6E','#888'], particles:['#8B8B8B','#D4A574','#7A7A7A'], ore:'#D4A574', grassSide:0 },
  { name:'Gold Ore', mult:12, cost:3000, top:'#8B8B8B', topN:['#7A7A7A','#9C9C9C','#6E6E6E'], side:'#808080', sideN:['#737373','#919191','#6A6A6A'], bot:'#777', botN:['#6E6E6E','#888'], particles:['#8B8B8B','#FFD700','#7A7A7A'], ore:'#FFD700', grassSide:0 },
  { name:'Diamond Ore', mult:30, cost:18000, top:'#8B8B8B', topN:['#7A7A7A','#9C9C9C','#6E6E6E'], side:'#808080', sideN:['#737373','#919191','#6A6A6A'], bot:'#777', botN:['#6E6E6E','#888'], particles:['#8B8B8B','#4DD9FF','#7A7A7A','#80E8FF'], ore:'#4DD9FF', grassSide:0 },
  { name:'Emerald Ore', mult:80, cost:120000, top:'#8B8B8B', topN:['#7A7A7A','#9C9C9C','#6E6E6E'], side:'#808080', sideN:['#737373','#919191','#6A6A6A'], bot:'#777', botN:['#6E6E6E','#888'], particles:['#8B8B8B','#00E676','#7A7A7A','#40FF90'], ore:'#00E676', grassSide:0 }
];

/* ===== UPGRADES ===== */
const upgrades = [
  { id:'pickaxe', name:'Better Pickaxe', desc:'+1 emerald per click', icon:'fa-hammer', iconBg:'rgba(139,105,20,.2)', iconColor:'#D4A574', baseCost:15, mult:1.55, level:0 },
  { id:'autoMiner', name:'Auto-Miner', desc:'+0.5 emeralds per second', icon:'fa-gears', iconBg:'rgba(77,217,255,.15)', iconColor:'var(--diamond)', baseCost:50, mult:1.6, level:0 },
  { id:'fortune', name:'Fortune', desc:'+5% chance for 3x drop', icon:'fa-clover', iconBg:'rgba(255,215,0,.15)', iconColor:'var(--gold)', baseCost:250, mult:1.8, level:0 },
  { id:'efficiency', name:'Efficiency', desc:'-2% upgrade costs', icon:'fa-bolt', iconBg:'rgba(0,230,118,.12)', iconColor:'var(--emerald)', baseCost:1200, mult:2.0, level:0 }
];

/* ===== ACHIEVEMENTS ===== */
const achievements = [
  { id:'first', name:'First Strike', desc:'Click the block', icon:'fa-hand-pointer', check:()=>G.totalClicks>=1 },
  { id:'c100', name:'Miner', desc:'100 clicks', icon:'fa-pickaxe', check:()=>G.totalClicks>=100 },
  { id:'c1000', name:'Dedicated', desc:'1,000 clicks', icon:'fa-mountain', check:()=>G.totalClicks>=1000 },
  { id:'c10000', name:'Click Legend', desc:'10,000 clicks', icon:'fa-crown', check:()=>G.totalClicks>=10000 },
  { id:'e100', name:'Emerald Hoarder', desc:'Earn 100 total', icon:'fa-gem', check:()=>G.totalEarned>=100 },
  { id:'e1k', name:'Wealthy', desc:'Earn 1,000 total', icon:'fa-sack-dollar', check:()=>G.totalEarned>=1000 },
  { id:'e10k', name:'Diamond Hands', desc:'Earn 10,000 total', icon:'fa-diamond', check:()=>G.totalEarned>=10000 },
  { id:'e100k', name:'Emerald Tycoon', desc:'Earn 100,000 total', icon:'fa-landmark', check:()=>G.totalEarned>=100000 },
  { id:'upgrade1', name:'Upgrader', desc:'Buy first upgrade', icon:'fa-arrow-up', check:()=>upgrades.reduce((s,u)=>s+u.level,0)>=1 },
  { id:'block2', name:'New Horizons', desc:'Unlock Stone block', icon:'fa-cube', check:()=>G.currentBlock>=1 },
  { id:'block5', name:'Into the Deep', desc:'Unlock Diamond Ore', icon:'fa-cubes', check:()=>G.currentBlock>=4 },
  { id:'cps10', name:'Automation', desc:'Reach 10 CPS', icon:'fa-robot', check:()=>G.cps>=10 },
  { id:'fortune1', name:'Lucky Strike', desc:'Get a Fortune proc', icon:'fa-clover', check:()=>G.fortuneHits>=1 },
  { id:'combo10', name:'Combo Master', desc:'Reach 10x combo', icon:'fa-fire', check:()=>G.maxCombo>=10 }
];

/* ===== GAME STATE ===== */
const G = {
  emeralds: 0, totalEarned: 0, totalClicks: 0, clickPower: 1, cps: 0,
  currentBlock: 0, cracks: 0, maxCracks: 10,
  combo: 0, comboTimer: null, maxCombo: 0, fortuneHits: 0,
  unlockedAchievements: new Set()
};

/* ===== TEXTURE GENERATION ===== */
function genTexture(blockIdx, face) {
  const c = document.createElement('canvas'); c.width=16; c.height=16;
  const ctx = c.getContext('2d');
  const b = blockTypes[blockIdx];
  function noise(colors, prob) {
    for(let x=0;x<16;x++) for(let y=0;y<16;y++)
      if(Math.random()<prob){ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];ctx.fillRect(x,y,1,1)}
  }
  function oreSpots(col,prob){
    for(let x=0;x<16;x++) for(let y=0;y<16;y++)
      if(Math.random()<prob){ctx.fillStyle=col;ctx.fillRect(x,y,1,1)}
  }
  if(face==='top'){
    ctx.fillStyle=b.top; ctx.fillRect(0,0,16,16); noise(b.topN,.3);
  } else if(face==='bottom'){
    ctx.fillStyle=b.bot; ctx.fillRect(0,0,16,16); noise(b.botN,.3);
  } else {
    ctx.fillStyle=b.side; ctx.fillRect(0,0,16,16);
    if(b.grassSide>0){ctx.fillStyle=b.top; ctx.fillRect(0,0,16,b.grassSide); noise(b.topN,.25)}
    noise(b.sideN,.3);
    if(b.ore) oreSpots(b.ore,.12);
  }
  return c.toDataURL();
}

function applyBlockTextures(idx) {
  const faces = document.querySelectorAll('.face');
  const t = genTexture(idx,'top'), s = genTexture(idx,'side'), bt = genTexture(idx,'bottom');
  faces.forEach(f => {
    f.style.imageRendering='pixelated'; f.style.backgroundSize='cover';
    if(f.classList.contains('top')) f.style.backgroundImage=`url(${t})`;
    else if(f.classList.contains('bottom')) f.style.backgroundImage=`url(${bt})`;
    else f.style.backgroundImage=`url(${s})`;
  });
}

/* ===== PARTICLES ===== */
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let particles = [];

function resizeParticles(){ pCanvas.width=window.innerWidth; pCanvas.height=window.innerHeight; }
window.addEventListener('resize', resizeParticles); resizeParticles();

class Particle {
  constructor(x,y,color,size,vx,vy,life){
    this.x=x;this.y=y;this.color=color;this.size=size;
    this.vx=vx;this.vy=vy;this.life=life;this.maxLife=life;
    this.rot=Math.random()*Math.PI*2;this.rotS=(Math.random()-.5)*.3;this.gravity=.18;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.gravity;this.life--;this.rot+=this.rotS;}
  draw(ctx){
    const a=this.life/this.maxLife;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
    ctx.globalAlpha=a;ctx.fillStyle=this.color;
    ctx.fillRect(-this.size/2,-this.size/2,this.size,this.size);
    ctx.restore();
  }
  get dead(){return this.life<=0;}
}

function spawnClickParticles(cx, cy, isBreak) {
  const b = blockTypes[G.currentBlock];
  const count = isBreak ? 45 : 18;
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = (isBreak?3:2) + Math.random()*(isBreak?6:4);
    const size = (isBreak?4:3) + Math.random()*(isBreak?6:3);
    const color = b.particles[Math.floor(Math.random()*b.particles.length)];
    particles.push(new Particle(cx, cy, color, size, Math.cos(angle)*speed, Math.sin(angle)*speed-2, 30+Math.random()*20));
  }
}

/* Ambient dust */
let ambientTimer = 0;
function spawnAmbient() {
  if(particles.length > 300) return;
  const x = Math.random()*pCanvas.width;
  const y = pCanvas.height * .7 + Math.random()*pCanvas.height*.3;
  particles.push(new Particle(x,y,'rgba(255,255,255,0.15)',1+Math.random(),(Math.random()-.5)*.3,-.2-Math.random()*.3,120+Math.random()*80));
}

function updateParticles(){
  pCtx.clearRect(0,0,pCanvas.width,pCanvas.height);
  particles = particles.filter(p=>!p.dead);
  particles.forEach(p=>{p.update();p.draw(pCtx);});
  ambientTimer++;
  if(ambientTimer%8===0) spawnAmbient();
  requestAnimationFrame(updateParticles);
}
updateParticles();

/* ===== STARS BACKGROUND ===== */
(function drawStars(){
  const c = document.getElementById('starsCanvas');
  c.width=window.innerWidth; c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  for(let i=0;i<120;i++){
    const x=Math.random()*c.width, y=Math.random()*c.height*.75;
    const s=1+Math.random()*1.5;
    ctx.fillStyle=`rgba(255,255,255,${.2+Math.random()*.5})`;
    ctx.fillRect(Math.floor(x),Math.floor(y),Math.ceil(s),Math.ceil(s));
  }
  /* Moon */
  ctx.fillStyle='rgba(240,240,220,0.85)';
  ctx.beginPath(); ctx.arc(c.width*.82,c.height*.12,28,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#060618';
  ctx.beginPath(); ctx.arc(c.width*.82+10,c.height*.12-5,22,0,Math.PI*2); ctx.fill();
})();

/* ===== NUMBER FORMATTING ===== */
function fmt(n){
  if(n>=1e9) return (n/1e9).toFixed(1)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}

/* ===== DISPLAY ===== */
let displayedEmeralds = 0;
function updateDisplay(){
  /* Smooth emerald counter */
  const diff = G.emeralds - displayedEmeralds;
  if(Math.abs(diff)<1) displayedEmeralds = G.emeralds;
  else displayedEmeralds += diff * 0.18;
  document.getElementById('emeraldCount').textContent = fmt(Math.max(0,displayedEmeralds));
  document.getElementById('cpsCount').textContent = fmt(G.cps);
  document.getElementById('clickCount').textContent = fmt(G.totalClicks);

  /* Upgrade affordability */
  upgrades.forEach((u,i)=>{
    const cost = getCost(u);
    const btn = document.querySelector(`[data-upgrade="${i}"]`);
    if(!btn) return;
    btn.disabled = G.emeralds < cost;
    btn.closest('.upgrade-card').classList.toggle('affordable', G.emeralds >= cost);
    btn.querySelector('.cost-val').textContent = fmt(cost);
    btn.closest('.upgrade-card').querySelector('.upgrade-level').textContent = 'Level ' + u.level;
  });

  /* Block selector */
  blockTypes.forEach((b,i)=>{
    const el = document.querySelector(`[data-block="${i}"]`);
    if(!el) return;
    const locked = i > 0 && G.totalEarned < b.cost;
    el.classList.toggle('locked', locked);
    el.classList.toggle('active', G.currentBlock === i);
    const costEl = el.querySelector('.block-cost');
    if(i===0) costEl.textContent = 'START';
    else if(!locked) costEl.textContent = 'OWNED';
    else costEl.textContent = fmt(b.cost);
  });
}

/* ===== COST CALCULATION ===== */
function getCost(u){
  const base = u.baseCost * Math.pow(u.mult, u.level);
  const eff = 1 - (upgrades[3].level * 0.02);
  return Math.floor(base * Math.max(0.5, eff));
}

/* ===== CLICK HANDLER ===== */
const cube = document.getElementById('blockCube');
const shadow = document.getElementById('blockShadow');
const scene = document.getElementById('blockScene');
const blockArea = document.getElementById('blockArea');
const comboEl = document.getElementById('comboDisplay');
const dmgOverlay = document.getElementById('damageOverlay');
let isBreaking = false;

function handleClick(e) {
  if(isBreaking) return;
  const rect = scene.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  /* Combo */
  G.combo++;
  if(G.combo > G.maxCombo) G.maxCombo = G.combo;
  clearTimeout(G.comboTimer);
  G.comboTimer = setTimeout(()=>{ G.combo=0; comboEl.classList.remove('active'); }, 600);
  const comboMult = 1 + Math.min(G.combo * 0.08, 2);
  if(G.combo > 1){
    comboEl.textContent = 'COMBO x' + G.combo;
    comboEl.classList.add('active');
  }

  /* Calculate yield */
  let yield_ = G.clickPower * blockTypes[G.currentBlock].mult * comboMult;
  let isFortune = false;
  const fortuneChance = upgrades[2].level * 0.05;
  if(Math.random() < fortuneChance){ yield_ *= 3; isFortune = true; G.fortuneHits++; }

  G.emeralds += yield_;
  G.totalEarned += yield_;
  G.totalClicks++;
  G.cracks++;

  /* Visual feedback */
  cube.classList.remove('idle','clicked');
  void cube.offsetWidth;
  cube.classList.add('clicked');
  shadow.classList.add('pulse');
  setTimeout(()=>{ shadow.classList.remove('pulse'); cube.classList.remove('clicked'); cube.classList.add('idle'); }, 130);

  /* Floating number */
  spawnFloating(e ? e.clientX : cx, e ? e.clientY : cy, yield_, isFortune, false);

  /* Particles */
  spawnClickParticles(cx, cy, false);

  /* Damage overlay */
  updateDamage();

  /* Check break */
  if(G.cracks >= G.maxCracks) breakBlock(cx, cy);

  checkAchievements();
}

scene.addEventListener('click', handleClick);
scene.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleClick(e.touches[0]); }, {passive:false});

function updateDamage(){
  const pct = G.cracks / G.maxCracks;
  const alpha = Math.min(pct * 0.5, 0.45);
  const dark = Math.floor(pct * 60);
  dmgOverlay.style.background = `rgba(0,0,0,${alpha})`;
  if(pct > 0.6) dmgOverlay.style.boxShadow = `inset 0 0 ${pct*20}px rgba(0,0,0,${pct*0.5})`;
}

function breakBlock(cx, cy) {
  isBreaking = true;
  G.cracks = 0;
  dmgOverlay.style.background = 'transparent';
  dmgOverlay.style.boxShadow = 'none';

  /* Break bonus */
  const bonus = G.clickPower * blockTypes[G.currentBlock].mult * 5;
  G.emeralds += bonus;
  G.totalEarned += bonus;
  spawnFloating(cx, cy, bonus, false, true);

  /* Screen flash */
  const flash = document.createElement('div');
  flash.className = 'screen-flash';
  document.body.appendChild(flash);
  setTimeout(()=>flash.remove(), 250);

  /* Big particle burst */
  spawnClickParticles(cx, cy, true);

  /* Break animation */
  cube.classList.remove('idle','clicked');
  cube.classList.add('breaking');

  setTimeout(()=>{
    cube.classList.remove('breaking');
    cube.classList.add('reforming');
    setTimeout(()=>{
      cube.classList.remove('reforming');
      cube.classList.add('idle');
      isBreaking = false;
      applyBlockTextures(G.currentBlock);
    }, 420);
  }, 360);
}

function spawnFloating(x, y, amount, isFortune, isBreak) {
  const el = document.createElement('div');
  el.className = 'floating-num' + (isFortune?' fortune':'') + (isBreak?' break':'');
  el.textContent = '+' + fmt(amount);
  el.style.left = (x + (Math.random()-0.5)*40) + 'px';
  el.style.top = (y - 20) + 'px';
  el.style.position = 'fixed';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}

/* ===== BUY UPGRADE ===== */
function buyUpgrade(idx) {
  const u = upgrades[idx];
  const cost = getCost(u);
  if(G.emeralds < cost) return;
  G.emeralds -= cost;
  u.level++;

  /* Apply effects */
  G.clickPower = 1 + upgrades[0].level;
  G.cps = upgrades[1].level * 0.5;

  checkAchievements();
}

/* ===== UNLOCK BLOCK ===== */
function selectBlock(idx) {
  if(idx === 0 || G.totalEarned >= blockTypes[idx].cost) {
    G.currentBlock = idx;
    applyBlockTextures(idx);
    G.cracks = 0;
    dmgOverlay.style.background = 'transparent';
    dmgOverlay.style.boxShadow = 'none';
    checkAchievements();
  }
}

/* ===== ACHIEVEMENTS ===== */
function checkAchievements() {
  achievements.forEach(a => {
    if(!G.unlockedAchievements.has(a.id) && a.check()) {
      G.unlockedAchievements.add(a.id);
      showToast(a.name, a.desc, a.icon);
      const card = document.querySelector(`[data-ach="${a.id}"]`);
      if(card) card.classList.add('unlocked');
    }
  });
}

function showToast(title, desc, icon) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div class="toast-icon"><i class="fas ${icon}"></i></div><div><div class="toast-title">${title}</div><div class="toast-desc">${desc}</div></div>`;
  c.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 350); }, 3500);
}

/* ===== AUTO-MINER TICK ===== */
setInterval(()=>{
  if(G.cps > 0){
    const gain = G.cps / 20;
    G.emeralds += gain;
    G.totalEarned += gain;
  }
}, 50);

/* ===== RENDER BLOCK SELECTOR ===== */
function renderBlockSelector() {
  const container = document.getElementById('blockSelector');
  container.innerHTML = '';
  blockTypes.forEach((b, i) => {
    const div = document.createElement('div');
    div.className = 'block-opt' + (i===0?' active':' locked');
    div.dataset.block = i;
    div.addEventListener('click', ()=>selectBlock(i));

    const preview = document.createElement('div');
    preview.className = 'block-preview';
    /* Mini texture */
    const tc = document.createElement('canvas'); tc.width=16; tc.height=16;
    const tctx = tc.getContext('2d');
    tctx.fillStyle = b.top; tctx.fillRect(0,0,16,16);
    if(b.ore){for(let x=0;x<16;x++)for(let y=0;y<16;y++)if(Math.random()<.15){tctx.fillStyle=b.ore;tctx.fillRect(x,y,1,1)}}
    else{for(let x=0;x<16;x++)for(let y=0;y<16;y++)if(Math.random()<.3){tctx.fillStyle=b.topN[Math.floor(Math.random()*b.topN.length)];tctx.fillRect(x,y,1,1)}}
    preview.style.backgroundImage = `url(${tc.toDataURL()})`;

    const name = document.createElement('div');
    name.className = 'block-name'; name.textContent = b.name;

    const cost = document.createElement('div');
    cost.className = 'block-cost'; cost.textContent = i===0?'START':fmt(b.cost);

    if(i > 0){
      const lock = document.createElement('div');
      lock.className = 'lock-icon'; lock.innerHTML = '<i class="fas fa-lock"></i>';
      div.appendChild(lock);
    }

    div.appendChild(preview);
    div.appendChild(name);
    div.appendChild(cost);
    container.appendChild(div);
  });
}

/* ===== RENDER UPGRADES ===== */
function renderUpgrades() {
  const grid = document.getElementById('upgradesGrid');
  grid.innerHTML = '';
  upgrades.forEach((u, i) => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <div class="upgrade-icon" style="background:${u.iconBg};color:${u.iconColor}"><i class="fas ${u.icon}"></i></div>
      <div class="upgrade-info">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
        <div class="upgrade-level">Level ${u.level}</div>
      </div>
      <button class="upgrade-buy" data-upgrade="${i}" onclick="buyUpgrade(${i})" disabled>
        <i class="fas fa-gem" style="margin-right:4px;font-size:7px"></i><span class="cost-val">${fmt(getCost(u))}</span>
      </button>`;
    grid.appendChild(card);
  });
}

/* ===== RENDER ACHIEVEMENTS ===== */
function renderAchievements() {
  const grid = document.getElementById('achGrid');
  grid.innerHTML = '';
  achievements.forEach(a => {
    const card = document.createElement('div');
    card.className = 'ach-card';
    card.dataset.ach = a.id;
    card.innerHTML = `<div class="ach-icon"><i class="fas ${a.icon}"></i></div><div class="ach-name">${a.name}</div>`;
    grid.appendChild(card);
  });
}

/* ===== MAIN LOOP ===== */
function gameLoop() {
  updateDisplay();
  requestAnimationFrame(gameLoop);
}

/* ===== INIT ===== */
applyBlockTextures(0);
renderBlockSelector();
renderUpgrades();
renderAchievements();
gameLoop();

/* Keyboard accessibility - space/enter on block */
scene.setAttribute('tabindex','0');
scene.setAttribute('role','button');
scene.setAttribute('aria-label','Mine the block');
scene.addEventListener('keydown', e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();handleClick(null);} });
</script>
