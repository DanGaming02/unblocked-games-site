<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0c0c1d;--panel:rgba(18,18,38,0.92);--border:rgba(255,255,255,0.07);--emerald:#00E676;--diamond:#4DD9FF;--gold:#FFD700;--iron:#D4A574;--redstone:#FF3333;--lapis:#3355DD;--copper:#E87D4A;--text:#ddd;--dim:#555;--dim2:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Press Start 2P',monospace;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;user-select:none}
#particles{position:fixed;inset:0;pointer-events:none;z-index:50}
.bg-sky{position:fixed;inset:0;background:linear-gradient(180deg,#060618 0%,#0d0d30 40%,#14143a 70%,#1a1a44 100%);z-index:0;transition:filter .5s}
.bg-stars{position:fixed;inset:0;z-index:1;opacity:.6}
.bg-ground{position:fixed;bottom:0;width:100%;height:22%;z-index:2;background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 48px),linear-gradient(180deg,#5B8731 0%,#5B8731 10px,#8B6914 10px,#7a5c12 100%);image-rendering:pixelated}
.bg-ground::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45))}
#app{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:14px 10px 220px}
header{text-align:center;margin-bottom:6px;width:100%}
header h1{font-size:clamp(12px,2.8vw,20px);color:var(--emerald);text-shadow:0 0 20px rgba(0,230,118,.35),3px 3px 0 #000;letter-spacing:2px;margin-bottom:12px}
.stats-bar{display:flex;justify-content:center;gap:clamp(6px,2vw,18px);flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--border);padding:6px 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:clamp(7px,1.3vw,10px)}
.stat i{font-size:clamp(9px,1.5vw,12px)}
.stat.emeralds i{color:var(--emerald)}.stat.cps i{color:var(--diamond)}.stat.clicks i{color:var(--gold)}.stat.prestige i{color:#c084fc}
.stat .val{color:#fff;min-width:30px;text-align:right}
.block-area{position:relative;margin:16px 0 6px;display:flex;flex-direction:column;align-items:center}
.pickaxe-wrap{position:absolute;left:clamp(-70px,-12vw,-90px);top:50%;transform:translateY(-55%);text-align:center;z-index:5}
.pickaxe{width:36px;height:64px;position:relative;transform:rotate(-45deg);transform-origin:80% 90%;margin:0 auto;transition:transform .08s}
.pickaxe.swing{animation:pickSwing .14s ease-out}
@keyframes pickSwing{0%{transform:rotate(-45deg)}45%{transform:rotate(-10deg)}100%{transform:rotate(-45deg)}}
.pk-head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:7px;border-radius:1px;transition:background .3s}
.pk-head::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,.25);border-radius:1px 1px 0 0}
.pk-handle{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:5px;height:42px;background:#7a5230;border-radius:1px}
.pk-tier{font-size:5px;color:var(--dim);margin-top:12px;white-space:nowrap;transition:color .3s}
.block-scene{width:clamp(110px,22vw,160px);height:clamp(110px,22vw,160px);perspective:600px;cursor:pointer;position:relative}
.block-cube{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(32deg);transition:filter .1s}
.block-cube.idle{animation:idleBob 3.5s ease-in-out infinite}
.block-cube.clicked{animation:clickPulse .12s ease-out}
.block-cube.breaking{animation:breakAnim .35s ease-out forwards}
.block-cube.reforming{animation:reformAnim .4s ease-out forwards}
@keyframes idleBob{0%,100%{transform:rotateX(-22deg) rotateY(32deg) translateY(0)}50%{transform:rotateX(-22deg) rotateY(38deg) translateY(-5px)}}
@keyframes clickPulse{0%{transform:rotateX(-22deg) rotateY(32deg) scale(1)}50%{transform:rotateX(-22deg) rotateY(32deg) scale(.87)}100%{transform:rotateX(-22deg) rotateY(32deg) scale(1)}}
@keyframes breakAnim{0%{transform:rotateX(-22deg) rotateY(32deg) scale(1);opacity:1}40%{transform:rotateX(-10deg) rotateY(50deg) scale(1.15);opacity:.6}100%{transform:rotateX(-22deg) rotateY(32deg) scale(0);opacity:0}}
@keyframes reformAnim{0%{transform:rotateX(-22deg) rotateY(32deg) scale(0);opacity:0}60%{transform:rotateX(-22deg) rotateY(32deg) scale(1.12);opacity:1}100%{transform:rotateX(-22deg) rotateY(32deg) scale(1);opacity:1}}
.face{position:absolute;width:100%;height:100%;image-rendering:pixelated;background-size:cover;backface-visibility:hidden}
.sz{--s:clamp(110px,22vw,160px)}
.face.front{transform:translateZ(calc(var(--s)/2))}.face.back{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.face.right{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.face.left{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.face.top{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.face.bottom{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.dmg-overlay{position:absolute;inset:0;pointer-events:none;border-radius:2px;transition:all .15s}
.health-wrap{width:clamp(100px,20vw,150px);height:7px;background:rgba(0,0,0,.5);border:1px solid var(--border);margin-top:10px;border-radius:1px;overflow:hidden}
.health-bar{height:100%;background:var(--emerald);transition:width .12s,background .3s;width:0%}
.block-shadow{width:110px;height:20px;background:radial-gradient(ellipse,rgba(0,0,0,.3),transparent 70%);margin-top:8px;transition:all .15s;border-radius:50%}
.block-shadow.pulse{width:150px;height:28px;opacity:.5}
.combo-display{position:absolute;top:-28px;font-size:clamp(7px,1.1vw,10px);color:var(--gold);text-shadow:0 0 8px rgba(255,215,0,.5);opacity:0;transition:all .15s;white-space:nowrap}
.combo-display.active{opacity:1}
.floating-num{position:fixed;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:clamp(9px,1.4vw,13px);color:var(--emerald);text-shadow:2px 2px 0 #000,-1px -1px 0 #000;z-index:60;animation:floatUp .85s ease-out forwards;white-space:nowrap}
.floating-num.fortune{font-size:clamp(13px,2vw,18px);color:var(--gold);animation:floatUpF .85s ease-out forwards}
.floating-num.explosive{font-size:clamp(15px,2.2vw,22px);color:var(--redstone);animation:floatUpE .9s ease-out forwards}
.floating-num.brk{font-size:clamp(14px,2.2vw,22px);color:#fff;animation:floatUpB 1s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(.5)}}
@keyframes floatUpF{0%{opacity:1;transform:translateY(0) scale(1.2)}25%{transform:translateY(-18px) scale(1.4)}100%{opacity:0;transform:translateY(-85px) scale(.4)}}
@keyframes floatUpE{0%{opacity:1;transform:translateY(0) scale(1.3)}30%{transform:translateY(-20px) scale(1.6)}100%{opacity:0;transform:translateY(-95px) scale(.3)}}
@keyframes floatUpB{0%{opacity:1;transform:translateY(0) scale(1.4)}35%{transform:translateY(-25px) scale(1.6)}100%{opacity:0;transform:translateY(-105px) scale(.3)}}
.block-selector{display:flex;gap:7px;overflow-x:auto;padding:4px 8px 8px;max-width:100%;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
.block-selector::-webkit-scrollbar{height:4px}.block-selector::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.block-opt{width:50px;text-align:center;cursor:pointer;transition:all .15s;position:relative;flex-shrink:0}
.block-opt:hover{transform:translateY(-2px)}.block-opt.locked{opacity:.35;cursor:not-allowed}.block-opt.locked:hover{transform:none}
.block-opt.active .block-preview{box-shadow:0 0 0 2px var(--emerald),0 0 10px rgba(0,230,118,.25)}
.block-preview{width:40px;height:40px;image-rendering:pixelated;border:2px solid rgba(255,255,255,.08);border-radius:2px;margin:0 auto 3px;transition:all .15s}
.block-opt .bname{font-size:4.5px;color:var(--dim);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.block-opt .bcost{font-size:4.5px;color:var(--emerald);margin-top:1px}.block-opt.locked .bcost{color:#f44}
.lock-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:rgba(255,255,255,.5);text-shadow:0 0 3px #000;pointer-events:none}
.section-title{font-size:clamp(8px,1.3vw,11px);color:var(--dim);margin:14px 0 8px;text-align:center;letter-spacing:1px}
.buy-mode{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
.buy-mode button{font-family:inherit;font-size:6px;padding:4px 10px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--dim);border-radius:2px;cursor:pointer;transition:all .15s}
.buy-mode button.active{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.3);color:var(--emerald)}
.buy-mode button:hover{border-color:rgba(255,255,255,.2)}
.upgrades-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;width:100%;max-width:780px}
.upgrade-card{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:10px;display:flex;align-items:center;gap:10px;transition:all .15s}
.upgrade-card:hover{border-color:rgba(255,255,255,.13);background:rgba(25,25,48,.95)}
.upgrade-card.affordable{border-color:rgba(0,230,118,.2)}.upgrade-card.affordable:hover{border-color:rgba(0,230,118,.35);box-shadow:0 0 12px rgba(0,230,118,.06)}
.upg-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:3px;flex-shrink:0;border:1px solid var(--border)}
.upg-info{flex:1;min-width:0}
.upg-name{font-size:clamp(6px,1.1vw,8px);margin-bottom:3px;color:#fff}
.upg-desc{font-size:clamp(5px,.9vw,6.5px);color:var(--dim);line-height:1.5;margin-bottom:4px}
.upg-level{font-size:clamp(5px,.9vw,6.5px);color:var(--diamond);margin-bottom:4px}
.upg-buy{background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.25);color:var(--emerald);font-family:inherit;font-size:clamp(5px,.9vw,7px);padding:4px 8px;border-radius:2px;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.upg-buy:hover{background:rgba(0,230,118,.22);border-color:rgba(0,230,118,.45)}
.upg-buy:disabled{background:rgba(255,255,255,.03);border-color:var(--border);color:#333;cursor:not-allowed}
.upg-buy:disabled:hover{background:rgba(255,255,255,.03);border-color:var(--border)}
.prestige-box{background:var(--panel);border:1px solid rgba(192,132,252,.2);border-radius:6px;padding:14px 20px;display:flex;align-items:center;gap:16px;max-width:500px;width:100%;margin-top:4px}
.prestige-box.available{border-color:rgba(192,132,252,.5);box-shadow:0 0 20px rgba(192,132,252,.08)}
.prest-info{flex:1}.prest-lvl{font-size:clamp(7px,1.1vw,9px);color:#c084fc;margin-bottom:4px}
.prest-mult{font-size:clamp(6px,1vw,8px);color:var(--dim2);margin-bottom:3px}
.prest-req{font-size:clamp(5px,.9vw,7px);color:var(--dim)}
.prest-btn{font-family:inherit;font-size:clamp(6px,1vw,8px);padding:8px 14px;background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.3);color:#c084fc;border-radius:3px;cursor:pointer;transition:all .15s;white-space:nowrap}
.prest-btn:hover:not(:disabled){background:rgba(192,132,252,.25);border-color:rgba(192,132,252,.5)}
.prest-btn:disabled{opacity:.3;cursor:not-allowed}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:5px;max-width:780px;width:100%}
.ach-card{background:var(--panel);border:1px solid var(--border);border-radius:3px;padding:6px 8px;display:flex;align-items:center;gap:7px;font-size:5.5px;opacity:.3;transition:all .3s}
.ach-card.unlocked{opacity:1;border-color:rgba(255,215,0,.25)}
.ach-icon{font-size:11px;color:#333;flex-shrink:0;width:18px;text-align:center}
.ach-card.unlocked .ach-icon{color:var(--gold)}
.ach-name{color:#555}.ach-card.unlocked .ach-name{color:#ccc}
.save-indicator{position:fixed;bottom:10px;right:14px;font-size:6px;color:var(--dim);z-index:200;transition:opacity .3s}
.reset-btn{font-family:inherit;font-size:5px;color:#555;background:none;border:1px solid rgba(255,255,255,.05);padding:3px 8px;border-radius:2px;cursor:pointer;margin-top:8px;transition:all .15s}
.reset-btn:hover{color:#f44;border-color:rgba(255,68,68,.3)}
#toastContainer{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(18,18,38,.95);border:1px solid var(--gold);border-radius:5px;padding:8px 12px;display:flex;align-items:center;gap:8px;transform:translateX(120%);transition:transform .3s ease;pointer-events:auto;max-width:280px}
.toast.show{transform:translateX(0)}
.toast-icon{font-size:16px;color:var(--gold);flex-shrink:0}
.toast-title{font-size:6px;color:var(--gold);margin-bottom:2px}
.toast-desc{font-size:5px;color:var(--dim);line-height:1.4}
.screen-flash{position:fixed;inset:0;background:#fff;pointer-events:none;z-index:100;opacity:0;animation:flash .2s ease-out}
@keyframes flash{0%{opacity:.2}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,1px)}80%{transform:translate(2px,-1px)}}
.shake{animation:shake .25s ease-out}
@media(max-width:600px){.upgrades-grid{grid-template-columns:1fr}.ach-grid{grid-template-columns:1fr 1fr}.pickaxe-wrap{display:none}.prestige-box{flex-direction:column;text-align:center;gap:10px}.stat{padding:5px 8px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style>
</head>
<body>
<div class="bg-sky" id="bgSky"></div>
<canvas class="bg-stars" id="starsCanvas"></canvas>
<div class="bg-ground"></div>
<canvas id="particles"></canvas>
<div id="app">
  <header>
    <h1>MINECRAFT CLICKER</h1>
    <div class="stats-bar">
      <div class="stat emeralds"><i class="fas fa-gem"></i><span class="val" id="sEmeralds">0</span></div>
      <div class="stat cps"><i class="fas fa-bolt"></i><span class="val" id="sCps">0</span>/s</div>
      <div class="stat clicks"><i class="fas fa-crosshairs"></i><span class="val" id="sClicks">0</span></div>
      <div class="stat prestige"><i class="fas fa-rotate"></i><span class="val" id="sPrestige">0</span></div>
    </div>
  </header>
  <div class="block-area" id="blockArea">
    <div class="combo-display" id="comboDisp">COMBO x1</div>
    <div class="pickaxe-wrap" id="pickWrap">
      <div class="pickaxe" id="pickaxe"><div class="pk-head" id="pkHead"></div><div class="pk-handle"></div></div>
      <div class="pk-tier" id="pkTier">Wood</div>
    </div>
    <div class="block-scene sz" id="blockScene" tabindex="0" role="button" aria-label="Mine the block">
      <div class="block-cube idle" id="blockCube">
        <div class="face front"></div><div class="face back"></div><div class="face left"></div><div class="face right"></div><div class="face top"></div><div class="face bottom"></div>
        <div class="dmg-overlay" id="dmgOverlay"></div>
      </div>
    </div>
    <div class="health-wrap"><div class="health-bar" id="healthBar"></div></div>
    <div class="block-shadow" id="blockShadow"></div>
  </div>
  <div class="block-selector" id="blockSel"></div>
  <div class="section-title">UPGRADES</div>
  <div class="buy-mode" id="buyMode">
    <button class="active" data-m="1">x1</button>
    <button data-m="10">x10</button>
    <button data-m="max">MAX</button>
  </div>
  <div class="upgrades-grid" id="upgGrid"></div>
  <div class="section-title">PRESTIGE</div>
  <div class="prestige-box" id="prestBox">
    <div class="prest-info">
      <div class="prest-lvl">Level <span id="prestLvl">0</span></div>
      <div class="prest-mult">Multiplier: <span id="prestMult">1.0x</span> all earnings</div>
      <div class="prest-req">Requires: <span id="prestReq">10M</span> total earned</div>
    </div>
    <button class="prest-btn" id="prestBtn" disabled>PRESTIGE</button>
  </div>
  <div class="section-title">ACHIEVEMENTS <span id="achCount" style="color:var(--gold)">0/25</span></div>
  <div class="ach-grid" id="achGrid"></div>
  <button class="reset-btn" onclick="resetSave()">Reset Save</button>
</div>
<div id="toastContainer"></div>
<div class="save-indicator" id="saveInd"></div>

<script>
/* ===== BLOCK DEFINITIONS ===== */
const BT=[
  {name:'Grass Block',mult:1,cost:0,top:'#5B8731',topN:['#4C7A2B','#6B9E3A','#528532'],side:'#8B6914',sideN:['#7A5C12','#9C7A1A','#6B5210'],bot:'#8B6914',botN:['#7A5C12','#9C7A1A'],pts:['#5B8731','#4C7A2B','#8B6914','#6B5210'],ore:null,gs:3},
  {name:'Cobblestone',mult:2,cost:250,top:'#7A7A7A',topN:['#6E6E6E','#888','#666'],side:'#707070',sideN:['#656565','#7D7D7D','#5E5E5E'],bot:'#6A6A6A',botN:['#606060','#777'],pts:['#7A7A7A','#6E6E6E','#666'],ore:null,gs:0},
  {name:'Coal Ore',mult:5,cost:2000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#333','#222','#555'],ore:'#2A2A2A',gs:0},
  {name:'Iron Ore',mult:12,cost:12000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#D4A574','#7A7A7A'],ore:'#D4A574',gs:0},
  {name:'Copper Ore',mult:28,cost:65000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#E87D4A','#C66A3A'],ore:'#E87D4A',gs:0},
  {name:'Gold Ore',mult:65,cost:400000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#FFD700','#DAA520'],ore:'#FFD700',gs:0},
  {name:'Redstone Ore',mult:150,cost:2500000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#FF3333','#CC0000','#FF6666'],ore:'#FF3333',gs:0},
  {name:'Lapis Ore',mult:350,cost:18000000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#3355DD','#2244BB','#5577FF'],ore:'#3355DD',gs:0},
  {name:'Diamond Ore',mult:900,cost:150000000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#4DD9FF','#80E8FF','#00BBDD'],ore:'#4DD9FF',gs:0},
  {name:'Emerald Ore',mult:2500,cost:1500000000,top:'#8B8B8B',topN:['#7A7A7A','#9C9C9C','#6E6E6E'],side:'#808080',sideN:['#737373','#919191','#6A6A6A'],bot:'#777',botN:['#6E6E6E','#888'],pts:['#8B8B8B','#00E676','#40FF90','#00CC66'],ore:'#00E676',gs:0}
];

/* ===== UPGRADES ===== */
const UG=[

/* ===== HELPERS ===== */
function fmt(n){if(n>=1e12)return(n/1e12).toFixed(1)+'T';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return Math.floor(n).toString()}
function costAt(u,lv){const b=u.bc*Math.pow(u.bm,lv);const e=1-(UG[3].lv*0.02);return Math.floor(b*Math.max(0.5,e))}
function nextCost(u){return costAt(u,u.lv)}
function dispCost(u){
  if(buyMode===1)return nextCost(u);
  const mx=buyMode==='max'?maxBuy(u):buyMode;let t=0;
  for(let i=0;i<mx;i++)t+=costAt(u,u.lv+i);return t;
}
function maxBuy(u){let c=0,e=G.em;for(let i=0;i<200;i++){const co=costAt(u,u.lv+i);if(e<co)break;e-=co;c++}return c||1}
function prestMult(){return 1+G.pl*0.5}
function prestReq(){return Math.floor(1e7*Math.pow(2,G.pl))}
function recalc(){G.cps=(UG[1].lv*0.5)*(1+UG[4].lv*0.5);updatePickaxe()}

/* ===== TEXTURES ===== */
function genTex(bi,face){
  const c=document.createElement('canvas');c.width=16;c.height=16;const x=c.getContext('2d');const b=BT[bi];
  function noise(cs,p){for(let i=0;i<16;i++)for(let j=0;j<16;j++)if(Math.random()<p){x.fillStyle=cs[Math.floor(Math.random()*cs.length)];x.fillRect(i,j,1,1)}}
  function ore(cl,p){for(let i=0;i<16;i++)for(let j=0;j<16;j++)if(Math.random()<p){x.fillStyle=cl;x.fillRect(i,j,1,1)}}
  if(face==='top'){x.fillStyle=b.top;x.fillRect(0,0,16,16);noise(b.topN,.3)}
  else if(face==='bot'){x.fillStyle=b.bot;x.fillRect(0,0,16,16);noise(b.botN,.3)}
  else{x.fillStyle=b.side;x.fillRect(0,0,16,16);if(b.gs>0){x.fillStyle=b.top;x.fillRect(0,0,16,b.gs);noise(b.topN,.25)}noise(b.sideN,.3);if(b.ore)ore(b.ore,.12)}
  return c.toDataURL();
}
function applyTex(i){
  const t=genTex(i,'top'),s=genTex(i,'side'),bt=genTex(i,'bot');
  document.querySelectorAll('.face').forEach(f=>{f.style.imageRendering='pixelated';f.style.backgroundSize='cover';
    if(f.classList.contains('top'))f.style.backgroundImage=`url(${t})`;
    else if(f.classList.contains('bottom'))f.style.backgroundImage=`url(${bt})`;
    else f.style.backgroundImage=`url(${s})`});
}

const pC=document.getElementById('particles'),pX=pC.getContext('2d');let pts=[];
function rsP(){pC.width=innerWidth;pC.height=innerHeight}
addEventListener('resize',rsP);rsP();
class P{constructor(x,y,c,s,vx,vy,l){this.x=x;this.y=y;this.c=c;this.s=s;this.vx=vx;this.vy=vy;this.l=l;this.ml=l;this.r=Math.random()*6.28;this.rs=(Math.random()-.5)*.3}
  up(){this.x+=this.vx;this.y+=this.vy;this.vy+=.17;this.l--;this.r+=this.rs}
  dr(x){const a=this.l/this.ml;x.save();x.translate(this.x,this.y);x.rotate(this.r);x.globalAlpha=a;x.fillStyle=this.c;x.fillRect(-this.s/2,-this.s/2,this.s,this.s);x.restore()}
  get dead(){return this.l<=0}}
function spawnP(cx,cy,brk){const b=BT[G.cb],n=brk?50:16;for(let i=0;i<n;i++){const a=Math.random()*6.28,sp=(brk?3.5:2)+Math.random()*(brk?7:4),sz=(brk?4:3)+Math.random()*(brk?7:3);pts.push(new P(cx,cy,b.pts[Math.floor(Math.random()*b.pts.length)],sz,Math.cos(a)*sp,Math.sin(a)*sp-2,28+Math.random()*22))}}
let ambT=0;
function ambP(){if(pts.length<250){const x=Math.random()*pC.width,y=pC.height*.72+Math.random()*pC.height*.28;pts.push(new P(x,y,'rgba(255,255,255,0.12)',1+Math.random(),(Math.random()-.5)*.3,-.15-Math.random()*.25,100+Math.random()*80))}}
function tickP(){pX.clearRect(0,0,pC.width,pC.height);pts=pts.filter(p=>!p.dead);pts.forEach(p=>{p.up();p.dr(pX)});if(++ambT%10===0)ambP();requestAnimationFrame(tickP)}
tickP();

  const df=G.em-dEm;if(Math.abs(df)<1)dEm=G.em;else dEm+=df*.18;
  document.getElementById('sEmeralds').textContent=fmt(Math.max(0,dEm));
  document.getElementById('sCps').textContent=fmt(G.cps);
  document.getElementById('sClicks').textContent=fmt(G.tc);
  document.getElementById('sPrestige').textContent=G.pl;
  /* Upgrades */
  UG.forEach((u,i)=>{const co=dispCost(u),btn=document.querySelector(`[data-ug="${i}"]`);if(!btn)return;
    btn.disabled=G.em<co;btn.closest('.upgrade-card').classList.toggle('affordable',G.em>=co);
    btn.querySelector('.cv').textContent=fmt(co);btn.closest('.upgrade-card').querySelector('.ul').textContent='Lv '+u.lv});
  /* Blocks */
  BT.forEach((b,i)=>{const el=document.querySelector(`[data-bt="${i}"]`);if(!el)return;
    const lk=i>0&&G.te<b.cost;el.classList.toggle('locked',lk);el.classList.toggle('active',G.cb===i);
    const ce=el.querySelector('.bcost');ce.textContent=i===0?'START':!lk?'OWNED':fmt(b.cost)});
  /* Prestige */
  const pr=prestReq(),pa=G.te>=pr;

/* ===== CLICK ===== */
let isBrk=false;
function handleClick(e){
  if(isBrk)return;
  const r=scene.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  /* Combo */
  G.combo++;if(G.combo>G.maxCo)G.maxCo=G.combo;
  clearTimeout(G.ct);G.ct=setTimeout(()=>{G.combo=0;document.getElementById('comboDisp').classList.remove('active')},600);
  const coMul=1+Math.min(G.combo*.08,2);
  if(G.combo>1){const cd=document.getElementById('comboDisp');cd.textContent='COMBO x'+G.combo;cd.classList.add('active')}
  /* Yield calc */
  let y=(UG[0].lv+1+UG[7].lv*2)*BT[G.cb].mult*coMul*prestMult();
  let isF=false,isE=false;
  if(Math.random()<UG[2].lv*.05){y*=3;isF=true;G.fh++}
  if(Math.random()<UG[5].lv*.03){y*=5;isE=true;G.eh++}
  G.em+=y;G.te+=y;G.tc++;G.cr++;
  /* Visuals */
  cube.classList.remove('idle','clicked');void cube.offsetWidth;cube.classList.add('clicked');
  document.getElementById('blockShadow').classList.add('pulse');
  const pk=document.getElementById('pickaxe');pk.classList.remove('swing');void pk.offsetWidth;pk.classList.add('swing');
  setTimeout(()=>{document.getElementById('blockShadow').classList.remove('pulse');cube.classList.remove('clicked');if(!hovering)cube.classList.add('idle')},130);
  spawnFloat(e?e.clientX:cx,e?e.clientY:cy,y,isF,isE,false);
  spawnP(cx,cy,false);updateDmg();updateHB();
  if(G.cr>=G.mc)breakBlock(cx,cy);
  checkAch();
}
scene.addEventListener('click',handleClick);
scene.addEventListener('touchstart',e=>{e.preventDefault();handleClick(e.touches[0])},{passive:false});
scene.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();handleClick(null)}});

function breakBlock(cx,cy){
  isBrk=true;G.cr=0;updateDmg();updateHB();
  const silkM=1+UG[6].lv*.25;const bonus=(UG[0].lv+1+UG[7].lv*2)*BT[G.cb].mult*5*silkM*prestMult();
  G.em+=bonus;G.te+=bonus;
  spawnFloat(cx,cy,bonus,false,false,true);
  const fl=document.createElement('div');fl.className='screen-flash';document.body.appendChild(fl);setTimeout(()=>fl.remove(),250);
  document.getElementById('app').classList.add('shake');setTimeout(()=>document.getElementById('app').classList.remove('shake'),280);
  spawnP(cx,cy,true);
  cube.classList.remove('idle','clicked');cube.classList.add('breaking');
  setTimeout(()=>{cube.classList.remove('breaking');cube.classList.add('reforming');
    setTimeout(()=>{cube.classList.remove('reforming');if(!hovering)cube.classList.add('idle');isBrk=false;applyTex(G.cb)},420)},360);
  checkAch();
}

/* ===== BUY UPGRADE ===== */
function buyUp(i){
  const u=UG[i];let bought=0;
  if(buyMode==='max'){for(let j=0;j<200;j++){const c=costAt(u,u.lv);if(G.em<c)break;G.em-=c;u.lv++;bought++}}
  else{for(let j=0;j<buyMode;j++){const c=costAt(u,u.lv);if(G.em<c)break;G.em-=c;u.lv++;bought++}}
  if(bought>0){recalc();checkAch()}
}

function loadGame(){const d=localStorage.getItem('mcClicker');if(!d)return;const s=JSON.parse(d);
  G.em=s.em||0;G.te=s.te||0;G.tc=s.tc||0;G.cb=s.cb||0;G.pl=s.pl||0;G.maxCo=s.mc||0;G.fh=s.fh||0;G.eh=s.eh||0;
  s.ul.forEach((l,i)=>{if(UG[i])UG[i].lv=l});G.ua=new Set(s.ua||[]);recalc();applyTex(G.cb);
  /* Mark unlocked achievements visually */
  G.ua.forEach(id=>{const c=document.querySelector(`[data-ach="${id}"]`);if(c)c.classList.add('unlocked')})}
function resetSave(){if(confirm('Delete all save data?')){localStorage.removeItem('mcClicker');location.reload()}}
setInterval(saveGame,10000);addEventListener('beforeunload',saveGame);

/* ===== MAIN LOOP ===== */
!function loop(){updateDisp();requestAnimationFrame(loop)}();

/* ===== INIT ===== */
loadGame();renderBlocks();renderUpgrades();renderAch();updatePickaxe();checkAch();
</script>
</body>
</html>
