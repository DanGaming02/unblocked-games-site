<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT 2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg-0: #08080a;
    --bg-1: #0f0f12;
    --bg-2: #16161a;
    --bg-3: #1e1e23;
    --bg-hover: #26262c;
    --fg-1: #ececea;
    --fg-2: #a09d97;
    --fg-3: #5e5b56;
    --accent: #00d68f;
    --accent-dim: rgba(0,214,143,0.1);
    --accent-mid: rgba(0,214,143,0.25);
    --accent-glow: rgba(0,214,143,0.3);
    --game: #f5a623;
    --game-dim: rgba(245,166,35,0.1);
    --game-glow: rgba(245,166,35,0.25);
    --border: #232328;
    --border-light: #2e2e34;
    --danger: #ff5c5c;
    --user-bg: #141a17;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:'Space Grotesk',sans-serif;background:var(--bg-0);color:var(--fg-1);overflow:hidden;}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:3px;}
  ::-webkit-scrollbar-thumb:hover{background:#3a3a42;}

  .app{display:flex;height:100vh;position:relative;}

  /* ── Sidebar ── */
  .sidebar{width:272px;min-width:272px;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s;z-index:20;}
  .sidebar.hidden{transform:translateX(-100%);opacity:0;position:absolute;height:100%;pointer-events:none;}
  .sb-head{padding:14px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;}
  .new-btn{flex:1;display:flex;align-items:center;gap:7px;padding:9px 13px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,214,143,.18);border-radius:10px;cursor:pointer;font:500 13px/1 'Space Grotesk',sans-serif;transition:all .2s;}
  .new-btn:hover{background:rgba(0,214,143,.18);border-color:rgba(0,214,143,.35);box-shadow:0 0 24px var(--accent-glow);}
  .sb-close{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;color:var(--fg-2);cursor:pointer;font-size:13px;transition:all .15s;}
  .sb-close:hover{color:var(--fg-1);background:var(--bg-hover);}

  .conv-list{flex:1;overflow-y:auto;padding:8px;}
  .conv-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);padding:14px 10px 5px;}
  .conv-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--fg-2);transition:all .12s;position:relative;}
  .conv-item:hover{background:var(--bg-hover);color:var(--fg-1);}
  .conv-item.active{background:var(--bg-3);color:var(--fg-1);}
  .conv-item .ci-icon{font-size:12px;opacity:.4;min-width:15px;}
  .conv-item .ci-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item .ci-del{opacity:0;background:none;border:none;color:var(--fg-3);cursor:pointer;font-size:11px;padding:4px 5px;border-radius:4px;transition:all .12s;}
  .conv-item:hover .ci-del{opacity:1;}
  .conv-item .ci-del:hover{color:var(--danger);background:rgba(255,92,92,.1);}
  .conv-item .ci-game-badge{font-size:9px;background:var(--game-dim);color:var(--game);padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.03em;}

  .sb-foot{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .user-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#00a06a);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#080a08;}
  .user-info{flex:1;}
  .user-name{font-size:12.5px;font-weight:500;}
  .user-plan{font-size:10.5px;color:var(--fg-3);}

  /* ── Main ── */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
  .top-bar{height:50px;min-height:50px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--border);gap:10px;background:rgba(8,8,10,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:10;}
  .mob-menu{display:none;width:34px;height:34px;align-items:center;justify-content:center;background:none;border:1px solid var(--border);border-radius:7px;color:var(--fg-2);cursor:pointer;font-size:13px;}
  .model-sel{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;cursor:pointer;font:500 13px/1 'Space Grotesk',sans-serif;color:var(--fg-1);transition:all .15s;position:relative;}
  .model-sel:hover{border-color:var(--fg-3);}
  .m-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow);}
  .m-chev{font-size:9px;color:var(--fg-3);margin-left:2px;}
  .m-drop{position:absolute;top:calc(100% + 5px);left:0;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;padding:5px;min-width:210px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.55);z-index:50;}
  .m-drop.open{display:block;animation:ddIn .15s ease;}
  @keyframes ddIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
  .m-opt{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--fg-2);transition:all .1s;}
  .m-opt:hover{background:var(--bg-hover);color:var(--fg-1);}
  .m-opt.sel{color:var(--accent);}
  .m-opt .mo-d{width:5px;height:5px;border-radius:50%;background:var(--fg-3);}
  .m-opt.sel .mo-d{background:var(--accent);box-shadow:0 0 6px var(--accent-glow);}
  .top-spacer{flex:1;}
  .h-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--fg-3);cursor:pointer;border-radius:7px;font-size:13px;transition:all .12s;}
  .h-btn:hover{color:var(--fg-1);background:var(--bg-hover);}

  /* ── Chat ── */
  .chat-area{flex:1;overflow-y:auto;scroll-behavior:smooth;}
  .chat-inner{max-width:780px;margin:0 auto;padding:16px 20px 110px;}

  /* Welcome */
  .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;animation:fadeUp .5s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .w-logo{width:60px;height:60px;border-radius:16px;background:linear-gradient(135deg,var(--accent),#00a06a);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#080a08;margin-bottom:22px;box-shadow:0 0 50px var(--accent-glow),0 0 100px rgba(0,214,143,.08);animation:logoPulse 3s ease-in-out infinite;}
  @keyframes logoPulse{0%,100%{box-shadow:0 0 50px var(--accent-glow),0 0 100px rgba(0,214,143,.08);}50%{box-shadow:0 0 60px var(--accent-glow),0 0 120px rgba(0,214,143,.12);}}
  .w-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;}
  .w-sub{font-size:14px;color:var(--fg-2);margin-bottom:8px;max-width:420px;line-height:1.6;}
  .w-game-hint{font-size:12px;color:var(--game);background:var(--game-dim);padding:6px 14px;border-radius:20px;margin-bottom:28px;display:inline-flex;align-items:center;gap:6px;font-weight:500;}
  .suggestions{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:540px;}
  .sug-card{padding:13px 15px;background:var(--bg-1);border:1px solid var(--border);border-radius:11px;cursor:pointer;text-align:left;font-size:12.5px;color:var(--fg-2);line-height:1.5;transition:all .2s;}
  .sug-card:hover{border-color:var(--fg-3);background:var(--bg-2);color:var(--fg-1);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,.3);}
  .sug-card .sc-t{font-weight:600;color:var(--fg-1);margin-bottom:3px;font-size:13px;}
  .sug-card.game-card{border-color:rgba(245,166,35,.15);}
  .sug-card.game-card:hover{border-color:rgba(245,166,35,.35);box-shadow:0 4px 20px rgba(245,166,35,.08);}
  .sug-card.game-card .sc-t{color:var(--game);}

  /* Messages */
  .msg{padding:18px 0;animation:msgIn .25s ease;position:relative;}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .msg+.msg{border-top:1px solid var(--border);}
  .msg-row{display:flex;gap:13px;max-width:100%;}
  .msg-av{width:28px;height:28px;min-width:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:2px;}
  .msg-av.u-av{background:linear-gradient(135deg,#ff8c42,#d95820);color:#fff;}
  .msg-av.a-av{background:linear-gradient(135deg,var(--accent),#00a06a);color:#080a08;}
  .msg-body{flex:1;min-width:0;overflow-wrap:break-word;line-height:1.7;font-size:14.5px;}
  .msg-body p{margin-bottom:10px;}.msg-body p:last-child{margin-bottom:0;}
  .msg-body strong{font-weight:600;color:#fff;}
  .msg-body em{font-style:italic;color:var(--fg-2);}
  .msg-body ul,.msg-body ol{margin:6px 0 10px 18px;}.msg-body li{margin-bottom:4px;}
  .msg-body code:not(.blk-c){background:var(--bg-0);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--accent);}

  .code-blk{margin:10px 0;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--bg-0);}
  .code-hd{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);font-size:11px;color:var(--fg-3);}
  .cp-btn{background:none;border:none;color:var(--fg-3);cursor:pointer;font:12px/1 'Space Grotesk',sans-serif;display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:4px;transition:all .12s;}
  .cp-btn:hover{color:var(--fg-1);background:rgba(255,255,255,.04);}
  .code-blk pre{padding:12px;overflow-x:auto;font:13px/1.6 'JetBrains Mono',monospace;color:var(--fg-1);margin:0;}

  /* Game Player */
  .game-player{margin:12px 0;border-radius:12px;overflow:hidden;border:1px solid rgba(245,166,35,.2);background:var(--bg-0);box-shadow:0 0 30px rgba(245,166,35,.06);}
  .game-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(245,166,35,.05);border-bottom:1px solid rgba(245,166,35,.12);}
  .game-bar .gb-icon{color:var(--game);font-size:13px;}
  .game-bar .gb-name{flex:1;font-size:12.5px;font-weight:600;color:var(--game);}
  .game-bar .gb-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.12);border-radius:6px;color:var(--game);cursor:pointer;font-size:11px;transition:all .12s;}
  .game-bar .gb-btn:hover{background:rgba(245,166,35,.15);border-color:rgba(245,166,35,.25);}
  .game-frame{width:100%;height:380px;border:none;display:block;background:#000;}

  .msg-acts{display:flex;gap:1px;margin-top:6px;opacity:0;transition:opacity .2s;}
  .msg:hover .msg-acts{opacity:1;}
  .ma-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--fg-3);cursor:pointer;border-radius:5px;font-size:11px;transition:all .12s;}
  .ma-btn:hover{color:var(--fg-1);background:var(--bg-hover);}

  /* Typing */
  .typing{display:flex;gap:4px;padding:4px 0;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--fg-3);animation:tBounce 1.2s ease-in-out infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes tBounce{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-5px);opacity:1;}}

  /* Stop button */
  .stop-btn{display:none;width:auto;height:34px;padding:0 16px;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--border);border-radius:10px;color:var(--fg-2);cursor:pointer;font:500 12.5px/1 'Space Grotesk',sans-serif;transition:all .15s;margin:0 auto 8px;}
  .stop-btn.show{display:flex;}
  .stop-btn:hover{border-color:var(--fg-3);color:var(--fg-1);}
  .stop-btn .sb-circle{width:8px;height:8px;border-radius:2px;background:var(--fg-2);}

  /* Input */
  .input-area{position:absolute;bottom:0;left:0;right:0;padding:0 20px 20px;background:linear-gradient(to top,var(--bg-0) 55%,transparent);z-index:5;}
  .input-wrap{max-width:780px;margin:0 auto;}
  .input-box{display:flex;align-items:flex-end;background:var(--bg-2);border:1px solid var(--border);border-radius:14px;padding:6px;transition:border-color .2s,box-shadow .2s;}
  .input-box:focus-within{border-color:var(--fg-3);box-shadow:0 0 0 3px rgba(255,255,255,.025);}
  .input-box textarea{flex:1;background:none;border:none;outline:none;color:var(--fg-1);font:15px/1.5 'Space Grotesk',sans-serif;padding:8px 10px;resize:none;max-height:150px;min-height:22px;}
  .input-box textarea::placeholder{color:var(--fg-3);}
  .send-btn{width:36px;height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;background:var(--accent);border:none;border-radius:9px;color:#080a08;cursor:pointer;font-size:14px;transition:all .2s;}
  .send-btn:hover{background:#00e89a;box-shadow:0 0 20px var(--accent-glow);}
  .send-btn:disabled{opacity:.25;cursor:not-allowed;box-shadow:none;}.send-btn:disabled:hover{background:var(--accent);}
  .input-hint{text-align:center;font-size:10.5px;color:var(--fg-3);margin-top:7px;}

  /* Toast */
  .toast-box{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;}
  .toast{padding:8px 18px;background:var(--bg-3);border:1px solid var(--border);border-radius:9px;font-size:12.5px;color:var(--fg-1);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tIn .25s ease,tOut .25s ease 2s forwards;pointer-events:auto;}
  @keyframes tIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes tOut{from{opacity:1;}to{opacity:0;transform:translateY(-6px);}}

  /* Background */
  .bg-g{position:fixed;border-radius:50%;filter:blur(140px);opacity:.025;pointer-events:none;z-index:0;}
  .bg-g.g1{width:500px;height:500px;top:-180px;right:-80px;background:var(--accent);}
  .bg-g.g2{width:400px;height:400px;bottom:-150px;left:-80px;background:var(--game);}
  .bg-g.g3{width:300px;height:300px;top:40%;left:30%;background:#8b5cf6;}

  /* Noise overlay */
  .noise{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.018;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;}

  @media(max-width:768px){
    .sidebar{position:absolute;height:100%;box-shadow:8px 0 32px rgba(0,0,0,.6);}
    .mob-menu{display:flex;}
    .suggestions{grid-template-columns:1fr;}
    .chat-inner{padding:14px 14px 110px;}
    .input-area{padding:0 10px 14px;}
    .game-frame{height:300px;}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="bg-g g1"></div>
<div class="bg-g g2"></div>
<div class="bg-g g3"></div>
<div class="noise"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <button class="new-btn" onclick="newChat()" aria-label="New chat"><i class="fa-solid fa-plus"></i> New chat</button>
      <button class="sb-close" onclick="toggleSidebar()" aria-label="Close sidebar"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sb-foot">
      <div class="user-av">U</div>
      <div class="user-info"><div class="user-name">User</div><div class="user-plan">Free tier</div></div>
      <button class="h-btn" onclick="showToast('Settings coming soon')" aria-label="Settings"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
  </aside>

  <main class="main">
    <header class="top-bar">
      <button class="mob-menu" onclick="toggleSidebar()" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <div class="model-sel" id="modelSel" onclick="toggleMD()">
        <span class="m-dot"></span>
        <span id="mName">ChatGPT 2</span>
        <i class="fa-solid fa-chevron-down m-chev"></i>
        <div class="m-drop" id="mDrop">
          <div class="m-opt sel" data-m="ChatGPT 2" onclick="selModel(this)"><span class="mo-d"></span><div><div style="font-weight:500;color:var(--fg-1)">ChatGPT 2</div><div style="font-size:10.5px;color:var(--fg-3)">Great for everyday tasks</div></div></div>
          <div class="m-opt" data-m="ChatGPT 2 Turbo" onclick="selModel(this)"><span class="mo-d"></span><div><div style="font-weight:500;color:var(--fg-1)">ChatGPT 2 Turbo</div><div style="font-size:10.5px;color:var(--fg-3)">Faster, higher quality</div></div></div>
          <div class="m-opt" data-m="ChatGPT 2 Vision" onclick="selModel(this)"><span class="mo-d"></span><div><div style="font-weight:500;color:var(--fg-1)">ChatGPT 2 Vision</div><div style="font-size:10.5px;color:var(--fg-3)">Understands images</div></div></div>
        </div>
      </div>
      <div class="top-spacer"></div>
      <button class="h-btn" onclick="showToast('Link copied')" aria-label="Share"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div style="position:absolute;bottom:76px;left:0;right:0;z-index:6;display:flex;justify-content:center;">
      <button class="stop-btn" id="stopBtn" onclick="stopGen()"><span class="sb-circle"></span> Stop generating</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <div class="input-box">
          <textarea id="uInput" rows="1" placeholder="Message ChatGPT 2..." aria-label="Message input"></textarea>
          <button class="send-btn" id="sendBtn" disabled onclick="sendMsg()" aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
        <div class="input-hint">ChatGPT 2 can make mistakes. Consider checking important information.</div>
      </div>
    </div>
  </main>
</div>

<div class="toast-box" id="toastBox"></div>

<script>
// ═══════════════════════════════════════════
// GAME GENERATORS — Each returns a full HTML doc
// ═══════════════════════════════════════════
const GAMES = {
  snake: {
    name: 'Snake',
    html: `<!DOCTYPE html><html><head><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0b;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#eee;overflow:hidden}canvas{border:1px solid #1e1e23;border-radius:6px;background:#0f0f12}.info{display:flex;gap:30px;margin-bottom:12px;font-size:13px}.info span{color:#00d68f;font-weight:700}.hint{margin-top:10px;font-size:11px;color:#5e5b56}</style></head><body>
<div class="info">Score: <span id="s">0</span> &nbsp; High: <span id="h">0</span></div>
<canvas id="c" width="360" height="360"></canvas>
<div class="hint">Arrow keys or WASD to move</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),g=18,W=c.width/g,H=c.height/g;
let snake,dir,food,score,hi=0,dead,tick;
function init(){snake=[{x:10,y:10}];dir={x:1,y:0};score=0;dead=false;placeFood();document.getElementById('s').textContent=0;if(!tick)loop();}
function placeFood(){do{food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function loop(){tick=setInterval(()=>{if(dead)return;move();draw();},110);}

function getAIResponse(msg) {
  const m = msg.toLowerCase();
  // Check for game requests
  if (/make|create|build|write|code|generat|develop/.test(m) && /game|play|snake|pong|breakout|tetris|flappy|memory|space.*invad|tic.?tac/i.test(m)) {

    return getGameResponse(msg);
  }

  if (/^(hi|hello|hey|sup|what'?s up|greetings|yo)\b/i.test(m)) return pick(textResponses.greeting);
  if (/code|function|program|script|debug|error|bug|api|javascript|python|html|css|react|node/i.test(m)) return pick(textResponses.code);
  if (/explain|what is|how does|tell me about|describe|concept|understand/i.test(m)) return pick(textResponses.explain);
  if (/write|story|poem|creative|fiction|narrative|imagine/i.test(m)) return pick(textResponses.creative);
  if (/math|calcul|equation|derivative|integral|algebra|formula|solve/i.test(m)) return pick(textResponses.math);

function esc(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

function parseMD(text) {
  let html = text;

  // Extract game blocks first
  html = html.replace(/\{\{\{GAME:(\w+)\}\}\}/g, (match, key) => {
    const game = GAMES[key];
    if (!game) return '';
    const gid = 'gf-' + Math.random().toString(36).substr(2, 8);
    return `<div class="game-player" id="${gid}">
      <div class="game-bar">
        <i class="fa-solid fa-gamepad gb-icon"></i>
        <span class="gb-name">${esc(game.name)}</span>
        <button class="gb-btn" onclick="restartGame('${gid}')" title="Restart"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="gb-btn" onclick="fullscreenGame('${gid}')" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
        <button class="gb-btn" onclick="downloadGame('${key}')" title="Download"><i class="fa-solid fa-download"></i></button>
      </div>
      <iframe class="game-frame" srcdoc="${esc(game.html)}" sandbox="allow-scripts" allow="autoplay"></iframe>
    </div>`;
  });

  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
    const language = lang || 'code';
    const id = 'cd-' + Math.random().toString(36).substr(2, 8);
    return `<div class="code-blk"><div class="code-hd"><span>${language}</span><button class="cp-btn" onclick="copyCode('${id}',this)"><i class="fa-regular fa-clipboard"></i> Copy</button></div><pre><code id="${id}" class="blk-c">${esc(code.trim())}</code></pre></div>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Blockquote
  html = html.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding-left:13px;color:var(--fg-2);margin:10px 0;">$1</blockquote>');
  // HR
  html = html.replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">');
  // UL
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, (m) => {
    if (!m.startsWith('<ul>')) return '<ul>' + m + '</ul>';
    return m;
  });
  // Merge adjacent uls
  html = html.replace(/<\/ul>\s*<ul>/g, '');
  // OL
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Paragraphs
  html = html.split('\n\n').map(block => {
    block = block.trim();
    if (!block) return '';
    if (/^<(div|ul|ol|blockquote|hr)/.test(block)) return block;
    if (/^<li>/.test(block)) return '<ul>' + block + '</ul>';
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  return html;
}

// ═══════════════════════════════════════════
// GAME ACTIONS
// ═══════════════════════════════════════════
function restartGame(id) {
  const container = document.getElementById(id);
  if (!container) return;
  const iframe = container.querySelector('iframe');
  if (iframe) {
    const src = iframe.getAttribute('srcdoc');
    iframe.removeAttribute('srcdoc');
    void iframe.offsetWidth; // force reflow
    iframe.setAttribute('srcdoc', src);
  }
}

function fullscreenGame(id) {
  const container = document.getElementById(id);
  if (!container) return;
  const iframe = container.querySelector('iframe');
  if (!iframe) return;
  if (iframe.requestFullscreen) iframe.requestFullscreen();
  else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
}

function downloadGame(key) {
  const game = GAMES[key];
  if (!game) return;
  const blob = new Blob([game.html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (game.name || 'game').toLowerCase().replace(/\s+/g, '-') + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Game downloaded!');
}

let convs = [], activeId = null, generating = false, stopFlag = false, currentModel = 'ChatGPT 2';

function createConv(firstMsg) {
  const isGame = /game|snake|pong|breakout|tetris|flappy|memory|space.*invad|tic.?tac/i.test(firstMsg);
  const conv = {
    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
    title: firstMsg.slice(0, 42) + (firstMsg.length > 42 ? '...' : ''),
    isGame,
    messages: [],
    created: Date.now()
  };
  convs.unshift(conv);
  activeId = conv.id;
  renderSidebar();
  return conv;
}

function getConv() { return convs.find(c => c.id === activeId); }

function switchConv(id) {
  activeId = id;
  renderSidebar();
  renderChat();
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
}

function deleteConv(id, e) {
  e.stopPropagation();
  convs = convs.filter(c => c.id !== id);
  if (activeId === id) activeId = convs.length ? convs[0].id : null;
  renderSidebar();
  renderChat();
  showToast('Chat deleted');
}

function newChat() {
  activeId = null;
  renderSidebar();
  renderChat();
  document.getElementById('uInput').focus();
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.add('hidden');
}

        <span class="ci-text">${esc(c.title)}</span>
        ${c.isGame ? '<span class="ci-game-badge">GAME</span>' : ''}
        <button class="ci-del" onclick="deleteConv('${c.id}',event)" aria-label="Delete"><i class="fa-regular fa-trash-can"></i></button>
      </div>`;
    });
    return s;
  };
  h += group('Today', today);
  h += group('Previous 7 days', week);
  h += group('Older', older);
  list.innerHTML = h;
}

function renderChat() {
  const inner = document.getElementById('chatInner');
  const conv = getConv();
  if (!conv || !conv.messages.length) {
    inner.innerHTML = renderWelcome();
    return;
  }
  inner.innerHTML = conv.messages.map((m, i) => renderMsg(m, i)).join('');
  scrollBottom();
}

function renderMsg(msg, idx) {
  const isUser = msg.role === 'user';
  return `<div class="msg">
    <div class="msg-row">
      <div class="msg-av ${isUser ? 'u-av' : 'a-av'}">${isUser ? 'U' : 'G'}</div>
      <div class="msg-body">${isUser ? '<p>' + esc(msg.content).replace(/\n/g, '<br>') + '</p>' : parseMD(msg.content)}</div>
    </div>
    ${!isUser ? `<div class="msg-acts">
      <button class="ma-btn" onclick="copyMsg(${idx})" title="Copy"><i class="fa-regular fa-clipboard"></i></button>
      <button class="ma-btn" onclick="regenMsg(${idx})" title="Regenerate"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button class="ma-btn" onclick="showToast('Thanks!')" title="Good"><i class="fa-regular fa-thumbs-up"></i></button>
      <button class="ma-btn" onclick="showToast('Thanks!')" title="Bad"><i class="fa-regular fa-thumbs-down"></i></button>
    </div>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════
// SEND & STREAM
// ═══════════════════════════════════════════
async function sendMsg() {
  const input = document.getElementById('uInput');
  const text = input.value.trim();
  if (!text || generating) return;

  if (!activeId) createConv(text);
  const conv = getConv();
  conv.messages.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();
  renderChat();

  generating = true;
  stopFlag = false;
  updateSendBtn();
  document.getElementById('stopBtn').classList.add('show');

  // Typing indicator
  const inner = document.getElementById('chatInner');
  const typDiv = document.createElement('div');
  typDiv.className = 'msg';
  typDiv.id = 'typing-ind';
  typDiv.innerHTML = `<div class="msg-row"><div class="msg-av a-av">G</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  inner.appendChild(typDiv);
  scrollBottom();

  await sleep(500 + Math.random() * 800);
  if (stopFlag) { finishGen(); return; }

  typDiv.remove();

  const response = getAIResponse(text);
  conv.messages.push({ role: 'assistant', content: '' });
  const aiIdx = conv.messages.length - 1;

  // Check if response contains a game block
  const hasGame = /\{\{\{GAME:\w+\}\}\}/.test(response);

  // Create message element
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg';
  const streamId = 'str-' + Math.random().toString(36).substr(2, 6);
  msgDiv.innerHTML = `<div class="msg-row"><div class="msg-av a-av">G</div><div class="msg-body" id="${streamId}"></div></div>
    <div class="msg-acts" style="opacity:0;">
      <button class="ma-btn" onclick="copyMsg(${aiIdx})" title="Copy"><i class="fa-regular fa-clipboard"></i></button>
      <button class="ma-btn" onclick="regenMsg(${aiIdx})" title="Regenerate"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button class="ma-btn" onclick="showToast('Thanks!')" title="Good"><i class="fa-regular fa-thumbs-up"></i></button>
      <button class="ma-btn" onclick="showToast('Thanks!')" title="Bad"><i class="fa-regular fa-thumbs-down"></i></button>
    </div>`;
  inner.appendChild(msgDiv);
  const streamEl = document.getElementById(streamId);

  if (hasGame) {
    // Stream text before game block, then inject game
    const parts = response.split(/(\{\{\{GAME:\w+\}\}\})/);
    let accumulated = '';

    for (let p = 0; p < parts.length; p++) {
      if (stopFlag) break;
      const part = parts[p];
      if (/^\{\{\{GAME:\w+\}\}\}$/.test(part)) {
        // Add game block marker
        accumulated += part;
        conv.messages[aiIdx].content = accumulated;
        streamEl.innerHTML = parseMD(accumulated);
        scrollBottom();
      } else {
        // Stream character by character
        for (let i = 0; i < part.length; i++) {
          if (stopFlag) break;
          accumulated += part[i];
          conv.messages[aiIdx].content = accumulated;
          streamEl.innerHTML = parseMD(accumulated);
          // Slow down at punctuation for natural feel
          const ch = part[i];
          const delay = '.!?'.includes(ch) ? 60 : ',;:'.includes(ch) ? 30 : 10 + Math.random() * 14;
          if (i % 3 === 0) scrollBottom();
          await sleep(delay);
        }
      }
    }
  } else {
    // Normal text streaming
    let accumulated = '';
    for (let i = 0; i < response.length; i++) {
      if (stopFlag) break;
      accumulated += response[i];
      conv.messages[aiIdx].content = accumulated;
      streamEl.innerHTML = parseMD(accumulated);
      const ch = response[i];
      const delay = '.!?'.includes(ch) ? 55 : ',;:'.includes(ch) ? 28 : 8 + Math.random() * 12;
      if (i % 3 === 0) scrollBottom();
      await sleep(delay);
    }
  }

  streamEl.removeAttribute('id');
  msgDiv.querySelector('.msg-acts').style.opacity = '';
  finishGen();
}

function finishGen() {
  generating = false;
  stopFlag = false;
  updateSendBtn();
  document.getElementById('stopBtn').classList.remove('show');
  // Remove leftover typing indicator
  const ti = document.getElementById('typing-ind');
  if (ti) ti.remove();
}

function stopGen() {
  stopFlag = true;
}

function regenMsg(idx) {
  if (generating) return;
  const conv = getConv();
  if (!conv || idx < 1) return;
  // Find the last user message before this AI message
  let userMsg = '';
  for (let i = idx - 1; i >= 0; i--) {
    if (conv.messages[i].role === 'user') { userMsg = conv.messages[i].content; break; }
  }
  if (!userMsg) return;
  // Remove this AI message and re-generate
  conv.messages.splice(idx, 1);
  renderChat();

  generating = true;
  stopFlag = false;
  updateSendBtn();
  document.getElementById('stopBtn').classList.add('show');

  const inner = document.getElementById('chatInner');
  const typDiv = document.createElement('div');
  typDiv.className = 'msg'; typDiv.id = 'typing-ind';
  typDiv.innerHTML = `<div class="msg-row"><div class="msg-av a-av">G</div><div class="msg-body"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  inner.appendChild(typDiv);
  scrollBottom();

  setTimeout(async () => {
    if (stopFlag) { finishGen(); return; }
    typDiv.remove();
    const response = getAIResponse(userMsg);
    conv.messages.push({ role: 'assistant', content: '' });
    const aiIdx = conv.messages.length - 1;
    const hasGame = /\{\{\{GAME:\w+\}\}\}/.test(response);

    const msgDiv = document.createElement('div');
    msgDiv.className = 'msg';
    const streamId = 'str-' + Math.random().toString(36).substr(2, 6);
    msgDiv.innerHTML = `<div class="msg-row"><div class="msg-av a-av">G</div><div class="msg-body" id="${streamId}"></div></div>
      <div class="msg-acts" style="opacity:0;">
        <button class="ma-btn" onclick="copyMsg(${aiIdx})" title="Copy"><i class="fa-regular fa-clipboard"></i></button>
        <button class="ma-btn" onclick="regenMsg(${aiIdx})" title="Regenerate"><i class="fa-solid fa-arrows-rotate"></i></button>
        <button class="ma-btn" onclick="showToast('Thanks!')" title="Good"><i class="fa-regular fa-thumbs-up"></i></button>
        <button class="ma-btn" onclick="showToast('Thanks!')" title="Bad"><i class="fa-regular fa-thumbs-down"></i></button>
      </div>`;
    inner.appendChild(msgDiv);
    const streamEl = document.getElementById(streamId);

    const parts = hasGame ? response.split(/(\{\{\{GAME:\w+\}\}\})/) : [response];
    let acc = '';
    for (const part of parts) {
      if (stopFlag) break;
      if (/^\{\{\{GAME:\w+\}\}\}$/.test(part)) {
        acc += part;
        conv.messages[aiIdx].content = acc;
        streamEl.innerHTML = parseMD(acc);
        scrollBottom();
      } else {
        for (let i = 0; i < part.length; i++) {
          if (stopFlag) break;
          acc += part[i];
          conv.messages[aiIdx].content = acc;
          streamEl.innerHTML = parseMD(acc);
          const ch = part[i];
          const delay = '.!?'.includes(ch) ? 55 : ',;:'.includes(ch) ? 28 : 8 + Math.random() * 12;
          if (i % 3 === 0) scrollBottom();
          await sleep(delay);
        }
      }
    }
    streamEl.removeAttribute('id');
    msgDiv.querySelector('.msg-acts').style.opacity = '';
    finishGen();
  }, 600 + Math.random() * 600);
}

function useSug(text) {
  document.getElementById('uInput').value = text;
  updateSendBtn();
  sendMsg();
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function scrollBottom() { const a = document.getElementById('chatArea'); a.scrollTop = a.scrollHeight; }
function updateSendBtn() { document.getElementById('sendBtn').disabled = !document.getElementById('uInput').value.trim() || generating; }

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('hidden'); }

function toggleMD() { document.getElementById('mDrop').classList.toggle('open'); }

function selModel(el) {
  currentModel = el.dataset.m;
  document.getElementById('mName').textContent = currentModel;
  document.querySelectorAll('.m-opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel');
  document.getElementById('mDrop').classList.remove('open');
  document.getElementById('uInput').placeholder = `Message ${currentModel}...`;
  showToast(`Switched to ${currentModel}`);
}

function copyMsg(idx) {
  const conv = getConv();
  if (!conv || !conv.messages[idx]) return;
  navigator.clipboard.writeText(conv.messages[idx].content).then(() => showToast('Copied to clipboard'));
}

function copyCode(id, btn) {
  const code = document.getElementById(id);
  if (!code) return;
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
    setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-clipboard"></i> Copy'; }, 1800);
  });
}

function showToast(msg) {
  const box = document.getElementById('toastBox');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

// ═══════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════
const ta = document.getElementById('uInput');
ta.addEventListener('input', () => {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 150) + 'px';
  updateSendBtn();
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.addEventListener('click', e => {
  if (!document.getElementById('modelSel').contains(e.target)) {
    document.getElementById('mDrop').classList.remove('open');
  }
});

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
renderSidebar();
renderChat();
ta.focus();
</script>
